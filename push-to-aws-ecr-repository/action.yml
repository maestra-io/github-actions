name: 'Push to AWS ECR repositories'
description: >-
  Log in to ECR through the Teleport image-push bot, create the repositories
  (immutable release tags) and either push pre-built local images with
  `docker push` (push: true, the default) or stop after the login so the
  caller pushes straight from BuildKit (push: false, output `registry`):
  BuildKit skips every layer the registry already has, `docker push` from a
  fresh runner re-uploads all of them.
inputs:
  awsAccessKey:
    description: >-
      AWS Access Key ID. Leave EMPTY (default) to authenticate through Teleport
      workload identity instead: the job then needs `id-token: write`, and the
      repository needs a Teleport GitHub join token for the image-push bot
      (see teleportToken). Static keys are being retired (issues-maestra#1455).
    required: false
    default: ''
  awsSecretKey:
    description: 'AWS Secret Access Key. Only with awsAccessKey.'
    required: false
    default: ''
  teleportToken:
    description: >-
      Teleport GitHub join token of the image-push bot, used when awsAccessKey
      is empty. Default: image-push-github-actions-<repository name>, the name
      every token in fluxcd iota/us-iota-lw-kube-infra/teleport-maestra/
      operator-crs/image-push-tokens.yaml carries (same as bake-oci-manifests).
    required: false
    default: ''
  teleportFqdn:
    description: 'Teleport proxy host:port.'
    required: false
    default: 'teleport.maestra.io:443'
  awsRoleArn:
    description: 'IAM role assumed with the Teleport workload-identity JWT.'
    required: false
    default: 'arn:aws:iam::515260921971:role/teleport-image-push'
  awsRegion:
    description: 'AWS Region'
    required: true
  repositories:
    description: 'Comma-separated list of repository names'
    required: true
  localTag:
    description: >-
      Tag of locally built images (`local/<repository>:<localTag>`), pre-built
      into the docker daemon. Required when push is true.
    required: false
    default: ''
  targetTag:
    description: 'Target tag for all ECR repositories'
    required: true
  push:
    description: >-
      `true` (default): tag `local/<repository>:<localTag>` as
      `<registry>/<repository>:<targetTag>` and `docker push` it. `false`: only
      log in and create the repositories; the caller then pushes from BuildKit
      (docker/build-push-action `push: true` with `<registry>/<repository>:<targetTag>`),
      which uploads only the layers the registry is missing.
    required: false
    default: 'true'
outputs:
  registry:
    description: 'ECR registry host the action logged in to, e.g. 515260921971.dkr.ecr.us-west-2.amazonaws.com.'
    value: ${{ steps.login-ecr.outputs.registry }}
runs:
  using: "composite"
  steps:
    # Phase 6 safety net (ECR eu-central-1 -> us-west-2,
    # https://github.com/maestra-io/issues-maestra/issues/1354).
    #
    # awsRegion is `required`, so every caller passes it, and a caller still
    # passing the retired eu-central-1 would push where nothing reads: all five
    # clusters and every Kargo/Flux/Renovate subscription moved to us-west-2 on
    # 2026-09-02. That is not a red job -- it is a release that reaches nobody,
    # which is the one failure mode of this phase worth engineering against.
    # Callers are being swept in their own PRs; until the last one lands (and
    # for any that reappears from an old branch) the region is normalised here,
    # loudly. Remove this step in phase 7 once the sweep is closed.
    - name: Resolve the ECR region
      id: region
      shell: bash
      env:
        REQUESTED_REGION: ${{ inputs.awsRegion }}
      run: |
        region="$REQUESTED_REGION"
        if [ "$region" = "eu-central-1" ]; then
          echo "::warning::awsRegion is pinned to the retired eu-central-1 registry, which stopped receiving new tags in phase 6 of issues-maestra#1354 and is pulled by nothing. Pushing to us-west-2 instead -- drop the awsRegion override from the calling workflow."
          region="us-west-2"
        fi
        echo "value=${region}" >> "$GITHUB_OUTPUT"

    - name: Configure AWS Credentials
      if: ${{ inputs.awsAccessKey != '' }}
      uses: aws-actions/configure-aws-credentials@v2.2.0
      with:
        aws-access-key-id: ${{ inputs.awsAccessKey }}
        aws-secret-access-key: ${{ inputs.awsSecretKey }}
        aws-region: ${{ steps.region.outputs.value }}

    # ── No static key: Teleport workload identity -> AWS STS ─────────────
    # Same chain as bake-oci-manifests: GitHub OIDC joins the image-push bot,
    # which mints a JWT SVID for spiffe://teleport.maestra.io/svc/image-push,
    # federated into role/teleport-image-push (aws-infra
    # terraform/main/eu/teleport-workload-identity.tf).
    - name: Get Teleport version
      if: ${{ inputs.awsAccessKey == '' }}
      id: tp-version
      shell: bash
      env:
        TELEPORT_FQDN: ${{ inputs.teleportFqdn }}
      run: |
        version=$(curl -sf --retry 5 --retry-all-errors "https://${TELEPORT_FQDN}/webapi/find" \
          | jq -r '.auto_update.tools_version // .server_version')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # cdn.teleport.dev 5xx now and then: one retry after a pause.
    - id: tp-setup
      if: ${{ inputs.awsAccessKey == '' }}
      continue-on-error: true
      uses: teleport-actions/setup@v1.1.1
      with:
        version: ${{ steps.tp-version.outputs.version }}
        proxy: ${{ inputs.teleportFqdn }}

    - if: ${{ steps.tp-setup.outcome == 'failure' }}
      shell: bash
      run: sleep 20
    - if: ${{ steps.tp-setup.outcome == 'failure' }}
      uses: teleport-actions/setup@v1.1.1
      with:
        version: ${{ steps.tp-version.outputs.version }}
        proxy: ${{ inputs.teleportFqdn }}

    - name: Mint Teleport workload-identity JWT for AWS
      if: ${{ inputs.awsAccessKey == '' }}
      shell: bash
      env:
        TELEPORT_FQDN: ${{ inputs.teleportFqdn }}
        TELEPORT_TOKEN: ${{ inputs.teleportToken }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        token="${TELEPORT_TOKEN:-image-push-github-actions-${REPO_NAME}}"
        out="$(mktemp -d)"
        cat > "$out/tbot.yaml" <<EOF
        version: v2
        proxy_server: ${TELEPORT_FQDN}
        onboarding:
          join_method: github
          token: ${token}
        oneshot: true
        storage:
          type: memory
        services:
          - type: workload-identity-jwt
            destination:
              type: directory
              path: ${out}/svid
            selector:
              name: image-push
            audiences: ["sts.amazonaws.com"]
        EOF
        mkdir -p "$out/svid"
        # Retries transient Teleport backend / GitHub OIDC failures, fails at once
        # on configuration errors (../tbot-join/tbot-join.sh, same ref as this action).
        bash "${GITHUB_ACTION_PATH}/../tbot-join/tbot-join.sh" -c "$out/tbot.yaml" -r "$out/svid/jwt_svid" \
          -l "token ${token}" -H "does ${token} exist in image-push-tokens.yaml, and does the job have id-token: write?"
        echo "PUSH_ECR_JWT_SVID=$out/svid/jwt_svid" >> "$GITHUB_ENV"

    - name: Configure AWS Credentials (workload identity)
      if: ${{ inputs.awsAccessKey == '' }}
      uses: aws-actions/configure-aws-credentials@v4.3.1
      with:
        role-to-assume: ${{ inputs.awsRoleArn }}
        aws-region: ${{ steps.region.outputs.value }}
        web-identity-token-file: ${{ env.PUSH_ECR_JWT_SVID }}

    - name: Login to Amazon ECR Private
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2.1.7

    # Inputs reach the shell through `env:`, never through ${{ }} in the script
    # body: GitHub substitutes the expression BEFORE bash parses the line, so a
    # quote or a `;` in a caller-supplied value would execute in a step holding
    # AWS credentials and an ECR login.
    - name: Create AWS repositories if not exist
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REPOSITORIES: ${{ inputs.repositories }}
      run: |
        IFS=',' read -ra REPOS <<< "${REPOSITORIES}"
        for repo in "${REPOS[@]}"; do
          repo=$(echo "$repo" | xargs)  # trim whitespace
          # Release tags immutable, moving tags excluded: see create-repository.sh.
          aws ecr describe-repositories --repository-names "$repo" || {
            bash ./create-repository.sh "$repo"
            aws ecr set-repository-policy --repository-name "$repo" --policy-text file://ecr-policy.json
          }
        done

    - name: Tag docker images
      if: ${{ inputs.push == 'true' }}
      env:
        registry: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORIES: ${{ inputs.repositories }}
        LOCAL_TAG: ${{ inputs.localTag }}
        TARGET_TAG: ${{ inputs.targetTag }}
      shell: bash
      run: |
        [ -n "$LOCAL_TAG" ] || { echo "::error::localTag is required with push: true"; exit 1; }
        IFS=',' read -ra REPOS <<< "${REPOSITORIES}"
        for repo in "${REPOS[@]}"; do
          repo=$(echo "$repo" | xargs)  # trim whitespace
          docker tag "local/$repo:${LOCAL_TAG}" "${registry}/$repo:${TARGET_TAG}"
        done

    # A fresh runner's daemon (overlay2) holds no registry metadata for these
    # layers, so `docker push` uploads every one of them even when ECR already
    # has 81 of 85 (data-mesh-algs-413, 22.10.2026: 2.3 GB a release for 3 MB
    # of change). Callers that build with BuildKit use push: false instead.
    - name: Docker push
      if: ${{ inputs.push == 'true' }}
      env:
        registry: ${{ steps.login-ecr.outputs.registry }}
        REPOSITORIES: ${{ inputs.repositories }}
        TARGET_TAG: ${{ inputs.targetTag }}
      shell: bash
      run: |
        IFS=',' read -ra REPOS <<< "${REPOSITORIES}"
        for repo in "${REPOS[@]}"; do
          repo=$(echo "$repo" | xargs)  # trim whitespace
          docker push "${registry}/$repo:${TARGET_TAG}"
        done
