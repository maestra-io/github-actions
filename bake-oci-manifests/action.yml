name: 'Bake OCI manifests artifact'
description: >-
  Bakes a microservice's kustomization/ tree into an OCI artifact at
  ${ECR_REGISTRY}/<service>-manifests:<tag>, cosign-keyless-signs the digest,
  and verifies the pulled artifact contains no leftover placeholders. Used by
  the OCI + Kargo deploy pattern (see maestra-io/fluxcd/docs/microservice-deployment.md).

inputs:
  service:
    description: 'Service name (kebab-case, e.g. db-migrator). Derives TELEPORT_TOKEN and IMAGE_MANIFESTS.'
    required: true
  tag:
    description: >-
      Explicit bare-semver tag to bake. Use when calling this action from a job
      that is NOT triggered by a tag push — e.g. a `bake` job in a push-to-main
      release workflow on a GitHub-native repo, where the release tag is created
      with GITHUB_TOKEN and so cannot trigger a separate `on: push: tags`
      workflow. When set, it takes precedence over the workflow_dispatch input
      and GITHUB_REF_NAME. Leave empty (default) to preserve the
      tag-push/workflow_dispatch behavior.
    required: false
    default: ''
  images:
    description: >-
      Comma-separated list of image basenames to verify exist in ECR before
      baking (e.g. "db_migrator_services,db_migrator_migrator"). The bake refuses
      to proceed if any image is missing for the target tag. Leave EMPTY for
      artifacts that ship no app images (e.g. a Terraform-module bundle
      consumed by a tofu Terraform CR) — the image-verify step is skipped.
    required: false
    default: ''
  bake-path:
    description: >-
      Path within the repo packed into the OCI artifact and used for the
      placeholder substitution + pull-verify. Default './kustomization' (k8s
      manifest tree). Set './terraform' for a Terraform-module bundle. The
      ${APP_PACKAGE_VERSION_TO_BE_REPLACED} substitution is a no-op when the
      tree has no such placeholder (e.g. terraform), so it is safe for both.
    required: false
    default: './kustomization'
  flux-version:
    description: 'flux CLI version (without v- prefix).'
    required: false
    default: '2.8.6'
  aws-region:
    description: >-
      AWS region for ECR. us-west-2 since phase 6 of the ECR eu-central-1 ->
      us-west-2 migration
      (https://github.com/maestra-io/issues-maestra/issues/1354).
    required: false
    default: 'us-west-2'
  ecr-registry:
    description: 'ECR registry host.'
    required: false
    default: '515260921971.dkr.ecr.us-west-2.amazonaws.com'
  aws-region-secondary:
    description: >-
      Second ECR region that receives a byte-identical copy of the baked
      artifact (ECR eu-central-1 -> us-west-2 migration, phase 3 dual-push:
      https://github.com/maestra-io/issues-maestra/issues/1354). The artifact is
      imported BY DIGEST and then tagged with `crane tag`, so both regions hold
      the digest this job baked — a second `flux push` would re-tar the tree and
      produce a different one. EMPTY since phase 6: eu-central-1 is frozen and
      us-west-2 is the only push target, so the mirror has nothing to copy.
    required: false
    default: ''
  ecr-registry-secondary:
    description: >-
      ECR registry host in the secondary region. Only used when
      aws-region-secondary is non-empty, which it is not since phase 6.
      Restoring the mirror is a FOUR-value override, never a single edit:
      aws-region=eu-central-1, ecr-registry=515260921971.dkr.ecr.eu-central-1.amazonaws.com,
      aws-region-secondary=us-west-2, ecr-registry-secondary=this default.
      The direction cannot be inverted — the mirror is a cache prime plus a
      storage poll, and only us-west-2 carries the registry-ROOT
      pull-through-cache rule (see aws-region-secondary above).
    required: false
    default: '515260921971.dkr.ecr.us-west-2.amazonaws.com'
  crane-version:
    description: >-
      crane CLI version (without the v- prefix), downloaded into a temporary
      directory. Only used when aws-region-secondary is non-empty.
    required: false
    default: '0.22.0'
  teleport-fqdn:
    description: 'Teleport proxy host:port.'
    required: false
    default: 'teleport.maestra.io:443'
  aws-role-arn:
    description: 'IAM role assumed via Teleport workload-identity OIDC.'
    required: false
    default: 'arn:aws:iam::515260921971:role/teleport-image-push'

outputs:
  version:
    description: 'Resolved semver tag the artifact was baked at.'
    value: ${{ steps.ver.outputs.version }}
  digest:
    description: 'OCI digest of the pushed manifests artifact.'
    value: ${{ steps.push.outputs.digest }}

runs:
  using: 'composite'
  steps:
    # Inputs reach the shell through `env:`, never through ${{ }} in the script
    # body: GitHub substitutes the expression BEFORE bash parses the line, so a
    # quote or a `;` in a caller-supplied value would execute in a step that
    # holds a Teleport identity and AWS/ECR credentials.
    - name: resolve version
      id: ver
      shell: bash
      env:
        TAG_INPUT: ${{ inputs.tag }}
        TAG_DISPATCH: ${{ github.event.inputs.tag }}
        SERVICE: ${{ inputs.service }}
      run: |
        if [ -n "${TAG_INPUT}" ]; then
          tag="${TAG_INPUT}"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          tag="${TAG_DISPATCH}"
        else
          tag="${GITHUB_REF_NAME}"
        fi
        case "$tag" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "::error::tag '$tag' is not bare semver (e.g. 1.0.648)"; exit 1 ;;
        esac
        echo "version=$tag" >> "$GITHUB_OUTPUT"
        echo "Baking manifests for ${SERVICE} $tag"

    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: ${{ steps.ver.outputs.version }}
        fetch-depth: 1

    # ── Teleport workload-identity → AWS STS → ECR ────────────────────────
    - name: get teleport version
      id: tp-version
      shell: bash
      env:
        TELEPORT_FQDN: ${{ inputs.teleport-fqdn }}
      run: |
        version=$(curl -sf "https://${TELEPORT_FQDN}/webapi/find" \
          | jq -r '.auto_update.tools_version // .server_version')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
      with:
        version: ${{ steps.tp-version.outputs.version }}
        proxy: ${{ inputs.teleport-fqdn }}

    - name: mint Teleport workload-identity JWT for AWS
      shell: bash
      env:
        TELEPORT_FQDN: ${{ inputs.teleport-fqdn }}
        SERVICE: ${{ inputs.service }}
      run: |
        cat > /tmp/tbot.yaml <<EOF
        version: v2
        proxy_server: ${TELEPORT_FQDN}
        onboarding:
          join_method: github
          token: image-push-github-actions-${SERVICE}
        oneshot: true
        storage:
          type: memory
        services:
          - type: workload-identity-jwt
            destination:
              type: directory
              path: /tmp/tbot-output
            selector:
              name: image-push
            audiences: ["sts.amazonaws.com"]
        EOF
        mkdir -p /tmp/tbot-output
        tbot start -c /tmp/tbot.yaml || true
        test -f /tmp/tbot-output/jwt_svid

    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        web-identity-token-file: /tmp/tbot-output/jwt_svid

    - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      with:
        registries: "515260921971"

    # ── Verify GitLab CI already pushed every image for this tag ──────────
    # If any is missing, refuse to bake the bundle — a manifests artifact
    # without working images is worse than no artifact at all. Skipped when
    # `images` is empty (artifact ships no app images, e.g. a TF-module bundle).
    - name: verify images exist
      if: ${{ inputs.images != '' }}
      shell: bash
      env:
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        AWS_REGION: ${{ inputs.aws-region }}
        IMAGES: ${{ inputs.images }}
        TAG: ${{ steps.ver.outputs.version }}
      run: |
        set -e
        IFS=',' read -ra REPOS <<< "$IMAGES"
        for repo in "${REPOS[@]}"; do
          repo=$(echo "$repo" | xargs)
          echo "checking ${ECR_REGISTRY}/${repo}:${TAG}"
          aws ecr describe-images \
            --repository-name "$repo" \
            --image-ids "imageTag=${TAG}" \
            --region "$AWS_REGION" >/dev/null \
            || { echo "::error::${repo}:${TAG} missing in ECR — refusing to bake bundle"; exit 1; }
        done

    - name: ensure manifests repo exists (immutable tags)
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        IMAGE_MANIFESTS: ${{ inputs.service }}-manifests
      run: |
        # IMMUTABLE so a republish of the same tag (e.g. an accidental
        # workflow_dispatch on an existing tag) fails fast at PutImage
        # instead of silently overwriting a published artifact.
        aws ecr describe-repositories --repository-names "$IMAGE_MANIFESTS" \
          --region "$AWS_REGION" >/dev/null 2>&1 \
          || aws ecr create-repository \
               --repository-name "$IMAGE_MANIFESTS" \
               --image-tag-mutability IMMUTABLE \
               --region "$AWS_REGION" >/dev/null

    # Same repository in the dual-push region. ECR never auto-creates a
    # repository on push, and the registry-root pull-through-cache rule only
    # materialises one on a PULL — so the mirror target has to be created here.
    - name: ensure manifests repo exists in the secondary region
      if: ${{ inputs.aws-region-secondary != '' }}
      shell: bash
      env:
        AWS_REGION_SECONDARY: ${{ inputs.aws-region-secondary }}
        IMAGE_MANIFESTS: ${{ inputs.service }}-manifests
      run: |
        aws ecr describe-repositories --repository-names "$IMAGE_MANIFESTS" \
          --region "$AWS_REGION_SECONDARY" >/dev/null 2>&1 \
          || aws ecr create-repository \
               --repository-name "$IMAGE_MANIFESTS" \
               --image-tag-mutability IMMUTABLE \
               --region "$AWS_REGION_SECONDARY" >/dev/null

    # ── Tools ─────────────────────────────────────────────────────────────
    - name: install flux CLI
      shell: bash
      env:
        FLUX_VERSION: ${{ inputs.flux-version }}
      run: |
        curl -sL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin flux
        flux --version

    # ── Substitute the version placeholder ────────────────────────────────
    # For a k8s-manifest tree the placeholder lives in
    # <bake-path>/base/helm-release-{app,init}.yaml as
    # `packageVersion: ${APP_PACKAGE_VERSION_TO_BE_REPLACED}`. After the sed
    # pass, the bake refuses to push if any placeholder survived. For a tree
    # with no such placeholder (e.g. a terraform bundle) the sed matches
    # nothing and the guard grep finds nothing — a safe no-op.
    - name: substitute APP_PACKAGE_VERSION_TO_BE_REPLACED
      shell: bash
      env:
        TAG: ${{ steps.ver.outputs.version }}
        BAKE_PATH: ${{ inputs.bake-path }}
      run: |
        test -d "$BAKE_PATH" || { echo "::error::bake-path '$BAKE_PATH' not found in repo"; exit 1; }
        find "$BAKE_PATH" -type f -name '*.yaml' \
          -exec sed -i "s|\${APP_PACKAGE_VERSION_TO_BE_REPLACED}|${TAG}|g" {} +
        if grep -rn '\${APP_PACKAGE_VERSION_TO_BE_REPLACED}' "$BAKE_PATH" ; then
          echo "::error::APP_PACKAGE_VERSION_TO_BE_REPLACED placeholder still present after substitution"
          exit 1
        fi
        echo "--- packageVersion after substitution (if any) ---"
        grep -rn packageVersion "$BAKE_PATH" || true

    # ── Guard: no frozen-registry host in the tree ────────────────────────
    # ECR eu-central-1 stopped receiving tags on 2026-09-02 16:50 UTC (phase 6
    # of https://github.com/maestra-io/issues-maestra/issues/1354). A host
    # literal in the tree — an in-repo chart helper, a HelmRelease
    # `image.registry`, a CNPG `imageName` — renders a pull path that cannot
    # resolve any post-freeze tag, and the bake is the only place that sees
    # the tree before Flux does: postBuild substitution touches the kustomize
    # OUTPUT, never the chart templates packed into the artifact. Live
    # example: personalization-workers-manifests:1.0.2267 (a
    # `container.registry.name` helper literal) → 49 ImagePullBackOff pods on
    # us-omega, 2026-09-03. Registry hosts only — `s3.eu-central-1` endpoints
    # are data, not pull paths, and stay allowed. Same guard as
    # system/components/maestra-bake-oci-manifests 1.0.8.
    - name: guard against the frozen eu-central-1 registry host
      shell: bash
      env:
        BAKE_PATH: ${{ inputs.bake-path }}
      run: |
        FROZEN_REGISTRY="515260921971.dkr.ecr.eu-central-1.amazonaws.com"
        if grep -rnF "$FROZEN_REGISTRY" "$BAKE_PATH"; then
          echo "::error::frozen registry host ${FROZEN_REGISTRY} in ${BAKE_PATH} — reference \${CONTAINER_REGISTRY} (Flux substitutes it per cluster) or the us-west-2 host"
          exit 1
        fi
        # helm-charts charts whose DEFAULT for the maestra contours was the
        # frozen host until commons-app 18.1.1 / commons-app-init 7.5.1 /
        # external-vault-agent 4.3.1. A lower pin renders the frozen host
        # unless the HelmRelease sets containerRegistryName itself — warn only.
        check_registry_floor() {
          grep -rh -A1 -E "^\s*chart: $1\$" --include='*.yaml' "$BAKE_PATH" \
            | sed -n 's/.*version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' | sort -uV \
            | while read -r v; do
                if [ "$(printf '%s\n%s\n' "$2" "$v" | sort -V | head -n1)" != "$2" ]; then
                  echo "::warning::$1 pinned at $v (< $2) resolves the frozen eu-central-1 host unless the HelmRelease overrides containerRegistryName"
                fi
              done
        }
        check_registry_floor commons-app 18.1.1
        check_registry_floor commons-app-init 7.5.1
        check_registry_floor external-vault-agent 4.3.1

    # ── Bake the OCI artifact ─────────────────────────────────────────────
    - name: flux push artifact
      id: push
      shell: bash
      env:
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        IMAGE_MANIFESTS: ${{ inputs.service }}-manifests
        TAG: ${{ steps.ver.outputs.version }}
        BAKE_PATH: ${{ inputs.bake-path }}
      run: |
        out=$(flux push artifact \
          "oci://${ECR_REGISTRY}/${IMAGE_MANIFESTS}:${TAG}" \
          --path "${BAKE_PATH}" \
          --source "https://github.com/${GITHUB_REPOSITORY}" \
          --revision "${GITHUB_SHA}" \
          --output json)
        echo "$out" | jq .
        echo "digest=$(echo "$out" | jq -r .digest)" >> "$GITHUB_OUTPUT"

    - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

    - name: cosign keyless sign manifests
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "true"
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        IMAGE_MANIFESTS: ${{ inputs.service }}-manifests
        DIGEST: ${{ steps.push.outputs.digest }}
      run: cosign sign --yes "${ECR_REGISTRY}/${IMAGE_MANIFESTS}@${DIGEST}"

    # ── Sanity: pull the artifact back and verify it contains what we sent
    - name: verify artifact pullable
      shell: bash
      env:
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        IMAGE_MANIFESTS: ${{ inputs.service }}-manifests
        TAG: ${{ steps.ver.outputs.version }}
      run: |
        mkdir -p /tmp/verify
        flux pull artifact \
          "oci://${ECR_REGISTRY}/${IMAGE_MANIFESTS}:${TAG}" \
          --output /tmp/verify
        ls -R /tmp/verify | head -30
        # Match the placeholder form `${APP_PACKAGE_VERSION_TO_BE_REPLACED}` —
        # base/helm-release-{app,init}.yaml legitimately mention the variable
        # name in comments without the ${...} braces; those are safe.
        if grep -rn '\${APP_PACKAGE_VERSION_TO_BE_REPLACED}' /tmp/verify ; then
          echo "::error::Placeholder leaked into pulled artifact"
          exit 1
        fi

    # ── Dual-push: mirror the verified artifact to the secondary region ────
    # Phase 3 of the ECR eu-central-1 -> us-west-2 migration
    # (https://github.com/maestra-io/issues-maestra/issues/1354). Runs after the
    # verify pull so a broken artifact is never propagated. Hard failure by
    # design: a soft-failed mirror is an invisible gap that phase 4 (repointing
    # Kargo/Flux at us-west-2) would only discover as missing Freight.
    #
    # The secondary region carries a registry-ROOT pull-through-cache rule onto
    # the primary one, which makes every registry READ against the secondary
    # host lie: it answers THROUGH the cache from the primary region, for
    # content the secondary repository does not store. Two consequences, both
    # reproduced in production (rakes #2/#4 of the issue above):
    #   - `crane copy` sees the proxied "destination already has it", no-ops,
    #     and a STALE storage record for that tag survives. The only primitive
    #     that rewrites the storage record is `crane tag`, which PUTs
    #     unconditionally.
    #   - `crane digest <secondary>/<repo>:<tag>` confirms content this job
    #     never wrote — and pins that tag in the cache for up to 24 h on top.
    # So: read the reference digest from STORAGE (`describe-images`), import
    # deliberately BY DIGEST, wait for real storage, write the tag with
    # `crane tag`, and assert against storage in both regions. Same doctrine as
    # system/components/maestra-bake-oci-manifests 1.0.5 on the GitLab side.
    - name: mirror manifests artifact to the secondary region
      if: ${{ inputs.aws-region-secondary != '' }}
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        AWS_REGION_SECONDARY: ${{ inputs.aws-region-secondary }}
        ECR_REGISTRY: ${{ inputs.ecr-registry }}
        ECR_REGISTRY_SECONDARY: ${{ inputs.ecr-registry-secondary }}
        CRANE_VERSION: ${{ inputs.crane-version }}
        IMAGE_MANIFESTS: ${{ inputs.service }}-manifests
        TAG: ${{ steps.ver.outputs.version }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail

        IMPORT_TIMEOUT=180
        IMPORT_POLL=5

        # Reference digest = what the primary region STORES for this tag, never
        # a registry read path. `None` is what describe-images prints for a
        # missing image with --output text, and it would poison the tag write
        # just as silently as an empty value.
        REF_DIGEST=$(aws ecr describe-images \
          --repository-name "$IMAGE_MANIFESTS" \
          --region "$AWS_REGION" \
          --image-ids "imageTag=${TAG}" \
          --query 'imageDetails[0].imageDigest' --output text 2>/dev/null) || REF_DIGEST=""
        if [ -z "$REF_DIGEST" ] || [ "$REF_DIGEST" = "None" ]; then
          echo "::error::could not read the ${AWS_REGION} storage digest of ${IMAGE_MANIFESTS}:${TAG}"
          exit 1
        fi
        if [ -n "${DIGEST:-}" ] && [ "$REF_DIGEST" != "$DIGEST" ]; then
          echo "::error::${AWS_REGION} stores ${REF_DIGEST} for ${IMAGE_MANIFESTS}:${TAG}, but this job baked ${DIGEST}"
          exit 1
        fi

        # Storage truth on the secondary side too: a proxied read would report
        # "present" for a tag this repository does not actually store.
        MIRROR_DIGEST=$(aws ecr describe-images \
          --repository-name "$IMAGE_MANIFESTS" \
          --region "$AWS_REGION_SECONDARY" \
          --image-ids "imageTag=${TAG}" \
          --query 'imageDetails[0].imageDigest' --output text 2>/dev/null) || MIRROR_DIGEST=""
        if [ "$MIRROR_DIGEST" = "$REF_DIGEST" ]; then
          echo "${ECR_REGISTRY_SECONDARY}/${IMAGE_MANIFESTS}:${TAG} already stores ${REF_DIGEST} — mirror skipped"
          exit 0
        fi
        if [ -n "$MIRROR_DIGEST" ] && [ "$MIRROR_DIGEST" != "None" ]; then
          # Presence alone is NOT the question — a tag already pointing at other
          # content is the exact silent failure this step exists to prevent, and
          # the mirror repository is IMMUTABLE so `crane tag` cannot repair it.
          echo "::error::${AWS_REGION_SECONDARY} stores ${MIRROR_DIGEST} for ${IMAGE_MANIFESTS}:${TAG}, ${AWS_REGION} has ${REF_DIGEST}"
          echo "::error::the mirror repository has IMMUTABLE tags — delete the diverged tag by hand, then re-run:"
          echo "::error::  aws ecr batch-delete-image --region ${AWS_REGION_SECONDARY} --repository-name ${IMAGE_MANIFESTS} --image-ids imageTag=${TAG}"
          exit 1
        fi

        # crane goes into a temp dir, never into the workspace — the tree that
        # was just packed into the artifact stays exactly as verified.
        CRANE_DIR="$(mktemp -d)"
        curl -sfL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
          | tar -xz -C "$CRANE_DIR" crane
        export PATH="${CRANE_DIR}:${PATH}"
        crane version

        aws ecr get-login-password --region "$AWS_REGION" \
          | crane auth login "$ECR_REGISTRY" --username AWS --password-stdin
        aws ecr get-login-password --region "$AWS_REGION_SECONDARY" \
          | crane auth login "$ECR_REGISTRY_SECONDARY" --username AWS --password-stdin

        # Trigger the server-side import BY DIGEST. A tag read through the
        # secondary host would pin that tag in the pull-through cache to the
        # then-current primary content for up to 24 h, un-evictable; digest
        # mappings cannot go stale. A manifests artifact is a single OCI
        # manifest — no child manifests to import alongside it (the multi-arch
        # recursion that push-to-aws-ecr-repository needs does not apply here).
        echo "Priming ${AWS_REGION_SECONDARY} with ${IMAGE_MANIFESTS}@${REF_DIGEST}"
        crane manifest "${ECR_REGISTRY_SECONDARY}/${IMAGE_MANIFESTS}@${REF_DIGEST}" >/dev/null 2>&1 || true

        # The import is ASYNCHRONOUS, and describe-images is the only honest
        # "has it landed yet" question — the read path answers yes immediately.
        waited=0
        until aws ecr describe-images --region "$AWS_REGION_SECONDARY" \
                --repository-name "$IMAGE_MANIFESTS" \
                --image-ids "imageDigest=${REF_DIGEST}" >/dev/null 2>&1; do
          if [ "$waited" -ge "$IMPORT_TIMEOUT" ]; then
            echo "::error::${IMAGE_MANIFESTS}@${REF_DIGEST} did not reach ${AWS_REGION_SECONDARY} storage within ${IMPORT_TIMEOUT}s"
            exit 1
          fi
          sleep "$IMPORT_POLL"
          waited=$((waited + IMPORT_POLL))
        done
        echo "${IMAGE_MANIFESTS}@${REF_DIGEST} is in ${AWS_REGION_SECONDARY} storage after ${waited}s"

        echo "Tagging ${ECR_REGISTRY_SECONDARY}/${IMAGE_MANIFESTS}@${REF_DIGEST} as ${TAG}"
        crane tag "${ECR_REGISTRY_SECONDARY}/${IMAGE_MANIFESTS}@${REF_DIGEST}" "${TAG}"

        MIRROR_DIGEST=$(aws ecr describe-images \
          --repository-name "$IMAGE_MANIFESTS" \
          --region "$AWS_REGION_SECONDARY" \
          --image-ids "imageTag=${TAG}" \
          --query 'imageDetails[0].imageDigest' --output text 2>/dev/null) || MIRROR_DIGEST=""
        if [ "$MIRROR_DIGEST" != "$REF_DIGEST" ]; then
          echo "::error::${AWS_REGION_SECONDARY} stores ${MIRROR_DIGEST:-<none>} for ${IMAGE_MANIFESTS}:${TAG}, ${AWS_REGION} has ${REF_DIGEST}"
          exit 1
        fi
        echo "Mirrored ${ECR_REGISTRY_SECONDARY}/${IMAGE_MANIFESTS}:${TAG} @ ${MIRROR_DIGEST}"
