---
- name: Assert the role inputs are complete
  ansible.builtin.assert:
    that:
      - wireguard_burst_mode in ['embedded', 'dedicated']
      - wireguard_burst_address | length > 0
      - wireguard_burst_slots | length > 0
      - wireguard_burst_slots | rejectattr('name', 'defined') | list | length == 0
      - wireguard_burst_slots | rejectattr('ip', 'defined') | list | length == 0
      - wireguard_burst_slots | rejectattr('pubkey', 'defined') | list | length == 0
      - (wireguard_burst_slots | map(attribute='ip') | unique | list | length) == (wireguard_burst_slots | length)
      - (wireguard_burst_slots | map(attribute='pubkey') | unique | list | length) == (wireguard_burst_slots | length)
    fail_msg: >-
      wireguard_burst_mode must be embedded|dedicated, wireguard_burst_address set, and
      wireguard_burst_slots a non-empty list of {name, ip, pubkey} with unique ip and pubkey.
    quiet: true

- name: Assert the embedded fallback has its loop breaker
  ansible.builtin.assert:
    that: wireguard_burst_neighbour_mac | length > 0
    fail_msg: >-
      wireguard_burst_neighbour_lan_ip is set but wireguard_burst_neighbour_mac is not: with both
      tunnels down the two fallbacks point at each other, and the MAC is what the forward-chain
      rule uses to drop that loop.
    quiet: true
  when:
    - wireguard_burst_mode == 'embedded'
    - wireguard_burst_neighbour_lan_ip | length > 0

- name: Assert the dedicated gateway has its uplinks
  ansible.builtin.assert:
    that:
      - wireguard_burst_bgp_router_id | length > 0
      - wireguard_burst_bgp_uplinks | length > 0
      - wireguard_burst_bgp_accept | length > 0
      - wireguard_burst_wan_address | length == 0 or wireguard_burst_wan_gateway | length > 0
    fail_msg: "dedicated mode needs wireguard_burst_bgp_router_id, wireguard_burst_bgp_uplinks and wireguard_burst_bgp_accept (and wireguard_burst_wan_gateway with a WAN address)."
    quiet: true
  when: wireguard_burst_mode == 'dedicated'
