---
# maestra.infra.os_update — generic half of the fleet OS-update workflow.
# The role-specific half lives in each consumer repo under
# ansible/tasks/os-update/{vars,preflight,drain,verify,undrain,settle}.yml
# (contract: docs/ansible-os-update.md).

# plan | stage | apply | binary-update | undrain-only.
#   plan        mutates nothing.
#   stage       installs the upgrade (kernel included) and stops there: no cordon,
#               no drain, no reboot. The new kernel becomes active at the node's
#               NEXT reboot, whoever performs it. On Deckhouse kube nodes that is
#               normally the platform's own node-update wave, which reboots every
#               node anyway — staging under a running wave turns those reboots
#               from wasted into the activation step, and removes the second
#               fleet-wide reboot entirely.
#   apply       the full drain -> upgrade -> reboot -> verify contract.
#   binary-update
#               drain -> swap the SERVING BINARY -> verify -> undrain, with the
#               apt/kernel/reboot path skipped entirely. It exists because a
#               binary bump (haproxy-otel track, a rebuilt agent) needs exactly
#               the same "out of rotation, proven, back in" window as an OS
#               patch and none of the patching, and driving it through the
#               config-deploy pipeline instead costs 3 PRs and a full CI matrix
#               per host (issues-maestra#1373).
#
#               It differs from `apply` in ONE load-bearing way: on failure the
#               host STAYS DRAINED and the job goes red. `apply` un-drains in
#               `always` because a patched host that failed verify is usually a
#               host that needs a human look while it serves; a host whose
#               serving binary was just replaced and cannot be proven healthy is
#               the opposite — putting THAT back into rotation is the outage.
#               Rollback is re-running the mode with the previous track pinned,
#               and `undrain-only` stays the escape hatch.
#
#               The payload is consumer-specific, so it is two hooks in the
#               consumer repo (binary-update.yml + verify-binary-update.yml);
#               a consumer that does not implement them cannot use the mode, and
#               the role says so BEFORE it drains anything.
os_update_mode: plan

# Where the consumer repo's hook task-files live (playbook_dir = <repo>/ansible/playbooks).
os_update_hooks_dir: "{{ playbook_dir }}/../tasks/os-update"

# Alertmanager, reached through the tbot app-tunnel started by ansible-run.yml
# (tbot_tunnels: app=alertmanager listen=9093). Empty = refuse to apply.
os_update_am_url: ""

# Dead-man window for the maintenance silences. MUST stay below the `for:` of
# the OsUpdateHostStrandedDrain alert, or the safety net silences itself.
os_update_silence_minutes: 25

# Reboot behaviour. post_reboot_delay covers Teleport agent re-registration:
# the host is SSH-reachable only once its teleport agent is back in the proxy's
# inventory, and ansible reconnects through the tsh ProxyCommand.
os_update_reboot_timeout: 900
os_update_post_reboot_delay: 45
os_update_connect_timeout: 30

# Packages that are owned by IaC (custom builds, pinned versions, or the very
# transport we are riding on) and must NEVER be touched by the OS upgrade.
# `teleport` is on this list because its postinst restarts the agent we are
# connected through. Consumers add their own via os_update_pinned_extra.
os_update_pinned_base:
  - teleport
  - frr
  - frr-pythontools
  - consul
os_update_pinned_extra: []

# Kernel GC only when /boot is genuinely tight — autoremove --purge has a wider
# blast radius than "delete old kernels", so we don't run it speculatively.
os_update_boot_free_gc_threshold_mb: 500

# How much room the /boot guard demands before it will let a host be drained.
# NOT an absolute MB figure: what the upgrade needs is room to unpack ONE more
# kernel, and a kernel costs what it costs on THIS host — ~98 MB on the omega
# kube nodes, more on a host with a fatter initrd. plan.yml measures the largest
# kernel already in /boot and multiplies by this, so the requirement scales with
# the machine instead of with a number guessed on a different one.
#
# A constant cannot work across the fleet: the kube nodes have a 467 MB /boot,
# so the old `os_update_boot_free_min_mb: 400` was unsatisfiable there even with
# a single kernel installed — the guard could never pass, on hosts with 241 MB
# free and room for two more kernels.
os_update_boot_free_factor: 2
# Floor for the pathological case where /boot holds no kernel to measure.
os_update_boot_free_floor_mb: 150

# Drain marker: survives a runner crash, so a re-run can tell "this host was
# left drained by a previous run" from "this host is healthy and in rotation".
os_update_marker_dir: /var/lib/os-update
os_update_marker_file: /var/lib/os-update/drained.json
# Where node_exporter's textfile collector reads .prom files, for the
# os_update_drained gauge marker.yml writes.
#
# `node_exporter_textfile_dir` (unprefixed) is a FLEET-WIDE convention, not an
# os_update knob: every consumer repo already declares it in
# ansible/inventory/group_vars/all.yml and feeds it to its own node-exporter
# tasks and templates, and maestra-io/kubernetes-clusters overrides it per run
# (/var/run/node-exporter-textfile on a Deckhouse node). A role default may not
# carry that bare name — ansible-lint var-naming[no-role-prefix] rejects it, and
# rightly: an unprefixed role default silently claims a fleet-wide name.
#
# So the KEY is prefixed and the fleet convention is read through it. Role
# defaults are the lowest precedence and this template is evaluated lazily at
# use time, so anything a consumer sets (group_vars, a set_fact in its
# os-update/vars.yml hook, -e) still wins, exactly as before. Referencing an
# unprefixed variable inside the expression is fine — the rule looks at the key.
os_update_node_exporter_textfile_dir: "{{ node_exporter_textfile_dir | default('/var/lib/node_exporter') }}"

# Run URL, injected by the reusable workflow for the silence comment + marker.
os_update_run_url: manual

# Escape hatch for a deliberate fleet-wide local run (the playbook is normally
# driven one host per GH job, so >1 host in the play means someone bypassed the
# GH-level fail-fast / approval / artifact trail).
os_update_allow_multi: false
os_update_allow_single_node: false

# The contour a drain window belongs to: the region_environment_site triplet
# of the farm/group name (us_omega_lw_kubernetes -> us_omega_lw). The
# one-at-a-time guard is scoped to THIS: a us and an eu sweep touch disjoint
# fleets and must not block each other, while anything sharing the triplet
# still serializes. Consumers set os_update_farm in their vars.yml before
# guards run; the default here evaluates lazily.
os_update_contour: "{{ (os_update_farm.split('_'))[:3] | join('_') }}"

# Let `mode: stage` reclaim /boot when the plan guard cannot be met. Turning this
# off makes a tight /boot a hard refusal instead — safe, just less useful.
os_update_stage_gc_enabled: true

# How long apt-mark waits for the dpkg frontend lock before giving up, mirroring
# what apt.yml has always passed to apt-get. On a Deckhouse node bashible runs
# apt transactions of its own, so the lock is genuinely contended.
os_update_dpkg_lock_timeout: 300
