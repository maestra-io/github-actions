---
# Runs in `always`. An already-expired silence is not an error — but a failure to
# reach Alertmanager IS worth showing, so we surface it rather than swallowing it.
# We expire the silences we created; if the runner is killed the endsAt dead-man
# expires them anyway.

# No IDs to loop in two cases: undrain-only (silence.yml never runs, the silences
# belong to the DEAD run) and a silence POST loop that failed part-way (the items
# before the failing one exist, but set_fact never ran; 20.11.2026 omega
# worker-storage08 left five that blocked storage09's guard for 25 min).
# Recover them from Alertmanager by the same discriminator guards.yml uses
# (createdBy gha-os-update + `host=<me> ` with the trailing space), or the
# stranded silence blocks the next host's one-at-a-time guard until its endsAt.
- name: No IDs on record — recover this host's silence IDs from Alertmanager
  when: (os_update_silence_ids | default([]) | length) == 0
  block:
    - name: Fetch the silences
      ansible.builtin.uri:
        url: "{{ os_update_am_url }}/api/v2/silences"
        return_content: true
        status_code: 200
      delegate_to: localhost
      become: false
      check_mode: false
      register: os_update_silences_orphaned

    - name: Adopt the ones this host still owns
      ansible.builtin.set_fact:
        os_update_silence_ids: >-
          {{ os_update_silences_orphaned.json
             | default([])
             | selectattr('status.state', 'equalto', 'active')
             | selectattr('createdBy', 'defined')
             | selectattr('createdBy', 'search', '^gha-os-update')
             | selectattr('comment', 'search', 'host=' ~ inventory_hostname ~ ' ')
             | map(attribute='id')
             | list }}

- name: Expire the maintenance silences
  ansible.builtin.uri:
    url: "{{ os_update_am_url }}/api/v2/silence/{{ item }}"
    method: DELETE
    status_code: [200, 404, 500]
  delegate_to: localhost
  become: false
  check_mode: false
  loop: "{{ os_update_silence_ids | default([]) }}"
  register: os_update_unsilence
  failed_when: false

- name: Report any silence we could not expire (the dead-man endsAt still covers us)
  ansible.builtin.debug:
    msg: >-
      Could not expire silence {{ item.item }} (status {{ item.status | default('?') }});
      it expires on its own in <= {{ os_update_silence_minutes }} min.
  loop: "{{ os_update_unsilence.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - item.status is defined
    - item.status not in [200, 404]
