---
# dpkg holds are the mechanism that keeps the OS upgrade off the IaC-owned
# packages (custom haproxy/haproxy-otel builds, pinned frr, consul, and the
# teleport agent we are literally connected through).
#
# Two things this deliberately does NOT do:
#   * it does not try to scope apt to the Ubuntu archive via Dir::Etc::SourceList.
#     On 24.04 the repos are deb822 .sources under sources.list.d (SourceParts) —
#     overriding SourceList alone silently leaves every third-party repo enabled,
#     i.e. a protection that reads correct and does nothing.
#   * it does not trust the hold to be enough on its own: apt is free to satisfy a
#     dependency by REMOVING a held package. The tripwire below catches that.

- name: Apply holds
  when: os_update_holds_action == 'apply'
  block:
    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: apt
      check_mode: false

    - name: Which pinned packages are actually installed here and not already held
      ansible.builtin.set_fact:
        os_update_our_holds: >-
          {{ (os_update_pinned_base + os_update_pinned_extra)
             | unique
             | select('in', ansible_facts.packages)
             | difference(os_update_holds_before)
             | list }}

    - name: Hold them
      # -o DPkg::Lock::Timeout, and retries on top. `apt.yml` has always passed
      # this; these two apt-mark calls did not, and that asymmetry cost a run.
      #
      # On a Deckhouse node the lock has a real competitor: bashible runs apt of
      # its own. Measured on us-omega worker21 (run 33089541251): the node staged
      # fine, then the hold RESTORE died with "dpkg frontend lock was locked by
      # another process with pid 1402631", rc=100, leaving `teleport` held. The
      # node's apt history for that minute shows who: `apt-get install -y -qq
      # --no-install-recommends oathtool` (our own break-glass NGC step) and
      # `apt-get remove -y --allow-change-held-packages
      # linux-headers-6.8.0-138-generic`. So the claim that Deckhouse has no apt
      # transaction to race is wrong — it does not manage the kernel IMAGE, which
      # is a different statement.
      #
      # A failed restore is the worst of the failure modes here: the mutation has
      # already happened and a pin we introduced outlives the run, silently
      # freezing that package for every future upgrade.
      ansible.builtin.command:
        argv: >-
          {{ ['apt-mark', '-o', 'DPkg::Lock::Timeout=' ~ (os_update_dpkg_lock_timeout | int),
              'hold'] + os_update_our_holds }}
      register: os_update_hold_lock_try
      until: os_update_hold_lock_try.rc == 0
      retries: 5
      delay: 20
      register: os_update_hold_cmd
      changed_when: "'set on hold' in os_update_hold_cmd.stdout"
      check_mode: false
      when: os_update_our_holds | length > 0

    - name: Re-simulate with the holds in place
      ansible.builtin.command:
        argv: [apt-get, -s, dist-upgrade]
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: os_update_sim_held
      changed_when: false
      check_mode: false

    - name: TRIPWIRE — no IaC-owned package may be installed, upgraded OR REMOVED
      # `Remv haproxy-otel` is the catastrophic case: its postrm un-diverts
      # /usr/sbin/haproxy and the load balancer never comes back after the reboot.
      # Matching only `^Inst` would miss it entirely.
      ansible.builtin.assert:
        that:
          - >-
            os_update_sim_held.stdout_lines
            | select('match', '^(Inst|Remv|Purg) (' ~ ((os_update_pinned_base + os_update_pinned_extra) | unique | join('|')) ~ ')( |$)')
            | list | length == 0
        fail_msg: >-
          apt wants to touch a pinned package despite the holds:
          {{ os_update_sim_held.stdout_lines
             | select('match', '^(Inst|Remv|Purg) (' ~ ((os_update_pinned_base + os_update_pinned_extra) | unique | join('|')) ~ ')( |$)')
             | list }}
          Refusing to upgrade. Investigate the dependency that forces this.

- name: Restore the pre-existing hold set
  when: os_update_holds_action == 'restore'
  block:
    # No `failed_when: false` here: it would make the hold-restore rescue in
    # main.yml dead code — a swallowed unhold failure (dpkg lock right after apt
    # activity, full disk) leaves teleport/frr/consul held FOREVER, and their own
    # IaC-driven upgrades then fail silently on the next run.
    - name: Unhold only what WE held (someone else's pins stay put)
      # Same lock discipline as the hold above — see the note there. This is the
      # call that actually failed in production.
      ansible.builtin.command:
        argv: >-
          {{ ['apt-mark', '-o', 'DPkg::Lock::Timeout=' ~ (os_update_dpkg_lock_timeout | int),
              'unhold'] + os_update_our_holds }}
      register: os_update_unhold_lock_try
      until: os_update_unhold_lock_try.rc == 0
      retries: 5
      delay: 20
      register: os_update_unhold_cmd
      changed_when: "'canceled' in os_update_unhold_cmd.stdout"
      check_mode: false
      when: (os_update_our_holds | default([]) | length) > 0

    - name: Re-read the holds (apt-mark can exit 0 without actually unholding)
      ansible.builtin.command:
        argv: [apt-mark, showhold]
      register: os_update_showhold_after
      changed_when: false
      check_mode: false
      when: (os_update_our_holds | default([]) | length) > 0

    - name: Assert none of OUR holds survived the unhold
      ansible.builtin.assert:
        that:
          - >-
            (os_update_our_holds | intersect(os_update_showhold_after.stdout_lines | default([]))) | length == 0
        fail_msg: >-
          Holds we set are still in place after unhold:
          {{ os_update_our_holds | intersect(os_update_showhold_after.stdout_lines | default([])) }}.
          Left held, their IaC-driven upgrades (`apt-get install teleport=X`) fail
          silently. Clean up with `apt-mark unhold` by hand.
      when: (os_update_our_holds | default([]) | length) > 0
