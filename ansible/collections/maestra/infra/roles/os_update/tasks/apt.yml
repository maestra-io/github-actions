---
# The payload. Runs while the host is DRAINED (apply) or still in rotation (stage).

- name: Serialize against unattended-upgrades / apt-daily
  # The apt-daily timers are masked on these boxes (harden-apt), but the
  # unattended-upgrades unit itself is enabled and can still fire on boot.
  # lock_timeout makes us wait for the dpkg lock instead of dying on it.
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    # Same knob holds.yml uses — one source of truth for the dpkg lock wait.
    # The apt module WAITS here; it does not retry, and it does not need to:
    # a single dist-upgrade that cannot get the lock in this window is a real
    # problem, not a transient. apt-mark is the one that retries, because its
    # failure lands in the always-block where a lost race leaves a pin behind.
    lock_timeout: "{{ os_update_dpkg_lock_timeout | int }}"
    autoremove: false
    dpkg_options: force-confdef,force-confold
  environment:
    DEBIAN_FRONTEND: noninteractive
    # needrestart IS installed where the image ships it (Ubuntu 24.04: all three
    # us-iota nodes, 3.6-7ubuntu4.5) and in mode `a` it RESTARTS every service on
    # an upgraded lib from inside dpkg — 07.10.2026 an unrelated apt run restarted
    # k0scontroller (etcd) on all three iota nodes at once. Here the activation
    # is ours to schedule: the reboot in `apply`, somebody else's reboot in
    # `stage` (which runs on a host still in rotation). So needrestart is
    # suspended; MODE `a` stays as the fallback against an interactive prompt.
    NEEDRESTART_SUSPEND: "1"
    NEEDRESTART_MODE: a
  register: os_update_apt_result

- name: Re-check whether the upgrade asked for a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: os_update_reboot_flag_post
  check_mode: false

- name: Which packages asked for it
  ansible.builtin.slurp:
    src: /var/run/reboot-required.pkgs
  register: os_update_reboot_pkgs
  failed_when: false
  check_mode: false

- name: Recompute the reboot decision from the post-upgrade state
  ansible.builtin.set_fact:
    os_update_reboot_needed: >-
      {{ os_update_reboot_needed
         or os_update_reboot_flag_post.stat.exists }}

- name: What the upgrade did
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: apt changed={{ os_update_apt_result.changed }},
      reboot_required={{ os_update_reboot_flag_post.stat.exists }},
      reboot_pkgs={{ (os_update_reboot_pkgs.content | default('') | b64decode).split() | default([]) }}
