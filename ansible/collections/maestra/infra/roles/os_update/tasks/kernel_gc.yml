---
# Old kernels are only garbage-collected when /boot is genuinely tight.
# `autoremove --purge` has a wider blast radius than "delete old kernels", and the
# kernel we might have to fall back to is worth more than the megabytes it occupies.
#
# Two phases, selected by `os_update_gc_phase`:
#
#   post-reboot (default) — the original behaviour, unchanged: only after a
#     successful reboot, gated on os_update_rebooted. The kernel we just left is
#     the fallback, so it must not be purged until the new one has actually
#     booted.
#
#   pre-stage — for `mode: stage`, which installs a kernel and never reboots. Here
#     the running kernel IS the fallback and stays: `apt autoremove --purge` by
#     construction never removes the running kernel nor the newest installed one,
#     so what it can reclaim is exactly the "one before last" set. Without this
#     the stage mode is unusable on the kube tier — /boot there is 467 MB with
#     241 free against a 196 MB guard (measured us-omega worker23, 2026-08-27),
#     i.e. one bad week of kernels away from refusing every stage run.

- name: Re-measure /boot
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      df -Pm /boot | awk 'NR==2 {print $4}'
  register: os_update_boot_free_post
  changed_when: false
  check_mode: false

- name: Purge superseded kernels
  ansible.builtin.apt:
    autoremove: true
    purge: true
  register: os_update_gc
  when:
    # post-reboot: unchanged gate. pre-stage: the reboot has not happened and
    # never will in this mode, so the gate is "the plan guard could not be met".
    - >-
      (os_update_gc_phase | default('post-reboot')) == 'pre-stage'
      or (os_update_rebooted | default(false))
    - >-
      (os_update_boot_free_post.stdout | trim | int)
      < ((os_update_boot_free_needed_mb | int)
         if (os_update_gc_phase | default('post-reboot')) == 'pre-stage'
         else (os_update_boot_free_gc_threshold_mb | int))

# Re-probe when the GC actually ran — os_update_boot_free_post was measured
# BEFORE the purge, and the one case this message matters is the one where the
# number just changed.
# noqa: no-handler — this is a read probe whose value the very next task prints;
# deferring it to the end of the play would report a number nobody is waiting for.
- name: Re-measure /boot after the GC  # noqa: no-handler
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      df -Pm /boot | awk 'NR==2 {print $4}'
  register: os_update_boot_free_final
  changed_when: false
  check_mode: false
  when: os_update_gc.changed | default(false)

- name: /boot after GC
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: /boot free
      {{ (os_update_boot_free_final.stdout | default(os_update_boot_free_post.stdout)) | trim }} MB
      {{ '(GC ran)' if (os_update_gc.changed | default(false)) else '(GC not needed)' }}
