---
# Driver. One host per run (the reusable workflow fans out a per-host matrix);
# `serial: 1` in the consumer playbook is only a safety net for a local operator.
#
# Order is load-bearing:
#   vars -> guards -> marker(read) -> plan -> PREFLIGHT -> [silence -> drain ->
#   boot_safety -> holds -> apt -> reboot -> kernel_gc -> VERIFY]
#   always: holds(restore) -> UNDRAIN -> marker(clear) -> SETTLE -> unsilence
#
# `binary-update` is the one mode that does NOT end in that `always`. It lives at
# the bottom of this file, and its undrain sits in the success block on purpose —
# see its own header and defaults/main.yml.
#
# PREFLIGHT sits immediately before the drain, in the same block — not in an
# earlier play. Ansible finishes an entire play (all serial batches) before
# starting the next one, so a preflight in play 1 would evaluate "is my peer
# healthy?" long before the drain in play 2 ever touches the host.

- name: Load the consumer repo's per-role vars (peers, expectations, silence sets)
  ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/vars.yml"

- name: Guard — nobody else in this contour is currently drained
  ansible.builtin.include_tasks: guards.yml

# ── escape hatch ───────────────────────────────────────────────────────────
# Deliberately skips preflight: the peer gates there are exactly what fails in
# the scenario this hatch exists for (a run died mid-drain and the pair is
# already degraded).
- name: UNDRAIN-ONLY (escape hatch)
  when: os_update_mode == 'undrain-only'
  block:
    - name: Put the host back into rotation
      ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/undrain.yml"

    - name: Clear the drain marker
      ansible.builtin.include_tasks: marker.yml
      vars:
        os_update_marker_action: clear

    - name: Prove it is actually serving again
      ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/settle.yml"

    - name: Drop any silence this host still owns
      ansible.builtin.include_tasks: unsilence.yml

    - name: End of play for this host
      ansible.builtin.meta: end_host

- name: Read the drain marker (was this host left drained by an earlier run?)
  ansible.builtin.include_tasks: marker.yml
  vars:
    os_update_marker_action: read

- name: Plan — what would this update do (read-only, every probe check_mode:false)
  # Skipped in `binary-update`, and that is a correctness fix rather than a
  # micro-optimisation. Everything plan.yml produces is about the APT/KERNEL
  # decision — pending packages, "does this need a reboot", how much room /boot
  # has for one more kernel — and binary-update unpacks no kernel and reboots
  # nothing. Its /boot assert would therefore REFUSE a run that cannot consume
  # /boot at all, on a host whose only mutation is one .deb replacing one binary.
  # (It is also ~40 s of apt-index refresh + dist-upgrade simulation inside a
  # mode whose whole point is a <=10 min per-host cycle, issues-maestra#1373.)
  ansible.builtin.include_tasks: plan.yml
  when: os_update_mode != 'binary-update'

- name: PREFLIGHT — is the peer healthy, and is this host safe to reboot
  # Skipped in `stage`, and that is the point rather than an oversight: every gate
  # in preflight exists to decide whether this host may be TAKEN OUT of rotation
  # (peer health, capacity for the evicted pods, "is anyone else drained"). Stage
  # takes nothing out of rotation. Worse, running it would make stage refuse
  # exactly when it is most useful — the kube preflight fails while any node in
  # the cluster is cordoned, which is permanently true while a Deckhouse wave is
  # rolling, and staging under that wave is the whole reason this mode exists.
  ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/preflight.yml"
  when: os_update_mode != 'stage'

- name: Plan report
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}
      kernel={{ ansible_facts.kernel }} newest={{ os_update_newest_kernel }}
      pending_pkgs={{ os_update_pending | length }}
      needs_upgrade={{ os_update_needed }}
      needs_reboot={{ os_update_reboot_needed }}
      boot_free_mb={{ os_update_boot_free_mb }}
      resuming_drain={{ os_update_resuming }}
      pre_existing_holds={{ os_update_holds_before }}
  # Every fact on this line is set by plan.yml, which binary-update skips — so
  # the report has to be skipped with it or it renders `'os_update_pending' is
  # undefined` before the mode has done anything.
  when: os_update_mode != 'binary-update'

- name: Binary-update plan report (no apt, no kernel, no reboot — that is the mode)
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} mode=binary-update
      kernel={{ ansible_facts.kernel }} (untouched)
      resuming_drain={{ os_update_resuming }}
      — drain -> swap the serving binary -> verify -> undrain.
      A FAILURE ANYWHERE LEAVES THIS HOST DRAINED, on purpose.
  when: os_update_mode == 'binary-update'

- name: Nothing to do — host is current, it is NOT drained and NOT rebooted
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: already up to date, no reboot pending — untouched."
  when:
    - os_update_mode == 'apply'
    - not (os_update_needed or os_update_reboot_needed or os_update_resuming)

- name: Nothing to stage — host already carries the newest packages
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: nothing pending — untouched."
  when:
    - os_update_mode == 'stage'
    - not os_update_needed

- name: STAGE — install the upgrade, activate nothing
  # Deliberately NOT a drain-less copy of APPLY. The whole block is one apt
  # transaction plus the hold discipline around it, because that is the entire
  # mutation: no cordon, no eviction, no reboot, no verify, no settle. Nothing is
  # taken out of rotation, so there is nothing to put back and nothing to prove
  # afterwards beyond "the package landed".
  #
  # This is the same class of mutation Ubuntu performs by itself via
  # unattended-upgrades on an ordinary server. On a Deckhouse node it is safe for
  # a specific, checked reason: the kubernetes bits are NOT apt packages here —
  # kubelet, containerd and the CNI are managed by bashible, and Deckhouse removes
  # unattended-upgrades outright (003_disable_unattended_upgrades.sh).
  #
  # It does still run apt of its own, though, so the dpkg lock IS contended — the
  # earlier wording here claimed otherwise and was wrong. Measured on us-omega
  # worker21: bashible installed `oathtool` and removed
  # `linux-headers-6.8.0-138-generic` while a stage run was finishing, and the
  # hold restore lost the lock. Every apt-touching call waits for it now.
  when:
    - os_update_mode == 'stage'
    - os_update_needed
  block:
    - name: Refuse to stage onto a host somebody left drained
      # A staged install is invisible: it changes nothing observable until a
      # reboot. Doing that to a host that is already out of rotation hides a
      # half-finished apply behind a green run. Finish that run first.
      ansible.builtin.assert:
        that: not os_update_resuming
        fail_msg: >-
          {{ inventory_hostname }} still carries an os-update drain marker — it was
          left drained by an earlier run. Finish or unwind that run first
          (mode=apply to complete it, or mode=undrain-only to put the host back);
          staging on top would bury it.

    - name: Reclaim /boot before staging, if the guard cannot be met
      # Ordering matters: the plan's /boot guard is deferred in stage precisely so
      # this can run first. autoremove never touches the running kernel or the
      # newest installed one, so the fallback we would boot from survives.
      ansible.builtin.include_tasks: kernel_gc.yml
      vars:
        os_update_gc_phase: pre-stage
      when: os_update_stage_gc_enabled | bool

    - name: Guard — /boot must have room to unpack a kernel
      # The same assertion plan.yml makes for apply, re-evaluated after the GC.
      # Re-measured rather than reused: os_update_boot_free_mb was read before the
      # purge, and this is the one case where that number just changed.
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          df -Pm /boot | awk 'NR==2 {print $4}'
      register: os_update_stage_boot_free
      changed_when: false
      check_mode: false

    - name: The /boot guard must pass before any package is unpacked
      ansible.builtin.assert:
        that: >-
          (os_update_stage_boot_free.stdout | trim | int)
          >= (os_update_boot_free_needed_mb | int)
        fail_msg: >-
          /boot has {{ os_update_stage_boot_free.stdout | trim }} MB free after the
          pre-stage GC; the guard wants {{ os_update_boot_free_needed_mb }} MB.
          Nothing has been installed. Reclaim space by hand.
        success_msg: >-
          /boot free {{ os_update_stage_boot_free.stdout | trim }} MB >=
          {{ os_update_boot_free_needed_mb }} needed.

    - name: Pin the packages we must not let apt move
      ansible.builtin.include_tasks: holds.yml
      vars:
        os_update_holds_action: apply

    - name: Upgrade
      ansible.builtin.include_tasks: apt.yml

    - name: Prove a newer kernel is installed and waiting for a reboot
      # The success criterion for a mode that never reboots. `os_update_reboot_needed`
      # is recomputed inside apt.yml from the post-upgrade state, so this reads the
      # fresh value, not the plan's.
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          ls -1 /boot/vmlinuz-* 2>/dev/null | sed 's|.*/vmlinuz-||' | sort -V | tail -1
      register: os_update_stage_newest
      changed_when: false
      check_mode: false

    - name: Staged
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: staged. running={{ ansible_facts.kernel }}
          newest_installed={{ os_update_stage_newest.stdout | trim }}
          reboot_pending={{ os_update_reboot_needed }}.
          NOT activated — this host runs the old kernel until something reboots it.
          CVE closure is claimed by the SOC rescan after that reboot, never here.

  always:
    - name: Restore the hold set we found
      ansible.builtin.include_tasks: holds.yml
      vars:
        os_update_holds_action: restore

- name: APPLY
  when:
    - os_update_mode == 'apply'
    - os_update_needed or os_update_reboot_needed or os_update_resuming
  block:
    # Silences go up BEFORE the drain, not before the reboot: HaproxySystemdUnitFailed
    # (for: 1m) and the BGP/VRRP alerts fire on the drain itself.
    - name: Silence this host's alerts (dead-man window)
      ansible.builtin.include_tasks: silence.yml

    - name: DRAIN — take the host out of rotation, persistently, and prove it
      ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/drain.yml"

    - name: Make the box safe to reboot headless
      ansible.builtin.include_tasks: boot_safety.yml

    - name: Pin the IaC-owned packages
      ansible.builtin.include_tasks: holds.yml
      vars:
        os_update_holds_action: apply

    - name: Upgrade
      ansible.builtin.include_tasks: apt.yml
      when: os_update_needed

    - name: Reboot
      # The consumer may own the reboot. A kube node is not rebooted over SSH by
      # us when its platform already has a node-update machine that drains,
      # reboots and uncordons it — handing the reboot over means one reboot
      # instead of two. A consumer opts in simply by having the file; the pet-VM
      # repos have no reboot.yml, so they keep the SSH reboot with no change at
      # all.
      ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', params) }}"
      vars:
        params:
          files:
            - "{{ os_update_hooks_dir }}/reboot.yml"
            - reboot.yml
          paths:
            - "{{ role_path }}/tasks"
      when: os_update_reboot_needed

    - name: Reclaim /boot if it is tight
      ansible.builtin.include_tasks: kernel_gc.yml

    - name: VERIFY — the host is healthy again (still out of rotation)
      ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/verify.yml"

  rescue:
    - name: Record the failure (we still un-drain in always)
      ansible.builtin.set_fact:
        os_update_failed: true

    - name: Announce
      ansible.builtin.debug:
        msg: >-
          FAILED on {{ inventory_hostname }} — un-draining this host, then aborting
          the fleet (the GH matrix is fail-fast, no further host is touched).

  # EVERY step here is individually rescued. A bare list of tasks in `always` is a
  # trap: the first one that fails ABORTS the rest of the block, so a single bad
  # probe inside the undrain silently skips the marker clear and the unsilence — and
  # the host ends up flagged as stranded (and silenced) while it is actually fine.
  # That is exactly what happened to us-omicron-lw-haproxy-cdp-01 (run 29367636656):
  # undrain's `wait_for 127.0.0.1:443` timed out (that farm binds its real IPs, not
  # loopback) AFTER haproxy had already been started, the rest of `always` never ran,
  # and the leftover marker + silence then blocked the NEXT run on the
  # one-host-at-a-time guard.
  always:
    - name: Restore the pre-existing hold set
      block:
        - name: Restore holds
          ansible.builtin.include_tasks: holds.yml
          vars:
            os_update_holds_action: restore
      rescue:
        - name: Hold restore failed — carry on with the rest of the cleanup
          ansible.builtin.debug:
            msg: >-
              WARNING: could not restore the pre-existing apt holds on {{ inventory_hostname }}.
              Check `apt-mark showhold` by hand. Continuing with the undrain.

    - name: UNDRAIN — put the host back into rotation (idempotent)
      block:
        - name: Undrain
          ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/undrain.yml"
      rescue:
        - name: The undrain itself failed — the host may still be OUT of rotation
          ansible.builtin.set_fact:
            os_update_undrain_failed: true

        - name: Say so loudly
          ansible.builtin.debug:
            msg: >-
              UNDRAIN FAILED on {{ inventory_hostname }} — it may still be out of rotation.
              The drain marker is deliberately LEFT IN PLACE so OsUpdateHostStrandedDrain
              fires and a human finishes the job:
              gh workflow run os-update.yml -f mode=undrain-only -f host_limit={{ inventory_hostname }}

    # Only when the undrain actually succeeded. If it did not, the marker MUST stay:
    # it is the one signal that says "this host is still out of rotation" — it is
    # what makes OsUpdateHostStrandedDrain fire and mode=undrain-only meaningful.
    - name: Clear the drain marker
      when: not (os_update_undrain_failed | default(false))
      block:
        - name: Clear the marker
          ansible.builtin.include_tasks: marker.yml
          vars:
            os_update_marker_action: clear
      rescue:
        - name: Marker clear failed — the rest of the cleanup must still run
          ansible.builtin.set_fact:
            os_update_failed: true

        - name: Say so
          ansible.builtin.debug:
            msg: >-
              WARNING: could not clear the drain marker on {{ inventory_hostname }} —
              OsUpdateHostStrandedDrain may fire on a host that IS back in rotation.
              Continuing so the silences are still dropped and the job fails.

    - name: SETTLE — traffic is actually flowing again and the pair is redundant
      when:
        - not (os_update_failed | default(false))
        - not (os_update_undrain_failed | default(false))
      block:
        - name: Settle
          ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/settle.yml"
      rescue:
        - name: Settle failed — the host is back in rotation but UNPROVEN
          ansible.builtin.set_fact:
            os_update_failed: true

        - name: Say so
          ansible.builtin.debug:
            msg: >-
              WARNING: settle failed on {{ inventory_hostname }} — the host is back in
              rotation but not proven to be serving. Continuing so the silences are
              dropped (the alerts must be free to fire on it) and the job fails.

    # Always dropped, even on a failed undrain: the silences are time-boxed anyway,
    # and a stranded host is precisely the case where we want the alerts to fire.
    - name: Drop the silences
      block:
        - name: Unsilence
          ansible.builtin.include_tasks: unsilence.yml
      rescue:
        - name: Could not expire the silences — the dead-man endsAt still covers us
          ansible.builtin.debug:
            msg: "WARNING: could not expire the maintenance silences; they expire on their own in <= {{ os_update_silence_minutes }} min."

    - name: Fail the job
      ansible.builtin.fail:
        msg: >-
          OS update FAILED on {{ inventory_hostname }}.
          {{ 'The host was un-drained and is back in rotation.'
             if not (os_update_undrain_failed | default(false))
             else 'THE UNDRAIN ALSO FAILED — the host may still be OUT of rotation, and the drain marker was left in place on purpose.' }}
          No further host is touched (the matrix is fail-fast).
      when: (os_update_failed | default(false)) or (os_update_undrain_failed | default(false))

# ── BINARY-UPDATE ────────────────────────────────────────────────────────────
# Same drain contract as APPLY, a different payload, and a DIFFERENT FAILURE
# CONTRACT. issues-maestra#1373.
#
# Payload: one .deb replaces the binary the service runs, and the service is
# restarted onto it. No apt index refresh, no dist-upgrade, no holds dance (the
# consumer's own install task owns the pins on the packages it ships), no
# boot_safety, no reboot, no kernel GC. Those are all steps of an OS PATCH, and
# this mode performs none of one.
#
# THE INVARIANT: a host that fails ANY step here STAYS DRAINED and the job goes
# red. That is why the undrain is the last task of the `block` and not, as in
# APPLY, the first task of `always`. APPLY un-drains unconditionally because a
# patched host that failed verify has usually just booted a kernel that works,
# and leaving a healthy box out of rotation costs redundancy for no gain. Here
# the failing thing IS the thing that serves traffic: an unproven binary put back
# into rotation is the outage the drain existed to prevent. So the recovery is
# explicitly manual and named in the failure message — re-run with the previous
# track pinned, or `mode=undrain-only` once a human has looked.
#
# What still runs in `always`: the silences are dropped, exactly as in APPLY and
# for the sharper version of the same reason — a stranded, drained host is
# precisely the host whose alerts must be free to fire. The drain marker is NOT
# cleared on the failure path, so OsUpdateHostStrandedDrain reports it and the
# contour-wide one-at-a-time guard keeps the next host out until it is resolved.
- name: BINARY-UPDATE — swap the serving binary inside a drain window
  when: os_update_mode == 'binary-update'
  block:
    - name: Does this consumer implement the binary-update hooks
      # Checked BEFORE the drain, not by the include that needs them. An
      # `include_tasks` of a missing file fails where it stands — which here is
      # two tasks past the drain, so a consumer that simply never implemented the
      # mode would have a production host taken out of rotation to find that out.
      ansible.builtin.stat:
        path: "{{ os_update_hooks_dir }}/{{ item }}"
      loop:
        - binary-update.yml
        - verify-binary-update.yml
      # The hooks live in the checkout on the CONTROLLER, not on the host.
      delegate_to: localhost
      become: false
      check_mode: false
      register: os_update_binmode_hooks

    - name: Both hooks must exist
      ansible.builtin.assert:
        that: (os_update_binmode_hooks.results | rejectattr('stat.exists') | list | length) == 0
        fail_msg: >-
          {{ inventory_hostname }}: this repo does not implement mode=binary-update.
          Missing under {{ os_update_hooks_dir }}:
          {{ os_update_binmode_hooks.results | rejectattr('stat.exists')
             | map(attribute='item') | join(', ') }}.
          Nothing has been touched — the host is still in rotation.
        success_msg: "binary-update hooks present under {{ os_update_hooks_dir }}."

    - name: Silence this host's alerts (dead-man window)
      # Before the drain, not before the restart: the drain masks and stops the
      # unit, and HaproxySystemdUnitFailed has for: 1m.
      ansible.builtin.include_tasks: silence.yml

    - name: DRAIN — take the host out of rotation, persistently, and prove it
      # Byte-identically the same hook APPLY uses, marker included. A binary swap
      # cuts every established session on this host, so it needs the full
      # withdrawal + idle proof, not a lighter one.
      ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/drain.yml"

    - name: SWAP — install the new binary and restart onto it, still drained
      ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/binary-update.yml"

    - name: VERIFY — the NEW binary is fit to serve (still out of rotation)
      ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/verify-binary-update.yml"

    # ── success path only — everything below is unreachable on a failure ──
    - name: UNDRAIN — put the host back into rotation
      ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/undrain.yml"

    - name: Clear the drain marker
      ansible.builtin.include_tasks: marker.yml
      vars:
        os_update_marker_action: clear

    - name: SETTLE — traffic is actually flowing through the new binary
      ansible.builtin.include_tasks: "{{ os_update_hooks_dir }}/settle.yml"

  rescue:
    - name: Record the failure — and deliberately do NOT undrain
      ansible.builtin.set_fact:
        os_update_failed: true

    - name: Say exactly what state the host was left in
      ansible.builtin.debug:
        msg: >-
          BINARY-UPDATE FAILED on {{ inventory_hostname }}. The host is LEFT DRAINED
          on purpose — an unproven binary must not go back into rotation. The drain
          marker is left in place, so OsUpdateHostStrandedDrain will report it and
          the contour-wide one-at-a-time guard will hold the next host.
          Recover by: (1) reading this job's log to see WHICH gate failed;
          (2) re-running mode=binary-update with the previous track pinned, which
          reinstalls the old .deb inside the same drain window; or
          (3) `gh workflow run os-update.yml -f mode=undrain-only
          -f host_limit={{ inventory_hostname }}` once you are satisfied the host
          is fit to serve. No further host is touched (the matrix is fail-fast).

  always:
    # Dropped even on the failure path — that is the point. A host we have just
    # decided to leave out of rotation is the one host whose alerts must fire.
    - name: Drop the silences
      block:
        - name: Unsilence
          ansible.builtin.include_tasks: unsilence.yml
      rescue:
        - name: Could not expire the silences — the dead-man endsAt still covers us
          ansible.builtin.debug:
            msg: "WARNING: could not expire the maintenance silences; they expire on their own in <= {{ os_update_silence_minutes }} min."

    - name: Fail the job
      ansible.builtin.fail:
        msg: >-
          BINARY UPDATE FAILED on {{ inventory_hostname }} — the host is STILL DRAINED
          (weight 0, unit not proven). See the message above for the recovery paths.
      when: os_update_failed | default(false)
