name: "translation-checker"
description: >-
  Drop-in for mindbox-cloud/github-actions/localization/translation-checker@658e582 (same
  inputs): checks the Mindbox i18n files of a .NET solution. Its image,
  mindboxmoscow/translation-checker-gha 1.0.69 (its `latest` since 2024-12-18), by digest,
  pulled through nora (packages.maestra.io/docker-hub, issues-maestra#1649) instead of
  Docker Hub. Needs `permissions: id-token: write`.

inputs:
  skipInclusionCheck:
    description: "Skip the inclusion check."
    required: false
    default: "false"
  allowCyrillicSymbolsInCSharpComments:
    description: "Allow cyrillic symbols in C# comments."
    required: false
    default: "false"
  allowOldFormatTranslationFiles:
    description: "Allow old-format translation files (no Mindbox/Maestra subdivision)."
    required: false
    default: "false"
  requireDivisionAgnosticTranslations:
    description: 'Any "Mindbox" or "Maestra" in a translation is an error.'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: translation-checker
      shell: bash
      env:
        skipInclusionCheck: ${{ inputs.skipInclusionCheck }}
        allowCyrillicSymbolsInCSharpComments: ${{ inputs.allowCyrillicSymbolsInCSharpComments }}
        allowOldFormatTranslationFiles: ${{ inputs.allowOldFormatTranslationFiles }}
        requireDivisionAgnosticTranslations: ${{ inputs.requireDivisionAgnosticTranslations }}
        IMAGE_ENV: skipInclusionCheck allowCyrillicSymbolsInCSharpComments allowOldFormatTranslationFiles requireDivisionAgnosticTranslations
      run: |
        bash "${GITHUB_ACTION_PATH}/../nora-session/nora-docker-run.sh" \
          packages.maestra.io/docker-hub/mindboxmoscow/translation-checker-gha:1.0.69@sha256:93bc6ea87be4aae205dbc374496a290f2f46f0cab125daa32cb015470f7d1ae5
