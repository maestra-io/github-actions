name: "translation-checker"
description: >-
  Drop-in for mindbox-cloud/github-actions/localization/translation-checker@658e582 (same
  inputs): checks the Mindbox i18n files of a .NET solution. Runs our build of it,
  maestra-io/localization-github-actions (image translation-checker-gha in this account's
  private ECR, pinned by digest), instead of Mindbox's mindboxmoscow/translation-checker-gha
  (issues-maestra#1649). Pulled with the runner's instance role (RunsOn, read only), the
  same ECR login the shared workflows use; needs no token.

inputs:
  skipInclusionCheck:
    description: "Skip the inclusion check."
    required: false
    default: "false"
  allowCyrillicSymbolsInCSharpComments:
    description: "Allow cyrillic symbols in C# comments."
    required: false
    default: "false"
  allowOldFormatTranslationFiles:
    description: "Allow old-format translation files (no Mindbox/Maestra subdivision)."
    required: false
    default: "false"
  requireDivisionAgnosticTranslations:
    description: 'Any "Mindbox" or "Maestra" in a translation is an error.'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: translation-checker
      shell: bash
      env:
        skipInclusionCheck: ${{ inputs.skipInclusionCheck }}
        allowCyrillicSymbolsInCSharpComments: ${{ inputs.allowCyrillicSymbolsInCSharpComments }}
        allowOldFormatTranslationFiles: ${{ inputs.allowOldFormatTranslationFiles }}
        requireDivisionAgnosticTranslations: ${{ inputs.requireDivisionAgnosticTranslations }}
        IMAGE: 515260921971.dkr.ecr.us-west-2.amazonaws.com/translation-checker-gha:1.1.1@sha256:22eb2b8eee26ca1027878b15407d0e89ff4d8232ed03be519bd69d5739f7b5ca
      run: |
        set -euo pipefail
        registry="${IMAGE%%/*}"
        region=$(cut -d. -f4 <<< "$registry")
        # A throwaway docker config: the caller's ~/.docker/config.json stays as it was.
        DOCKER_CONFIG=$(mktemp -d); export DOCKER_CONFIG
        trap 'rm -rf "$DOCKER_CONFIG"' EXIT
        # A fresh RunsOn instance can lack its instance-role credentials for a few seconds.
        for i in 1 2 3 4 5; do
          aws sts get-caller-identity --region "$region" >/dev/null 2>&1 && break
          [ "$i" -lt 5 ] && sleep 10
        done
        aws ecr get-login-password --region "$region" \
          | docker login --username AWS --password-stdin "$registry" >/dev/null \
          || { echo "::error::no AWS credentials for the ECR pull of $IMAGE: translation-checker needs a RunsOn runner (instance role)"; exit 1; }
        docker pull "$IMAGE"
        docker run --rm -v "${GITHUB_WORKSPACE:-$PWD}:/github/workspace" -w /github/workspace \
          -e skipInclusionCheck -e allowCyrillicSymbolsInCSharpComments \
          -e allowOldFormatTranslationFiles -e requireDivisionAgnosticTranslations \
          "$IMAGE"
