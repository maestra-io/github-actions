name: "Go toolchain through nora"
description: >-
  actions/setup-go without github.com / go.dev: the Go named by go-version or go-version-file
  comes from packages.maestra.io raw, sha256-pinned in versions.txt, into the runner tool cache
  (issues-maestra#1649). The archive is cached next to the runners (RunsOn Magic Cache) and used
  from there only when its sha256 is the pin. `cache` keeps setup-go's module and build cache.
  Modules still come from GOPROXY: add go-nora for nora's. Needs `permissions: id-token: write`;
  linux-x64 only.

inputs:
  go-version:
    description: "latest, N.M (the newest pinned patch) or an exact version."
    required: false
    default: ""
  go-version-file:
    description: "A go.mod: its toolchain / go line, the newest pinned patch at or above it."
    required: false
    default: ""
  cache:
    description: "Cache the module and build caches, keyed by cache-dependency-path (setup-go's default true)."
    required: false
    default: "true"
  cache-dependency-path:
    description: "go.sum file(s) the cache key hashes (default **/go.sum)."
    required: false
    default: ""
  check-latest:
    description: "Accepted for setup-go compatibility: the newest pinned version is always used."
    required: false
    default: "false"
  url:
    description: "nora base URL."
    required: false
    default: "https://packages.maestra.io"
  audience:
    description: "`aud` of the GitHub OIDC token nora accepts."
    required: false
    default: "packages.maestra.io"

outputs:
  go-version:
    description: "The Go version installed."
    value: ${{ steps.install.outputs.version }}
  cache-hit:
    description: "Whether the module cache was restored."
    value: ${{ steps.modules.outputs.cache-hit }}

  tool-source:
    description: "Where the toolchain came from: tool-cache (already installed, its tree the pin in versions.txt), runner-cache (the cached archive) or nora."
    value: ${{ steps.install.outputs.source }}

runs:
  using: composite
  steps:
    - name: Go cache key
      id: plan
      shell: bash
      env:
        NORA_URL: ${{ inputs.url }}
        TOOL_VERSION: ${{ inputs.go-version }}
        TOOL_VERSION_FILE: ${{ inputs.go-version-file }}
      run: bash "${GITHUB_ACTION_PATH}/../nora-tool/nora-tool.sh" go plan
    - name: Go archive from the cache
      id: restore
      if: ${{ steps.plan.outputs.cache-key != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/nora-tool-cache/${{ steps.plan.outputs.cache-key }}
        # <key>-fixed: the archive saved after a restored one failed the pin (a key is immutable)
        key: ${{ steps.plan.outputs.cache-key }}-fixed
        restore-keys: ${{ steps.plan.outputs.cache-key }}
    - name: Go through nora
      id: install
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.go-version }}
        TOOL_VERSION_FILE: ${{ inputs.go-version-file }}
        NORA_URL: ${{ inputs.url }}
        NORA_AUDIENCE: ${{ inputs.audience }}
        NORA_TOOL_CACHE_DIR: ${{ steps.plan.outputs.cache-key != '' && format('{0}/nora-tool-cache/{1}', runner.temp, steps.plan.outputs.cache-key) || '' }}
      run: bash "${GITHUB_ACTION_PATH}/../nora-tool/nora-tool.sh" go install
    - name: Go archive into the cache
      # save=true: a fetched archive (after a rejected restore: under <key>-fixed)
      if: ${{ steps.install.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/nora-tool-cache/${{ steps.plan.outputs.cache-key }}
        key: ${{ steps.plan.outputs.cache-key }}${{ steps.restore.outputs.cache-matched-key != '' && '-fixed' || '' }}
    - name: Go module and build cache
      id: modules
      if: ${{ inputs.cache == 'true' && hashFiles(inputs.cache-dependency-path || '**/go.sum') != '' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.install.outputs.gomodcache }}
          ${{ steps.install.outputs.gocache }}
        key: setup-go-nora-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.install.outputs.version }}-${{ hashFiles(inputs.cache-dependency-path || '**/go.sum') }}
