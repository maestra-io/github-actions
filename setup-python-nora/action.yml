name: "CPython through nora"
description: >-
  actions/setup-python without github.com/actions/python-versions: the CPython named by
  python-version is a python-build-standalone build from nora's GitHub Releases proxy,
  sha256-pinned in versions.txt, put into the runner tool cache with the environment setup-python
  exports (issues-maestra#1649). The archive is cached next to the runners (RunsOn Magic Cache) and
  used from there only when its sha256 is the pin. Packages still come from the job's index: add
  uv-nora or a pip config for nora's. Needs `permissions: id-token: write`; linux-x64 only.

inputs:
  python-version:
    description: "N.M (the newest pinned patch) or an exact version."
    required: false
    default: ""
  url:
    description: "nora base URL."
    required: false
    default: "https://packages.maestra.io"
  audience:
    description: "`aud` of the GitHub OIDC token nora accepts."
    required: false
    default: "packages.maestra.io"

outputs:
  python-version:
    description: "The CPython version installed."
    value: ${{ steps.install.outputs.version }}
  python-path:
    description: "The python executable."
    value: ${{ steps.install.outputs.path }}

  tool-source:
    description: "Where the toolchain came from: tool-cache (already installed), runner-cache (the cached archive) or nora."
    value: ${{ steps.install.outputs.source }}

runs:
  using: composite
  steps:
    - name: CPython cache key
      id: plan
      shell: bash
      env:
        NORA_URL: ${{ inputs.url }}
        TOOL_VERSION: ${{ inputs.python-version }}
      run: bash "${GITHUB_ACTION_PATH}/../nora-tool/nora-tool.sh" python plan
    - name: CPython archive from the cache
      id: restore
      if: ${{ steps.plan.outputs.cache-key != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/nora-tool-cache/${{ steps.plan.outputs.cache-key }}
        # <key>-fixed: the archive saved after a restored one failed the pin (a key is immutable)
        key: ${{ steps.plan.outputs.cache-key }}-fixed
        restore-keys: ${{ steps.plan.outputs.cache-key }}
    - name: CPython through nora
      id: install
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.python-version }}
        NORA_URL: ${{ inputs.url }}
        NORA_AUDIENCE: ${{ inputs.audience }}
        NORA_TOOL_CACHE_DIR: ${{ steps.plan.outputs.cache-key != '' && format('{0}/nora-tool-cache/{1}', runner.temp, steps.plan.outputs.cache-key) || '' }}
      run: bash "${GITHUB_ACTION_PATH}/../nora-tool/nora-tool.sh" python install
    - name: CPython archive into the cache
      # save=true: a fetched archive (after a rejected restore: under <key>-fixed)
      if: ${{ steps.install.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/nora-tool-cache/${{ steps.plan.outputs.cache-key }}
        key: ${{ steps.plan.outputs.cache-key }}${{ steps.restore.outputs.cache-matched-key != '' && '-fixed' || '' }}
