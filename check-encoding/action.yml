name: "check-encoding"
description: >-
  Drop-in for mindbox-cloud/check-encoding@b7c4fcd (same inputs): every tracked file
  with these extensions must be UTF-8 (ASCII included). Runs our port,
  pr-checks/check-encoding.py (strict UTF-8 decode), on the runner instead of the
  mindboxmoscow/check-encoding image (issues-maestra#1649). Needs a git checkout of
  the workspace and python3; no registry pull, no token.

inputs:
  command:
    description: '"check" fails the build. "fix" (convert the files) is not supported and fails.'
    required: false
    default: "check"
  extensions:
    description: "File extensions to check, comma-separated, without dots."
    required: false
    default: "txt,xml,json,config,cs,csproj,sln"
  target_encoding:
    description: "Accepted encodings: must name utf-8; ASCII may be listed beside it."
    required: false
    default: "utf-8,ASCII"

runs:
  using: composite
  steps:
    - name: check-encoding
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        EXTENSIONS: ${{ inputs.extensions }}
        TARGET_ENCODING: ${{ inputs.target_encoding }}
      run: bash "${GITHUB_ACTION_PATH}/check-encoding.sh"
