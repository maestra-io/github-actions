name: "check-encoding"
description: >-
  Drop-in for mindbox-cloud/check-encoding@b7c4fcd (same inputs): files with these
  extensions must be in the target encoding. Its image, mindboxmoscow/check-encoding
  1.0.17 (built from that commit, its `latest`), by digest, pulled through nora
  (packages.maestra.io/docker-hub, issues-maestra#1649) instead of Docker Hub.
  Needs `permissions: id-token: write`.

inputs:
  command:
    description: '"check" fails the build, "fix" converts the offending files.'
    required: false
    default: "check"
  extensions:
    description: "File extensions to check, comma-separated, without dots."
    required: false
    default: "txt,xml,json,config,cs,csproj,sln"
  target_encoding:
    description: "Accepted encodings."
    required: false
    default: "utf-8,ASCII"

runs:
  using: composite
  steps:
    - name: check-encoding
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        EXTENSIONS: ${{ inputs.extensions }}
        TARGET_ENCODING: ${{ inputs.target_encoding }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../nora-session/nora-docker-run.sh" \
          packages.maestra.io/docker-hub/mindboxmoscow/check-encoding:1.0.17@sha256:6b2f07f6112e270885ff805034fa2f5b780e1b712bb3a154688fb2b976a3b65f \
          "$COMMAND" -d /github/workspace -e "$TARGET_ENCODING" --extensions "$EXTENSIONS"
