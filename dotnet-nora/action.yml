name: ".NET SDK through nora"
description: >-
  actions/setup-dotnet without Microsoft: the SDKs named by dotnet-version (setup-dotnet
  syntax) and by a global.json (its rollForward) come from packages.maestra.io raw,
  sha256-pinned in sdks.txt, and are unpacked each into its own runner tool-cache directory,
  whose tree is pinned in sdks.txt too and checked before an SDK already there runs; the job's
  dotnet root holds only these SDKs (issues-maestra#1649). The archives are cached by version + pin in the job's cache
  (RunsOn Magic Cache: S3 next to the runners), so a job whose repository/branch already
  holds them fetches nothing from nora; a cached archive is used only when its sha256 is the
  pin. Needs `permissions: id-token: write`; linux-x64 only.

inputs:
  dotnet-version:
    description: "SDK versions, one per line: N, N.x, N.M, N.M.x, N.M.Fxx or exact."
    required: false
    default: ""
  global-json-file:
    description: "A global.json whose sdk.version + rollForward add one SDK."
    required: false
    default: ""
  url:
    description: "nora base URL."
    required: false
    default: "https://packages.maestra.io"
  audience:
    description: "`aud` of the GitHub OIDC token nora accepts."
    required: false
    default: "packages.maestra.io"

outputs:
  versions:
    description: "The SDK versions installed (newest first, one per line)."
    value: ${{ steps.install.outputs.versions }}

runs:
  using: composite
  steps:
    - name: .NET SDK cache key
      id: plan
      shell: bash
      env:
        DOTNET_VERSION: ${{ inputs.dotnet-version }}
        GLOBAL_JSON: ${{ inputs.global-json-file }}
        DOTNET_NORA_PLAN: "1"
      run: bash "${GITHUB_ACTION_PATH}/dotnet-nora.sh"
    - name: .NET SDK archives from the cache
      id: restore
      if: ${{ steps.plan.outputs.cache-key != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dotnet-nora-cache
        key: ${{ steps.plan.outputs.cache-key }}
    - name: .NET SDK through nora
      id: install
      shell: bash
      env:
        DOTNET_VERSION: ${{ inputs.dotnet-version }}
        GLOBAL_JSON: ${{ inputs.global-json-file }}
        NORA_URL: ${{ inputs.url }}
        NORA_AUDIENCE: ${{ inputs.audience }}
        DOTNET_NORA_CACHE_DIR: ${{ steps.plan.outputs.cache-key != '' && format('{0}/dotnet-nora-cache', runner.temp) || '' }}
      run: bash "${GITHUB_ACTION_PATH}/dotnet-nora.sh"
    - name: .NET SDK archives into the cache
      if: ${{ steps.install.outputs.save == 'true' && steps.restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/dotnet-nora-cache
        key: ${{ steps.plan.outputs.cache-key }}
