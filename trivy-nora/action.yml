name: "trivy through nora"
description: >-
  Trivy image / fs scan with everything it fetches coming through packages.maestra.io
  (nora, issues-maestra#1649): the trivy binary from nora's GitHub Releases proxy, pinned by
  sha256, and the vulnerability, Java and checks databases from nora's ghcr proxy. Replaces
  aquasecurity/trivy-action, whose setup-trivy and DB cache went around nora. The inputs
  keep trivy-action's names and meaning: an input left empty (or at trivy-action's default)
  leaves trivy's own default, so a caller switches by changing only the `uses:` line and
  dropping `version` / `skip-setup-trivy` (trivy is installed once per job). The job's
  docker credentials (ECR login and the like) stay in use for the scanned image. Needs
  `permissions: id-token: write`.

inputs:
  scan-type:
    description: "trivy subcommand: image, fs, rootfs, repo, config."
    required: false
    default: "image"
  image-ref:
    description: "Image to scan (takes precedence over scan-ref)."
    required: false
    default: ""
  scan-ref:
    description: "Path or reference to scan for the non-image subcommands."
    required: false
    default: "."
  severity:
    description: "Comma-separated severities to report (empty: all)."
    required: false
    default: ""
  exit-code:
    description: "Exit code when findings are reported (empty: trivy's 0)."
    required: false
    default: ""
  ignore-unfixed:
    description: "Leave out vulnerabilities without a fixed version."
    required: false
    default: "false"
  vuln-type:
    description: "Package types (trivy --pkg-types), e.g. os,library (empty: trivy's default)."
    required: false
    default: ""
  scanners:
    description: "Comma-separated scanners, e.g. vuln,secret,misconfig (empty: trivy's default)."
    required: false
    default: ""
  format:
    description: "Output format: table, json, sarif, ... (empty: table)."
    required: false
    default: ""
  output:
    description: "Write the report to this file instead of the log."
    required: false
    default: ""
  list-all-pkgs:
    description: "Report every package, not only vulnerable ones (json)."
    required: false
    default: "false"
  trivyignores:
    description: "Comma-separated .trivyignore files (concatenated) or one .trivyignore.yaml. Empty: trivy reads ./.trivyignore."
    required: false
    default: ""
  url:
    description: "nora base URL."
    required: false
    default: "https://packages.maestra.io"
  audience:
    description: "`aud` of the GitHub OIDC token nora accepts."
    required: false
    default: "packages.maestra.io"

runs:
  using: composite
  steps:
    - name: trivy through nora
      shell: bash
      env:
        # renovate: datasource=github-releases depName=aquasecurity/trivy
        TRIVY_VERSION: "0.75.0"
        TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        NORA_URL: ${{ inputs.url }}
        NORA_AUDIENCE: ${{ inputs.audience }}
        INPUT_SCAN_TYPE: ${{ inputs.scan-type }}
        INPUT_IMAGE_REF: ${{ inputs.image-ref }}
        INPUT_SCAN_REF: ${{ inputs.scan-ref }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_EXIT_CODE: ${{ inputs.exit-code }}
        INPUT_IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        INPUT_VULN_TYPE: ${{ inputs.vuln-type }}
        INPUT_SCANNERS: ${{ inputs.scanners }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_LIST_ALL_PKGS: ${{ inputs.list-all-pkgs }}
        INPUT_TRIVYIGNORES: ${{ inputs.trivyignores }}
      run: bash "${GITHUB_ACTION_PATH}/trivy-nora.sh"
