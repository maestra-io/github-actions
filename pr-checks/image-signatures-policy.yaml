# Source: kyverno-image-signatures/templates/verify-image-signatures.yaml
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    # Pods only: after use-nora-pull-through rewrote them, so the nora names
    # are what the kubelet pulls. A controller's template is not verified.
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Verify cosign signatures of external images
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires a valid cosign signature, by the publisher's documented
      identity or key, on every image of a publisher in the chart's
      `publishers` list, under its upstream name and its nora name
      (packages.maestra.io). Signatures are read from the upstream
      repository. Images of other publishers are not matched. Only Pod
      CREATE is checked. A failure is only reported in the recovery-path
      namespaces (`auditNamespaces`) and for tag references, whose digest
      Kyverno resolves through nora at admission (issues-maestra#1649).
spec:
  background: false
  webhookConfiguration:
    failurePolicy: Ignore
    timeoutSeconds: 15
  rules:
    # enforce: digest refs, every namespace but auditNamespaces, validationFailureAction.
    # audit: digest refs in auditNamespaces, always Audit.
    # tags: tag refs anywhere, always Audit. Kyverno resolves a tag through the
    # Pod's registry, i.e. packages.maestra.io after use-nora-pull-through, and a
    # slow nora answer there (single replica, object store) denied descheduler
    # Pods under Enforce (03.11). Digest refs never touch nora; tags are being
    # removed by require-external-image-digest.
    - name: kubernetes
      match:
        any:
          - resources:
              kinds:
                - Pod
              # A running Pod's UPDATE (finalizers, status) cannot change its
              # images; re-verifying it only adds a way to wedge Jobs.
              operations:
                - CREATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - d8-*
                - kyverno
                - trow-system
                - nora
                - flux-system
                - teleport-maestra
                - teleport-maestra-agent
                - teleport-maestra-db-access
                - teleport-wds
                - teleport-leaf
                - breakglass
                - tang
                - traefik-public
                - cert-manager
                - external-dns
                - vault
                - vault-operator
                - vault-secrets-operator
                - openebs
                - crossplane
      verifyImages:
        - imageReferences:
            - "registry.k8s.io/autoscaling/cluster-autoscaler@*"
            - "packages.maestra.io/k8s/autoscaling/cluster-autoscaler@*"
          repository: registry.k8s.io/autoscaling/cluster-autoscaler
          # nora answers 401 without a token; the digest of a nora name is
          # resolved with kyverno/nora-pull-secret (base/kyverno-nora-pull-secret).
          imageRegistryCredentials:
            secrets:
              - nora-pull-secret
          # Digests are pinned in git and required by
          # require-external-image-digest; this policy only verifies.
          failureAction: Audit
          mutateDigest: false
          verifyDigest: false
          required: true
          attestors:
            # One verifying entry is enough: a `pem` with several keys expands
            # into one entry per key (litellm rotated its key).
            - count: 1
              entries:
                - keyless:
                    issuer: https://accounts.google.com
                    subjectRegExp: "^krel-trust@k8s-releng-prod\\.iam\\.gserviceaccount\\.com$"
                    rekor:
                      url: https://rekor.sigstore.dev
        - imageReferences:
            - "registry.k8s.io/autoscaling/vpa-admission-controller@*"
            - "packages.maestra.io/k8s/autoscaling/vpa-admission-controller@*"
          repository: registry.k8s.io/autoscaling/vpa-admission-controller
