  matchConditions:
    - name: namespaces
      expression: "!(object.metadata.namespace == 'kube-system' || object.metadata.namespace.startsWith('d8-') || object.metadata.namespace == 'kyverno' || object.metadata.namespace == 'trow-system' || object.metadata.namespace == 'nora' || object.metadata.namespace == 'flux-system' || object.metadata.namespace == 'teleport-maestra' || object.metadata.namespace == 'teleport-maestra-agent' || object.metadata.namespace == 'teleport-maestra-db-access' || object.metadata.namespace == 'teleport-wds' || object.metadata.namespace == 'teleport-leaf' || object.metadata.namespace == 'breakglass' || object.metadata.namespace == 'tang' || object.metadata.namespace == 'traefik-public' || object.metadata.namespace == 'cert-manager' || object.metadata.namespace == 'external-dns' || object.metadata.namespace == 'vault' || object.metadata.namespace == 'vault-operator' || object.metadata.namespace == 'vault-secrets-operator' || object.metadata.namespace == 'openebs' || object.metadata.namespace == 'crossplane')"
