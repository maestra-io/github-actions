apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-v2
  namespace: universal-channel-http-sender
spec:
  interval: 168h
  chart:
    spec:
      chart: dragonfly
      version: "6.3.1"
      sourceRef:
        kind: HelmRepository
        name: maestra-helm-charts
        namespace: universal-channel-http-sender
  values:
    mode: database
    global:
      deployEnv: ${ENV}
    serviceNameOverride: uc-http-sender-v2
    networkPolicy:
      enabled: true
