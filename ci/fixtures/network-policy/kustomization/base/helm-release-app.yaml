apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: universal-channel-http-sender
  namespace: universal-channel-http-sender
spec:
  interval: 1h
  timeout: 15m
  dependsOn:
    - name: external-vault-agent
    - name: auth-jwt-config
    - name: universal-channel-http-sender-init
  chart:
    spec:
      chart: commons-app
      version: "18.14.0"
      sourceRef:
        kind: HelmRepository
        name: maestra-helm-charts
        namespace: universal-channel-http-sender
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
