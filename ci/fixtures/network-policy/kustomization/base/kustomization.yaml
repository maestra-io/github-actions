# Snapshot of maestra-io/universal-channel-http-sender (the networkPolicy pilot, 2026-11-09),
# trimmed to what scripts/test-network-policy-gate.sh needs: the commons-app HelmRelease, its
# commons-app-init one (chart bumped to 7.10.0, the first with networkPolicy) and a dragonfly
# one whose own `networkPolicy: enabled` key the gate must ignore.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-repositories.yaml
  - dragonfly-v2.yaml
  - helm-release-app.yaml
  - helm-release-init.yaml
