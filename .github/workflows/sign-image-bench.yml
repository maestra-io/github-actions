---
# TEMPORARY A/B bench for the sign-image speed-up (issues-maestra#1648); not for merge.
# Copies a real released image into selftest-ecr-push, then signs + attests the same
# digest with the released action (v1.62.2) and with this branch, in both orders.
name: sign-image-bench
on:
  pull_request:
    paths:
      - ".github/workflows/sign-image-bench.yml"
      - "sign-image/**"
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        pool: [small, build]
        order: [old-first, new-first]
        image:
          - frontend-mailings-with-deps@sha256:aeaa08cf4062ea8016136d07dec00e47470fe02be5c963194f7efac3d781ce69
          - frontend-mailings@sha256:885308e185d51b945d87df300e77890b9ac618b084a69c4ab2cfd7b418d68b12
          - nexus_services@sha256:6f661780f1e0bd0935fee1ba944b00336f8850a6d3419e840d5d4e85430f001d
          - code-intelligence@sha256:45f9d93793f952a357187e6e220058e38fe52bb6621866b51758628186a6298b
    runs-on: runs-on=${{ github.run_id }}-bench-${{ strategy.job-index }}/pool=${{ matrix.pool }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      REPOSITORY: selftest-ecr-push
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ecr login
        id: ecr
        uses: ./push-to-aws-ecr-repository
        with:
          awsRegion: us-west-2
          repositories: ${{ env.REPOSITORY }}
          targetTag: bench-${{ github.run_id }}-${{ strategy.job-index }}
          push: false
      - name: copy the image into the selftest repository
        id: copy
        env:
          SRC: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}
          DST: ${{ steps.ecr.outputs.registry }}/selftest-ecr-push:bench-${{ github.run_id }}-${{ strategy.job-index }}
        run: |
          nproc; free -m | head -2; skopeo --version || true
          start=$(date +%s)
          skopeo copy -q --preserve-digests --digestfile "$RUNNER_TEMP/digest" "docker://$SRC" "docker://$DST"
          echo "copy $(( $(date +%s) - start ))s"
          d=$(cat "$RUNNER_TEMP/digest"); [ "$d" = "${SRC#*@}" ] || { echo "::error::copied digest $d != ${SRC#*@}"; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      - name: A old (v1.62.2) first
        if: ${{ matrix.order == 'old-first' }}
        id: a1
        uses: maestra-io/github-actions/sign-image@bdfea43a7d47149012fa1a488c91e5d6a49b2744 # v1.62.2
        with:
          image: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}
          digest: ${{ steps.copy.outputs.digest }}
      - name: B new (this branch)
        id: b
        uses: ./sign-image
        with:
          image: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}
          digest: ${{ steps.copy.outputs.digest }}
      - name: A old (v1.62.2) second
        if: ${{ matrix.order == 'new-first' }}
        id: a2
        uses: maestra-io/github-actions/sign-image@bdfea43a7d47149012fa1a488c91e5d6a49b2744 # v1.62.2
        with:
          image: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}
          digest: ${{ steps.copy.outputs.digest }}
      - name: both verify, SBOM components identical
        env:
          OLD: ${{ steps.a1.outputs.status || steps.a2.outputs.status }}
          NEW: ${{ steps.b.outputs.status }}
          REF: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}@${{ steps.copy.outputs.digest }}
          DIGEST: ${{ steps.copy.outputs.digest }}
        run: |
          echo "status old=$OLD new=$NEW"
          [ "$OLD" = sbom+signature ] && [ "$NEW" = sbom+signature ] || { echo "::error::status old=$OLD new=$NEW"; exit 1; }
          id=(--certificate-oidc-issuer https://token.actions.githubusercontent.com
              --certificate-identity-regexp '^https://github\.com/maestra-io/github-actions/')
          cosign verify "${id[@]}" "$REF" | jq -r 'length | "verified signatures: \(.)"'
          cosign verify-attestation "${id[@]}" --type cyclonedx "$REF" > "$RUNNER_TEMP/att.jsonl"
          n=$(wc -l < "$RUNNER_TEMP/att.jsonl"); echo "verified CycloneDX attestations: $n"
          [ "$n" -ge 2 ] || { echo "::error::expected 2 attestations (old + new)"; exit 1; }
          # every job of one image signs the same digest: all attestations of it are compared.
          # The released action's syft redacts its registry username "AWS" to "*******" in the
          # SBOM text; the normalized hash undoes only that.
          while read -r line; do
            jq -r '.payload | @base64d | fromjson | .predicate' <<<"$line" > "$RUNNER_TEMP/bom.json"
            raw=$(jq -cS '.components' "$RUNNER_TEMP/bom.json" | sha256sum | cut -c1-12)
            norm=$(jq -cS '.components | walk(if type == "string" then gsub("\\*{7}"; "AWS") else . end)' "$RUNNER_TEMP/bom.json" | sha256sum | cut -c1-12)
            dep=$(jq -cS '.dependencies' "$RUNNER_TEMP/bom.json" | sha256sum | cut -c1-12)
            echo "bom components=$(jq '.components|length' "$RUNNER_TEMP/bom.json") raw=$raw norm=$norm deps=$dep redacted=$(grep -o '\*\*\*\*\*\*\*' "$RUNNER_TEMP/bom.json" | wc -l) name=$(jq -r .metadata.component.name "$RUNNER_TEMP/bom.json")"
          done < "$RUNNER_TEMP/att.jsonl" | tee "$RUNNER_TEMP/boms.txt"
          echo "distinct raw: $(grep -o 'raw=[0-9a-f]*' "$RUNNER_TEMP/boms.txt" | sort -u | wc -l), normalized: $(grep -o 'norm=[0-9a-f]*' "$RUNNER_TEMP/boms.txt" | sort -u | wc -l), deps: $(grep -o 'deps=[0-9a-f]*' "$RUNNER_TEMP/boms.txt" | sort -u | wc -l)"
          [ "$(grep -o 'norm=[0-9a-f]*' "$RUNNER_TEMP/boms.txt" | sort -u | wc -l)" = 1 ] || { echo "::error::SBOM components differ beyond the AWS redaction"; exit 1; }
          types=$(aws ecr list-image-referrers --region us-west-2 --repository-name "$REPOSITORY" \
            --subject-id imageDigest="$DIGEST" \
            --query 'referrers[].annotations."dev.sigstore.bundle.predicateType"' --output text)
          echo "referrer predicateTypes: $types"
      - name: split download vs scan (skopeo -> OCI layout, syft oci-dir)
        env:
          REF: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}@${{ steps.copy.outputs.digest }}
          SYFT_IMAGE: ghcr.io/anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c
        run: |
          (umask 077; printf '{"auths":{"%s":{"auth":"%s"}}}' "${REF%%/*}" "$(printf 'AWS:%s' "$(aws ecr get-login-password --region us-west-2)" | base64 -w0)" > "$RUNNER_TEMP/auth.json")
          s=$SECONDS; skopeo copy -q --authfile "$RUNNER_TEMP/auth.json" "docker://$REF" "oci:$RUNNER_TEMP/oci"; echo "download (skopeo) $((SECONDS - s)) s, $(du -sm "$RUNNER_TEMP/oci" | cut -f1) MiB"
          s=$SECONDS; docker run --rm -v "$RUNNER_TEMP/oci:/oci:ro" "$SYFT_IMAGE" oci-dir:/oci -q -o cyclonedx-json > /dev/null; echo "scan (syft oci-dir) $((SECONDS - s)) s"
          s=$SECONDS; docker run --rm -v "$RUNNER_TEMP/oci:/oci:ro" -e SYFT_FILE_METADATA_SELECTION=none "$SYFT_IMAGE" oci-dir:/oci -q -o cyclonedx-json > /dev/null; echo "scan (syft oci-dir, no file metadata) $((SECONDS - s)) s"
          rm -rf "$RUNNER_TEMP/oci" "$RUNNER_TEMP/auth.json"
