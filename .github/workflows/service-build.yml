# Reusable build-and-release workflow for a containerised service in any language
# (Python, Node, Go, ...): the language-agnostic sibling of dotnet-service-build.yml
# (same jobs and contracts; only `test` differs). GitLab originals: create-release-number
# + docker-push-to-all + maestra-bake-oci-manifests + create-gitlab-release, with the
# repo's own test jobs (issues-maestra#1442 W3, #1568).
#
#   version ─► test ─► images (matrix) ─► release ─► bake
#   pull_request: version ─► test, checks (pr-checks.yml) ─► pr-gate (the required check)
#
# Warehouse refresh: no job here. The GitHub org webhook (workflow_run completed)
# refreshes every Kargo Warehouse labelled maestra.io/source-repo=<lower-case repo name>
# (fluxcd iota/us-iota-lw-kube-infra/kargo/webhook-receivers.yaml); Warehouses still
# poll ECR every 5 min as the fallback.
#
# Job names are a contract (required checks, `needs:` in callers): keep them.
#
# Usage (caller, on push to the default branch and on pull_request):
#
#   jobs:
#     build:
#       uses: maestra-io/github-actions/.github/workflows/service-build.yml@main
#       permissions: { contents: write, id-token: write }
#       with:
#         image-targets: ai-assistant-rnd=
#         python-version: "3.12"
#         test-command: |
#           pip install poetry tox
#           tox -e lint && tox -e test
#         build-secret-ids: ARTIFACTORY_ACCESS_TOKEN
#         bake: true
#
#   Bake-only repo (no image of its own; GitLab `images: ""`): omit image-targets,
#   keep `bake: true` (and `bake-path` when not ./kustomization).
#
# Inputs:
#   image-targets       `image=target` pairs, comma or newline separated
#                       (GitLab IMAGE_TARGETS_PAIRS). Empty only with `bake: true`:
#                       a bake-only repo (GitLab `images: ""`, e.g. a kustomize or
#                       terraform tree with no image of its own) runs version -> test
#                       -> release -> bake, no `images` job. <image> is the ECR repository,
#                       <target> the Dockerfile stage; `image=` (or bare `image`)
#                       builds the Dockerfile's last stage. As in dotnet-service-build:
#                       `image=<dockerfile>:<target>` builds from another Dockerfile
#                       (repos with several), `image=<dockerfile>:<target>:<context>`
#                       also sets the build context (default the repo root).
#   dockerfile          Default Dockerfile path (default Dockerfile, context = repo root);
#                       also the Dockerfile of docker-test-target.
#   test-command        Bash run on the runner from the repo root (the GitLab test
#                       jobs). Gets PACKAGES_TOKEN (GitHub OIDC token nora accepts as
#                       Basic `token:<it>`), PACKAGES_URL and the test-env variables.
#                       The token expires within minutes: run `packages-token` (on PATH)
#                       for a fresh one before each later install, e.g.
#                       `poetry config http-basic.maestra token "$(packages-token)"`.
#                       Docker is available (Testcontainers / docker compose).
#   docker-test-target  Dockerfile stage that runs the tests instead (built with the
#                       build secrets, then `docker run`). Both empty = no tests.
#   test-shards         Run the tests as N parallel `test (i/N)` jobs (default 1, a
#                       single `test` job). Each gets SHARD_INDEX (1..N) and SHARD_TOTAL
#                       (test-command env, docker-test-target `-e`) and picks its part,
#                       e.g. `playwright test --shard=$SHARD_INDEX/$SHARD_TOTAL`.
#   python-version      actions/setup-python before test-command (empty = skip).
#   node-version        actions/setup-node before test-command (empty = skip).
#   test-env            Extra environment for the tests, KEY=VALUE per line, not
#                       secret (shown in the log); exported to test-command and passed
#                       with --env-file to the docker-test-target container. Images on
#                       this account's ECR are pulled after an ECR login (see
#                       mirror-test-images.yml for test-images/*).
#   build-secret-ids    Comma-separated BuildKit secret ids the packages token is
#                       passed under (the Dockerfile's `--mount=type=secret,id=...`).
#                       Default PRIVATE_PACKAGES_TOKEN.
#   build-args          Extra `--build-arg`s, KEY=VALUE per line (not secret).
#   pr-images           Build the images on pull_request too (default false: a PR runs
#                       tests only; a broken Dockerfile surfaces in the release on the
#                       default branch, before anything is pushed).
#   push                Push images and run release/bake (default
#                       true). Never on pull_request. false = build-only dry run.
#   bake                Bake kustomization/ into <service>-manifests:<release> (default false).
#   service             Service name for bake (<service>-manifests). Default: repository name.
#   bake-path           Passed to bake-oci-manifests (default ./kustomization).
#   teleport-token      Teleport GitHub join token of the image-push bot (default the
#                       org-wide image-push-github-actions-maestra-io; empty = per-repo).
#   packages-url        Package registry (default https://packages.maestra.io, nora).
#   packages-audience   `aud` of the GitHub OIDC token nora accepts (default packages.maestra.io).
#   release-version     Release number set by the caller instead of RELEASE_PREFIX.run_number,
#                       X.Y.Z (e.g. a semantic-release version the caller has already
#                       tagged and released; the `release` job then finds it and skips).
#   release-tag-prefix  Prefix of the git tag / GitHub Release (default '': bare `1.1.N`),
#                       for a second release line in a repo that already tags `1.1.N`
#                       (e.g. `standard-blocks-v` next to mcf-build). Images and
#                       <service>-manifests keep the bare release; the prefix also
#                       gives the line its own concurrency group.
# Secrets:
#   private-packages-token  Optional override of the nora OIDC token.
# Outputs:
#   release             The release number (1.1.N, or release-version).
#
# Release number: `release-version` if set, else
# `${vars.RELEASE_PREFIX:-1.1}.${github.run_number}`, exactly as in
# dotnet-service-build.yml (above the GitLab 1.0.N, inside Kargo's `^1`; renaming the
# caller workflow file restarts run_number, then set RELEASE_PREFIX).
#
# Base images: a Dockerfile that names this account's ECR (`FROM`/`COPY --from` of a
# private base) gets an ECR login before the build (instance role, read only).

name: service-build

on:
  workflow_call:
    inputs:
      image-targets:
        type: string
        default: ""
      dockerfile:
        type: string
        default: Dockerfile
      test-command:
        type: string
        default: ""
      docker-test-target:
        type: string
        default: ""
      python-version:
        type: string
        default: ""
      node-version:
        type: string
        default: ""
      test-env:
        type: string
        default: ""
      build-secret-ids:
        type: string
        default: PRIVATE_PACKAGES_TOKEN
      build-args:
        type: string
        default: ""
      pr-images:
        type: boolean
        default: false
      push:
        type: boolean
        default: true
      bake:
        type: boolean
        default: false
      service:
        type: string
        default: ""
      bake-path:
        type: string
        default: ./kustomization
      teleport-token:
        type: string
        default: image-push-github-actions-maestra-io
      packages-url:
        type: string
        default: https://packages.maestra.io
      packages-audience:
        type: string
        default: packages.maestra.io
      release-version:
        type: string
        default: ""
      release-tag-prefix:
        type: string
        default: ""
      test-shards:
        type: number
        default: 1
    secrets:
      private-packages-token:
        required: false
    outputs:
      release:
        value: ${{ jobs.version.outputs.release }}

# One release pipeline per repository (and release-tag-prefix) at a time: a second
# release line would otherwise share mcf-build's `release-<repo>` group, where a newer
# pending run cancels the older one. Pull requests get their own group and cancel
# superseded runs. Callers must not reuse the `release-<repo>` group name in their own
# workflow (same name in caller and callee deadlocks).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-{0}-{1}', github.repository, github.ref) || format('release-{0}{1}', github.repository, inputs.release-tag-prefix != '' && format(':{0}', inputs.release-tag-prefix) || '') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com

jobs:
  # Pull requests that change only the kustomization tree(s) skip version/test/images:
  # nothing that is built or tested changed. checks still runs (check-encoding + the
  # kustomize build of the changed overlays) and pr-gate stays green (skipped jobs pass).
  # Any doubt (no merge commit, git failure, bake from the repo root) means code=true:
  # everything runs.
  changes:
    runs-on: runs-on=${{ github.run_id }}-changes/pool=small
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # A push (release) or workflow_dispatch builds everything: code=true without a diff. The job
      # must still RUN on those events - a skipped `changes` makes every dependent job that has
      # no `!cancelled()` guard (test, images, release, bake) skip too, which shipped empty green
      # releases on 2026-10-19.
      code: ${{ github.event_name == 'pull_request' && steps.c.outputs.code || 'true' }}
    steps:
      - uses: runs-on/action@v2.5.0
      # The test merge commit and its first parent, the base branch tip (HEAD^1).
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: c
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BAKE_PATH: ${{ inputs.bake-path }}
          BAKES: ""
        run: |
          # >>> pr-changes (scripts/test-pr-changes.sh runs this block)
          # kustomization trees: bake-path plus the <bake-path> field of every `bakes` line.
          # Comments are stripped first (a `# src` comment is not a path). A tree that is the repo
          # root (`.`, `./`, empty) means everything is baked: never skip.
          raw=$( { printf '%s\n' "$BAKE_PATH"; printf '%s\n' "$BAKES" | sed 's/#.*//' | awk 'NF>=2{print $2}'; } \
            | sed -E 's#^\./##; s#/+$##; s#^$#.#')
          dirs=$(grep -vxE '\.?' <<<"$raw" | sort -u || true)
          root=false; grep -qxE '\.?' <<<"$raw" && root=true
          files=$(git diff --name-only --no-renames HEAD^1 HEAD 2>/dev/null) || files=""
          code=true
          if [ -n "$files" ] && [ -n "$dirs" ] && ! $root; then
            code=false
            while IFS= read -r f; do
              inside=false
              while IFS= read -r d; do case "$f" in "$d"/*) inside=true; break ;; esac; done <<<"$dirs"
              if ! $inside; then code=true; break; fi
            done <<<"$files"
          fi
          echo "kustomization trees: $(tr '\n' ' ' <<<"$dirs")"
          echo "changed files: $(wc -l <<<"$files" | tr -d ' ') -> code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # <<< pr-changes

  version:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: runs-on=${{ github.run_id }}-version/pool=small
    timeout-minutes: 5
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
      shards: ${{ steps.v.outputs.shards }}
      matrix: ${{ steps.v.outputs.matrix }}
      legs: ${{ steps.v.outputs.legs }}
      specs: ${{ steps.v.outputs.specs }}
      images: ${{ steps.v.outputs.images }}
      service: ${{ steps.v.outputs.service }}
      publish: ${{ steps.v.outputs.publish }}
      teleport-token: ${{ steps.v.outputs.teleport-token }}
    steps:
      - uses: runs-on/action@v2.5.0
      - id: v
        env:
          PREFIX: ${{ vars.RELEASE_PREFIX }}
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          TAG_PREFIX: ${{ inputs.release-tag-prefix }}
          TEST_SHARDS: ${{ inputs.test-shards }}
          IMAGE_TARGETS: ${{ inputs.image-targets }}
          BAKE: ${{ inputs.bake }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          SERVICE: ${{ inputs.service }}
          REPO_NAME: ${{ github.event.repository.name }}
          PUSH: ${{ inputs.push && github.event_name != 'pull_request' }}
          TELEPORT_TOKEN: ${{ inputs.teleport-token }}
        run: |
          # >>> release (scripts/test-service-build.sh runs this block)
          if [ -n "$RELEASE_VERSION" ]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release-version '$RELEASE_VERSION' is not X.Y.Z"; exit 1
            fi
            release="$RELEASE_VERSION"
          else
            prefix="${PREFIX:-1.1}"
            case "$prefix" in
              [0-9]*.[0-9]*) ;;
              *) echo "::error::vars.RELEASE_PREFIX '$prefix' is not MAJOR.MINOR"; exit 1 ;;
            esac
            release="${prefix}.${RUN_NUMBER}"
          fi
          if [[ ! "$TAG_PREFIX" =~ ^[A-Za-z0-9._-]*$ ]]; then
            echo "::error::release-tag-prefix '$TAG_PREFIX' is not [A-Za-z0-9._-]*"; exit 1
          fi
          tag="${TAG_PREFIX}${release}"
          # <<< release
          # >>> shards (scripts/test-service-build.sh runs this block)
          if ! [[ "$TEST_SHARDS" =~ ^[0-9]+$ ]] || [ "$TEST_SHARDS" -lt 1 ] || [ "$TEST_SHARDS" -gt 20 ]; then
            echo "::error::test-shards '$TEST_SHARDS' is not 1..20"; exit 1
          fi
          shards=$(seq 1 "$TEST_SHARDS" | jq -sc .)
          # <<< shards
          # >>> image-targets (scripts/test-service-build.sh runs this block)
          # `image[=target]` / `image=<dockerfile>:<target>[:<context>]`, comma or newline
          # separated -> images matrix. Empty target = last stage. Nothing at all is
          # a bake-only repo (allowed with bake only): empty matrix, no images job.
          if [ -z "$(printf '%s' "$IMAGE_TARGETS" | tr -d ',[:space:]')" ] && [ "$BAKE" = true ]; then
            matrix='[]'
          else
            matrix=$(printf '%s' "$IMAGE_TARGETS" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . \
              | jq -Rnc --arg df "$DOCKERFILE" '[inputs | {image: (split("=")[0]), spec: (split("=")[1] // "")}
                  | (.spec | split(":")) as $f
                  | {image, dockerfile: (if ($f | length) > 1 then $f[0] else $df end),
                     target: (if ($f | length) > 1 then $f[1] else .spec end),
                     context: (if ($f | length) > 2 and $f[2] != "" then $f[2] else "." end),
                     fields: ($f | length)}]') || matrix='[]'
            if [ "$(jq 'length' <<<"$matrix")" -eq 0 ] \
               || jq -e 'any(.[]; .image == "" or .dockerfile == "" or .fields > 3)' <<<"$matrix" >/dev/null; then
              echo "::error::image-targets must be image=target or image=<dockerfile>:<target>[:<context>] pairs (empty only with bake: true), got '$IMAGE_TARGETS'"; exit 1
            fi
            matrix=$(jq -c 'map(del(.fields))' <<<"$matrix")
          fi
          # <<< image-targets
          {
            echo "release=$release"
            echo "tag=$tag"
            echo "shards=$shards"
            echo "matrix=$matrix"
            echo "legs=$(jq -c 'map({image, target})' <<<"$matrix")"
            echo "specs=$(jq -c 'map({key: .image, value: {dockerfile, context}}) | from_entries' <<<"$matrix")"
            echo "images=$(jq -r 'map(.image) | join(",")' <<<"$matrix")"
            echo "service=${SERVICE:-$REPO_NAME}"
            echo "publish=$PUSH"
            echo "teleport-token=${TELEPORT_TOKEN:-image-push-github-actions-${REPO_NAME}}"
          } >> "$GITHUB_OUTPUT"
          echo "release $release, images $(jq -c 'map(.image)' <<<"$matrix"), publish=$PUSH"

  test:
    needs: version
    # One `test` job unless test-shards > 1 (the name is a contract, see the header).
    name: ${{ inputs.test-shards > 1 && format('test ({0}/{1})', matrix.shard, inputs.test-shards) || 'test' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.version.outputs.shards) }}
    runs-on: runs-on=${{ github.run_id }}-test-${{ matrix.shard }}/pool=build
    timeout-minutes: 45
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ inputs.test-shards }}
    permissions:
      contents: read
      id-token: write # nora OIDC token
      packages: read  # only for a private-packages-token: GITHUB_TOKEN override (GitHub Packages)
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: mint packages token
        id: token
        uses: actions/github-script@v9.0.0
        env:
          OVERRIDE: ${{ secrets.private-packages-token }}
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = process.env.OVERRIDE || await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);

      - name: build secrets
        id: secrets
        env:
          IDS: ${{ inputs.build-secret-ids }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          {
            echo 'value<<__SECRETS__'
            tr ',' '\n' <<<"$IDS" | sed 's/[[:space:]]//g' | grep . | while read -r id; do
              printf '%s=%s\n' "$id" "$TOKEN"
            done
            echo '__SECRETS__'
          } >> "$GITHUB_OUTPUT"

      - name: test-env
        env:
          TEST_ENV: ${{ inputs.test-env }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          DOCKER_TEST_TARGET: ${{ inputs.docker-test-target }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          : > "$RUNNER_TEMP/test.env"
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            [[ "$line" == *=* && "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] \
              || { echo "::error::test-env line is not KEY=VALUE: '$line'"; exit 1; }
            printf '%s\n' "$line" >> "$RUNNER_TEMP/test.env"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
            echo "test env: ${key}"
          done <<< "$TEST_ENV"
          # Testcontainers pulls with ~/.docker/config.json, and so does BuildKit
          # for the docker-test-target stage; log in to this account's ECR when a
          # value or that Dockerfile names it (instance role, read only).
          ecr_refs=("$RUNNER_TEMP/test.env")
          [ -n "$DOCKER_TEST_TARGET" ] && ecr_refs+=("$DOCKERFILE")
          if grep -qsF "$ECR_REGISTRY" "${ecr_refs[@]}"; then
            aws ecr get-login-password --region "$(cut -d. -f4 <<< "$ECR_REGISTRY")" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          fi

      # ── Dockerfile stage (GitLab .run-docker-test) ───────────────────────
      - if: ${{ inputs.docker-test-target != '' }}
        uses: docker/setup-buildx-action@v4.4.1
      # Layer cache only for a Dockerfile that never writes the token into a layer:
      # a cached layer replays it after it expired (dotnet-service-build.yml header).
      - if: ${{ inputs.docker-test-target != '' }}
        name: layer cache
        id: cache
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          SCOPES: ${{ inputs.docker-test-target }}
        run: |
          # >>> layer-cache (scripts/test-dotnet-service-build-cache.sh runs this block)
          persists='--password|ClearTextPassword|_authToken|http-basic|^[[:space:]]*ARG[[:space:]]+[A-Za-z0-9_]*(TOKEN|PASSWORD)'
          nugetcache='--mount=type=cache,[^[:space:]]*id=nuget(,|[[:space:]]|$)'
          nocache=false; nocachefilter=""; mountgone=false
          # BuildKit's default GC drops a cache mount unused for 48 h, its layers live 60 d:
          # a cached restore layer then leaves the --no-restore RUNs without packages
          # (NETSDK1064, every rerun too). One --no-cache build refills the mount.
          if [ "${STICKY:-}" = true ] && grep -Eq -- "$nugetcache" "$DOCKERFILE" 2>/dev/null \
             && ! grep -qF 'with id "/nuget"' <<<"$(docker buildx du ${BUILDER:+--builder "$BUILDER"} --verbose --filter type=exec.cachemount 2>/dev/null || true)"; then
            mountgone=true
          fi
          if [ "${STICKY:-}" = true ] && grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            # The persistent builder would replay the token layer exactly like the gha
            # cache does: re-run the stages that write it (--no-cache-filter; stages built
            # FROM them re-run too). A global --no-cache would also start every NuGet cache
            # mount empty and keep that one (BuildKit 0.33). A match outside a named stage: --no-cache.
            nocachefilter=$(python3 -I - "$DOCKERFILE" "$persists" <<'PY'
          import re, sys
          pat, hit, named, cur, mounts = re.compile(sys.argv[2].replace('[[:space:]]', r'\s'), re.I), [], True, None, set()
          for l in re.sub(r'\\\r?\n', ' ', open(sys.argv[1]).read()).splitlines():
              m = re.match(r'\s*FROM\s+(?:--\S+\s+)*\S+(?:\s+AS\s+(\S+))?', l, re.I)
              if m:
                  cur = (m.group(1) or '').lower()
              elif pat.search(l):
                  named = named and bool(cur)
                  hit += [cur] if cur and cur not in hit else []
              if 'type=cache' in l and 'id=nuget' in l:
                  mounts.add(cur)
          # a filtered stage would start its NuGet cache mount empty: --no-cache then
          print(','.join(hit) if named and not mounts & set(hit) else '')
          PY
            )
            [ -n "$nocachefilter" ] && [ "$mountgone" = false ] || { nocache=true; nocachefilter=""; }
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer: built with ${nocachefilter:+--no-cache-filter }${nocachefilter:---no-cache} on the sticky BuildKit disk; scripts/nuget-secret-mount-fix.sh fixes the Dockerfile"
            from=""; to=""
          elif [ "$mountgone" = true ]; then
            echo "::notice file=${DOCKERFILE}::no NuGet cache mount on the sticky BuildKit disk (new disk or GC): built with --no-cache once to fill it"
            from=""; to=""; nocache=true
          elif [ "${STICKY:-}" = true ]; then
            from=""; to="" # layers live on the job's sticky disk, no gha export/import
          elif grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer (GitLab-era 'dotnet nuget update source --password'): built WITHOUT the layer cache, a cached layer would replay an expired token. Mount it per RUN instead: --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_<source> (scripts/nuget-secret-mount-fix.sh)."
            from=""; to=""
          elif grep -Eq -- "$nugetcache" "$DOCKERFILE" 2>/dev/null; then
            # type=gha exports layers, never cache mounts: an imported restore layer leaves
            # the --no-restore RUNs of a fresh runner without packages (NETSDK1064).
            from=""; to=""
          else
            scopes=$(printf '%s\n' "$SCOPES" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . || true)
            from=$(awk '{print "type=gha,scope=" $0}' <<<"$scopes")
            to="type=gha,mode=max,scope=$(head -n1 <<<"$scopes")"
          fi
          { echo 'from<<__CACHE__'; echo "$from"; echo '__CACHE__'; echo "to=$to"; echo "nocache=$nocache"; echo "nocachefilter=$nocachefilter"; } >> "$GITHUB_OUTPUT"
          # <<< layer-cache
      - if: ${{ inputs.docker-test-target != '' }}
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.docker-test-target }}
          load: true
          tags: local/${{ inputs.docker-test-target }}:latest
          build-args: ${{ inputs.build-args }}
          secrets: ${{ steps.secrets.outputs.value }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
      # No packages token at test time: the .NET SDK workload-manifest check would send an
      # empty Basic credential to the feed and nora locks the runner out (13.10.2026).
      - if: ${{ inputs.docker-test-target != '' }}
        env:
          TARGET: ${{ inputs.docker-test-target }}
        run: docker run --rm -e DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE=true -e SHARD_INDEX -e SHARD_TOTAL --env-file "$RUNNER_TEMP/test.env" "local/${TARGET}:latest"

      # ── test-command on the runner (the repo's GitLab test jobs) ─────────
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command != '' && inputs.python-version != '' }}
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command != '' && inputs.node-version != '' }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      # The GitHub OIDC token lives minutes: a test-command that installs packages more
      # than once (tox envs) mints a fresh one with `packages-token` before each install.
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command != '' }}
        env:
          AUDIENCE: ${{ inputs.packages-audience }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/packages-token" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          t=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${PACKAGES_AUDIENCE}" | jq -r .value)
          printf '%s' "$t"
          SH
          chmod +x "$RUNNER_TEMP/bin/packages-token"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "PACKAGES_AUDIENCE=$AUDIENCE" >> "$GITHUB_ENV"
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command != '' }}
        env:
          PACKAGES_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGES_URL: ${{ inputs.packages-url }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -eo pipefail -c "$TEST_COMMAND"

      - if: ${{ inputs.docker-test-target == '' && inputs.test-command == '' }}
        run: echo "::notice::no test-command and no docker-test-target, tests skipped"

  images:
    # No `name`: GitHub appends the matrix values, `images (<image>, <target>)` or
    # `images (<image>)` for a last-stage build, and a skipped job (pull_request) reads
    # `images` instead of the raw expression a matrix-based `name` leaves when skipped.
    # So the matrix carries only image/target; dockerfile/context come from `specs`.
    needs: [version, test]
    # Not on pull_request unless pr-images: images are built (and checked) by the
    # release on the default branch and by the workflow_dispatch dry run.
    if: ${{ needs.version.outputs.images != '' && (github.event_name != 'pull_request' || inputs.pr-images) }}
    # One label per leg: legs sharing `runs-on=<run_id>/pool=build` claim each
    # other's runners, and the robbed leg waits out RunsOn's retry backoff
    # (up to 42 min on 12.10, issues-maestra#1556).
    runs-on: runs-on=${{ github.run_id }}-images-${{ strategy.job-index }}/pool=build
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # nora OIDC token + Teleport join
      packages: read  # see `test`
    # fail-fast off: one failed image (a Teleport/ECR flake) no longer cancels its
    # siblings, so "re-run failed jobs" rebuilds only that leg instead of legs that
    # may already have pushed their immutable tag. `images` still ends `failure`
    # when any leg fails: `release` (and the bake after it) stays skipped and
    # `pr gate` red, exactly as before.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.legs) }}
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: mint packages token
        id: token
        uses: actions/github-script@v9.0.0
        env:
          OVERRIDE: ${{ secrets.private-packages-token }}
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = process.env.OVERRIDE || await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);

      - name: build secrets
        id: secrets
        env:
          IDS: ${{ inputs.build-secret-ids }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          {
            echo 'value<<__SECRETS__'
            tr ',' '\n' <<<"$IDS" | sed 's/[[:space:]]//g' | grep . | while read -r id; do
              printf '%s=%s\n' "$id" "$TOKEN"
            done
            echo '__SECRETS__'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      # BuildKit pulls base images with ~/.docker/config.json; log in to this
      # account's ECR when the Dockerfile names it (instance role, read only).
      - name: ecr login (base images)
        env:
          DOCKERFILE: ${{ fromJSON(needs.version.outputs.specs)[matrix.image].dockerfile }}
        run: |
          if grep -qsF "$ECR_REGISTRY" "$DOCKERFILE"; then
            aws ecr get-login-password --region "$(cut -d. -f4 <<< "$ECR_REGISTRY")" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          fi

      # Layer cache only for a Dockerfile that never writes the token into a layer:
      # a cached layer replays it after it expired (dotnet-service-build.yml header).
      - name: layer cache
        id: cache
        env:
          DOCKERFILE: ${{ fromJSON(needs.version.outputs.specs)[matrix.image].dockerfile }}
          SCOPES: |
            ${{ matrix.image }}
            ${{ inputs.docker-test-target }}
        run: |
          # >>> layer-cache (scripts/test-dotnet-service-build-cache.sh runs this block)
          persists='--password|ClearTextPassword|_authToken|http-basic|^[[:space:]]*ARG[[:space:]]+[A-Za-z0-9_]*(TOKEN|PASSWORD)'
          nugetcache='--mount=type=cache,[^[:space:]]*id=nuget(,|[[:space:]]|$)'
          nocache=false; nocachefilter=""; mountgone=false
          # BuildKit's default GC drops a cache mount unused for 48 h, its layers live 60 d:
          # a cached restore layer then leaves the --no-restore RUNs without packages
          # (NETSDK1064, every rerun too). One --no-cache build refills the mount.
          if [ "${STICKY:-}" = true ] && grep -Eq -- "$nugetcache" "$DOCKERFILE" 2>/dev/null \
             && ! grep -qF 'with id "/nuget"' <<<"$(docker buildx du ${BUILDER:+--builder "$BUILDER"} --verbose --filter type=exec.cachemount 2>/dev/null || true)"; then
            mountgone=true
          fi
          if [ "${STICKY:-}" = true ] && grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            # The persistent builder would replay the token layer exactly like the gha
            # cache does: re-run the stages that write it (--no-cache-filter; stages built
            # FROM them re-run too). A global --no-cache would also start every NuGet cache
            # mount empty and keep that one (BuildKit 0.33). A match outside a named stage: --no-cache.
            nocachefilter=$(python3 -I - "$DOCKERFILE" "$persists" <<'PY'
          import re, sys
          pat, hit, named, cur, mounts = re.compile(sys.argv[2].replace('[[:space:]]', r'\s'), re.I), [], True, None, set()
          for l in re.sub(r'\\\r?\n', ' ', open(sys.argv[1]).read()).splitlines():
              m = re.match(r'\s*FROM\s+(?:--\S+\s+)*\S+(?:\s+AS\s+(\S+))?', l, re.I)
              if m:
                  cur = (m.group(1) or '').lower()
              elif pat.search(l):
                  named = named and bool(cur)
                  hit += [cur] if cur and cur not in hit else []
              if 'type=cache' in l and 'id=nuget' in l:
                  mounts.add(cur)
          # a filtered stage would start its NuGet cache mount empty: --no-cache then
          print(','.join(hit) if named and not mounts & set(hit) else '')
          PY
            )
            [ -n "$nocachefilter" ] && [ "$mountgone" = false ] || { nocache=true; nocachefilter=""; }
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer: built with ${nocachefilter:+--no-cache-filter }${nocachefilter:---no-cache} on the sticky BuildKit disk; scripts/nuget-secret-mount-fix.sh fixes the Dockerfile"
            from=""; to=""
          elif [ "$mountgone" = true ]; then
            echo "::notice file=${DOCKERFILE}::no NuGet cache mount on the sticky BuildKit disk (new disk or GC): built with --no-cache once to fill it"
            from=""; to=""; nocache=true
          elif [ "${STICKY:-}" = true ]; then
            from=""; to="" # layers live on the job's sticky disk, no gha export/import
          elif grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer (GitLab-era 'dotnet nuget update source --password'): built WITHOUT the layer cache, a cached layer would replay an expired token. Mount it per RUN instead: --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_<source> (scripts/nuget-secret-mount-fix.sh)."
            from=""; to=""
          elif grep -Eq -- "$nugetcache" "$DOCKERFILE" 2>/dev/null; then
            # type=gha exports layers, never cache mounts: an imported restore layer leaves
            # the --no-restore RUNs of a fresh runner without packages (NETSDK1064).
            from=""; to=""
          else
            scopes=$(printf '%s\n' "$SCOPES" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . || true)
            from=$(awk '{print "type=gha,scope=" $0}' <<<"$scopes")
            to="type=gha,mode=max,scope=$(head -n1 <<<"$scopes")"
          fi
          { echo 'from<<__CACHE__'; echo "$from"; echo '__CACHE__'; echo "to=$to"; echo "nocache=$nocache"; echo "nocachefilter=$nocachefilter"; } >> "$GITHUB_OUTPUT"
          # <<< layer-cache

      # Built once into the BuildKit builder (type=image, no daemon load), then the
      # shared push-to-aws-ecr-repository action logs in through the Teleport
      # image-push bot and creates the repository (IMMUTABLE_WITH_EXCLUSION, org
      # pull policy), and a second, fully cached build pushes from BuildKit: it
      # uploads only the layers ECR is missing. The old `load: true` + `docker push`
      # re-uploaded every layer from the runner's fresh daemon (data-mesh-algs-413,
      # 22.10.2026: 2.3 GB a release for 3 MB of change, 100 s of load + 3 min of push).
      # SOURCE_DATE_EPOCH pins the image timestamps to the commit, so the same
      # commit rebuilds to the same manifest digest: a re-run of a failed job finds
      # its own image under the immutable tag and skips the push.
      - name: source date epoch
        id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: build ${{ matrix.image }} (${{ matrix.target }})
        id: build
        uses: docker/build-push-action@v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        with:
          context: ${{ fromJSON(needs.version.outputs.specs)[matrix.image].context }}
          file: ${{ fromJSON(needs.version.outputs.specs)[matrix.image].dockerfile }}
          target: ${{ matrix.target }}
          provenance: false
          outputs: type=image,push=false
          tags: local/${{ matrix.image }}:${{ needs.version.outputs.release }}
          build-args: |
            revision=${{ needs.version.outputs.release }} (${{ github.sha }})
            release=${{ needs.version.outputs.release }} (${{ github.sha }})
            ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.release }}
          secrets: ${{ steps.secrets.outputs.value }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
      - name: ecr login
        id: ecr
        if: ${{ needs.version.outputs.publish == 'true' }}
        uses: maestra-io/github-actions/push-to-aws-ecr-repository@v1
        with:
          awsRegion: us-west-2
          repositories: ${{ matrix.image }}
          targetTag: ${{ needs.version.outputs.release }}
          teleportToken: ${{ needs.version.outputs.teleport-token }}
          push: false
      - name: ${{ matrix.image }}:${{ needs.version.outputs.release }} already in ECR?
        id: existing
        if: ${{ needs.version.outputs.publish == 'true' }}
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE: ${{ needs.version.outputs.release }}
          DIGEST: ${{ steps.build.outputs.digest }}
          AWS_REGION: us-west-2
        run: |
          # >>> ecr-push-check (scripts/test-ecr-push-check.sh runs this block)
          # Idempotent re-run: the immutable tag may already hold this run's image from an
          # earlier attempt. Same digest (SOURCE_DATE_EPOCH makes the rebuild reproducible)
          # = pushed already: skip. Another digest would end in ECR TAG_INVALID: fail and say what to do.
          [ -n "$DIGEST" ] || { echo "::error::no image digest from the build step"; exit 1; }
          if ! out=$(aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$RELEASE" --output json 2>&1); then
            if grep -qE 'ImageNotFoundException|RepositoryNotFoundException' <<<"$out"; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::error::cannot read ${IMAGE}:${RELEASE} from ECR: $out"; exit 1
          fi
          existing=$(jq -r '.imageDetails[0].imageDigest // empty' <<<"$out")
          if [ "$existing" = "$DIGEST" ]; then
            echo "${IMAGE}:${RELEASE} is already in ECR (${DIGEST}): push skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::${IMAGE}:${RELEASE} already exists in ECR (${existing:-<none>}) and is not the image built now (${DIGEST}); tags are immutable. Dispatch the release workflow again: it takes the next release number."
            exit 1
          fi
          # <<< ecr-push-check
      - name: push ${{ matrix.image }}:${{ needs.version.outputs.release }}
        if: ${{ needs.version.outputs.publish == 'true' && steps.existing.outputs.skip != 'true' }}
        uses: docker/build-push-action@v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        with:
          context: ${{ fromJSON(needs.version.outputs.specs)[matrix.image].context }}
          file: ${{ fromJSON(needs.version.outputs.specs)[matrix.image].dockerfile }}
          target: ${{ matrix.target }}
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:${{ needs.version.outputs.release }}
          build-args: |
            revision=${{ needs.version.outputs.release }} (${{ github.sha }})
            release=${{ needs.version.outputs.release }} (${{ github.sha }})
            ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.release }}
          secrets: ${{ steps.secrets.outputs.value }}
          cache-from: ${{ steps.cache.outputs.from }}

  # Git tag + GitHub Release BEFORE the bake: bake-oci-manifests checks out the
  # release tag. Bare `1.1.N`, same shape as create-gitlab-release (or
  # <release-tag-prefix>1.1.N).
  # Bake-only (no image-targets): `images` is skipped, so the gate is explicit.
  release:
    needs: [version, test, images]
    if: >-
      ${{ !cancelled() && needs.version.outputs.publish == 'true' && needs.test.result == 'success'
          && (needs.images.result == 'success' || (needs.images.result == 'skipped' && needs.version.outputs.images == '')) }}
    runs-on: runs-on=${{ github.run_id }}-release/pool=small
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: runs-on/action@v2.5.0
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Idempotent for a re-run of failed jobs (same run_number, same release).
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 0
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes

  bake:
    needs: [version, release]
    # !cancelled(): a skipped `images` (bake-only) would otherwise skip every job after it.
    if: ${{ !cancelled() && inputs.bake && needs.version.outputs.publish == 'true' && needs.release.result == 'success' }}
    runs-on: runs-on=${{ github.run_id }}-bake/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Teleport join + cosign keyless
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: maestra-io/github-actions/bake-oci-manifests@v1
        with:
          service: ${{ needs.version.outputs.service }}
          images: ${{ needs.version.outputs.images }}
          tag: ${{ needs.version.outputs.release }}
          ref: ${{ needs.version.outputs.tag }}
          bake-path: ${{ inputs.bake-path }}
          teleport-token: ${{ needs.version.outputs.teleport-token }}

  # Pull requests only: the shared PR checks (check-encoding, kustomize build of a
  # changed overlays tree), then one verdict.
  checks:
    if: ${{ github.event_name == 'pull_request' }}
    uses: maestra-io/github-actions/.github/workflows/pr-checks.yml@main
    permissions:
      contents: read

  # The single check a branch ruleset requires (`<caller job> / pr gate`): red when
  # any PR job failed or was cancelled. Skipped jobs (images without pr-images) pass.
  pr-gate:
    name: pr gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [version, test, images, checks]
    runs-on: runs-on=${{ github.run_id }}-pr-gate/pool=small
    timeout-minutes: 5
    steps:
      - uses: runs-on/action@v2.5.0
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "PR jobs: $RESULTS"
          if jq -e 'any(. == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "::error::a PR job failed or was cancelled"; exit 1
          fi
