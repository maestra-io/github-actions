# Reusable build-and-release workflow for a containerised service in any language
# (Python, Node, Go, ...): the language-agnostic sibling of dotnet-service-build.yml
# (same jobs and contracts; only `test` differs). GitLab originals: create-release-number
# + docker-push-to-all + maestra-bake-oci-manifests + create-gitlab-release, with the
# repo's own test jobs (issues-maestra#1442 W3, #1568).
#
#   version ─► test ─► images (matrix) ─► release ─► bake ─► kargo-refresh
#
# Job names are a contract (required checks, `needs:` in callers): keep them.
#
# Usage (caller, on push to the default branch and on pull_request):
#
#   jobs:
#     build:
#       uses: maestra-io/github-actions/.github/workflows/service-build.yml@<sha> # vX.Y.Z
#       permissions: { contents: write, id-token: write }
#       with:
#         image-targets: ai-assistant-rnd=
#         python-version: "3.12"
#         test-command: |
#           pip install poetry tox
#           tox -e lint && tox -e test
#         build-secret-ids: ARTIFACTORY_ACCESS_TOKEN
#         bake: true
#
#   Bake-only repo (no image of its own; GitLab `images: ""`): omit image-targets,
#   keep `bake: true` (and `bake-path` when not ./kustomization).
#
# Inputs:
#   image-targets       `image=target` pairs, comma or newline separated
#                       (GitLab IMAGE_TARGETS_PAIRS). Empty only with `bake: true`:
#                       a bake-only repo (GitLab `images: ""`, e.g. a kustomize or
#                       terraform tree with no image of its own) runs version -> test
#                       -> release -> bake -> kargo-refresh, no `images` job. <image> is the ECR repository,
#                       <target> the Dockerfile stage; `image=` (or bare `image`)
#                       builds the Dockerfile's last stage. As in dotnet-service-build:
#                       `image=<dockerfile>:<target>` builds from another Dockerfile
#                       (repos with several), `image=<dockerfile>:<target>:<context>`
#                       also sets the build context (default the repo root).
#   dockerfile          Default Dockerfile path (default Dockerfile, context = repo root);
#                       also the Dockerfile of docker-test-target.
#   test-command        Bash run on the runner from the repo root (the GitLab test
#                       jobs). Gets PACKAGES_TOKEN (GitHub OIDC token nora accepts as
#                       Basic `token:<it>`), PACKAGES_URL and the test-env variables.
#                       The token expires within minutes: run `packages-token` (on PATH)
#                       for a fresh one before each later install, e.g.
#                       `poetry config http-basic.maestra token "$(packages-token)"`.
#                       Docker is available (Testcontainers / docker compose).
#   docker-test-target  Dockerfile stage that runs the tests instead (built with the
#                       build secrets, then `docker run`). Both empty = no tests.
#   python-version      actions/setup-python before test-command (empty = skip).
#   node-version        actions/setup-node before test-command (empty = skip).
#   test-env            Extra environment for the tests, KEY=VALUE per line, not
#                       secret (shown in the log); exported to test-command and passed
#                       with --env-file to the docker-test-target container. Images on
#                       this account's ECR are pulled after an ECR login (see
#                       mirror-test-images.yml for test-images/*).
#   build-secret-ids    Comma-separated BuildKit secret ids the packages token is
#                       passed under (the Dockerfile's `--mount=type=secret,id=...`).
#                       Default PRIVATE_PACKAGES_TOKEN.
#   build-args          Extra `--build-arg`s, KEY=VALUE per line (not secret).
#   pr-images           Build the images on pull_request too (default false: a PR runs
#                       tests only; a broken Dockerfile surfaces in the release on the
#                       default branch, before anything is pushed).
#   push                Push images and run release/bake/kargo-refresh (default
#                       true). Never on pull_request. false = build-only dry run.
#   bake                Bake kustomization/ into <service>-manifests:<release> (default false).
#   service             Service name for bake and Kargo. Default: repository name.
#   bake-path           Passed to bake-oci-manifests (default ./kustomization).
#   kargo-refresh       Refresh the Kargo Warehouse after bake (default true; only with bake).
#   kargo-project       Kargo project. Default kargo-<service>.
#   kargo-warehouse     Warehouse to refresh. Default <service>.
#   teleport-token      Teleport GitHub join token of the image-push bot (default the
#                       org-wide image-push-github-actions-maestra-io; empty = per-repo).
#   kargo-teleport-token  Join token of the kargo-refresh bot
#                       (default kargo-refresh-github-actions-maestra-io).
#   packages-url        Package registry (default https://packages.maestra.io, nora).
#   packages-audience   `aud` of the GitHub OIDC token nora accepts (default packages.maestra.io).
# Secrets:
#   private-packages-token  Optional override of the nora OIDC token.
# Outputs:
#   release             The release number 1.1.N.
#
# Release number: `${vars.RELEASE_PREFIX:-1.1}.${github.run_number}`, exactly as in
# dotnet-service-build.yml (above the GitLab 1.0.N, inside Kargo's `^1`; renaming the
# caller workflow file restarts run_number, then set RELEASE_PREFIX).
#
# Base images: a Dockerfile that names this account's ECR (`FROM`/`COPY --from` of a
# private base) gets an ECR login before the build (instance role, read only).

name: service-build

on:
  workflow_call:
    inputs:
      image-targets:
        type: string
        default: ""
      dockerfile:
        type: string
        default: Dockerfile
      test-command:
        type: string
        default: ""
      docker-test-target:
        type: string
        default: ""
      python-version:
        type: string
        default: ""
      node-version:
        type: string
        default: ""
      test-env:
        type: string
        default: ""
      build-secret-ids:
        type: string
        default: PRIVATE_PACKAGES_TOKEN
      build-args:
        type: string
        default: ""
      pr-images:
        type: boolean
        default: false
      push:
        type: boolean
        default: true
      bake:
        type: boolean
        default: false
      service:
        type: string
        default: ""
      bake-path:
        type: string
        default: ./kustomization
      kargo-refresh:
        type: boolean
        default: true
      kargo-project:
        type: string
        default: ""
      kargo-warehouse:
        type: string
        default: ""
      teleport-token:
        type: string
        default: image-push-github-actions-maestra-io
      kargo-teleport-token:
        type: string
        default: kargo-refresh-github-actions-maestra-io
      packages-url:
        type: string
        default: https://packages.maestra.io
      packages-audience:
        type: string
        default: packages.maestra.io
    secrets:
      private-packages-token:
        required: false
    outputs:
      release:
        value: ${{ jobs.version.outputs.release }}

# One release pipeline per repository at a time; pull requests get their own group
# and cancel superseded runs. Callers must not reuse the `release-<repo>` group
# name in their own workflow (same name in caller and callee deadlocks).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-{0}-{1}', github.repository, github.ref) || format('release-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  TELEPORT_FQDN: teleport.maestra.io:443

jobs:
  version:
    runs-on: runs-on=${{ github.run_id }}-version/pool=small
    timeout-minutes: 5
    outputs:
      release: ${{ steps.v.outputs.release }}
      matrix: ${{ steps.v.outputs.matrix }}
      images: ${{ steps.v.outputs.images }}
      service: ${{ steps.v.outputs.service }}
      publish: ${{ steps.v.outputs.publish }}
      teleport-token: ${{ steps.v.outputs.teleport-token }}
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - id: v
        env:
          PREFIX: ${{ vars.RELEASE_PREFIX }}
          RUN_NUMBER: ${{ github.run_number }}
          IMAGE_TARGETS: ${{ inputs.image-targets }}
          BAKE: ${{ inputs.bake }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          SERVICE: ${{ inputs.service }}
          REPO_NAME: ${{ github.event.repository.name }}
          PUSH: ${{ inputs.push && github.event_name != 'pull_request' }}
          TELEPORT_TOKEN: ${{ inputs.teleport-token }}
        run: |
          prefix="${PREFIX:-1.1}"
          case "$prefix" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::vars.RELEASE_PREFIX '$prefix' is not MAJOR.MINOR"; exit 1 ;;
          esac
          release="${prefix}.${RUN_NUMBER}"
          # >>> image-targets (scripts/test-service-build.sh runs this block)
          # `image[=target]` / `image=<dockerfile>:<target>[:<context>]`, comma or newline
          # separated -> images matrix. Empty target = last stage. Nothing at all is
          # a bake-only repo (allowed with bake only): empty matrix, no images job.
          if [ -z "$(printf '%s' "$IMAGE_TARGETS" | tr -d ',[:space:]')" ] && [ "$BAKE" = true ]; then
            matrix='[]'
          else
            matrix=$(printf '%s' "$IMAGE_TARGETS" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . \
              | jq -Rnc --arg df "$DOCKERFILE" '[inputs | {image: (split("=")[0]), spec: (split("=")[1] // "")}
                  | (.spec | split(":")) as $f
                  | {image, dockerfile: (if ($f | length) > 1 then $f[0] else $df end),
                     target: (if ($f | length) > 1 then $f[1] else .spec end),
                     context: (if ($f | length) > 2 and $f[2] != "" then $f[2] else "." end),
                     fields: ($f | length)}]') || matrix='[]'
            if [ "$(jq 'length' <<<"$matrix")" -eq 0 ] \
               || jq -e 'any(.[]; .image == "" or .dockerfile == "" or .fields > 3)' <<<"$matrix" >/dev/null; then
              echo "::error::image-targets must be image=target or image=<dockerfile>:<target>[:<context>] pairs (empty only with bake: true), got '$IMAGE_TARGETS'"; exit 1
            fi
            matrix=$(jq -c 'map(del(.fields))' <<<"$matrix")
          fi
          # <<< image-targets
          {
            echo "release=$release"
            echo "matrix=$matrix"
            echo "images=$(jq -r 'map(.image) | join(",")' <<<"$matrix")"
            echo "service=${SERVICE:-$REPO_NAME}"
            echo "publish=$PUSH"
            echo "teleport-token=${TELEPORT_TOKEN:-image-push-github-actions-${REPO_NAME}}"
          } >> "$GITHUB_OUTPUT"
          echo "release $release, images $(jq -c 'map(.image)' <<<"$matrix"), publish=$PUSH"

  test:
    needs: version
    runs-on: runs-on=${{ github.run_id }}-test/pool=build
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # nora OIDC token
      packages: read  # only for a private-packages-token: GITHUB_TOKEN override (GitHub Packages)
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: mint packages token
        id: token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OVERRIDE: ${{ secrets.private-packages-token }}
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = process.env.OVERRIDE || await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);

      - name: build secrets
        id: secrets
        env:
          IDS: ${{ inputs.build-secret-ids }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          {
            echo 'value<<__SECRETS__'
            tr ',' '\n' <<<"$IDS" | sed 's/[[:space:]]//g' | grep . | while read -r id; do
              printf '%s=%s\n' "$id" "$TOKEN"
            done
            echo '__SECRETS__'
          } >> "$GITHUB_OUTPUT"

      - name: test-env
        env:
          TEST_ENV: ${{ inputs.test-env }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          DOCKER_TEST_TARGET: ${{ inputs.docker-test-target }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          : > "$RUNNER_TEMP/test.env"
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            [[ "$line" == *=* && "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] \
              || { echo "::error::test-env line is not KEY=VALUE: '$line'"; exit 1; }
            printf '%s\n' "$line" >> "$RUNNER_TEMP/test.env"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
            echo "test env: ${key}"
          done <<< "$TEST_ENV"
          # Testcontainers pulls with ~/.docker/config.json, and so does BuildKit
          # for the docker-test-target stage; log in to this account's ECR when a
          # value or that Dockerfile names it (instance role, read only).
          ecr_refs=("$RUNNER_TEMP/test.env")
          [ -n "$DOCKER_TEST_TARGET" ] && ecr_refs+=("$DOCKERFILE")
          if grep -qsF "$ECR_REGISTRY" "${ecr_refs[@]}"; then
            aws ecr get-login-password --region "$(cut -d. -f4 <<< "$ECR_REGISTRY")" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          fi

      # ── Dockerfile stage (GitLab .run-docker-test) ───────────────────────
      - if: ${{ inputs.docker-test-target != '' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Layer cache only for a Dockerfile that never writes the token into a layer:
      # a cached layer replays it after it expired (dotnet-service-build.yml header).
      - if: ${{ inputs.docker-test-target != '' }}
        name: layer cache
        id: cache
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          SCOPES: ${{ inputs.docker-test-target }}
        run: |
          # >>> layer-cache (scripts/test-dotnet-service-build-cache.sh runs this block)
          persists='--password|ClearTextPassword|_authToken|http-basic|^[[:space:]]*ARG[[:space:]]+[A-Za-z0-9_]*(TOKEN|PASSWORD)'
          if grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer (GitLab-era 'dotnet nuget update source --password'): built WITHOUT the layer cache, a cached layer would replay an expired token. Mount it per RUN instead: --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_<source> (scripts/nuget-secret-mount-fix.sh)."
            from=""; to=""
          else
            scopes=$(printf '%s\n' "$SCOPES" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . || true)
            from=$(awk '{print "type=gha,scope=" $0}' <<<"$scopes")
            to="type=gha,mode=max,compression=zstd,compression-level=3,scope=$(head -n1 <<<"$scopes")"
          fi
          { echo 'from<<__CACHE__'; echo "$from"; echo '__CACHE__'; echo "to=$to"; } >> "$GITHUB_OUTPUT"
          # <<< layer-cache
      - if: ${{ inputs.docker-test-target != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.docker-test-target }}
          load: true
          tags: local/${{ inputs.docker-test-target }}:latest
          build-args: ${{ inputs.build-args }}
          secrets: ${{ steps.secrets.outputs.value }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
      - if: ${{ inputs.docker-test-target != '' }}
        env:
          TARGET: ${{ inputs.docker-test-target }}
        run: docker run --rm --env-file "$RUNNER_TEMP/test.env" "local/${TARGET}:latest"

      # ── test-command on the runner (the repo's GitLab test jobs) ─────────
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command != '' && inputs.python-version != '' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command != '' && inputs.node-version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      # The GitHub OIDC token lives minutes: a test-command that installs packages more
      # than once (tox envs) mints a fresh one with `packages-token` before each install.
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command != '' }}
        env:
          AUDIENCE: ${{ inputs.packages-audience }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/packages-token" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          t=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${PACKAGES_AUDIENCE}" | jq -r .value)
          printf '%s' "$t"
          SH
          chmod +x "$RUNNER_TEMP/bin/packages-token"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "PACKAGES_AUDIENCE=$AUDIENCE" >> "$GITHUB_ENV"
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command != '' }}
        env:
          PACKAGES_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGES_URL: ${{ inputs.packages-url }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -eo pipefail -c "$TEST_COMMAND"

      - if: ${{ inputs.docker-test-target == '' && inputs.test-command == '' }}
        run: echo "::notice::no test-command and no docker-test-target, tests skipped"

  images:
    # Explicit: the matrix carries `dockerfile`/`context` too; the check name stays the
    # default one (`images (<image>, <target>)`, `images (<image>)` for a last-stage build).
    name: ${{ matrix.target != '' && format('images ({0}, {1})', matrix.image, matrix.target) || format('images ({0})', matrix.image) }}
    needs: [version, test]
    # Not on pull_request unless pr-images: images are built (and checked) by the
    # release on the default branch and by the workflow_dispatch dry run.
    if: ${{ needs.version.outputs.images != '' && (github.event_name != 'pull_request' || inputs.pr-images) }}
    # One label per leg: legs sharing `runs-on=<run_id>/pool=build` claim each
    # other's runners, and the robbed leg waits out RunsOn's retry backoff
    # (up to 42 min on 12.10, issues-maestra#1556).
    runs-on: runs-on=${{ github.run_id }}-images-${{ strategy.job-index }}/pool=build
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # nora OIDC token + Teleport join
      packages: read  # see `test`
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.version.outputs.matrix) }}
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: mint packages token
        id: token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OVERRIDE: ${{ secrets.private-packages-token }}
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = process.env.OVERRIDE || await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);

      - name: build secrets
        id: secrets
        env:
          IDS: ${{ inputs.build-secret-ids }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          {
            echo 'value<<__SECRETS__'
            tr ',' '\n' <<<"$IDS" | sed 's/[[:space:]]//g' | grep . | while read -r id; do
              printf '%s=%s\n' "$id" "$TOKEN"
            done
            echo '__SECRETS__'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # BuildKit pulls base images with ~/.docker/config.json; log in to this
      # account's ECR when the Dockerfile names it (instance role, read only).
      - name: ecr login (base images)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          if grep -qsF "$ECR_REGISTRY" "$DOCKERFILE"; then
            aws ecr get-login-password --region "$(cut -d. -f4 <<< "$ECR_REGISTRY")" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          fi

      # Layer cache only for a Dockerfile that never writes the token into a layer:
      # a cached layer replays it after it expired (dotnet-service-build.yml header).
      - name: layer cache
        id: cache
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          SCOPES: |
            ${{ matrix.image }}
            ${{ inputs.docker-test-target }}
        run: |
          # >>> layer-cache (scripts/test-dotnet-service-build-cache.sh runs this block)
          persists='--password|ClearTextPassword|_authToken|http-basic|^[[:space:]]*ARG[[:space:]]+[A-Za-z0-9_]*(TOKEN|PASSWORD)'
          if grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer (GitLab-era 'dotnet nuget update source --password'): built WITHOUT the layer cache, a cached layer would replay an expired token. Mount it per RUN instead: --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_<source> (scripts/nuget-secret-mount-fix.sh)."
            from=""; to=""
          else
            scopes=$(printf '%s\n' "$SCOPES" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . || true)
            from=$(awk '{print "type=gha,scope=" $0}' <<<"$scopes")
            to="type=gha,mode=max,compression=zstd,compression-level=3,scope=$(head -n1 <<<"$scopes")"
          fi
          { echo 'from<<__CACHE__'; echo "$from"; echo '__CACHE__'; echo "to=$to"; } >> "$GITHUB_OUTPUT"
          # <<< layer-cache

      # Built into the local daemon as local/<image>:<release>, then pushed by the
      # shared push-to-aws-ecr-repository action: it creates the repository
      # IMMUTABLE_WITH_EXCLUSION with the org pull policy and logs in through the
      # Teleport image-push bot (no static AWS keys).
      - name: build ${{ matrix.image }} (${{ matrix.target }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: local/${{ matrix.image }}:${{ needs.version.outputs.release }}
          build-args: |
            revision=${{ needs.version.outputs.release }} (${{ github.sha }})
            release=${{ needs.version.outputs.release }} (${{ github.sha }})
            ${{ inputs.build-args }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.release }}
          secrets: ${{ steps.secrets.outputs.value }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      - name: push ${{ matrix.image }}:${{ needs.version.outputs.release }}
        if: ${{ needs.version.outputs.publish == 'true' }}
        uses: maestra-io/github-actions/push-to-aws-ecr-repository@v1
        with:
          awsRegion: us-west-2
          repositories: ${{ matrix.image }}
          localTag: ${{ needs.version.outputs.release }}
          targetTag: ${{ needs.version.outputs.release }}
          teleportToken: ${{ needs.version.outputs.teleport-token }}

  # Git tag + GitHub Release BEFORE the bake: bake-oci-manifests checks out the
  # release tag. Bare `1.1.N`, same shape as create-gitlab-release.
  # Bake-only (no image-targets): `images` is skipped, so the gate is explicit.
  release:
    needs: [version, test, images]
    if: >-
      ${{ !cancelled() && needs.version.outputs.publish == 'true' && needs.test.result == 'success'
          && (needs.images.result == 'success' || (needs.images.result == 'skipped' && needs.version.outputs.images == '')) }}
    runs-on: runs-on=${{ github.run_id }}-release/pool=small
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          # Idempotent for a re-run of failed jobs (same run_number, same release).
          if gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE already exists"; exit 0
          fi
          gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE" --generate-notes

  bake:
    needs: [version, release]
    # !cancelled(): a skipped `images` (bake-only) would otherwise skip every job after it.
    if: ${{ !cancelled() && inputs.bake && needs.version.outputs.publish == 'true' && needs.release.result == 'success' }}
    runs-on: runs-on=${{ github.run_id }}-bake/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Teleport join + cosign keyless
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: maestra-io/github-actions/bake-oci-manifests@v1
        with:
          service: ${{ needs.version.outputs.service }}
          images: ${{ needs.version.outputs.images }}
          tag: ${{ needs.version.outputs.release }}
          bake-path: ${{ inputs.bake-path }}
          teleport-token: ${{ needs.version.outputs.teleport-token }}

  # Instant freight: POST /v1beta1/projects/<p>/warehouses/<w>/refresh on Kargo
  # (us-iota-lw-kube-infra) instead of the Warehouse's 5m poll. Reached from the
  # AWS runner through Teleport, nothing on iota runs for it:
  #   1. tbot (github join, bot github-actions-kargo-refresh) writes a kubeconfig
  #      for us-iota-lw-kube-infra and a client certificate for the Teleport app
  #      `kargo` (kargo.teleport.maestra.io), in one oneshot run;
  #   2. kubectl mints a 10-minute token of ServiceAccount kargo/kargo-ci-github
  #      (the bot may do nothing else on the cluster);
  #   3. curl with the app certificate + that bearer. Kargo checks `get` on the
  #      Warehouse as kargo-ci-github (fluxcd ClusterRole kargo-ci-github-refresher),
  #      then applies the annotation with its own client.
  # Best effort: the bake is done, a failure here only delays freight by <=5m.
  kargo-refresh:
    needs: [version, bake]
    if: ${{ !cancelled() && inputs.bake && inputs.kargo-refresh && needs.version.outputs.publish == 'true' && needs.bake.result == 'success' }}
    runs-on: runs-on=${{ github.run_id }}-kargo-refresh/pool=small
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Teleport join
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - id: tp-version
        run: |
          v=$(curl -sf "https://${TELEPORT_FQDN}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}
      - env:
          TOKEN_NAME: ${{ inputs.kargo-teleport-token }}
          SERVICE: ${{ needs.version.outputs.service }}
          PROJECT: ${{ inputs.kargo-project }}
          WAREHOUSE: ${{ inputs.kargo-warehouse }}
        run: |
          out="$(mktemp -d)"
          cat > "$out/tbot.yaml" <<EOF
          version: v2
          proxy_server: ${TELEPORT_FQDN}
          onboarding:
            join_method: github
            token: ${TOKEN_NAME}
          oneshot: true
          storage:
            type: memory
          services:
            - type: kubernetes/v2
              destination:
                type: directory
                path: ${out}/kube
              selectors:
                - name: us-iota-lw-kube-infra
            - type: application
              app_name: kargo
              destination:
                type: directory
                path: ${out}/app
          EOF
          mkdir -p "$out/kube" "$out/app"
          # tbot's heartbeat can hang minutes after the outputs land (see
          # fluxcd setup-flux-ecr): poll for the files, then stop it.
          tbot start -c "$out/tbot.yaml" & pid=$!
          for _ in $(seq 1 30); do
            [ -s "$out/kube/kubeconfig.yaml" ] && [ -s "$out/app/tlscert" ] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          [ -s "$out/kube/kubeconfig.yaml" ] && [ -s "$out/app/tlscert" ] \
            || { echo "::warning::tbot (${TOKEN_NAME}) produced no credentials; freight appears on the next Warehouse poll"; exit 1; }

          bearer=$(kubectl --kubeconfig "$out/kube/kubeconfig.yaml" \
            --context "teleport.maestra.io-us-iota-lw-kube-infra" \
            -n kargo create token kargo-ci-github --duration 10m)
          echo "::add-mask::$bearer"
          project="${PROJECT:-kargo-${SERVICE}}"
          warehouse="${WAREHOUSE:-${SERVICE}}"
          http=$(curl -sS -o "$out/resp" -w '%{http_code}' -X POST \
            --cert "$out/app/tlscert" --key "$out/app/key" \
            -H "Authorization: Bearer ${bearer}" \
            "https://kargo.teleport.maestra.io/v1beta1/projects/${project}/warehouses/${warehouse}/refresh") || http=000
          if [ "$http" = "200" ]; then
            echo "Kargo warehouse ${project}/${warehouse} refreshed"
          else
            echo "::warning::Kargo warehouse ${project}/${warehouse} refresh failed (HTTP ${http}): $(head -c 300 "$out/resp" 2>/dev/null)"
            exit 1
          fi
