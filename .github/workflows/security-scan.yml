# Reusable security scan, two modes chosen by the caller's event:
#
#   pull_request   PR mode (what every repo runs, Igor 17.11.2026): fails only on findings the
#                  PR INTRODUCES, old findings on the base never block. security-scan/pr-scan.sh
#                  per tool: gitleaks over the PR's commits (HEAD^1..HEAD of the merge
#                  checkout), opengrep --baseline-commit HEAD^1 (only the changed files, a match
#                  also found at the base dropped by rule + path + matched lines), trivy fs of
#                  head minus trivy fs of base by (target, package, advisory) / (target, rule,
#                  redacted line); the base scan runs only when head has a finding. No report
#                  artifact. Selftest: scripts/test-security-scan-pr.sh.
#   anything else  full mode (workflow_dispatch by hand), below.
#
# Full mode: a scan of the whole default branch, the GitHub port of
# the GitLab "Daily security scan (gitleaks, trivy, opengrep)" pipeline schedule that the
# IDP terraform set up on every project (branch special/schedule-security-pipelines,
# components system/components/{gitleaks,trivy,opengrep}, maestra-io/issues-maestra#1649).
# Three jobs, the same scans with the same flags:
#
#   gitleaks   `gitleaks git` over the last 50 commits plus `gitleaks dir` over the whole
#              tree, with the central gitleaks/gitleaks.toml of this repo (as gitleaks.yml).
#              Accepted findings: `.gitleaksignore` (fingerprint) or `gitleaks:allow` inline.
#   trivy      `trivy fs --severity HIGH,CRITICAL` (vulnerabilities and secrets) of the tree.
#              Accepted findings: `.trivyignore` at the repo root.
#   opengrep   `opengrep scan --severity=ERROR --taint-intrafile` with the security rules
#              of semgrep/semgrep-rules (branch `release`, `category: security`, no
#              `secrets/`: the rule set the GitLab opengrep-ci image bakes in).
#              Accepted findings: `nosemgrep: <rule-id>` inline or `.semgrepignore`.
#
# GitLab sent the reports to DefectDojo and stayed green; DefectDojo is not reachable from
# GitHub and the org has no code scanning, so here a finding turns its job red and the
# accepted ones live in the repo, reviewed like code. Job logs carry the findings
# (gitleaks redacted).
#
# Reports for the SOC board (soc.maestrateam.io, source `code`): every job also writes its
# scanner's JSON, cut to an allowlist of fields by security-scan/report.py (no Secret / Match
# / Line / code lines; a 16-hex sha256 per finding for its identity), and the `report` job
# merges them with manifest.json (repo, sha, ref, run, tool versions, rule-set revisions,
# start / finish, job results) into ONE artifact `security-scan-report` (7 days: SOC keeps
# the record). The gitleaks job checks its reports against an UNREDACTED gitleaks pass (kept
# on the runner, never printed or uploaded): a raw secret value in any report fails the job
# and nothing is uploaded. A job's pass / fail is the scan's, as before.
#
# The binaries come from GitHub Releases through nora (packages.maestra.io/github/, release
# age and first-seen quarantine), authenticated by the job's OIDC token and pinned by
# sha256: bump the version and its sha256 together (the release's asset digest).
#
# Usage, .github/workflows/security-scan.yml in the repo (PR mode on every PR, full by hand):
#   name: security-scan
#   on:
#     pull_request:
#     workflow_dispatch:
#   permissions: { contents: read, id-token: write }
#   jobs:
#     scan:
#       uses: maestra-io/github-actions/.github/workflows/security-scan.yml@main
#
# Inputs:
#   ref   ref of maestra-io/github-actions the central gitleaks config is read from
#         (default main; set it when testing a branch of this repo).

name: security-scan

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main

jobs:
  gitleaks:
    name: gitleaks
    runs-on: runs-on=${{ github.run_id }}-gitleaks/pool=small
    timeout-minutes: 15
    outputs:
      config: ${{ steps.install.outputs.config }}
      version: ${{ steps.install.outputs.version }}
      started: ${{ steps.install.outputs.started }}
      finished: ${{ steps.report.outputs.finished }}
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestra-io/github-actions
          ref: ${{ inputs.ref }}
          path: .github-actions
          sparse-checkout: |
            gitleaks
            security-scan
          persist-credentials: false
      - name: Install gitleaks
        id: install
        run: |
          set -euo pipefail
          oidc="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=packages.maestra.io" | jq -r .value)"
          echo "::add-mask::${oidc}"
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          printf 'user = "oidc:%s"\n' "$oidc" | curl -sfL --retry 5 --retry-delay 5 --retry-all-errors -K - -o "$tgz" \
            "https://packages.maestra.io/github/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tgz}" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" gitleaks
          # The config and the report script leave the tree, or `gitleaks dir` would scan them too.
          mv .github-actions/gitleaks/gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"
          mv .github-actions/security-scan/{report.py,pr-scan.sh,pr-diff.py} "$RUNNER_TEMP/"
          echo "config=$(git -C .github-actions rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$GITLEAKS_VERSION" >> "$GITHUB_OUTPUT"
          rm -rf .github-actions
          echo "started=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: gitleaks git over the PR's commits (PR mode)
        if: ${{ github.event_name == 'pull_request' }}
        run: GITLEAKS="$RUNNER_TEMP/gitleaks" GITLEAKS_CONFIG="$RUNNER_TEMP/gitleaks.toml" bash "$RUNNER_TEMP/pr-scan.sh" gitleaks
      - name: gitleaks git (last 50 commits) and dir (whole tree)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          rc=0
          mkdir -p "$RUNNER_TEMP/report"
          "$RUNNER_TEMP/gitleaks" git --no-banner --config "$RUNNER_TEMP/gitleaks.toml" \
            --log-opts=--max-count=50 --redact=100 --verbose --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-git.raw.json" . || rc=1
          "$RUNNER_TEMP/gitleaks" dir --no-banner --config "$RUNNER_TEMP/gitleaks.toml" \
            --redact=100 --verbose --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-dir.raw.json" . || rc=1
          exit "$rc"
      - name: Report (redacted, checked against the raw values)
        id: report
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          echo "finished=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          r="$RUNNER_TEMP/report"
          for m in git dir; do
            python3 "$RUNNER_TEMP/report.py" gitleaks "$RUNNER_TEMP/gitleaks-$m.raw.json" "$r/gitleaks-$m.json"
          done
          # The same scans unredacted, to files that stay on this runner: the check fails when
          # one of their secret values appears anywhere in the reports. Nothing is printed.
          umask 077
          "$RUNNER_TEMP/gitleaks" git --no-banner --config "$RUNNER_TEMP/gitleaks.toml" --log-opts=--max-count=50 \
            --log-level error --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/unredacted-git.json" . >/dev/null 2>&1
          "$RUNNER_TEMP/gitleaks" dir --no-banner --config "$RUNNER_TEMP/gitleaks.toml" \
            --log-level error --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/unredacted-dir.json" . >/dev/null 2>&1
          rc=0
          python3 "$RUNNER_TEMP/report.py" check "$r" "$RUNNER_TEMP/unredacted-git.json" "$RUNNER_TEMP/unredacted-dir.json" || rc=1
          shred -u "$RUNNER_TEMP"/unredacted-*.json "$RUNNER_TEMP"/gitleaks-*.raw.json
          exit "$rc"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.event_name != 'pull_request' }}
        with:
          name: security-scan-part-gitleaks
          path: ${{ runner.temp }}/report/
          retention-days: 1
          if-no-files-found: error

  trivy:
    name: trivy
    runs-on: runs-on=${{ github.run_id }}-trivy/pool=small
    timeout-minutes: 15
    outputs:
      db: ${{ steps.report.outputs.db }}
      version: ${{ steps.install.outputs.version }}
      started: ${{ steps.install.outputs.started }}
      finished: ${{ steps.report.outputs.finished }}
    env:
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      TRIVY_VERSION: "0.75.0"
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      TRIVY_DISABLE_VEX_NOTICE: "true"
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR mode compares with the base, the merge commit's first parent
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestra-io/github-actions
          ref: ${{ inputs.ref }}
          path: .github-actions
          sparse-checkout: security-scan
          persist-credentials: false
      - name: Install trivy
        id: install
        run: |
          set -euo pipefail
          oidc="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=packages.maestra.io" | jq -r .value)"
          echo "::add-mask::${oidc}"
          tgz="$RUNNER_TEMP/trivy.tar.gz"
          printf 'user = "oidc:%s"\n' "$oidc" | curl -sfL --retry 5 --retry-delay 5 --retry-all-errors -K - -o "$tgz" \
            "https://packages.maestra.io/github/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${tgz}" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" trivy
          mv .github-actions/security-scan/{report.py,pr-scan.sh,pr-diff.py} "$RUNNER_TEMP/"
          rm -rf .github-actions
          echo "version=$TRIVY_VERSION" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      # One scan: the JSON goes to a file, the table to the log (trivy convert), exit code as before.
      - name: trivy fs, findings not on the base (PR mode)
        if: ${{ github.event_name == 'pull_request' }}
        run: TRIVY="$RUNNER_TEMP/trivy" bash "$RUNNER_TEMP/pr-scan.sh" trivy
      - name: trivy fs (HIGH, CRITICAL)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          rc=0
          "$RUNNER_TEMP/trivy" fs --severity HIGH,CRITICAL --exit-code 1 \
            --format json --output "$RUNNER_TEMP/trivy.raw.json" . || rc=$?
          if [ -s "$RUNNER_TEMP/trivy.raw.json" ]; then
            "$RUNNER_TEMP/trivy" convert --format table "$RUNNER_TEMP/trivy.raw.json" || echo "::warning::trivy convert failed"
          fi
          exit "$rc"
      # A report that cannot be written leaves the job's result to the scan; SOC shows the
      # missing report as "scan not reporting".
      - name: Report
        id: report
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name != 'pull_request' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "finished=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          echo "db=$("$RUNNER_TEMP/trivy" version --format json | jq -c '.VulnerabilityDB | {Version, UpdatedAt}')" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/report"
          python3 "$RUNNER_TEMP/report.py" trivy "$RUNNER_TEMP/trivy.raw.json" "$RUNNER_TEMP/report/trivy.json"
          python3 "$RUNNER_TEMP/report.py" check "$RUNNER_TEMP/report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.event_name != 'pull_request' }}
        with:
          name: security-scan-part-trivy
          path: ${{ runner.temp }}/report/
          retention-days: 1
          if-no-files-found: error

  opengrep:
    name: opengrep
    runs-on: runs-on=${{ github.run_id }}-opengrep/pool=small
    timeout-minutes: 30
    outputs:
      rules: ${{ steps.install.outputs.rules }}
      version: ${{ steps.install.outputs.version }}
      started: ${{ steps.install.outputs.started }}
      finished: ${{ steps.report.outputs.finished }}
    env:
      # renovate: datasource=github-releases depName=opengrep/opengrep
      OPENGREP_VERSION: "1.33.1"
      OPENGREP_SHA256: 46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR mode compares with the base, the merge commit's first parent
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: release
          path: .semgrep-rules
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestra-io/github-actions
          ref: ${{ inputs.ref }}
          path: .github-actions
          sparse-checkout: security-scan
          persist-credentials: false
      - name: Install opengrep, select the security rules
        id: install
        run: |
          set -euo pipefail
          oidc="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=packages.maestra.io" | jq -r .value)"
          echo "::add-mask::${oidc}"
          bin="$RUNNER_TEMP/opengrep"
          printf 'user = "oidc:%s"\n' "$oidc" | curl -sfL --retry 5 --retry-delay 5 --retry-all-errors -K - -o "$bin" \
            "https://packages.maestra.io/github/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  ${bin}" | sha256sum -c -
          chmod +x "$bin"
          # The rules and the scripts leave the tree, or the scan would read them as code.
          mv .github-actions/security-scan/{report.py,pr-scan.sh,pr-diff.py} "$RUNNER_TEMP/"
          rm -rf .github-actions
          mv .semgrep-rules "$RUNNER_TEMP/semgrep-rules"
          cd "$RUNNER_TEMP/semgrep-rules"
          echo "semgrep-rules $(git rev-parse HEAD)"
          { echo "rules=$(git rev-parse HEAD)"; echo "version=$OPENGREP_VERSION"; echo "started=$(date -u +%FT%TZ)"; } >> "$GITHUB_OUTPUT"
          rm -rf .git .github scripts stats libsonnet trusted_python
          find . -type f ! -name '*.yaml' -delete
          find . -name '*.yaml' ! -exec grep -qE '^[[:space:]]+category:[[:space:]]*security[[:space:]]*$' {} \; -delete
          find . -path '*/secrets/*' -delete
          find . -type d -empty -delete
          echo "$(find . -name '*.yaml' | wc -l) rule files"
      - name: opengrep scan (ERROR) of the PR's changes, base matches dropped (PR mode)
        if: ${{ github.event_name == 'pull_request' }}
        run: OPENGREP="$RUNNER_TEMP/opengrep" OPENGREP_RULES="$RUNNER_TEMP/semgrep-rules" bash "$RUNNER_TEMP/pr-scan.sh" opengrep
      - name: opengrep scan (ERROR)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          "$RUNNER_TEMP/opengrep" scan --config "$RUNNER_TEMP/semgrep-rules" --severity=ERROR \
            --taint-intrafile --no-rewrite-rule-ids --error --json-output="$RUNNER_TEMP/opengrep.raw.json" .
      - name: Report
        id: report
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name != 'pull_request' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "finished=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/report"
          python3 "$RUNNER_TEMP/report.py" opengrep "$RUNNER_TEMP/opengrep.raw.json" "$RUNNER_TEMP/report/opengrep.json"
          python3 "$RUNNER_TEMP/report.py" check "$RUNNER_TEMP/report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.event_name != 'pull_request' }}
        with:
          name: security-scan-part-opengrep
          path: ${{ runner.temp }}/report/
          retention-days: 1
          if-no-files-found: error

  # One artifact per run: the three parts + manifest.json, merged (the parts are deleted).
  # SOC (GET /api/cron/code-scan) lists the run's artifacts and downloads this one by name.
  # Full mode only: nothing reads a PR run's report.
  report:
    name: report
    needs: [gitleaks, trivy, opengrep]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: runs-on=${{ github.run_id }}-report/pool=small
    timeout-minutes: 10
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - name: manifest.json
        env:
          NEEDS: ${{ toJSON(needs) }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manifest"
          jq -n --argjson needs "$NEEDS" '{
              schema: 1,
              repository: env.GITHUB_REPOSITORY, sha: env.GITHUB_SHA, ref: env.GITHUB_REF,
              branch: env.GITHUB_REF_NAME, event: env.GITHUB_EVENT_NAME,
              run_id: (env.GITHUB_RUN_ID | tonumber), run_attempt: (env.GITHUB_RUN_ATTEMPT | tonumber),
              workflow_ref: env.GITHUB_WORKFLOW_REF, github_actions_ref: env.REF_INPUT,
              finished: (now | todate),
              tools: {
                gitleaks: {version: $needs.gitleaks.outputs.version, config: $needs.gitleaks.outputs.config,
                           started: $needs.gitleaks.outputs.started, finished: $needs.gitleaks.outputs.finished,
                           result: $needs.gitleaks.result, reports: ["gitleaks-git.json", "gitleaks-dir.json"]},
                trivy: {version: $needs.trivy.outputs.version, db: ($needs.trivy.outputs.db | try fromjson catch null),
                        started: $needs.trivy.outputs.started, finished: $needs.trivy.outputs.finished,
                        result: $needs.trivy.result, reports: ["trivy.json"]},
                opengrep: {version: $needs.opengrep.outputs.version, rules: ("semgrep/semgrep-rules@" + ($needs.opengrep.outputs.rules // "")),
                           started: $needs.opengrep.outputs.started, finished: $needs.opengrep.outputs.finished,
                           result: $needs.opengrep.result, reports: ["opengrep.json"]}
              }
            }' > "$RUNNER_TEMP/manifest/manifest.json"
          cat "$RUNNER_TEMP/manifest/manifest.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-part-manifest
          path: ${{ runner.temp }}/manifest/
          retention-days: 1
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-report
          pattern: security-scan-part-*
          delete-merged: true
          retention-days: 7
