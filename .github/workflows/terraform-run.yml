# maestra-io/github-actions/.github/workflows/terraform-run.yml
#
# Generic reusable Terraform runner (Proxmox-over-Teleport family). Covers EVERY
# consumer's run path (maestra-nat-gateway, vpn-maestra, mssql-maestra,
# active-directory-maestra, haproxy-maestra):
#   - Teleport auth (dynamic version discovery + binary cache); the exported
#     TELEPORT_IDENTITY_FILE / TBOT_DEST_DIR / TELEPORT_PROXY env is a HIDDEN
#     CONTRACT consumed by terraform local-exec `tsh` provisioners in the repos.
#   - Vault: none | public (vault.maestra.io direct, JWT) | tunnel (tbot
#     application-tunnel -> 127.0.0.1:8200). Secret map passed verbatim to
#     hashicorp/vault-action with TF_VAR_* export names chosen by the caller.
#   - Per-run Proxmox pveum API token `<prefix>-<run_id>-<attempt>` (fixes the
#     static-token 401 race between concurrent runs; json-first parse with
#     box-table fallback), removed in always() cleanup.
#   - AWS state creds via Teleport Workload Identity (terraform-state-s3),
#     plus optional extra WI legs (e.g. haproxy's route53/cert-manager).
#   - Optional per-node SSH tunnels + temp root ed25519 key (bpg/proxmox
#     native SSH transport) and the Proxmox API tunnel.
#
# ORDERING CONTRACT (do not reorder): vault tunnel -> vault fetch -> pveum mint
# -> workload identities -> node SSH tunnels + temp key -> API tunnel (the LAST
# `tsh ssh` before terraform — additional tsh connections can kill a resumable
# background tunnel, hence --no-resume on the API tunnel) -> terraform.
# Cleanup (always()) removes the token, the temp key, and every tunnel PID.
#
# Runner: `runs_on` (default ubuntu-latest). A self-hosted ARC scale set name
# (us-omega-lw-runners / us-omicron-lw-runners) puts the job on the same
# internal network as the Proxmox hosts. That alone does NOT remove Teleport
# from the path — every leg still dials teleport.maestra.io:443 — it only
# removes the Azure-to-edge internet hop. `node_ssh_direct` is what removes
# the long-lived tunnels; see its input description.
#
# Env dir convention: terraform runs in `terraform/environments/<env_dir>`;
# `env_dir` defaults to `environment` (vpn eu exception: env_dir=eu-omega).
name: Terraform Run (reusable)

on:
  workflow_call:
    inputs:
      # --- 3-axis targeting ----------------------------------------------
      region:
        description: "Target region label (e.g. us, eu)"
        required: true
        type: string
      environment:
        description: "Target environment label (e.g. omega, omicron)"
        required: true
        type: string
      site:
        description: "Target site label (e.g. lw)"
        required: true
        type: string
      env_dir:
        description: >-
          Subdir under terraform/environments/ to run in. Defaults to
          `environment` when empty; set explicitly when the directory name
          differs from the environment label (e.g. eu-omega for region=eu).
        required: false
        type: string
        default: ""
      # --- what to run -----------------------------------------------------
      action:
        description: "Terraform action: plan or apply"
        required: false
        type: string
        default: "plan"
      terraform_version:
        required: false
        type: string
        default: "1.14.6"
      replace_targets:
        description: "Comma-separated resource addresses passed as -replace=... (composed safely, no eval)"
        required: false
        type: string
        default: ""
      parallelism:
        description: "Value for terraform -parallelism on plan and apply. Empty = terraform default."
        required: false
        type: string
        default: ""
      # --- vault -----------------------------------------------------------
      vault_mode:
        description: "none | public | tunnel"
        required: false
        type: string
        default: "none"
      vault_addr:
        description: "Vault address (public mode: https://vault.maestra.io; tunnel mode: http://127.0.0.1:8200)"
        required: false
        type: string
        default: "https://vault.maestra.io"
      teleport_app:
        description: "Teleport app name for the tbot Vault tunnel (tunnel mode only, e.g. vault-omicron)"
        required: false
        type: string
        default: ""
      vault_role:
        description: "Vault JWT role name (auth method jwt-github)"
        required: false
        type: string
        default: ""
      vault_secrets:
        description: "Multiline map passed verbatim to hashicorp/vault-action `secrets:` — name the exports TF_VAR_* directly (e.g. 'infrastructure/data/x pwd | TF_VAR_admin_password')"
        required: false
        type: string
        default: ""
      # --- proxmox ---------------------------------------------------------
      proxmox_token_prefix:
        description: "pveum API token name prefix; actual token is <prefix>-<run_id>-<attempt> (per-run, race-safe)"
        required: true
        type: string
      proxmox_host:
        description: "Teleport node name of the Proxmox host used for token mint + API tunnel. Empty = nodes.json .nodes[0].teleport_host"
        required: false
        type: string
        default: ""
      api_tunnel:
        description: "Open the Proxmox API tunnel (port from nodes.json .api_tunnel_port, default 8006)"
        required: false
        type: boolean
        default: true
      node_ssh_tunnels:
        description: "Open one SSH tunnel per nodes.json node + inject a temp root ed25519 key + ssh-agent (bpg/proxmox native SSH transport). Requires nodes.json."
        required: false
        type: boolean
        default: false
      node_ssh_direct:
        description: >-
          Forward the per-node ports (and the Proxmox API port) with a plain
          `ssh -L` to the node's own nodes.json `address` instead of
          `tsh ssh -L`. The provider contract is UNCHANGED — it still dials
          127.0.0.1:<ssh_tunnel_port> — so no consumer provider block needs
          editing; the only consumer-side prerequisite is an `address` key
          (the node's internal IP) on every nodes.json node. Teleport is then
          used for the auth bootstrap only: the pveum token mint and the
          temp-key injection, both single short-lived `tsh ssh` calls, instead
          of tunnels that must stay up for the whole terraform run.
          REQUIRES an in-network runner (`runs_on`) and node_ssh_tunnels=true
          — a GitHub-hosted runner cannot reach the internal address at all.
        required: false
        type: boolean
        default: false
      # --- haproxy-shaped specials ------------------------------------------
      mask_sensitive_jq_path:
        description: "jq field accessor (e.g. .registration_secret) whose plan values get ::add-mask:: + redaction in the plan artifact. Empty = plain plan output."
        required: false
        type: string
        default: ""
      rolling:
        description: "Rolling apply: update VMs of <rolling_module_prefix> one at a time with an interval between targets"
        required: false
        type: boolean
        default: false
      rolling_interval:
        description: "Seconds to wait between rolling apply targets"
        required: false
        type: number
        default: 180
      rolling_module_prefix:
        description: "Module address prefix targeted by rolling apply"
        required: false
        type: string
        default: "module.haproxy"
      extra_workload_identities:
        description: "Multiline `selector=ENV_VAR=/dest/dir` lines; each mints a WI JWT and exports ENV_VAR=<dest>/jwt_svid (e.g. cert-manager=TF_VAR_route53_web_identity_token_file=/tmp/tbot-route53)"
        required: false
        type: string
        default: ""
      # --- misc --------------------------------------------------------------
      extra_env:
        description: "Extra KEY=VALUE lines appended to GITHUB_ENV early (e.g. TF_VAR_teleport_token=..., TF_VAR_proxmox_api_endpoint=...)"
        required: false
        type: string
        default: ""
      gh_environment:
        description: "GitHub Environment for the approval gate; empty = ungated. Caller passes VERBATIM (naming differs per repo — dashes vs underscores); central never derives it."
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Name of the uploaded plan artifact. Empty = tf-plan-<region>-<environment>-<site>."
        required: false
        type: string
        default: ""
      teleport_join_token:
        required: false
        type: string
        default: "github-actions-infra-deploy"
      teleport_fqdn:
        required: false
        type: string
        default: "teleport.maestra.io:443"
      runs_on:
        description: >-
          Runner label for the job. Default is GitHub-hosted ubuntu-latest;
          pass a self-hosted ARC scale-set name (e.g. us-omega-lw-runners) to
          run in-cluster, on the same internal network as the Proxmox hosts.
          Same convention and same scale sets as ansible-run.yml. The ARC image
          is minimal but carries everything this workflow needs (bash / jq /
          curl / git / python3 / ssh / ssh-keygen / ssh-agent); note sudo is
          blocked there (no-new-privileges), so steps must not install system
          packages — every binary here is either preinstalled or fetched into
          the tool cache by an action.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read
  id-token: write   # OIDC for Teleport join + Vault JWT

jobs:
  terraform:
    name: "${{ inputs.action }} · ${{ inputs.region }} · ${{ inputs.environment }} · ${{ inputs.site }}"
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.gh_environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TELEPORT_FQDN: ${{ inputs.teleport_fqdn }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Inject caller extra env
        if: ${{ inputs.extra_env != '' }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "${{ inputs.extra_env }}"

      - name: Set Terraform plugin cache
        run: echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/terraform-plugins" >> "$GITHUB_ENV"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terraform-plugins
          # NOTE: no .terraform.lock.hcl exists in any consumer today -> the key
          # is a degenerate static key. Kept as-is deliberately (harvest decision).
          key: tf-providers-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}

      # --- retry-once, and ONLY on the steps that dial the internet -----------
      # From here to "Terraform Plan/Apply" everything is setup: fetch a tool,
      # open a tunnel. Those steps get one retry, because they fail for reasons
      # that have nothing to do with the change under test. Terraform itself gets
      # none — a plan that failed is the answer this workflow exists to give.
      #
      # The pattern is the one "Teleport auth" below has used since it was
      # written: `continue-on-error` on the first attempt, a twin gated on its
      # `outcome`. Not a retry action (no new dependency) and not a job rerun
      # (GitHub has no job-level retry; `gh run rerun --failed` would rerun the
      # REAL failures too).
      #
      # Who this is for: rows with no `runs_on`, i.e. GitHub-hosted, which reach
      # the hosts over the PUBLIC Teleport proxy. On 2026-08-31 four plan jobs on
      # maestra-io/haproxy-maestra PRs 445/447 died inside 40 minutes on that hop
      # (`proxy returned non-JSON to a MachineID join`, `DeadlineExceeded` dialing
      # auth, `SSH tunnel on port 2223 never came up`) with the server side
      # healthy and every manual retry green — see the runner-routing note in
      # that repo's terraform-pr.yml. In-cluster ARC rows have not produced one.
      - name: Get Teleport version from proxy
        id: tp-version
        run: |
          # --retry-all-errors is what makes --retry cover the failure that
          # actually happens here: curl retries transient HTTP/transfer errors on
          # its own, but a CONNECTION reset — how the public proxy fails — is not
          # one of them without this flag.
          VER="$(/usr/bin/curl -sf --retry 3 --retry-delay 2 --retry-all-errors \
            "https://${TELEPORT_FQDN}/webapi/find" \
            | jq -r '.auto_update.tools_version // .server_version')"
          echo "Detected Teleport version: $VER"
          # The pipeline's exit status is jq's, so a dead curl used to leave VER
          # empty and this step GREEN — the version only went missing two steps
          # later, inside teleport-actions/setup.
          if [ -z "${VER}" ] || [ "${VER}" = "null" ]; then
            echo "::error::could not read a Teleport version from https://${TELEPORT_FQDN}/webapi/find"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ runner.os }}-${{ runner.arch }}-${{ steps.tp-version.outputs.version }}

      # Downloads the tarball from get.gravitational.com on every cache miss, so
      # it is one more internet dependency between a PR and its plan. Safe to
      # repeat: the action unpacks into the tool cache and is idempotent.
      - name: Setup Teleport
        id: teleport-setup
        continue-on-error: true
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ inputs.teleport_fqdn }}

      - name: Setup Teleport — retry
        if: steps.teleport-setup.outcome == 'failure'
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ inputs.teleport_fqdn }}

      # teleport-actions/auth mints the certificate by running tbot, whose heartbeat
      # to the proxy intermittently fails ("keepalive ping failed to receive ACK
      # within timeout") and reds a whole run before any terraform executes. The
      # first attempt is allowed to fail; the retry decides the job.
      - name: Teleport auth
        id: teleport-auth
        continue-on-error: true
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: ${{ inputs.teleport_fqdn }}
          token: ${{ inputs.teleport_join_token }}
          certificate-ttl: 30m

      - name: Teleport auth — retry
        id: teleport-auth-retry
        if: steps.teleport-auth.outcome == 'failure'
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: ${{ inputs.teleport_fqdn }}
          token: ${{ inputs.teleport_join_token }}
          certificate-ttl: 30m

      - name: Export Teleport identity for subsequent steps
        # HIDDEN CONTRACT: terraform local-exec provisioners in the consumer
        # repos run bare `tsh ssh ...` and rely on this ambient session.
        run: |
          echo "TELEPORT_IDENTITY_FILE=${{ steps.teleport-auth.outputs.identity-file || steps.teleport-auth-retry.outputs.identity-file }}" >> "$GITHUB_ENV"
          echo "TBOT_DEST_DIR=${{ steps.teleport-auth.outputs.destination-dir || steps.teleport-auth-retry.outputs.destination-dir }}" >> "$GITHUB_ENV"
          echo "TELEPORT_PROXY=${TELEPORT_FQDN}" >> "$GITHUB_ENV"

      # --- Vault: tunnel mode (mssql/ad omicron) ---------------------------
      - name: Start Vault tunnel via Teleport
        id: vault-tunnel
        if: ${{ inputs.vault_mode == 'tunnel' && inputs.teleport_app != '' }}
        run: |
          cat > /tmp/tbot-vault-config.yaml <<EOF
          version: v2
          onboarding:
            join_method: github
            token: ${{ inputs.teleport_join_token }}
          proxy_server: ${{ inputs.teleport_fqdn }}
          # memory storage: default /var/lib/teleport is not writable on hosted
          # runners (mkdir: permission denied -> tunnel never opens).
          storage:
            type: memory
          services:
            - type: application-tunnel
              app_name: ${{ inputs.teleport_app }}
              listen: tcp://127.0.0.1:8200
          EOF
          # Two attempts, in ONE step rather than a gated twin: the first tbot is
          # a background process holding (or trying to hold) 127.0.0.1:8200, so a
          # second attempt must reap it first or it binds nothing and the port
          # check then passes on a dead tunnel. A twin step cannot see the first
          # one's PID reliably; a loop can.
          tunnel_pid=""
          for attempt in 1 2; do
            tbot start -c /tmp/tbot-vault-config.yaml &
            tunnel_pid=$!
            for _ in $(seq 1 15); do
              (echo > /dev/tcp/127.0.0.1/8200) >/dev/null 2>&1 && break 2
              sleep 1
            done
            echo "::warning::vault tunnel (${{ inputs.teleport_app }}) did not open in 15s on attempt ${attempt}"
            kill "${tunnel_pid}" 2>/dev/null || true
            wait "${tunnel_pid}" 2>/dev/null || true
            tunnel_pid=""
          done
          if [ -z "${tunnel_pid}" ]; then
            echo "::error::vault tunnel (tbot app-tunnel ${{ inputs.teleport_app }}) did not open in 15s, twice"
            exit 1
          fi
          echo "tunnel_pid=${tunnel_pid}" >> "$GITHUB_OUTPUT"

      # --- Vault: fetch secrets (public OR tunnel) -------------------------
      - name: Retrieve secrets from Vault
        if: ${{ inputs.vault_mode != 'none' && inputs.vault_secrets != '' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault_addr }}
          method: jwt
          path: jwt-github
          role: ${{ inputs.vault_role }}
          jwtGithubAudience: https://github.com/maestra-io
          exportEnv: true
          secrets: ${{ inputs.vault_secrets }}

      # --- Node topology ----------------------------------------------------
      # Envs without nodes.json (haproxy omicron) skip node tunnels entirely and
      # must provide `proxmox_host` for the mint + API tunnel.
      - name: Load node configuration from nodes.json
        id: nodes
        working-directory: terraform/environments/${{ inputs.env_dir != '' && inputs.env_dir || inputs.environment }}
        run: |
          if [ ! -f nodes.json ]; then
            echo "has_nodes_json=false" >> "$GITHUB_OUTPUT"
            echo "api_port=8006" >> "$GITHUB_OUTPUT"
            echo "No nodes.json present — proxmox_host input drives mint/API tunnel."
            exit 0
          fi

          NODES_JSON=$(cat nodes.json)
          API_PORT=$(echo "$NODES_JSON" | jq -r '.api_tunnel_port // 8006')
          echo "api_port=$API_PORT" >> "$GITHUB_OUTPUT"

          NODE_NAMES=$(echo "$NODES_JSON" | jq -r '.nodes[].name' | tr '\n' ' ')
          TELEPORT_HOSTS=$(echo "$NODES_JSON" | jq -r '.nodes[].teleport_host' | tr '\n' ' ')
          SSH_PORTS=$(echo "$NODES_JSON" | jq -r '.nodes[].ssh_tunnel_port' | tr '\n' ' ')
          # Optional, node_ssh_direct only. "-" (never a valid IP) keeps the
          # index aligned with the other three lists when a node omits it, so
          # the direct step can name the offending node instead of silently
          # shifting every address by one.
          NODE_ADDRESSES=$(echo "$NODES_JSON" | jq -r '.nodes[] | .address // "-"' | tr '\n' ' ')
          NODE_COUNT=$(echo "$NODES_JSON" | jq '.nodes | length')

          echo "has_nodes_json=true" >> "$GITHUB_OUTPUT"
          echo "node_names=$NODE_NAMES" >> "$GITHUB_OUTPUT"
          echo "teleport_hosts=$TELEPORT_HOSTS" >> "$GITHUB_OUTPUT"
          echo "ssh_ports=$SSH_PORTS" >> "$GITHUB_OUTPUT"
          echo "node_addresses=$NODE_ADDRESSES" >> "$GITHUB_OUTPUT"
          echo "node_count=$NODE_COUNT" >> "$GITHUB_OUTPUT"
          echo "Loaded $NODE_COUNT node(s): $NODE_NAMES"

      # --- Proxmox pveum token (ALWAYS per-run name — race-safe) -----------
      - name: Create Proxmox API token
        id: api-token
        # nodes.json is CALLER-repo content (a reusable workflow checks out the
        # caller, so on a PR it is the PR branch). Splicing a step output into
        # the script body with ${{ }} would let a `$(...)` in any field execute
        # here. Every nodes.json-derived value therefore travels through env and
        # is read as a quoted shell variable — never as shell SOURCE.
        env:
          TELEPORT_HOSTS: ${{ steps.nodes.outputs.teleport_hosts }}
          PROXMOX_HOST_IN: ${{ inputs.proxmox_host }}
        run: |
          set -euo pipefail

          # Per-run token name: concurrent runs never remove each other's token
          # (the static-name scheme caused documented 401 races).
          TOKEN_NAME="${{ inputs.proxmox_token_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "token_name=$TOKEN_NAME" >> "$GITHUB_OUTPUT"

          PROXMOX_HOST="$PROXMOX_HOST_IN"
          if [ -z "$PROXMOX_HOST" ]; then
            read -r -a HOSTS <<< "$TELEPORT_HOSTS"
            if [ "${#HOSTS[@]}" -eq 0 ]; then
              echo "::error::No proxmox_host input and no nodes.json to derive one from"
              exit 1
            fi
            PROXMOX_HOST="${HOSTS[0]}"
          fi
          echo "Creating API token ${TOKEN_NAME} on ${PROXMOX_HOST}..."
          echo "host=$PROXMOX_HOST" >> "$GITHUB_OUTPUT"

          # `--output-format=json` keeps us out of the unicode-table parsing
          # business (the regex-on-`│` parser once extracted the literal string
          # "value" on some PVE 9.x output paths -> every API call 401'd).
          # Box-table grep kept as fallback for pveum builds that ignore the flag.
          # Every token expires in 24h and expired ones are pruned here, so a
          # run that never reaches Cleanup (runner killed) cannot leave a
          # live token behind.
          TOKEN_EXPIRE=$(( $(date +%s) + 86400 ))
          TOKEN_OUTPUT=$(tsh ssh "teleport-production@${PROXMOX_HOST}" -- \
            "sudo pveum user add ci@pve --comment 'Terraform CI automation' 2>/dev/null || true && \
             sudo pveum acl modify / -user ci@pve -role Administrator 2>/dev/null || true && \
             sudo pveum user token list ci@pve --output-format=json 2>/dev/null \
               | python3 -c 'import json,sys,time; [print(t[\"tokenid\"]) for t in json.load(sys.stdin) if 0 < t.get(\"expire\", 0) < time.time()]' \
               | xargs -r -n1 sudo pveum user token remove ci@pve 2>/dev/null; \
             sudo pveum user token remove ci@pve ${TOKEN_NAME} 2>/dev/null || true && \
             sudo pveum user token add ci@pve ${TOKEN_NAME} --privsep=0 --expire ${TOKEN_EXPIRE} --output-format=json")

          TOKEN_VALUE=$(echo "$TOKEN_OUTPUT" | jq -er '.value // empty' 2>/dev/null || true)
          if [ -z "$TOKEN_VALUE" ]; then
            TOKEN_VALUE=$(echo "$TOKEN_OUTPUT" | grep -E '^\│\s*value' | awk -F'│' '{print $3}' | tr -d ' ' || true)
          fi
          if [ -z "$TOKEN_VALUE" ]; then
            TOKEN_VALUE=$(echo "$TOKEN_OUTPUT" | grep "value" | awk -F'│' '{print $3}' | tr -d ' ' || true)
          fi
          if [ -z "$TOKEN_VALUE" ]; then
            echo "::error::Failed to extract API token from pveum output. Raw: $TOKEN_OUTPUT"
            exit 1
          fi

          echo "::add-mask::${TOKEN_VALUE}"
          echo "PROXMOX_VE_API_TOKEN=ci@pve!${TOKEN_NAME}=${TOKEN_VALUE}" >> "$GITHUB_ENV"
          echo "API token created successfully"

      # --- AWS state creds via Teleport Workload Identity -------------------
      - name: Get AWS credentials via Teleport Workload Identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/tbot-aws

          cat > /tmp/tbot-aws-config.yaml <<EOF
          version: v2
          proxy_server: ${TELEPORT_FQDN}
          onboarding:
            join_method: github
            token: ${{ inputs.teleport_join_token }}
          storage:
            type: memory
          oneshot: true
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: /tmp/tbot-aws
              selector:
                name: terraform-state-s3
              audiences:
                - sts.amazonaws.com
          EOF

          tbot start -c /tmp/tbot-aws-config.yaml

          if [ ! -f /tmp/tbot-aws/jwt_svid ]; then
            echo "::error::Failed to obtain AWS JWT from Teleport Workload Identity"
            exit 1
          fi

          echo "AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-aws/jwt_svid" >> "$GITHUB_ENV"
          echo "AWS_ROLE_ARN=arn:aws:iam::515260921971:role/teleport-terraform-state" >> "$GITHUB_ENV"
          echo "AWS credentials configured via Teleport Workload Identity"

      # --- Extra WI legs (e.g. haproxy route53 via cert-manager) ------------
      - name: Get extra workload identities
        if: ${{ inputs.extra_workload_identities != '' }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            SELECTOR="${line%%=*}"
            REST="${line#*=}"
            ENV_VAR="${REST%%=*}"
            DEST="${REST#*=}"
            if [ -z "$SELECTOR" ] || [ -z "$ENV_VAR" ] || [ -z "$DEST" ] || [ "$ENV_VAR" = "$DEST" ]; then
              echo "::error::Bad extra_workload_identities line (want selector=ENV_VAR=/dest/dir): $line"
              exit 1
            fi
            mkdir -p "$DEST"
            CFG="/tmp/tbot-wi-${SELECTOR}.yaml"
            cat > "$CFG" <<EOF
          version: v2
          proxy_server: ${TELEPORT_FQDN}
          onboarding:
            join_method: github
            token: ${{ inputs.teleport_join_token }}
          storage:
            type: memory
          oneshot: true
          services:
            - type: workload-identity-jwt
              destination:
                type: directory
                path: ${DEST}
              selector:
                name: ${SELECTOR}
              audiences:
                - sts.amazonaws.com
          EOF
            tbot start -c "$CFG"
            if [ ! -f "${DEST}/jwt_svid" ]; then
              echo "::error::Failed to obtain JWT for workload identity '${SELECTOR}'"
              exit 1
            fi
            echo "${ENV_VAR}=${DEST}/jwt_svid" >> "$GITHUB_ENV"
            echo "Workload identity '${SELECTOR}' exported as ${ENV_VAR}"
          done <<< "${{ inputs.extra_workload_identities }}"

      # --- Per-node SSH tunnels + temp key (bpg native SSH transport) -------
      # Two transports, one contract: whichever runs, the provider dials
      # 127.0.0.1:<ssh_tunnel_port>. Proxied (default) opens the forward with
      # `tsh ssh -L` through the Teleport proxy; direct (node_ssh_direct)
      # opens it with a plain `ssh -L` to the node's internal address and runs
      # AFTER the key injection below, because it authenticates with that key.
      - name: Start per-node SSH tunnels to Proxmox
        id: ssh-tunnel
        if: ${{ inputs.node_ssh_tunnels && !inputs.node_ssh_direct && steps.nodes.outputs.has_nodes_json == 'true' }}
        env:
          TELEPORT_HOSTS: ${{ steps.nodes.outputs.teleport_hosts }}
          SSH_PORTS: ${{ steps.nodes.outputs.ssh_ports }}
        run: |
          set -euo pipefail
          read -r -a HOSTS <<< "$TELEPORT_HOSTS"
          read -r -a PORTS <<< "$SSH_PORTS"
          TUNNEL_PIDS=""

          # Open every forward and wait for every port. Returns non-zero if any
          # port never answers, leaving TUNNEL_PIDS set so the caller can reap.
          start_tunnels() {
            TUNNEL_PIDS=""
            for i in "${!HOSTS[@]}"; do
              HOST="${HOSTS[$i]}"
              PORT="${PORTS[$i]}"
              echo "  - localhost:${PORT} -> ${HOST}:22"
              tsh ssh -i "$TELEPORT_IDENTITY_FILE" \
                -L "${PORT}:localhost:22" \
                "teleport-production@${HOST}" \
                "sleep infinity" &
              TUNNEL_PIDS="$TUNNEL_PIDS $!"
            done

            for PORT in "${PORTS[@]}"; do
              up=0
              for _ in $(seq 1 15); do
                (echo >/dev/tcp/localhost/"$PORT") 2>/dev/null && { up=1; break; }
                sleep 1
              done
              if [ "$up" != 1 ]; then
                echo "::warning::SSH tunnel on port ${PORT} never came up"
                return 1
              fi
            done
            return 0
          }

          # ALL-OR-NOTHING per attempt, and the reap is the reason the retry is a
          # loop inside this step rather than a gated twin step: a half-open
          # attempt leaves live `tsh ssh` children bound to some of the ports, so
          # a naive second attempt would fail to bind those and the readiness
          # check would then pass against the FIRST attempt's forwards — which
          # are exactly the ones already proven unreliable. Kill first, then
          # retry, and export only the surviving attempt's PIDs so Cleanup kills
          # the right processes.
          ok=0
          for attempt in 1 2; do
            if start_tunnels; then ok=1; break; fi
            echo "::warning::attempt ${attempt} did not bring every tunnel up — reaping and retrying"
            # Deliberate word splitting: TUNNEL_PIDS is a PID LIST.
            # shellcheck disable=SC2086
            kill ${TUNNEL_PIDS} 2>/dev/null || true
            # shellcheck disable=SC2086
            wait ${TUNNEL_PIDS} 2>/dev/null || true
            TUNNEL_PIDS=""
            sleep 3
          done

          if [ "$ok" != 1 ]; then
            echo "::error::SSH tunnels to Proxmox never came up (two attempts). This is the public Teleport edge, not the nodes: the forward has to SURVIVE the whole terraform run, so a transient at the proxy reds a job that had already authenticated fine."
            exit 1
          fi
          echo "tunnel_pids=${TUNNEL_PIDS}" >> "$GITHUB_OUTPUT"
          echo "All SSH tunnels up (PIDs:${TUNNEL_PIDS})"

      - name: Setup temporary SSH key for Proxmox provider
        if: ${{ inputs.node_ssh_tunnels && steps.nodes.outputs.has_nodes_json == 'true' }}
        env:
          TELEPORT_HOSTS: ${{ steps.nodes.outputs.teleport_hosts }}
        run: |
          set -euo pipefail
          read -r -a HOSTS <<< "$TELEPORT_HOSTS"

          # Comment = marker + epoch, so any run can tell a dead key from a live
          # one. Runs are capped well under 24h, so anything older is a leak
          # from a run that never reached Cleanup (runner killed, edge lost).
          ssh-keygen -t ed25519 -f /tmp/proxmox-key -N "" -q \
            -C "tf-ci-tmp $(date +%s) ${{ github.repository }}#${{ github.run_id }}"

          # Remote editor shared with Cleanup: drops blank lines, keys older
          # than 24h and DROP_KEY, appends ADD_KEY, and exits 3 if DROP_KEY is
          # still there. Writes through the symlink (/root/.ssh/authorized_keys
          # -> /etc/pve/priv/authorized_keys on PVE); `sed -i` used to replace
          # that symlink with a diverging copy that `pvecm updatecerts` later
          # merged back, resurrecting removed keys.
          cat > /tmp/ak-edit.sh <<'EOF'
          set -u
          f=/root/.ssh/authorized_keys
          mkdir -p /root/.ssh; [ -e "$f" ] || touch "$f"
          f=$(readlink -f "$f"); t=$(mktemp)
          awk -v now="$(date +%s)" -v drop="${DROP_KEY:-}" \
            'NF==0 {next} drop != "" && $2 == drop {next} $3 == "tf-ci-tmp" && now - $4 > 86400 {next} {print}' \
            "$f" > "$t" || exit 4
          cat "$t" > "$f"; rm -f "$t"
          if [ -n "${ADD_KEY:-}" ]; then echo "$ADD_KEY" >> "$f" || exit 4; fi
          if [ -n "${DROP_KEY:-}" ] && grep -qF "$DROP_KEY" "$f"; then exit 3; fi
          EOF

          for HOST in "${HOSTS[@]}"; do
            echo "Injecting temp SSH key into $HOST..."
            { printf 'ADD_KEY=%q\n' "$(cat /tmp/proxmox-key.pub)"; cat /tmp/ak-edit.sh; } \
              | tsh ssh -i "$TELEPORT_IDENTITY_FILE" "teleport-production@${HOST}" "sudo bash -s"
          done

          eval "$(ssh-agent -s)"
          ssh-add /tmp/proxmox-key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          # Base64 payload only (field 2) — for precise sed removal in cleanup
          TMP_KEY_DATA=$(awk '{print $2}' /tmp/proxmox-key.pub)
          echo "TMP_KEY_DATA=$TMP_KEY_DATA" >> "$GITHUB_ENV"

      # --- Per-node DIRECT forwarders (node_ssh_direct) ---------------------
      # Same local ports, same provider contract — the hop to the node is a
      # plain ssh over the internal network instead of a tunnel riding the
      # public Teleport edge. That edge is what fails as `SSH tunnel on port
      # 2223 never came up`: the tunnel must survive the whole terraform run,
      # so every transient at the proxy reds a job that had already
      # authenticated fine.
      - name: Start per-node direct SSH forwarders
        id: ssh-direct
        if: ${{ inputs.node_ssh_tunnels && inputs.node_ssh_direct && steps.nodes.outputs.has_nodes_json == 'true' }}
        env:
          NODE_NAMES: ${{ steps.nodes.outputs.node_names }}
          NODE_ADDRESSES: ${{ steps.nodes.outputs.node_addresses }}
          SSH_PORTS: ${{ steps.nodes.outputs.ssh_ports }}
        run: |
          set -euo pipefail
          read -r -a NAMES <<< "$NODE_NAMES"
          read -r -a ADDRS <<< "$NODE_ADDRESSES"
          read -r -a PORTS <<< "$SSH_PORTS"
          TUNNEL_PIDS=""

          for i in "${!NAMES[@]}"; do
            ADDR="${ADDRS[$i]}"
            PORT="${PORTS[$i]}"
            if [ "$ADDR" = "-" ]; then
              echo "::error::node_ssh_direct=true but nodes.json node '${NAMES[$i]}' has no \"address\" key — add the node's internal IP, or turn node_ssh_direct off"
              exit 1
            fi
            echo "  - localhost:${PORT} -> ${ADDR}:22 (direct)"
            # ExitOnForwardFailure turns a bind clash into a dead PID the
            # readiness loop below catches, rather than a live ssh session
            # forwarding nothing. Host keys are deliberately not pinned: CI
            # runners are ephemeral and hold no known_hosts, exactly as the
            # ansible direct path does it.
            ssh -N \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ExitOnForwardFailure=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -i /tmp/proxmox-key \
              -L "${PORT}:127.0.0.1:22" \
              "root@${ADDR}" &
            TUNNEL_PIDS="$TUNNEL_PIDS $!"
          done
          echo "tunnel_pids=${TUNNEL_PIDS}" >> "$GITHUB_OUTPUT"

          for PORT in "${PORTS[@]}"; do
            for i in $(seq 1 15); do
              (echo >"/dev/tcp/localhost/$PORT") 2>/dev/null && break
              [ "$i" -eq 15 ] && { echo "::error::direct SSH forwarder on port $PORT never came up"; exit 1; }
              sleep 1
            done
          done
          echo "All direct SSH forwarders up (PIDs:${TUNNEL_PIDS})"

      # --- Proxmox API tunnel — MUST be the LAST tsh ssh before terraform ---
      # Additional tsh connections can kill a resumable background tunnel, so
      # this runs after every other tsh interaction and uses --no-resume.
      - name: Start Proxmox API tunnel
        id: api-tunnel
        if: ${{ inputs.api_tunnel }}
        env:
          API_PORT: ${{ steps.nodes.outputs.api_port }}
          HOST: ${{ steps.api-token.outputs.host }}
          TELEPORT_HOSTS: ${{ steps.nodes.outputs.teleport_hosts }}
          NODE_ADDRESSES: ${{ steps.nodes.outputs.node_addresses }}
          HAS_NODES_JSON: ${{ steps.nodes.outputs.has_nodes_json }}
          NODE_SSH_DIRECT: ${{ inputs.node_ssh_direct }}
          NODE_SSH_TUNNELS: ${{ inputs.node_ssh_tunnels }}
        run: |
          # Local port comes from nodes.json .api_tunnel_port; the REMOTE side
          # is FIXED at 8006 — Proxmox always listens on 8006. This removes the
          # old triple coupling (local port == remote port == api_tunnel_port).
          # All repos currently use 8006:8006, so no behavior change today.

          # Direct mode carries the API forward the same way as the node
          # forwards above — plain ssh to the host's nodes.json address, using
          # the temp key. Gated on node_ssh_tunnels too: the key only exists
          # when that is on, so an env with node_ssh_tunnels=false (mssql, AD)
          # keeps the tsh tunnel regardless of node_ssh_direct.
          API_ADDR=""
          if [ "$NODE_SSH_DIRECT" = "true" ] \
             && [ "$NODE_SSH_TUNNELS" = "true" ] \
             && [ "$HAS_NODES_JSON" = "true" ]; then
            read -r -a HOSTS <<< "$TELEPORT_HOSTS"
            read -r -a ADDRS <<< "$NODE_ADDRESSES"
            for i in "${!HOSTS[@]}"; do
              if [ "${HOSTS[$i]}" = "$HOST" ]; then API_ADDR="${ADDRS[$i]}"; fi
            done
            if [ -z "$API_ADDR" ] || [ "$API_ADDR" = "-" ]; then
              echo "::error::node_ssh_direct=true but nodes.json has no \"address\" for the API host '${HOST}' — add it, or turn node_ssh_direct off"
              exit 1
            fi
          fi

          if [ -n "$API_ADDR" ]; then
            echo "Starting API tunnel: localhost:${API_PORT} -> ${API_ADDR}:8006 (direct)"
            ssh -N \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ExitOnForwardFailure=yes \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -i /tmp/proxmox-key \
              -L "${API_PORT}:127.0.0.1:8006" \
              "root@${API_ADDR}" &
          else
            echo "Starting API tunnel: localhost:${API_PORT} -> ${HOST}:8006"
            tsh ssh --no-resume -i "$TELEPORT_IDENTITY_FILE" \
              -L "${API_PORT}:localhost:8006" \
              "teleport-production@${HOST}" \
              "sleep infinity" &
          fi
          TUNNEL_PID=$!
          echo "tunnel_pid=$TUNNEL_PID" >> "$GITHUB_OUTPUT"

          # Readiness: TCP accept alone only proves the LOCAL bind; the
          # unauthenticated /api2/json/version probe proves HTTPS end-to-end
          # through the tunnel to the Proxmox API (no token required).
          for i in $(seq 1 15); do
            if (echo >"/dev/tcp/localhost/$API_PORT") 2>/dev/null \
               && curl -sk --max-time 5 "https://127.0.0.1:${API_PORT}/api2/json/version" >/dev/null; then
              break
            fi
            [ "$i" -eq 15 ] && { echo "::error::Proxmox API tunnel on port $API_PORT not serving HTTPS after 15 attempts"; exit 1; }
            sleep 1
          done
          echo "Proxmox API tunnel started (PID: $TUNNEL_PID)"

      # --- Terraform ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/environments/${{ inputs.env_dir != '' && inputs.env_dir || inputs.environment }}
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/${{ inputs.env_dir != '' && inputs.env_dir || inputs.environment }}
        run: |
          set -euo pipefail

          PLAN_ARGS=(-out=tfplan -input=false)
          if [ -n "${{ inputs.parallelism }}" ]; then
            PLAN_ARGS+=("-parallelism=${{ inputs.parallelism }}")
          fi
          # -replace targets composed as array elements — NO eval (quoting-safe).
          # Trim is plain bash (NOT `echo | xargs`): addresses like
          # module.sql["sql01"] need their double quotes intact, and xargs
          # strips unescaped quotes. Elements are appended verbatim post-trim.
          if [ -n "${{ inputs.replace_targets }}" ]; then
            IFS=',' read -ra TARGETS <<< "${{ inputs.replace_targets }}"
            for target in "${TARGETS[@]}"; do
              target="${target#"${target%%[![:space:]]*}"}"   # ltrim
              target="${target%"${target##*[![:space:]]}"}"   # rtrim
              [ -n "$target" ] && PLAN_ARGS+=("-replace=${target}")
            done
            echo "Replace targets: ${PLAN_ARGS[*]}"
          fi

          PLAN_TXT="plan-${{ inputs.region }}-${{ inputs.environment }}-${{ inputs.site }}.txt"

          MASK_PATH="${{ inputs.mask_sensitive_jq_path }}"
          if [ -n "$MASK_PATH" ]; then
            # IMPORTANT: terraform plan's stdout may include cleartext sensitive
            # values on creates/replacements (e.g. the gravitational/teleport
            # provider does NOT mark registration_secret as Sensitive). The GHA
            # log mask is registered BELOW, so plan stdout would leak the secret
            # into the runner log before the mask is in place. Suppress plan
            # stdout; read the plan via `terraform show` after masking is set up.
            terraform plan "${PLAN_ARGS[@]}" >/dev/null

            # Register every matching value with the GHA log mask, which scrubs
            # it from every subsequent step's stdout/stderr (rolling apply,
            # `terraform show -json`, artifact upload).
            while IFS= read -r secret; do
              [ -n "$secret" ] || continue
              echo "::add-mask::$secret"
            done < <(
              terraform show -json tfplan \
                | jq -r '.. | objects | ${{ inputs.mask_sensitive_jq_path }}? // empty'
            )

            # Belt-and-braces: also redact the value in the persisted plan text
            # artifact, in case the masker misses any rendering form.
            FIELD="${MASK_PATH#.}"
            terraform show -no-color tfplan \
              | sed -E "s/(${FIELD}[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"<redacted>\"/g" \
              > "$PLAN_TXT"
          else
            terraform plan "${PLAN_ARGS[@]}"
            terraform show -no-color tfplan > "$PLAN_TXT"
          fi

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: terraform/environments/${{ inputs.env_dir != '' && inputs.env_dir || inputs.environment }}
        run: |
          PAR_ARG=""
          if [ -n "${{ inputs.parallelism }}" ]; then
            PAR_ARG="-parallelism=${{ inputs.parallelism }}"
          fi

          # rolling=false -> just apply the saved plan in parallel.
          if [[ "${{ inputs.rolling }}" != "true" ]]; then
            terraform apply -auto-approve ${PAR_ARG} tfplan
            exit 0
          fi

          INTERVAL=${{ inputs.rolling_interval }}
          if ! [[ "$INTERVAL" =~ ^[0-9]+$ ]]; then
            echo "::error::rolling_interval must be a non-negative integer (seconds). Got: $INTERVAL"
            exit 1
          fi

          PREFIX='${{ inputs.rolling_module_prefix }}'
          PLAN_JSON=$(terraform show -json tfplan)

          # Rolling apply targets each changed resource by its full plan
          # address one at a time. If the plan also
          # touches anything outside the prefix (provider config drift, firewall
          # security groups, route53 records, etc.) rolling can't cover it, so
          # fall back to a normal parallel apply rather than refusing to deploy.
          NON_VM=$(echo "$PLAN_JSON" | jq -r --arg p "$PREFIX" '
            [.resource_changes[]
             | select(.change.actions != ["no-op"])
             | select(.address | startswith($p) | not)
             | .address] | unique | .[]')
          if [ -n "$NON_VM" ]; then
            echo "::notice::Plan touches resources outside ${PREFIX} — rolling skipped, running normal apply:"
            echo "$NON_VM"
            terraform apply -auto-approve ${PAR_ARG} tfplan
            exit 0
          fi

          CHANGED=$(echo "$PLAN_JSON" | jq -r --arg p "$PREFIX" '
            [.resource_changes[]
             | select(.address | startswith($p))
             | select(.change.actions != ["no-op"])
             | .address
            ] | unique | .[]')

          if [ -z "$CHANGED" ]; then
            echo "No ${PREFIX} changes detected in plan."
            exit 0
          fi

          # Order: privates first (internal traffic), then publics, api, cdp,
          # email-tracking and callback-receiver (all external/customer-facing).
          # Within each role, process numeric suffix in reverse so 02 goes
          # before 01 — pairs with ansible's serial:1 convention. Every role
          # must be listed here or its VMs are dropped from the rolling apply —
          # the unmatched-key check below turns that former silent drop into a
          # hard error. (Ported verbatim from haproxy-maestra — rolling is
          # haproxy-shaped by design.)
          PRIVATE=$(echo "$CHANGED" | grep '\["haproxy-private' | sort -r || true)
          PUBLIC=$(echo "$CHANGED" | grep '\["haproxy-public' | sort -r || true)
          API=$(echo "$CHANGED" | grep '\["haproxy-api' | sort -r || true)
          CDP=$(echo "$CHANGED" | grep '\["haproxy-cdp' | sort -r || true)
          EMAIL=$(echo "$CHANGED" | grep '\["haproxy-email' | sort -r || true)
          CALLBACK=$(echo "$CHANGED" | grep '\["haproxy-callback' | sort -r || true)
          ORDERED=$(echo -e "${PRIVATE}\n${PUBLIC}\n${API}\n${CDP}\n${EMAIL}\n${CALLBACK}" | sed '/^$/d')

          UNMATCHED=$(comm -23 <(echo "$CHANGED" | sort) <(echo "$ORDERED" | sort) | sed '/^$/d')
          if [ -n "$UNMATCHED" ]; then
            echo "::error::Rolling apply has no ordering for these changed VM keys (add their role to the PRIVATE/PUBLIC/API/CDP lists): $UNMATCHED"
            exit 1
          fi

          TOTAL=$(echo "$ORDERED" | wc -l | tr -d ' ')
          COUNT=0

          echo "Rolling apply for $TOTAL VM(s): $(echo $ORDERED | tr '\n' ' ')"
          echo "Interval between VMs: ${INTERVAL}s"

          for VM in $ORDERED; do
            COUNT=$((COUNT + 1))
            TARGET="${VM}"
            echo "::group::[$COUNT/$TOTAL] Applying ${TARGET}"
            terraform apply -auto-approve -target="$TARGET"
            echo "::endgroup::"

            if [ "$COUNT" -lt "$TOTAL" ]; then
              echo "Waiting ${INTERVAL}s before next VM..."
              sleep "$INTERVAL"
            fi
          done

      - name: Upload plan artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name != '' && inputs.artifact_name || format('tf-plan-{0}-{1}-{2}', inputs.region, inputs.environment, inputs.site) }}
          path: terraform/environments/${{ inputs.env_dir != '' && inputs.env_dir || inputs.environment }}/plan-${{ inputs.region }}-${{ inputs.environment }}-${{ inputs.site }}.txt
          retention-days: 30

      # --- Cleanup ------------------------------------------------------------
      - name: Cleanup
        if: ${{ always() }}
        env:
          TELEPORT_HOSTS: ${{ steps.nodes.outputs.teleport_hosts }}
          API_HOST_IN: ${{ steps.api-token.outputs.host }}
          TOKEN_NAME_IN: ${{ steps.api-token.outputs.token_name }}
        run: |
          # Stop Vault tunnel
          if [ -n "${{ steps.vault-tunnel.outputs.tunnel_pid }}" ]; then
            kill "${{ steps.vault-tunnel.outputs.tunnel_pid }}" 2>/dev/null || true
          fi

          # Remove the per-run Proxmox API token
          API_HOST="$API_HOST_IN"
          TOKEN_NAME="$TOKEN_NAME_IN"
          if [ -n "$API_HOST" ] && [ -n "$TOKEN_NAME" ]; then
            timeout 60 tsh ssh "teleport-production@${API_HOST}" -- \
              "sudo pveum user token remove ci@pve ${TOKEN_NAME} 2>/dev/null || true" || true
            echo "API token cleaned up"
          fi

          # Remove the temp SSH key from each node's root authorized_keys and
          # prove it is gone (exit 3 = still there -> red job). An unreachable
          # node is only a warning: the 24h age prune on the next run covers it.
          KEY_LEAKED=0
          if [ -n "${TMP_KEY_DATA:-}" ]; then
            read -r -a CLEANUP_HOSTS <<< "$TELEPORT_HOSTS"
            for HOST in "${CLEANUP_HOSTS[@]}"; do
              { printf 'DROP_KEY=%q\n' "$TMP_KEY_DATA"; cat /tmp/ak-edit.sh; } \
                | timeout 60 tsh ssh -i "$TELEPORT_IDENTITY_FILE" "teleport-production@${HOST}" "sudo bash -s"
              case $? in
                0) echo "Temp SSH key removed from ${HOST}" ;;
                3) echo "::error::temp SSH key STILL PRESENT on ${HOST} — standing root login left behind"; KEY_LEAKED=1 ;;
                *) echo "::warning::could not remove temp SSH key from ${HOST}; the next run prunes it after 24h" ;;
              esac
            done
          fi
          kill "${SSH_AGENT_PID:-}" 2>/dev/null || true

          # Kill all tunnels (node SSH proxied + node SSH direct + API)
          for PID in ${{ steps.ssh-tunnel.outputs.tunnel_pids }} ${{ steps.ssh-direct.outputs.tunnel_pids }} ${{ steps.api-tunnel.outputs.tunnel_pid }}; do
            kill "$PID" 2>/dev/null || true
          done
          rm -f /tmp/proxmox-key /tmp/proxmox-key.pub /tmp/ak-edit.sh
          [ "$KEY_LEAKED" = 0 ] || exit 1

      - name: Generate summary
        if: ${{ always() }}
        run: |
          {
            echo "## Terraform ${{ inputs.action }}"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| **Region** | ${{ inputs.region }} |"
            echo "| **Environment** | ${{ inputs.environment }} |"
            echo "| **Env dir** | \`terraform/environments/${{ inputs.env_dir != '' && inputs.env_dir || inputs.environment }}\` |"
            echo "| **Site** | ${{ inputs.site }} |"
            echo "| **Action** | ${{ inputs.action }} |"
            echo "| **Rolling** | ${{ inputs.rolling }} |"
            echo "| **Status** | ${{ job.status }} |"
            echo "| **Timestamp** | $(date -u) |"
          } >> "$GITHUB_STEP_SUMMARY"
