# maestra-io/github-actions/.github/workflows/ansible-run.yml
#
# Generic reusable Ansible runner. Covers EVERY consumer's run path:
#   - Teleport auth (dynamic version discovery + binary cache)
#   - Mitogen (Linux) OR linear/no-mitogen (Windows-over-SSH)
#   - Vault: none | public (vault.maestra.io direct, JWT) | tunnel (tbot app-tunnel -> 127.0.0.1:8200)
#   - Generic Vault secret map (multiline, passed straight to vault-action's `secrets:`)
#   - Optional proxmox pveum API-token mint/cleanup (input-gated; inert for the other 6 repos)
#   - No-hosts graceful-skip guard (sentinel log), log capture, artifact upload, step summary
#
# Path convention: `playbook` and `inventory` are relative to `working_directory`
# (the Execute step runs with working-directory = inputs.working_directory).
# `requirements_pip` / `requirements_galaxy` are workspace-root-relative (installed
# before we cd into working_directory).
name: Ansible Run (reusable)

on:
  workflow_call:
    inputs:
      # --- what to run ---------------------------------------------------
      playbook:
        description: "Playbook path relative to working_directory, e.g. playbooks/nat-gateway.yml"
        required: true
        type: string
      inventory:
        description: "Inventory path relative to working_directory (dynamic teleport script or static hosts.yml)"
        required: false
        type: string
        default: "inventory/teleport_inventory.py"
      working_directory:
        description: "Directory to run ansible from (holds ansible.cfg)"
        required: false
        type: string
        default: "ansible"
      # --- 3-axis targeting ----------------------------------------------
      region:
        required: true
        type: string
      environment:
        required: true
        type: string
      site:
        required: true
        type: string
      inventory_group_suffix:
        description: "Suffix appended to <region>_<env>_<site> to form the inventory group / --limit (e.g. _nat_gateway, _vpn, _sql, _dc, _haproxy_public). Empty = bare triple."
        required: false
        type: string
        default: ""
      host_limit:
        description: "Explicit --limit override; when set it wins over the computed group."
        required: false
        type: string
        default: ""
      tags:
        description: "Comma-separated ansible --tags"
        required: false
        type: string
        default: ""
      verbosity:
        description: "normal | -v | -vv | -vvv"
        required: false
        type: string
        default: "normal"
      check_mode:
        required: false
        type: boolean
        default: false
      # --- execution mode ------------------------------------------------
      use_mitogen:
        description: "Enable Mitogen linear strategy (Linux). Set false for Windows/PowerShell-over-SSH."
        required: false
        type: boolean
        default: true
      windows_mode:
        description: "Windows-over-SSH target: forces linear strategy + host_key_checking off."
        required: false
        type: boolean
        default: false
      # --- vault ---------------------------------------------------------
      vault_mode:
        description: "none | public | tunnel"
        required: false
        type: string
        default: "none"
      vault_addr:
        description: "Vault address (public mode: https://vault.maestra.io; tunnel mode: http://127.0.0.1:8200)"
        required: false
        type: string
        default: "https://vault.maestra.io"
      teleport_app:
        description: "Teleport app name for the tbot Vault tunnel (tunnel mode only, e.g. vault-omicron). Empty = no tunnel."
        required: false
        type: string
        default: ""
      concurrency_suffix:
        description: >-
          Appended to the concurrency group. Lets a caller opt out of the farm-wide
          mutating lane when its run is read-only in effect but does not use --check
          (the os-update `plan` job — command/shell/apt are SKIPPED under check mode,
          so its probes must run for real). Leave empty for anything that mutates.
        required: false
        type: string
        default: ""
      tbot_tunnels:
        description: >-
          Generic Teleport app tunnels for the play, one `app=<teleport-app> listen=<port>`
          per line. Starts a single tbot with N application-tunnel services and exports
          TUNNEL_<APP_UPPER_SNAKE>=http://127.0.0.1:<port> into the Execute env.
          Fails the job if a tunnel never opens — a play that silently loses its
          Alertmanager tunnel would drain and reboot a load balancer with no silences up.
          Independent of vault_mode (which keeps its own dedicated :8200 tunnel).
        required: false
        type: string
        default: ""
      aws_workload_identity:
        description: >-
          Mint a Teleport workload-identity JWT ON THE RUNNER and export
          AWS_WEB_IDENTITY_TOKEN_FILE + AWS_ROLE_ARN into the Execute env, so a play
          can call AWS as the CI principal instead of every target host needing its
          own AWS identity. Format:
          `name=<workload-identity> role_arn=<arn> [token=<provision-token>]`.
          `token=` defaults to teleport_join_token — but a workload identity is normally
          granted to a DEDICATED bot (so Route53 write does not follow from "can run
          ansible"), and that bot has its OWN provision token. Joining with the wrong
          one fails on permissions, not on syntax.
          Empty (default) skips the step entirely — inert for every existing caller.
          Written for os-update's Route53 drain: that flips a haproxy host's weighted
          record and used to run ON THE HOST with the host's tbot JWT, which only
          exists where certbot's tbot output does. It does not on the eu-omega CDP
          farm, so the drain could not run there at all.
        required: false
        type: string
        default: ""
      certificate_ttl:
        description: >-
          Teleport SSH certificate TTL. Must exceed the LONGEST expected play
          runtime: the cert is minted once at job start, and a run that
          outlives it dies mid-play with 'ssh: cert has expired' on every
          host at the same moment (bit mssql-maestra's fresh Windows installs
          at exactly 1h). Capped by the bot role's max_session_ttl.
        required: false
        type: string
        default: "1h"
      vault_role:
        description: "Vault JWT role name (auth method jwt-github)"
        required: false
        type: string
        default: ""
      vault_secrets:
        description: "Multiline map passed verbatim to hashicorp/vault-action `secrets:` (e.g. 'infrastructure/data/x field | ENV_NAME')"
        required: false
        type: string
        default: ""
      # --- proxmox-only optional pre-step (divergence class 1) -----------
      mint_proxmox_token:
        description: "Mint a per-run Proxmox pveum API token via tsh ssh (proxmox repo only)."
        required: false
        type: boolean
        default: false
      # --- misc ----------------------------------------------------------
      runs_on:
        description: >-
          Runner label for the job. Default is GitHub-hosted ubuntu-latest;
          pass a self-hosted ARC scale-set name (e.g. us-omicron-lw-runners)
          to run in-cluster. The ARC runner image is minimal but carries
          everything this workflow needs (jq/curl/git/python3/docker); note
          sudo is blocked there (no-new-privileges), so steps must not
          install system packages.
        required: false
        type: string
        default: "ubuntu-latest"
      extra_env:
        description: "Extra KEY=VALUE lines injected into the Execute step env (may reference secrets already exported to \\$GITHUB_ENV)."
        required: false
        type: string
        default: ""
      extra_run_args:
        description: "Extra args appended to ansible-playbook (e.g. -e vault_consul_template_token=... for haproxy CDP)."
        required: false
        type: string
        default: ""
      gh_environment:
        description: "GitHub Environment for the approval gate; empty = ungated."
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Name of the uploaded plan/apply log artifact."
        required: false
        type: string
        default: ""
      teleport_join_token:
        required: false
        type: string
        default: "github-actions-infra-deploy"
      teleport_fqdn:
        required: false
        type: string
        default: "teleport.maestra.io:443"
      python_version:
        required: false
        type: string
        default: "3.14"
      requirements_pip:
        required: false
        type: string
        default: "ansible/requirements-pip.txt"
      requirements_galaxy:
        required: false
        type: string
        default: "ansible/requirements.yml"
      no_hosts_fail_on_apply:
        description: "If true, an empty target group fails on apply (exit 1) but still skips on check_mode. mssql/ad want this."
        required: false
        type: boolean
        default: false
    secrets:
      # Optional GH-secret passthrough for repos that inject app creds into the run
      # (proxmox VECTOR_SIEM_*/PROXMOX_MONITORING_PASSWORD). Harmlessly empty elsewhere.
      VECTOR_SIEM_BASIC_AUTH_USER:
        required: false
      VECTOR_SIEM_BASIC_AUTH_PASSWORD:
        required: false
      PROXMOX_MONITORING_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write   # OIDC for Teleport join + Vault JWT

jobs:
  ansible:
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.gh_environment }}
    concurrency:
      # Two classes, deliberately NOT one group.
      #
      # MUTATING runs (deploys, os-update applies) share the farm group: they must
      # never interleave. A config deploy landing mid-drain would happily unmask the
      # keepalived/haproxy unit an os-update just masked to take the host out.
      #
      # READ-ONLY runs (--check: the PR plan matrix) get their own `-check` group.
      # They used to share the farm group, which meant any PR check — including the
      # three Renovate PRs that happen to be open on a Tuesday — would land in the
      # group and CANCEL a pending os-update job, because GitHub keeps at most one
      # pending job per group and evicts the older one. That is how run 29359006993
      # died. A read-only check has no reason to be exclusive with anything.
      #
      # concurrency_suffix is the escape hatch for a caller that needs its own lane
      # (the os-update `plan` job uses it: it runs with check_mode:false — command/
      # shell/apt are skipped under --check — so it is read-only in effect but cannot
      # be recognised as such from here).
      group: >-
        ansible-${{ inputs.region }}-${{ inputs.environment }}-${{ inputs.site }}${{ inputs.inventory_group_suffix }}${{ inputs.check_mode && '-check' || '' }}${{ inputs.concurrency_suffix }}
      cancel-in-progress: false
    env:
      ANSIBLE_FORCE_COLOR: "1"
      # All source repos ran with host key checking off: hosts are reached via
      # ephemeral tsh ProxyCommand and CI runners never hold host keys.
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_STRATEGY: ${{ (inputs.use_mitogen && !inputs.windows_mode) && 'mitogen_linear' || 'linear' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # TODO: SHA-pin via Renovate on landing

      - name: Set up Python
        uses: actions/setup-python@v6 # TODO: SHA-pin via Renovate on landing
        with:
          python-version: ${{ inputs.python_version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0 # TODO: SHA-pin via Renovate on landing
        with:
          enable-cache: true

      - name: Install ansible + pip requirements
        run: uv pip install --system -r "${{ inputs.requirements_pip }}"

      - name: Cache Ansible Galaxy collections
        uses: actions/cache@v6 # TODO: SHA-pin via Renovate on landing
        with:
          path: ~/.ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles(inputs.requirements_galaxy) }}

      - name: Install Galaxy collections/roles
        if: ${{ hashFiles(inputs.requirements_galaxy) != '' }}
        # From working_directory so ansible.cfg's roles_path/collections_path apply —
        # repos like vpn-maestra resolve roles from repo-relative paths, not ~/.ansible
        # (source repos all ran `cd ansible && ansible-galaxy install`). No `|| true`:
        # a galaxy failure must surface here, not later as "role not found".
        working-directory: ${{ inputs.working_directory }}
        run: ansible-galaxy install -r "${GITHUB_WORKSPACE}/${{ inputs.requirements_galaxy }}"

      - name: Get Teleport version from proxy
        id: tp-version
        # inputs go through env, never straight into the shell source: GitHub
        # substitutes ${{ }} BEFORE bash parses, so a quote in a caller-supplied
        # value would execute in this credentialed job.
        env:
          TELEPORT_FQDN: ${{ inputs.teleport_fqdn }}
        run: |
          VER="$(/usr/bin/curl -sf "https://${TELEPORT_FQDN}/webapi/find" \
            | jq -r '.auto_update.tools_version // .server_version')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        uses: actions/cache@v6 # TODO: SHA-pin via Renovate on landing
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ runner.os }}-${{ runner.arch }}-${{ steps.tp-version.outputs.version }}

      - name: Setup Teleport
        uses: teleport-actions/setup@v1 # TODO: SHA-pin via Renovate on landing
        with:
          version: ${{ steps.tp-version.outputs.version }}

      # teleport-actions/auth mints the certificate by running tbot, whose heartbeat
      # to the proxy intermittently fails ("keepalive ping failed to receive ACK
      # within timeout") and reds a whole run before a single task has executed.
      # The first attempt is therefore allowed to fail; the retry is the one that
      # decides the job. Both steps' outputs are read with `a || b` downstream —
      # exactly one of them produces an identity.
      - name: Teleport auth (SSH)
        id: teleport-auth
        continue-on-error: true
        uses: teleport-actions/auth@v2 # TODO: SHA-pin via Renovate on landing
        with:
          proxy: ${{ inputs.teleport_fqdn }}
          token: ${{ inputs.teleport_join_token }}
          certificate-ttl: ${{ inputs.certificate_ttl }}

      - name: Teleport auth (SSH) — retry
        id: teleport-auth-retry
        if: steps.teleport-auth.outcome == 'failure'
        uses: teleport-actions/auth@v2 # TODO: SHA-pin via Renovate on landing
        with:
          proxy: ${{ inputs.teleport_fqdn }}
          token: ${{ inputs.teleport_join_token }}
          certificate-ttl: ${{ inputs.certificate_ttl }}

      # --- Mitogen (Linux only) ------------------------------------------
      - name: Configure Mitogen strategy plugin
        if: ${{ inputs.use_mitogen && !inputs.windows_mode }}
        run: |
          PLUGINS="$(python3 -c 'import ansible_mitogen, os; print(os.path.join(ansible_mitogen.__path__[0], "plugins", "strategy"))')"
          echo "ANSIBLE_STRATEGY_PLUGINS=${PLUGINS}" >> "$GITHUB_ENV"

      # --- Vault: tunnel mode (mssql/ad omicron) -------------------------
      - name: Start Vault tunnel via Teleport
        id: vault-tunnel
        if: ${{ inputs.vault_mode == 'tunnel' && inputs.teleport_app != '' }}
        # See the tp-version step: inputs reach the shell through env only.
        env:
          TELEPORT_FQDN: ${{ inputs.teleport_fqdn }}
          TELEPORT_JOIN_TOKEN: ${{ inputs.teleport_join_token }}
        run: |
          cat > /tmp/tbot-vault-config.yaml <<EOF
          version: v2
          onboarding:
            join_method: github
            token: ${TELEPORT_JOIN_TOKEN}
          proxy_server: ${TELEPORT_FQDN}
          # memory storage: default /var/lib/teleport is not writable on hosted
          # runners (mkdir: permission denied -> tunnel never opens).
          storage:
            type: memory
          services:
            - type: application-tunnel
              app_name: ${{ inputs.teleport_app }}
              listen: tcp://127.0.0.1:8200
          EOF
          tbot start -c /tmp/tbot-vault-config.yaml &
          echo "tunnel_pid=$!" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 15); do
            (echo > /dev/tcp/127.0.0.1/8200) >/dev/null 2>&1 && break
            sleep 1
          done

      # --- Generic Teleport app tunnels (os-update: Alertmanager) --------
      - name: Start Teleport app tunnels
        id: app-tunnels
        if: ${{ inputs.tbot_tunnels != '' }}
        env:
          TBOT_TUNNELS: ${{ inputs.tbot_tunnels }}
          TELEPORT_FQDN: ${{ inputs.teleport_fqdn }}
          TELEPORT_JOIN_TOKEN: ${{ inputs.teleport_join_token }}
        run: |
          set -euo pipefail
          {
            echo "version: v2"
            echo "proxy_server: ${TELEPORT_FQDN}"
            echo "onboarding:"
            echo "  join_method: github"
            echo "  token: ${TELEPORT_JOIN_TOKEN}"
            # memory storage: /var/lib/teleport is not writable on hosted runners.
            echo "storage:"
            echo "  type: memory"
            echo "services:"
          } > /tmp/tbot-apps.yaml

          PAIRS=""
          while IFS= read -r line; do
            [ -z "${line// /}" ] && continue
            app="$(printf '%s' "$line" | sed -n 's/.*app=\([^ ]*\).*/\1/p')"
            port="$(printf '%s' "$line" | sed -n 's/.*listen=\([0-9]*\).*/\1/p')"
            if [ -z "$app" ] || [ -z "$port" ]; then
              echo "::error::malformed tbot_tunnels line (want 'app=<name> listen=<port>'): $line"
              exit 1
            fi
            {
              echo "  - type: application-tunnel"
              echo "    app_name: ${app}"
              echo "    listen: tcp://127.0.0.1:${port}"
            } >> /tmp/tbot-apps.yaml
            PAIRS="${PAIRS} ${app}:${port}"
          done <<< "${TBOT_TUNNELS}"

          tbot start -c /tmp/tbot-apps.yaml &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

          for pair in ${PAIRS}; do
            app="${pair%%:*}"; port="${pair##*:}"
            opened=0
            for _ in $(seq 1 30); do
              if (exec 3<>/dev/tcp/127.0.0.1/"${port}") 2>/dev/null; then opened=1; break; fi
              sleep 1
            done
            # FAIL CLOSED. No tunnel -> no silences -> we would page Rootly for every
            # host we reboot, and the "is anyone else drained" interlock would be blind.
            if [ "${opened}" != 1 ]; then
              echo "::error::tbot tunnel for app '${app}' never opened on 127.0.0.1:${port}"
              exit 1
            fi
            slug="$(printf '%s' "${app}" | tr 'a-z-' 'A-Z_')"
            echo "TUNNEL_${slug}=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
            echo "tunnel for ${app} is up on 127.0.0.1:${port}"
          done

      # --- Teleport workload identity -> AWS (os-update: the Route53 drain) ---
      # Same shape as the app-tunnels step above: write a tbot config, join with the
      # repo's GitHub-OIDC token, run tbot. Here the service is workload-identity-jwt,
      # which writes a SPIFFE JWT the AWS SDK exchanges for a role via
      # sts:AssumeRoleWithWebIdentity — the identity lives with the JOB, not with
      # every host it touches.
      #
      # `audiences` is a LIST and the key is plural; the singular `audience` is the
      # CLI flag, not the config field. Taken from the AWS-OIDC-federation page of
      # the Teleport docs rather than from memory.
      - name: Mint a workload-identity JWT for AWS
        id: aws-wi
        if: ${{ inputs.aws_workload_identity != '' }}
        env:
          AWS_WI: ${{ inputs.aws_workload_identity }}
          TELEPORT_FQDN: ${{ inputs.teleport_fqdn }}
          TELEPORT_JOIN_TOKEN: ${{ inputs.teleport_join_token }}
        run: |
          set -euo pipefail
          name="$(printf '%s' "$AWS_WI" | sed -n 's/.*name=\([^ ]*\).*/\1/p')"
          role="$(printf '%s' "$AWS_WI" | sed -n 's/.*role_arn=\([^ ]*\).*/\1/p')"
          # The identity's own bot, when it has one; else the SSH join token.
          wi_token="$(printf '%s' "$AWS_WI" | sed -n 's/.*token=\([^ ]*\).*/\1/p')"
          [ -n "$wi_token" ] || wi_token="${TELEPORT_JOIN_TOKEN}"
          if [ -z "$name" ] || [ -z "$role" ]; then
            echo "::error::malformed aws_workload_identity (want 'name=<wi> role_arn=<arn>'): ${AWS_WI}"
            exit 1
          fi

          mkdir -p /tmp/tbot-wi
          {
            echo "version: v2"
            echo "proxy_server: ${TELEPORT_FQDN}"
            echo "onboarding:"
            echo "  join_method: github"
            echo "  token: ${wi_token}"
            echo "storage:"
            echo "  type: memory"
            echo "services:"
            echo "  - type: workload-identity-jwt"
            echo "    selector:"
            echo "      name: ${name}"
            echo "    audiences: ['sts.amazonaws.com']"
            echo "    destination:"
            echo "      type: directory"
            echo "      path: /tmp/tbot-wi"
          } > /tmp/tbot-wi.yaml

          tbot start -c /tmp/tbot-wi.yaml --oneshot

          # FAIL CLOSED, like the tunnel step: a play that believes it has AWS creds
          # and does not would drain a host and then fail to withdraw it from DNS.
          if [ ! -s /tmp/tbot-wi/jwt_svid ]; then
            echo "::error::tbot produced no JWT SVID at /tmp/tbot-wi/jwt_svid for workload identity '${name}'"
            ls -la /tmp/tbot-wi || true
            exit 1
          fi

          echo "AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-wi/jwt_svid" >> "$GITHUB_ENV"
          echo "AWS_ROLE_ARN=${role}" >> "$GITHUB_ENV"
          echo "workload identity '${name}' minted via token '${wi_token}'; AWS role ${role}"

      # --- Vault: fetch secrets (public OR tunnel) -----------------------
      - name: Retrieve secrets from Vault
        if: ${{ inputs.vault_mode != 'none' && inputs.vault_secrets != '' }}
        uses: hashicorp/vault-action@v4 # TODO: SHA-pin via Renovate on landing
        with:
          url: ${{ inputs.vault_addr }}
          method: jwt
          path: jwt-github
          role: ${{ inputs.vault_role }}
          jwtGithubAudience: https://github.com/maestra-io
          exportEnv: true
          secrets: ${{ inputs.vault_secrets }}

      # --- Proxmox pveum token (divergence class 1, input-gated) ---------
      - name: Mint Proxmox API token
        id: mint-proxmox
        if: ${{ inputs.mint_proxmox_token }}
        env:
          TELEPORT_IDENTITY_FILE: ${{ steps.teleport-auth.outputs.identity-file || steps.teleport-auth-retry.outputs.identity-file }}
          TELEPORT_PROXY: ${{ inputs.teleport_fqdn }}
        run: |
          set -euo pipefail
          # Pick a candidate proxmox node in this region/env/site and mint a github-ci token.
          NODES="$(tsh ls --format=names \
            "role=proxmox,region=${{ inputs.region }},environment=${{ inputs.environment }},site=${{ inputs.site }}" || true)"
          TOKEN_VALUE=""
          TOKEN_NODE=""
          for NODE in $(echo "$NODES" | shuf); do
            OUT="$(timeout 30 tsh ssh --login=teleport-production "$NODE" '
              sudo pveum user add ansible-ci@pve 2>/dev/null || true
              sudo pveum acl modify / -user ansible-ci@pve -role Administrator
              sudo pveum user token remove ansible-ci@pve github-ci 2>/dev/null || true
              sudo pveum user token add ansible-ci@pve github-ci --privsep=0 --output-format=json
            ' 2>/dev/null || true)"
            TOKEN="$(echo "$OUT" | jq -r '.value // empty' 2>/dev/null || true)"
            if [ -n "$TOKEN" ]; then
              TOKEN_VALUE="$TOKEN"
              TOKEN_NODE="$NODE"
              break
            fi
          done
          if [ -z "$TOKEN_VALUE" ]; then
            echo "::error::Failed to mint Proxmox token on any candidate node"
            exit 1
          fi
          echo "::add-mask::$TOKEN_VALUE"
          echo "PROXMOX_API_TOKEN_SECRET=$TOKEN_VALUE" >> "$GITHUB_ENV"
          echo "node=$TOKEN_NODE" >> "$GITHUB_OUTPUT"

      # --- Execute -------------------------------------------------------
      - name: Execute Ansible
        id: execute
        working-directory: ${{ inputs.working_directory }}
        env:
          # Teleport identity for the dynamic inventory + tsh ProxyCommand:
          # teleport_inventory.py reads TELEPORT_PROXY (tsh ls / cluster name) and
          # TBOT_DEST_DIR (IdentityFile/CertificateFile ssh args); tsh reads
          # TELEPORT_IDENTITY_FILE automatically. Without these, SSH auth fails.
          TELEPORT_IDENTITY_FILE: ${{ steps.teleport-auth.outputs.identity-file || steps.teleport-auth-retry.outputs.identity-file }}
          TBOT_DEST_DIR: ${{ steps.teleport-auth.outputs.destination-dir || steps.teleport-auth-retry.outputs.destination-dir }}
          TELEPORT_PROXY: ${{ inputs.teleport_fqdn }}
          # optional app-cred passthroughs (empty for repos that don't set them)
          VECTOR_SIEM_BASIC_AUTH_USER: ${{ secrets.VECTOR_SIEM_BASIC_AUTH_USER }}
          VECTOR_SIEM_BASIC_AUTH_PASSWORD: ${{ secrets.VECTOR_SIEM_BASIC_AUTH_PASSWORD }}
          PROXMOX_MONITORING_PASSWORD: ${{ secrets.PROXMOX_MONITORING_PASSWORD }}
          # Token for `gh` CLI tasks (e.g. `gh release download` from a private
          # repo). It MUST be set here in the reusable's own context, where
          # github.token is populated. A caller cannot forward it: github.token
          # (and secrets.*) resolve to EMPTY inside a reusable-workflow `with:`
          # input, so forwarding it through `extra_env` shipped an empty value
          # and `gh` ran unauthenticated (rc=4).
          GH_TOKEN: ${{ github.token }}
          # Free-text dispatch inputs reach the shell via env, not ${{ }}
          # interpolation: an interpolated value is pasted into the script
          # BEFORE bash parses it, so `x; rm -rf /` in host_limit would run.
          # An env var is data, never code.
          HOST_LIMIT_INPUT: ${{ inputs.host_limit }}
          TAGS_INPUT: ${{ inputs.tags }}
        run: |
          set -uo pipefail

          # inject caller-provided extra env
          if [ -n "${{ inputs.extra_env }}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              # skip a KEY= line with an empty value so it can't clobber a real
              # step-env value (e.g. a caller forwarding an empty github.token)
              case "$line" in *=) continue ;; esac
              export "$line"
            done <<< "${{ inputs.extra_env }}"
          fi

          # check-mode display trim (matches source repos: hide ok/skipped hosts in plans)
          if [ "${{ inputs.check_mode }}" = "true" ]; then
            export ANSIBLE_DISPLAY_OK_HOSTS=false
            export ANSIBLE_DISPLAY_SKIPPED_HOSTS=false
          fi

          # compute target group / --limit
          LIMIT="${HOST_LIMIT_INPUT}"
          if [ -z "$LIMIT" ]; then
            LIMIT="${{ inputs.region }}_${{ inputs.environment }}_${{ inputs.site }}${{ inputs.inventory_group_suffix }}"
          fi
          # ansible --limit patterns are [a-zA-Z0-9_.,:*!&-] — anything else in a
          # dispatch input is not a host pattern, it is an attempt at the shell.
          case "$LIMIT" in
            *[!a-zA-Z0-9_.,:*!\&-]*)
              echo "::error::host_limit contains characters that are not a valid ansible limit pattern: ${LIMIT}"
              exit 1 ;;
          esac

          # verbosity
          VERB="${{ inputs.verbosity }}"
          [ "$VERB" = "normal" ] && VERB=""

          # tags / check
          # ansible tags are [a-zA-Z0-9_,-] — same rule as LIMIT above.
          case "$TAGS_INPUT" in
            *[!a-zA-Z0-9_,-]*)
              echo "::error::tags contains characters that are not a valid ansible tag list: ${TAGS_INPUT}"
              exit 1 ;;
          esac
          TAGS_ARG=""; [ -n "${TAGS_INPUT}" ] && TAGS_ARG="--tags ${TAGS_INPUT}"
          CHECK_ARG=""; [ "${{ inputs.check_mode }}" = "true" ] && CHECK_ARG="--check --diff"

          MODE="apply"; [ "${{ inputs.check_mode }}" = "true" ] && MODE="plan"
          SAFE_NAME="${{ inputs.region }}-${{ inputs.environment }}-${{ inputs.site }}${{ inputs.inventory_group_suffix }}"
          mkdir -p "${{ github.workspace }}/logs"
          LOG_FILE="${{ github.workspace }}/logs/${MODE}-${SAFE_NAME}.log"
          echo "log_file=${LOG_FILE}" >> "$GITHUB_OUTPUT"

          COMMON="-i ${{ inputs.inventory }} --limit ${LIMIT} ${TAGS_ARG} ${VERB} ${{ inputs.extra_run_args }}"

          # no-hosts pre-flight guard
          ansible-playbook ${{ inputs.playbook }} ${COMMON} --list-hosts > /tmp/list-hosts.txt 2>&1 || true
          if grep -qiE 'no hosts (matched|to target)' /tmp/list-hosts.txt; then
            echo "No hosts matched" | tee -a "$LOG_FILE"
            if [ "${{ inputs.no_hosts_fail_on_apply }}" = "true" ] && [ "${{ inputs.check_mode }}" != "true" ]; then
              exit 1
            fi
            exit 0
          fi

          set -o pipefail
          ansible-playbook ${{ inputs.playbook }} ${COMMON} ${CHECK_ARG} 2>&1 | tee -a "$LOG_FILE"

      # --- Vault tunnel teardown -----------------------------------------
      - name: Stop Vault tunnel
        if: ${{ always() && inputs.vault_mode == 'tunnel' && steps.vault-tunnel.outputs.tunnel_pid != '' }}
        run: kill "${{ steps.vault-tunnel.outputs.tunnel_pid }}" || true

      - name: Stop Teleport app tunnels
        if: ${{ always() && steps.app-tunnels.outputs.pid != '' }}
        run: kill "${{ steps.app-tunnels.outputs.pid }}" || true

      # --- Proxmox token cleanup -----------------------------------------
      - name: Cleanup Proxmox API token
        if: ${{ always() && inputs.mint_proxmox_token && steps.mint-proxmox.outputs.node != '' }}
        run: |
          timeout 30 tsh ssh --login=teleport-production "${{ steps.mint-proxmox.outputs.node }}" \
            'sudo pveum user token remove ansible-ci@pve github-ci' || true

      - name: Generate summary
        if: ${{ always() }}
        run: |
          {
            echo "### Ansible ${{ inputs.check_mode && 'plan (check)' || 'apply' }} — ${{ inputs.region }}-${{ inputs.environment }}-${{ inputs.site }}${{ inputs.inventory_group_suffix }}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| playbook | \`${{ inputs.playbook }}\` |"
            echo "| limit | \`${{ inputs.host_limit || format('{0}_{1}_{2}{3}', inputs.region, inputs.environment, inputs.site, inputs.inventory_group_suffix) }}\` |"
            echo "| tags | \`${{ inputs.tags }}\` |"
            echo "| check_mode | ${{ inputs.check_mode }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7 # TODO: SHA-pin via Renovate on landing
        with:
          name: ${{ inputs.artifact_name != '' && inputs.artifact_name || format('ansible-check-{0}-{1}-{2}{3}', inputs.region, inputs.environment, inputs.site, inputs.inventory_group_suffix) }}
          path: logs/
          if-no-files-found: warn
