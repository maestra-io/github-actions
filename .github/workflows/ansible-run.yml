# maestra-io/github-actions/.github/workflows/ansible-run.yml
#
# Generic reusable Ansible runner. Covers EVERY consumer's run path:
#   - Teleport auth (dynamic version discovery + binary cache)
#   - Mitogen (Linux) OR linear/no-mitogen (Windows-over-SSH)
#   - Vault: none | public (vault.maestra.io direct, JWT) | tunnel (tbot app-tunnel -> 127.0.0.1:8200)
#   - Generic Vault secret map (multiline, passed straight to vault-action's `secrets:`)
#   - Optional proxmox pveum API-token mint/cleanup (input-gated; inert for the other 6 repos);
#     on pull_request a PVEAuditor token comes from the cluster Vault's proxmox engine instead
#   - No-hosts graceful-skip guard (sentinel log), log capture, artifact upload, step summary
#
# Path convention: `playbook` and `inventory` are relative to `working_directory`
# (the Execute step runs with working-directory = inputs.working_directory).
# `uv_project` / `requirements_galaxy` are workspace-root-relative (installed
# before we cd into working_directory).
name: Ansible Run (reusable)

on:
  workflow_call:
    inputs:
      # --- what to run ---------------------------------------------------
      playbook:
        description: "Playbook path relative to working_directory, e.g. playbooks/nat-gateway.yml"
        required: true
        type: string
      inventory:
        description: "Inventory path relative to working_directory (dynamic teleport script or static hosts.yml)"
        required: false
        type: string
        default: "inventory/teleport_inventory.py"
      working_directory:
        description: "Directory to run ansible from (holds ansible.cfg)"
        required: false
        type: string
        default: "ansible"
      # --- 3-axis targeting ----------------------------------------------
      region:
        required: true
        type: string
      environment:
        required: true
        type: string
      site:
        required: true
        type: string
      inventory_group_suffix:
        description: "Suffix appended to <region>_<env>_<site> to form the inventory group / --limit (e.g. _nat_gateway, _vpn, _sql, _dc, _haproxy_public). Empty = bare triple."
        required: false
        type: string
        default: ""
      host_limit:
        description: "Explicit --limit override; when set it wins over the computed group."
        required: false
        type: string
        default: ""
      tags:
        description: "Comma-separated ansible --tags"
        required: false
        type: string
        default: ""
      verbosity:
        description: "normal | -v | -vv | -vvv"
        required: false
        type: string
        default: "normal"
      check_mode:
        required: false
        type: boolean
        default: false
      checkout_ref:
        description: "Git ref to check out and run instead of the caller's commit (empty = the caller's commit). Lets a caller run a check-mode plan of an older commit, e.g. a drift check of github.event.before before an apply. That commit must carry uv_project/uv.lock: a commit older than its repo's uv migration fails the install step."
        required: false
        type: string
        default: ""
      refuse_ancestor_of_branch_tip:
        description: >-
          Fail before any play when github.sha is a strict ancestor of the current
          tip of github.ref (and when github.ref is not a branch), so a re-run of an
          old caller run does not apply its older commit over a newer one (asbo
          Deploy 44521282714 re-run, 19.11.2026). Uses git with contents: read only.
          A sha equal to the tip, newer, or diverged passes. Off by default.
        required: false
        type: boolean
        default: false
      allow_rollback:
        description: "With refuse_ancestor_of_branch_tip: run anyway (a warning instead of the failure), for a deliberate rollback."
        required: false
        type: boolean
        default: false
      # --- execution mode ------------------------------------------------
      use_mitogen:
        description: "Enable Mitogen linear strategy (Linux). Set false for Windows/PowerShell-over-SSH."
        required: false
        type: boolean
        default: true
      windows_mode:
        description: "Windows-over-SSH target: forces linear strategy + host_key_checking off."
        required: false
        type: boolean
        default: false
      # --- vault ---------------------------------------------------------
      vault_mode:
        description: "none | public | tunnel"
        required: false
        type: string
        default: "none"
      vault_addr:
        description: "Vault address (public mode: https://vault.maestra.io; tunnel mode: http://127.0.0.1:8200)"
        required: false
        type: string
        default: "https://vault.maestra.io"
      teleport_app:
        description: "Teleport app name for the tbot Vault tunnel (tunnel mode only, e.g. vault-omicron). Empty = no tunnel."
        required: false
        type: string
        default: ""
      concurrency_suffix:
        description: >-
          Appended to the concurrency group. Lets a caller opt out of the farm-wide
          mutating lane when its run is read-only in effect but does not use --check
          (the os-update `plan` job — command/shell/apt are SKIPPED under check mode,
          so its probes must run for real). Leave empty for anything that mutates.
        required: false
        type: string
        default: ""
      tbot_tunnels:
        description: >-
          Generic Teleport app tunnels for the play, one `app=<teleport-app> listen=<port>`
          per line. Starts a single tbot with N application-tunnel services and exports
          TUNNEL_<APP_UPPER_SNAKE>=http://127.0.0.1:<port> into the Execute env.
          Fails the job if a tunnel never opens — a play that silently loses its
          Alertmanager tunnel would drain and reboot a load balancer with no silences up.
          Independent of vault_mode (which keeps its own dedicated :8200 tunnel).
        required: false
        type: string
        default: ""
      aws_workload_identity:
        description: >-
          Mint a Teleport workload-identity JWT ON THE RUNNER and export
          AWS_WEB_IDENTITY_TOKEN_FILE + AWS_ROLE_ARN into the Execute env, so a play
          can call AWS as the CI principal instead of every target host needing its
          own AWS identity. Format:
          `name=<workload-identity> role_arn=<arn> [token=<provision-token>]`.
          `token=` defaults to teleport_join_token — but a workload identity is normally
          granted to a DEDICATED bot (so Route53 write does not follow from "can run
          ansible"), and that bot has its OWN provision token. Joining with the wrong
          one fails on permissions, not on syntax.
          Empty (default) skips the step entirely — inert for every existing caller.
          Written for os-update's Route53 drain: that flips a haproxy host's weighted
          record and used to run ON THE HOST with the host's tbot JWT, which only
          exists where certbot's tbot output does. It does not on the eu-omega CDP
          farm, so the drain could not run there at all.
        required: false
        type: string
        default: ""
      certificate_ttl:
        description: >-
          Teleport SSH certificate TTL. Must exceed the LONGEST expected play
          runtime: the cert is minted once at job start, and a run that
          outlives it dies mid-play with 'ssh: cert has expired' on every
          host at the same moment (bit mssql-maestra's fresh Windows installs
          at exactly 1h). Capped by the bot role's max_session_ttl.
        required: false
        type: string
        default: "1h"
      vault_role:
        description: "Vault JWT role name (auth method jwt-github)"
        required: false
        type: string
        default: ""
      vault_secrets:
        description: "Multiline map passed verbatim to hashicorp/vault-action `secrets:` (e.g. 'infrastructure/data/x field | ENV_NAME')"
        required: false
        type: string
        default: ""
      # --- optional SECOND Vault source -----------------------------------
      # One connection cannot serve a secret that is deliberately fleet-wide when
      # every other secret in the run is per-contour. The break-glass domain
      # Administrator password is exactly that: its rotation runs from a domain
      # controller, which can reach https://vault.maestra.io and NOTHING else --
      # the in-cluster Vaults publish only /sys/health through their Teleport app
      # and answer 302 to every real call (measured 2026-08-28) -- so the value
      # lives on the public Vault under a per-domain field while the run's other
      # secrets keep coming from the contour's own Vault.
      #
      # Empty by default and gated on vault2_secrets, so no existing caller
      # changes behaviour.
      vault2_addr:
        description: "Second Vault address for vault2_secrets (e.g. https://vault.maestra.io). Falls back to vault_addr when empty."
        required: false
        type: string
        default: ""
      vault2_role:
        description: "Vault JWT role for the second source (auth method jwt-github). Falls back to vault_role when empty."
        required: false
        type: string
        default: ""
      vault2_secrets:
        description: "Second secret map, same syntax as vault_secrets. Empty disables the second fetch entirely."
        required: false
        type: string
        default: ""
      # --- proxmox-only optional pre-step (divergence class 1) -----------
      mint_proxmox_token:
        description: >-
          Proxmox API token for the play (proxmox repo only). push/dispatch: a
          per-run token of ci-plan@pve (PVEAuditor) minted with sudo pveum;
          the play reads through it and writes with pvesh as root.
          pull_request: nothing is minted with sudo; a PVEAuditor token of
          ci-plan@pve comes from the cluster Vault's proxmox secrets engine
          (proxmox_engine_vault_app, required on pull_request).
        required: false
        type: boolean
        default: false
      proxmox_engine_vault_app:
        description: >-
          pull_request with mint_proxmox_token: Teleport app of the cluster Vault
          whose proxmox secrets engine mints the check run's PVEAuditor token
          (role ci-plan, read as jwt-github role pve-ci-plan-<repo>-github-ci
          through a tbot tunnel). Required on pull_request. push / dispatch
          always mint with sudo pveum: the proxmox deploy sets the engine up
          and must not depend on it.
        required: false
        type: string
        default: ""
      # --- misc ----------------------------------------------------------
      runs_on:
        description: >-
          Runner label for the job. Default is RunsOn t3a-small (AWS,
          issues-maestra#1556; formerly GitHub-hosted ubuntu-latest);
          pass a self-hosted ARC scale-set name (e.g. us-omicron-lw-runners)
          to run in-cluster. The ARC runner image is minimal but carries
          everything this workflow needs (jq/curl/git/python3/docker); note
          sudo is blocked there (no-new-privileges), so steps must not
          install system packages.
        required: false
        type: string
        default: "runs-on=${{ github.run_id }}/runner=t3a-small"
      timeout_minutes:
        description: >-
          Job timeout. Without one a wedged job holds its concurrency group for
          GitHub's 6 h (asbo Deploy 44524806886 hung 50 min). Default 60: the
          longest of 180 green jobs of this workflow in the callers since
          20.10.2026 took 34.4 min (mssql-maestra OS Update; p95 24.2 min).
          A caller that knows its play is short passes a tighter bound.
        required: false
        type: number
        default: 60
      vault_export_token:
        description: "Also export the Vault token of the primary fetch as VAULT_TOKEN (and vault_addr as VAULT_ADDR) to the Execute step, for plays that write to Vault themselves (active-directory-maestra kerberos auth config, issues-maestra#1432). The token lives as long as the role's token_ttl; size that in vault-server values."
        required: false
        type: boolean
        default: false
      extra_env:
        description: "Extra KEY=VALUE lines injected into the Execute step env (may reference secrets already exported to \\$GITHUB_ENV)."
        required: false
        type: string
        default: ""
      extra_run_args:
        description: "Extra args appended to ansible-playbook (e.g. -e vault_consul_template_token=... for haproxy CDP)."
        required: false
        type: string
        default: ""
      gh_environment:
        description: "GitHub Environment for the approval gate; empty = ungated."
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Name of the uploaded plan/apply log artifact."
        required: false
        type: string
        default: ""
      summary_grep:
        description: "Extended regex; every debug `msg` in the run log that matches it is copied into the job summary. Empty = none."
        required: false
        type: string
        default: ""
      teleport_join_token:
        required: false
        type: string
        default: "github-actions-infra-deploy"
      teleport_fqdn:
        required: false
        type: string
        default: "teleport.maestra.io:443"
      teleport_avoid_host:
        description: >-
          A Teleport node this job must not route through. Before the play, the
          runner pins the proxy FQDN in /etc/hosts to its A records MINUS this
          host's own addresses, so every tsh/tbot dial lands on a proxy that is not
          on it. A no-op when no proxy address belongs to the host. os-update sets
          it to the target: on us-iota the proxies run hostNetwork ON the nodes it
          drains and reboots. Empty = DNS as is.
        required: false
        type: string
        default: ""
      python_version:
        required: false
        type: string
        default: "3.14"
      uv_project:
        description: >-
          Directory (workspace-relative) of the caller's pyproject.toml + uv.lock
          (next to ansible.cfg, so ansible/** path filters see a toolchain bump):
          the Ansible toolchain as `[project].dependencies`, nora as the only index
          (`[[tool.uv.index]] name = "maestra"`, default = true; issues-maestra#1649).
        required: false
        type: string
        default: "ansible"
      requirements_pip:
        description: "Deprecated and ignored (issues-maestra#1649): Python packages come from uv_project's uv.lock only. Kept so a caller that still passes it does not break."
        required: false
        type: string
        default: ""
      requirements_galaxy:
        required: false
        type: string
        default: "ansible/requirements.yml"
      no_hosts_fail_on_apply:
        description: "If true, an empty target group fails on apply (exit 1) but still skips on check_mode. mssql/ad want this."
        required: false
        type: boolean
        default: false
    secrets:
      # Optional GH-secret passthrough for repos that inject app creds into the run
      # (proxmox VECTOR_SIEM_*/PROXMOX_MONITORING_PASSWORD). Harmlessly empty elsewhere.
      VECTOR_SIEM_BASIC_AUTH_USER:
        required: false
      VECTOR_SIEM_BASIC_AUTH_PASSWORD:
        required: false
      PROXMOX_MONITORING_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write   # OIDC for Teleport join + Vault JWT

jobs:
  ansible:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.gh_environment }}
    concurrency:
      # Two classes, deliberately NOT one group.
      #
      # MUTATING runs (deploys, os-update applies) share the farm group: they must
      # never interleave. A config deploy landing mid-drain would happily unmask the
      # keepalived/haproxy unit an os-update just masked to take the host out.
      #
      # READ-ONLY runs (--check: the PR plan matrix) get their own `-check` group.
      # They used to share the farm group, which meant any PR check — including the
      # three Renovate PRs that happen to be open on a Tuesday — would land in the
      # group and CANCEL a pending os-update job, because GitHub keeps at most one
      # pending job per group and evicts the older one. That is how run 29359006993
      # died. A read-only check has no reason to be exclusive with anything.
      #
      # concurrency_suffix is the escape hatch for a caller that needs its own lane
      # (the os-update `plan` job uses it: it runs with check_mode:false — command/
      # shell/apt are skipped under --check — so it is read-only in effect but cannot
      # be recognised as such from here).
      group: >-
        ansible-${{ inputs.region }}-${{ inputs.environment }}-${{ inputs.site }}${{ inputs.inventory_group_suffix }}${{ inputs.check_mode && '-check' || '' }}${{ inputs.concurrency_suffix }}
      cancel-in-progress: false
    env:
      ANSIBLE_FORCE_COLOR: "1"
      # All source repos ran with host key checking off: hosts are reached via
      # ephemeral tsh ProxyCommand and CI runners never hold host keys.
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_STRATEGY: ${{ (inputs.use_mitogen && !inputs.windows_mode) && 'mitogen_linear' || 'linear' }}
    steps:
      # No-op off RunsOn (exits when RUNS_ON_RUNNER_NAME is unset), so ARC rows are unaffected.
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty = actions/checkout's default (the caller's commit).
          ref: ${{ inputs.checkout_ref }}

      # A caller cannot add a step to this job, and reading its last successful run
      # needs actions: read, which the callers do not grant; the branch tip needs
      # only the clone. First, so a refused run touches nothing.
      - name: Refuse an ancestor of the branch tip
        if: inputs.refuse_ancestor_of_branch_tip
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
        run: |
          set -uo pipefail
          # >>> refuse-ancestor (ansible/tests/test-refuse-ancestor.sh runs this block)
          refuse_ancestor() { # <sha> <ref> <allow_rollback>; cwd: a clone with remote origin
            local sha=$1 ref=$2 allow=$3 branch tip rc unshallow=
            case $ref in
              refs/heads/*) branch=${ref#refs/heads/} ;;
              *)
                [ "$allow" = true ] && { echo "::warning::$ref is not a branch; running $sha anyway (allow_rollback)"; return 0; }
                echo "::error::$ref is not a branch: no tip to compare $sha with"; return 1 ;;
            esac
            # The checkout is shallow; ancestry needs the history of both commits.
            [ "$(git rev-parse --is-shallow-repository)" = true ] && unshallow=--unshallow
            git fetch --no-tags --quiet $unshallow origin "$sha" "+refs/heads/$branch:refs/remotes/origin/$branch" ||
              { echo "::error::could not fetch $sha and the tip of $branch"; return 1; }
            tip=$(git rev-parse "refs/remotes/origin/$branch") || return 1
            if [ "$sha" = "$tip" ]; then echo "$sha is the tip of $branch"; return 0; fi
            git merge-base --is-ancestor "$sha" "$tip"; rc=$?
            case $rc in
              0)
                if [ "$allow" = true ]; then
                  echo "::warning::rolling back: $sha is older than the tip of $branch ($tip), allow_rollback=true"; return 0
                fi
                echo "::error::refusing to run $sha: it is older than the tip of $branch ($tip). A re-run of an old run? Start a new run from $branch, or pass allow_rollback."
                return 1 ;;
              1) echo "$sha is not an ancestor of the tip of $branch ($tip): newer or diverged, running it"; return 0 ;;
              *) echo "::error::git merge-base failed ($rc) for $sha and $tip"; return 1 ;;
            esac
          }
          # <<< refuse-ancestor
          refuse_ancestor "$SHA" "$REF" "$ALLOW_ROLLBACK"

      - name: Set up Python
        uses: maestra-io/github-actions/setup-python-nora@9b8a76b44a7333893fb2f995ab1afdcfb179ba59 # v1.106.5
        with:
          python-version: ${{ inputs.python_version }}

      # --- retry-once, and ONLY on the steps that dial the internet -----------
      # Every step from here to "Execute Ansible" is setup: it fetches a tool or
      # opens a tunnel, and it can fail for reasons that have nothing to do with
      # the change under test. Those steps get one retry. "Execute Ansible" and
      # everything downstream deliberately do NOT: a play that failed is the
      # answer this workflow exists to give, and re-running it until it passes
      # is how a check stops meaning anything.
      #
      # The pattern is the one "Teleport auth" has used since it was written —
      # `continue-on-error` on the first attempt, a twin gated on its `outcome`.
      # It is used rather than a retry ACTION because it adds no dependency, and
      # rather than a job-level rerun because GitHub has no job retry at all: the
      # only "job level" options are a third-party action (still step-scoped) or
      # `gh run rerun --failed`, which reruns the REAL failures too.
      #
      # Which rows this is for: the ones with no `runs_on` (GitHub-hosted until
      # issues-maestra#1556, RunsOn in AWS since; same public path either way).
      # They reach every host over the PUBLIC Teleport proxy and pull tools from
      # the public internet; the in-cluster ARC rows do neither. Across the
      # AWS-LC campaign (~40 runs, maestra-io/haproxy-maestra) every CI flake was
      # a GitHub-hosted row and not one was an ARC row. The retry is written here
      # rather than gated on `runs_on` because an ARC row that never flakes never
      # reaches the retry either — a condition that is always false on the rows
      # it would exclude is a condition worth not writing.
      - name: Set up uv
        id: setup-uv
        continue-on-error: true
        uses: maestra-io/github-actions/setup-uv-nora@9b8a76b44a7333893fb2f995ab1afdcfb179ba59 # v1.106.5
        with:
          version: "0.13.6"
          enable-cache: false

      # Observed 2026-09-02 on the eu _haproxy_cdp check row (run 33612325844):
      # `Fetching manifest data from https://raw.githubusercontent.com/astral-sh/
      # versions/main/v1/uv.ndjson` -> `##[error]fetch failed` (uv was unpinned then;
      # it is pinned now, the retry stays for the download itself).
      - name: Set up uv — retry
        if: steps.setup-uv.outcome == 'failure'
        uses: maestra-io/github-actions/setup-uv-nora@9b8a76b44a7333893fb2f995ab1afdcfb179ba59 # v1.106.5
        with:
          version: "0.13.6"
          enable-cache: false

      # Credentials for nora (packages.maestra.io), the caller's only Python index.
      - uses: maestra-io/github-actions/uv-nora@22ccbf9ff3d76fe13025cbc009d395024f025198 # v1.67.0

      # See the tp-version step: inputs reach the shell through env only.
      - name: Install ansible + Python dependencies
        env:
          DEPS_PROJECT: ${{ inputs.uv_project }}
          DEPS_GROUP: ""
          DEPS_TARGET: system
        run: |
          # >>> python-deps (identical in every ansible workflow; ansible/tests/test-python-deps.sh)
          set -euo pipefail
          if [ -f "${DEPS_PROJECT}/uv.lock" ]; then
            # nora only: every package source is the nora registry (or the project
            # itself), every URL is on packages.maestra.io. Anything else (another
            # index, git, ssh, a path, a direct URL) is refused, never followed.
            lock="${DEPS_PROJECT}/uv.lock"
            if bad=$(grep -E '^source = ' "$lock" | sort -u | grep -vxF \
                  -e 'source = { registry = "https://packages.maestra.io/simple/" }' \
                  -e 'source = { virtual = "." }' -e 'source = { editable = "." }'); then
              echo "::error file=${lock}::uv.lock has sources other than the nora registry: ${bad//$'\n'/ }"
              exit 1
            fi
            if other=$(grep -oE '[a-z+]+://[^/"]+' "$lock" | sort -u | grep -vxF 'https://packages.maestra.io'); then
              echo "::error file=${lock}::uv.lock names hosts other than packages.maestra.io: ${other//$'\n'/ }"
              exit 1
            fi
            args=(--locked --no-install-project --project "$DEPS_PROJECT")
            [ -z "${DEPS_GROUP:-}" ] || args+=(--group "$DEPS_GROUP")
            if [ "$DEPS_TARGET" = active ]; then
              args+=(--active)
            else
              # setup-python's interpreter, as `pip install --system` did; --inexact keeps its pip.
              export UV_PROJECT_ENVIRONMENT="${pythonLocation:?setup-python-nora must run first}"
              args+=(--inexact)
            fi
            uv sync "${args[@]}"
          else
            echo "::error::no ${DEPS_PROJECT}/uv.lock: the Ansible toolchain comes from pyproject.toml + uv.lock through nora (input uv_project; issues-maestra#1649)"
            exit 1
          fi
          # <<< python-deps

      - name: Cache Ansible Galaxy collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          # "nora": collections cached before Galaxy went through nora (a version
          # younger than 3 days among them) are not restored.
          key: galaxy-nora-${{ runner.os }}-${{ hashFiles(inputs.requirements_galaxy) }}

      # Galaxy through nora (packages.maestra.io/ansible/, issues-maestra#1649 s9):
      # collection versions younger than 3 days are hidden there, so a range like
      # ">=8.0.0" resolves to the newest mature release. The ANSIBLE_GALAXY_SERVER_*
      # variables reach every later step: the install below and ansible-lint's own
      # requirements install. Auth: a GitHub OIDC token as Basic token:<jwt>
      # (expires in minutes, enough for the install that follows).
      - name: Galaxy through nora
        if: ${{ hashFiles(inputs.requirements_galaxy) != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('packages.maestra.io');
            core.setSecret(t);
            core.exportVariable('ANSIBLE_GALAXY_SERVER_LIST', 'nora');
            core.exportVariable('ANSIBLE_GALAXY_SERVER_NORA_URL', 'https://packages.maestra.io/ansible/');
            core.exportVariable('ANSIBLE_GALAXY_SERVER_NORA_USERNAME', 'token');
            core.exportVariable('ANSIBLE_GALAXY_SERVER_NORA_PASSWORD', t);
      - name: Install Galaxy collections/roles
        if: ${{ hashFiles(inputs.requirements_galaxy) != '' }}
        # From working_directory so ansible.cfg's roles_path/collections_path apply —
        # repos like vpn-maestra resolve roles from repo-relative paths, not ~/.ansible
        # (source repos all ran `cd ansible && ansible-galaxy install`). No `|| true`:
        # a galaxy failure must surface here, not later as "role not found".
        working-directory: ${{ inputs.working_directory }}
        env:
          REQUIREMENTS_GALAXY: ${{ inputs.requirements_galaxy }}
        run: ansible-galaxy install -r "${GITHUB_WORKSPACE}/${REQUIREMENTS_GALAXY}"

      - name: Get Teleport version from proxy
        id: tp-version
        # inputs go through env, never straight into the shell source: GitHub
        # substitutes ${{ }} BEFORE bash parses, so a quote in a caller-supplied
        # value would execute in this credentialed job.
        env:
          TELEPORT_FQDN: ${{ inputs.teleport_fqdn }}
        run: |
          # --retry-all-errors is what makes --retry cover the case that actually
          # happens here: curl retries transient HTTP/transfer errors on its own,
          # but a CONNECTION reset — which is how the public proxy fails — is not
          # one of them without this flag. -f turns an HTTP error into a non-zero
          # exit so --retry can see it at all.
          VER="$(/usr/bin/curl -sf --retry 3 --retry-delay 2 --retry-all-errors \
            "https://${TELEPORT_FQDN}/webapi/find" \
            | jq -r '.auto_update.tools_version // .server_version')"
          if [ -z "${VER}" ] || [ "${VER}" = "null" ]; then
            echo "::error::could not read a Teleport version from https://${TELEPORT_FQDN}/webapi/find"
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Cache Teleport binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/teleport
          key: teleport-${{ runner.os }}-${{ runner.arch }}-${{ steps.tp-version.outputs.version }}

      # Downloads the tarball from get.gravitational.com on every cache miss, so
      # it is one more internet dependency standing between a PR and its check.
      # Safe to repeat: the action unpacks into the tool cache and is idempotent.
      - name: Setup Teleport
        id: teleport-setup
        continue-on-error: true
        uses: teleport-actions/setup@10b5e9f760190f027a1e04e342178d8d6e7eae30 # v2.0.0
        with:
          version: ${{ steps.tp-version.outputs.version }}

      - name: Setup Teleport — retry
        if: steps.teleport-setup.outcome == 'failure'
        uses: teleport-actions/setup@10b5e9f760190f027a1e04e342178d8d6e7eae30 # v2.0.0
        with:
          version: ${{ steps.tp-version.outputs.version }}

      # teleport-actions/auth mints the certificate by running tbot, whose heartbeat
      # to the proxy intermittently fails ("keepalive ping failed to receive ACK
      # within timeout") and reds a whole run before a single task has executed.
      # The first attempt is therefore allowed to fail; the retry is the one that
      # decides the job. Both steps' outputs are read with `a || b` downstream —
      # exactly one of them produces an identity.
      - name: Teleport auth (SSH)
        id: teleport-auth
        continue-on-error: true
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: ${{ inputs.teleport_fqdn }}
          token: ${{ inputs.teleport_join_token }}
          certificate-ttl: ${{ inputs.certificate_ttl }}

      # The retry right after a failure lands in the same loss window: eu-central-1
      # runners lose TCP to the us-iota proxy for ~2-3 min at a 15-min cadence
      # (:01/:16/:31/:46 and :12/:27/:42/:57 UTC); us-west-2 runners do not. A
      # retry 1 s later failed the same way (asbo 44544069208 attempt 2, 14:46-14:47).
      - name: Teleport auth (SSH) — wait out the path loss window
        if: steps.teleport-auth.outcome == 'failure'
        run: sleep 120

      - name: Teleport auth (SSH) — retry
        id: teleport-auth-retry
        if: steps.teleport-auth.outcome == 'failure'
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: ${{ inputs.teleport_fqdn }}
          token: ${{ inputs.teleport_join_token }}
          certificate-ttl: ${{ inputs.certificate_ttl }}

      # --- Keep the proxy on the target out of the path (os-update) ------
      # tsh dials <fqdn>:3023 (separate listener mode), which DNS spreads over
      # every proxy address. On us-iota those are the three k0s nodes' own IPs:
      # the proxy is hostNetwork there, so a dial that lands on the target rides
      # the target's proxy pod — evicted by our drain, gone at our reboot — and
      # with it the delegate's kubectl session. Pinning the FQDN to the OTHER
      # proxies' addresses takes the target out of every new dial (ssh, inventory
      # tsh ls, tbot tunnels). Teleport's SSH resumption (tsh proxy ssh, 1-min
      # window) remains the second layer for a connection that drops anyway.
      # Fail-open on purpose: a target we cannot ask is one the play cannot
      # reach either, and an unpinned run is exactly today's behaviour.
      - name: Keep the Teleport proxy on the target out of the path
        if: ${{ inputs.teleport_avoid_host != '' }}
        env:
          TELEPORT_IDENTITY_FILE: ${{ steps.teleport-auth.outputs.identity-file || steps.teleport-auth-retry.outputs.identity-file }}
          TELEPORT_PROXY: ${{ inputs.teleport_fqdn }}
          AVOID_HOST: ${{ inputs.teleport_avoid_host }}
        run: |
          # >>> avoid-target-proxy (ansible/tests/test-avoid-target-proxy.sh runs this block)
          set +e -uo pipefail  # +e: the runner's bash -e would turn an empty grep into a red step
          fqdn="${TELEPORT_PROXY%:*}"
          proxy_ips=$(getent ahostsv4 "$fqdn" | awk '{print $1}' | sort -u)
          target_ips=$(timeout 60 tsh ssh --login=teleport-production "$AVOID_HOST" 'hostname -I' 2>/dev/null \
            | tr ' ' '\n' | grep -E '^[0-9]+(\.[0-9]+){3}$' | sort -u)
          if [ -z "$proxy_ips" ] || [ -z "$target_ips" ]; then
            echo "::warning::could not read the addresses of ${fqdn} or ${AVOID_HOST} — DNS left as is"
            exit 0
          fi
          keep=$(comm -23 <(echo "$proxy_ips") <(echo "$target_ips"))
          if [ "$keep" = "$proxy_ips" ]; then
            echo "no ${fqdn} address is on ${AVOID_HOST} — nothing to pin"
            exit 0
          fi
          if [ -z "$keep" ]; then
            echo "::warning::every ${fqdn} address is on ${AVOID_HOST} — DNS left as is"
            exit 0
          fi
          if ! awk -v h="$fqdn" '{print $1, h}' <<< "$keep" | sudo tee -a /etc/hosts >/dev/null; then
            echo "::warning::could not write /etc/hosts — DNS left as is"
            exit 0
          fi
          if [ "$(getent ahostsv4 "$fqdn" | awk '{print $1}' | sort -u)" != "$keep" ]; then
            echo "::warning::/etc/hosts pin for ${fqdn} is not what the resolver returns — check nsswitch"
            exit 0
          fi
          echo "${fqdn} pinned to ${keep//$'\n'/ } (dropped the proxy on ${AVOID_HOST})"
          # <<< avoid-target-proxy

      # --- Mitogen (Linux only) ------------------------------------------
      - name: Configure Mitogen strategy plugin
        if: ${{ inputs.use_mitogen && !inputs.windows_mode }}
        run: |
          PLUGINS="$(python3 -c 'import ansible_mitogen, os; print(os.path.join(ansible_mitogen.__path__[0], "plugins", "strategy"))')"
          echo "ANSIBLE_STRATEGY_PLUGINS=${PLUGINS}" >> "$GITHUB_ENV"

      # --- Vault: tunnel mode (mssql/ad omicron) -------------------------
      - name: Start Vault tunnel via Teleport
        id: vault-tunnel
        if: ${{ inputs.vault_mode == 'tunnel' && inputs.teleport_app != '' }}
        # See the tp-version step: inputs reach the shell through env only.
        env:
          TELEPORT_FQDN: ${{ inputs.teleport_fqdn }}
          TELEPORT_JOIN_TOKEN: ${{ inputs.teleport_join_token }}
          TELEPORT_APP: ${{ inputs.teleport_app }}
        run: |
          cat > /tmp/tbot-vault-config.yaml <<EOF
          version: v2
          onboarding:
            join_method: github
            token: ${TELEPORT_JOIN_TOKEN}
          proxy_server: ${TELEPORT_FQDN}
          # memory storage: default /var/lib/teleport is not writable on hosted
          # runners (mkdir: permission denied -> tunnel never opens).
          storage:
            type: memory
          services:
            - type: application-tunnel
              app_name: ${TELEPORT_APP}
              listen: tcp://127.0.0.1:8200
          EOF
          # Two attempts. The retry is IN the step, not a twin step, for one
          # reason: the first tbot is a background process holding (or trying to
          # hold) 127.0.0.1:8200, so a second attempt has to reap it first or it
          # binds nothing and the port check passes on a dead tunnel. A gated
          # twin step cannot see the first one's PID reliably; a loop can.
          tunnel_pid=""
          for attempt in 1 2; do
            tbot start -c /tmp/tbot-vault-config.yaml &
            tunnel_pid=$!
            for _ in $(seq 1 15); do
              (echo > /dev/tcp/127.0.0.1/8200) >/dev/null 2>&1 && break 2
              sleep 1
            done
            echo "::warning::vault tunnel (${TELEPORT_APP}) did not open in 15s on attempt ${attempt}"
            kill "${tunnel_pid}" 2>/dev/null || true
            wait "${tunnel_pid}" 2>/dev/null || true
            tunnel_pid=""
          done

          # FAIL CLOSED, matching the twin step in terraform-run.yml, which has
          # exited 1 here since it was written. This copy used to fall through
          # silently: the job carried on with no tunnel and died several steps
          # later inside hashicorp/vault-action, reporting a connection error to
          # 127.0.0.1 with nothing to say about why nothing was listening.
          if [ -z "${tunnel_pid}" ]; then
            echo "::error::vault tunnel (tbot app-tunnel ${TELEPORT_APP}) did not open in 15s, twice"
            exit 1
          fi
          echo "tunnel_pid=${tunnel_pid}" >> "$GITHUB_OUTPUT"

      # --- Generic Teleport app tunnels (os-update: Alertmanager) --------
      - name: Start Teleport app tunnels
        id: app-tunnels
        if: ${{ inputs.tbot_tunnels != '' }}
        env:
          TBOT_TUNNELS: ${{ inputs.tbot_tunnels }}
          TELEPORT_FQDN: ${{ inputs.teleport_fqdn }}
          TELEPORT_JOIN_TOKEN: ${{ inputs.teleport_join_token }}
        run: |
          set -euo pipefail
          {
            echo "version: v2"
            echo "proxy_server: ${TELEPORT_FQDN}"
            echo "onboarding:"
            echo "  join_method: github"
            echo "  token: ${TELEPORT_JOIN_TOKEN}"
            # memory storage: /var/lib/teleport is not writable on hosted runners.
            echo "storage:"
            echo "  type: memory"
            echo "services:"
          } > /tmp/tbot-apps.yaml

          PAIRS=""
          while IFS= read -r line; do
            [ -z "${line// /}" ] && continue
            app="$(printf '%s' "$line" | sed -n 's/.*app=\([^ ]*\).*/\1/p')"
            port="$(printf '%s' "$line" | sed -n 's/.*listen=\([0-9]*\).*/\1/p')"
            if [ -z "$app" ] || [ -z "$port" ]; then
              echo "::error::malformed tbot_tunnels line (want 'app=<name> listen=<port>'): $line"
              exit 1
            fi
            {
              echo "  - type: application-tunnel"
              echo "    app_name: ${app}"
              echo "    listen: tcp://127.0.0.1:${port}"
            } >> /tmp/tbot-apps.yaml
            PAIRS="${PAIRS} ${app}:${port}"
          done <<< "${TBOT_TUNNELS}"

          # Two attempts, 120 s apart: the first tbot join can land in the
          # eu-central-1 -> us-iota loss window (see the Teleport auth steps;
          # maestra-nat-gateway 44496178532, 09:27:53-09:28:32 UTC). In the step,
          # like the Vault tunnel: the first tbot has to be reaped before a second
          # one can bind the ports.
          pid=""
          for attempt in 1 2; do
            tbot start -c /tmp/tbot-apps.yaml &
            pid=$!
            missing=""
            for pair in ${PAIRS}; do
              app="${pair%%:*}"; port="${pair##*:}"
              # An HTTP round trip, not an open local port: tbot binds the listener
              # before the app is reachable, so a TCP probe passed while every
              # request hung (maestra-nat-gateway 45956080817, 27.11.2026: the
              # silences GET timed out 35 s after "tunnel is up"). Any 1xx-4xx
              # means the request crossed the proxy and reached the app.
              opened=0
              deadline=$((SECONDS + 60))
              while [ "${SECONDS}" -lt "${deadline}" ]; do
                code="$(/usr/bin/curl -s -o /dev/null -m 5 -w '%{http_code}' "http://127.0.0.1:${port}/" 2>/dev/null || true)"
                case "${code}" in [1-4][0-9][0-9]) opened=1; break ;; esac
                sleep 2
              done
              if [ "${opened}" != 1 ]; then missing="${app} on 127.0.0.1:${port} (last HTTP code ${code:-none})"; break; fi
            done
            [ -z "${missing}" ] && break
            kill "${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            pid=""
            if [ "${attempt}" = 1 ]; then
              echo "::warning::tbot tunnel for app ${missing} did not answer over HTTP in 60 s; one more attempt in 120 s"
              sleep 120
            fi
          done
          # FAIL CLOSED. No tunnel -> no silences -> we would page Rootly for every
          # host we reboot, and the "is anyone else drained" interlock would be blind.
          if [ -z "${pid}" ]; then
            echo "::error::tbot tunnel for app ${missing} never opened, twice"
            exit 1
          fi
          echo "pid=${pid}" >> "$GITHUB_OUTPUT"

          for pair in ${PAIRS}; do
            app="${pair%%:*}"; port="${pair##*:}"
            slug="$(printf '%s' "${app}" | tr 'a-z-' 'A-Z_')"
            echo "TUNNEL_${slug}=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
            echo "tunnel for ${app} is up on 127.0.0.1:${port}"
          done

      # --- Teleport workload identity -> AWS (os-update: the Route53 drain) ---
      # Same shape as the app-tunnels step above: write a tbot config, join with the
      # repo's GitHub-OIDC token, run tbot. Here the service is workload-identity-jwt,
      # which writes a SPIFFE JWT the AWS SDK exchanges for a role via
      # sts:AssumeRoleWithWebIdentity — the identity lives with the JOB, not with
      # every host it touches.
      #
      # `audiences` is a LIST and the key is plural; the singular `audience` is the
      # CLI flag, not the config field. Taken from the AWS-OIDC-federation page of
      # the Teleport docs rather than from memory.
      - name: Mint a workload-identity JWT for AWS
        id: aws-wi
        if: ${{ inputs.aws_workload_identity != '' }}
        env:
          AWS_WI: ${{ inputs.aws_workload_identity }}
          TELEPORT_FQDN: ${{ inputs.teleport_fqdn }}
          TELEPORT_JOIN_TOKEN: ${{ inputs.teleport_join_token }}
        run: |
          set -euo pipefail
          name="$(printf '%s' "$AWS_WI" | sed -n 's/.*name=\([^ ]*\).*/\1/p')"
          role="$(printf '%s' "$AWS_WI" | sed -n 's/.*role_arn=\([^ ]*\).*/\1/p')"
          # The identity's own bot, when it has one; else the SSH join token.
          wi_token="$(printf '%s' "$AWS_WI" | sed -n 's/.*token=\([^ ]*\).*/\1/p')"
          [ -n "$wi_token" ] || wi_token="${TELEPORT_JOIN_TOKEN}"
          if [ -z "$name" ] || [ -z "$role" ]; then
            echo "::error::malformed aws_workload_identity (want 'name=<wi> role_arn=<arn>'): ${AWS_WI}"
            exit 1
          fi

          mkdir -p /tmp/tbot-wi
          {
            echo "version: v2"
            echo "proxy_server: ${TELEPORT_FQDN}"
            echo "onboarding:"
            echo "  join_method: github"
            echo "  token: ${wi_token}"
            echo "storage:"
            echo "  type: memory"
            echo "services:"
            echo "  - type: workload-identity-jwt"
            echo "    selector:"
            echo "      name: ${name}"
            echo "    audiences: ['sts.amazonaws.com']"
            echo "    destination:"
            echo "      type: directory"
            echo "      path: /tmp/tbot-wi"
          } > /tmp/tbot-wi.yaml

          # One more attempt past the eu-central-1 -> us-iota loss window (see the
          # Teleport auth steps).
          tbot start -c /tmp/tbot-wi.yaml --oneshot || {
            echo "::warning::tbot minted no JWT SVID; one more attempt in 120 s"
            sleep 120
            tbot start -c /tmp/tbot-wi.yaml --oneshot
          }

          # FAIL CLOSED, like the tunnel step: a play that believes it has AWS creds
          # and does not would drain a host and then fail to withdraw it from DNS.
          if [ ! -s /tmp/tbot-wi/jwt_svid ]; then
            echo "::error::tbot produced no JWT SVID at /tmp/tbot-wi/jwt_svid for workload identity '${name}'"
            ls -la /tmp/tbot-wi || true
            exit 1
          fi

          echo "AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/tbot-wi/jwt_svid" >> "$GITHUB_ENV"
          echo "AWS_ROLE_ARN=${role}" >> "$GITHUB_ENV"
          echo "workload identity '${name}' minted via token '${wi_token}'; AWS role ${role}"

      # --- Vault: fetch secrets (public OR tunnel) -----------------------
      - name: Retrieve secrets from Vault
        if: ${{ inputs.vault_mode != 'none' && inputs.vault_secrets != '' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault_addr }}
          method: jwt
          path: jwt-github
          role: ${{ inputs.vault_role }}
          jwtGithubAudience: https://github.com/maestra-io
          exportEnv: true
          exportToken: ${{ inputs.vault_export_token }}
          secrets: ${{ inputs.vault_secrets }}

      - name: Export the Vault address for the play
        if: ${{ inputs.vault_export_token && inputs.vault_mode != 'none' && inputs.vault_secrets != '' }}
        env:
          VAULT_ADDR_INPUT: ${{ inputs.vault_addr }}
        run: printf 'VAULT_ADDR=%s\n' "$VAULT_ADDR_INPUT" >> "$GITHUB_ENV"

      # --- Vault: second source (optional, additive) ---------------------
      # Gated ONLY on vault2_secrets being non-empty -- deliberately not on
      # vault_mode, exactly like the break-glass minter step below, so a caller
      # can use this while its primary source is `none`. Both fetches use
      # exportEnv, and the env names must not collide: the second one would win,
      # silently. Give it its own ENV_NAME.
      - name: Retrieve secrets from the second Vault
        if: ${{ inputs.vault2_secrets != '' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault2_addr != '' && inputs.vault2_addr || inputs.vault_addr }}
          method: jwt
          path: jwt-github
          role: ${{ inputs.vault2_role != '' && inputs.vault2_role || inputs.vault_role }}
          jwtGithubAudience: https://github.com/maestra-io
          exportEnv: true
          secrets: ${{ inputs.vault2_secrets }}

      # --- Proxmox pveum token (divergence class 1, input-gated) ---------
      # pull_request runs a play from the PR branch: it never gets the
      # Administrator mint (sudo pveum over teleport-production), only the
      # PVEAuditor token below. Its API tasks are uri / proxmox_firewall, which
      # do not run in check mode anyway.
      - name: A pull_request check needs the Proxmox engine
        if: ${{ inputs.mint_proxmox_token && github.event_name == 'pull_request' && inputs.proxmox_engine_vault_app == '' }}
        run: |
          echo "::error::mint_proxmox_token on pull_request needs proxmox_engine_vault_app (the Teleport app of the cluster Vault, e.g. vault-omicron): a PR check never mints with sudo, and the standing KV token is gone"
          exit 1

      # pull_request with proxmox_engine_vault_app: the PVEAuditor token comes
      # from the cluster Vault's proxmox engine, one short-lived token per run.
      # Own tunnel on 8201: the secrets tunnel (8200) may point elsewhere.
      - name: Start the Proxmox engine Vault tunnel (pull_request)
        id: pve-engine-tunnel
        if: ${{ inputs.mint_proxmox_token && github.event_name == 'pull_request' && inputs.proxmox_engine_vault_app != '' }}
        env:
          TELEPORT_JOIN_TOKEN: ${{ inputs.teleport_join_token }}
          TELEPORT_APP: ${{ inputs.proxmox_engine_vault_app }}
          TELEPORT_PROXY: ${{ inputs.teleport_fqdn }}
        run: |
          set -euo pipefail
          cat > /tmp/tbot-pve-engine-config.yaml <<EOF
          version: v2
          onboarding:
            join_method: github
            token: ${TELEPORT_JOIN_TOKEN}
          proxy_server: ${TELEPORT_PROXY}
          storage:
            type: memory
          services:
            - type: application-tunnel
              app_name: ${TELEPORT_APP}
              listen: tcp://127.0.0.1:8201
          EOF
          tunnel_pid=""
          for attempt in 1 2; do
            tbot start -c /tmp/tbot-pve-engine-config.yaml &
            tunnel_pid=$!
            for _ in $(seq 1 15); do
              (echo > /dev/tcp/127.0.0.1/8201) >/dev/null 2>&1 && break 2
              sleep 1
            done
            echo "::warning::proxmox engine vault tunnel (${TELEPORT_APP}) did not open in 15s on attempt ${attempt}"
            kill "${tunnel_pid}" 2>/dev/null || true
            wait "${tunnel_pid}" 2>/dev/null || true
            tunnel_pid=""
          done
          if [ -z "${tunnel_pid}" ]; then
            echo "::error::proxmox engine vault tunnel (tbot app-tunnel ${TELEPORT_APP}) did not open in 15s, twice"
            exit 1
          fi
          echo "tunnel_pid=${tunnel_pid}" >> "$GITHUB_OUTPUT"

      - name: Read the Proxmox token from the Vault proxmox engine (pull_request)
        id: pve-engine-token
        if: ${{ inputs.mint_proxmox_token && github.event_name == 'pull_request' && inputs.proxmox_engine_vault_app != '' }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: http://127.0.0.1:8201
          method: jwt
          path: jwt-github
          role: pve-ci-plan-${{ github.event.repository.name }}-github-ci
          jwtGithubAudience: https://github.com/maestra-io
          exportEnv: false
          secrets: |
            proxmox/creds/ci-plan token_id_full | PVE_TOKEN_ID ;
            proxmox/creds/ci-plan secret | PVE_TOKEN_SECRET

      - name: Export the Proxmox engine token (pull_request)
        if: ${{ inputs.mint_proxmox_token && github.event_name == 'pull_request' && inputs.proxmox_engine_vault_app != '' }}
        env:
          PVE_TOKEN_ID: ${{ steps.pve-engine-token.outputs.PVE_TOKEN_ID }}
          PVE_TOKEN_SECRET: ${{ steps.pve-engine-token.outputs.PVE_TOKEN_SECRET }}
          TUNNEL_PID: ${{ steps.pve-engine-tunnel.outputs.tunnel_pid }}
        run: |
          set -euo pipefail
          # The tunnel has done its job; the play does not talk to Vault through it.
          kill "$TUNNEL_PID" 2>/dev/null || true
          case "$PVE_TOKEN_ID" in
            ci-plan@pve!v-?*) ;;
            *) echo "::error::the proxmox engine answered token_id '${PVE_TOKEN_ID}', not a ci-plan@pve token"; exit 1 ;;
          esac
          echo "::add-mask::$PVE_TOKEN_SECRET"
          {
            echo "PROXMOX_API_USER=ci-plan@pve"
            echo "PROXMOX_API_TOKEN_NAME=${PVE_TOKEN_ID#ci-plan@pve!}"
            echo "PROXMOX_API_TOKEN_SECRET=$PVE_TOKEN_SECRET"
          } >> "$GITHUB_ENV"
          echo "Proxmox API token: ${PVE_TOKEN_ID} (PVEAuditor, Vault proxmox engine), nothing minted"

      - name: Mint Proxmox API token
        id: mint-proxmox
        if: ${{ inputs.mint_proxmox_token && github.event_name != 'pull_request' }}
        env:
          TELEPORT_IDENTITY_FILE: ${{ steps.teleport-auth.outputs.identity-file || steps.teleport-auth-retry.outputs.identity-file }}
          TELEPORT_PROXY: ${{ inputs.teleport_fqdn }}
          # Through the environment, not interpolated into the script: an
          # interpolated value is pasted in before bash parses the line, so a
          # quote in it would be code rather than data. Same reasoning the
          # Execute step already documents for its free-text dispatch inputs.
          TF_REGION: ${{ inputs.region }}
          TF_ENVIRONMENT: ${{ inputs.environment }}
          TF_SITE: ${{ inputs.site }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The token name is per-RUN. It used to be the fixed `github-ci`, which
          # every job in the repo minted with `token remove` + `token add` and
          # deleted again on the way out — so any two overlapping runs shared one
          # credential and the second one silently invalidated the first. Seen on
          # maestra-io/proxmox run 31637270407: a deploy on `serial: 1` was on its
          # third hypervisor when a PR-check run tore the token down, and that
          # host alone failed with `no such token 'github-ci' for user
          # 'ansible-ci@pve'` (the user of that time). A unique name per run removes the collision
          # entirely; the id is exported so the play can address it.
          TOKEN_NAME="github-ci-${GH_RUN_ID}"
          # Server-side expiry, so a cleanup that never runs — cancelled job,
          # runner death — cannot leave a token alive forever.
          # Two hours covers any run this workflow performs; the cleanup step
          # still removes it immediately on the normal path.
          TOKEN_EXPIRE="$(( $(date +%s) + 7200 ))"
          NODES="$(tsh ls --format=names \
            "role=proxmox,region=${TF_REGION},environment=${TF_ENVIRONMENT},site=${TF_SITE}" || true)"
          TOKEN_VALUE=""
          TOKEN_NODE=""
          for NODE in $(echo "$NODES" | shuf); do
            OUT="$(timeout 30 tsh ssh --login=teleport-production "$NODE" "
              sudo pveum user add ci-plan@pve 2>/dev/null || true
              sudo pveum acl modify / -user ci-plan@pve -role PVEAuditor
              sudo pveum user token remove ci-plan@pve ${TOKEN_NAME} 2>/dev/null || true
              sudo pveum user token add ci-plan@pve ${TOKEN_NAME} --privsep=0 --expire ${TOKEN_EXPIRE} --output-format=json
            " 2>/dev/null || true)"
            TOKEN="$(echo "$OUT" | jq -r '.value // empty' 2>/dev/null || true)"
            if [ -n "$TOKEN" ]; then
              TOKEN_VALUE="$TOKEN"
              TOKEN_NODE="$NODE"
              break
            fi
          done
          if [ -z "$TOKEN_VALUE" ]; then
            echo "::error::Failed to mint Proxmox token on any candidate node"
            exit 1
          fi
          echo "::add-mask::$TOKEN_VALUE"
          {
            echo "PROXMOX_API_TOKEN_SECRET=$TOKEN_VALUE"
            echo "PROXMOX_API_TOKEN_NAME=$TOKEN_NAME"
            echo "PROXMOX_API_USER=ci-plan@pve"
          } >> "$GITHUB_ENV"
          echo "node=$TOKEN_NODE" >> "$GITHUB_OUTPUT"
          echo "token_name=$TOKEN_NAME" >> "$GITHUB_OUTPUT"

      # --- Execute -------------------------------------------------------
      - name: Execute Ansible
        id: execute
        working-directory: ${{ inputs.working_directory }}
        env:
          # Teleport identity for the dynamic inventory + tsh ProxyCommand:
          # teleport_inventory.py reads TELEPORT_PROXY (tsh ls / cluster name) and
          # TBOT_DEST_DIR (IdentityFile/CertificateFile ssh args); tsh reads
          # TELEPORT_IDENTITY_FILE automatically. Without these, SSH auth fails.
          TELEPORT_IDENTITY_FILE: ${{ steps.teleport-auth.outputs.identity-file || steps.teleport-auth-retry.outputs.identity-file }}
          TBOT_DEST_DIR: ${{ steps.teleport-auth.outputs.destination-dir || steps.teleport-auth-retry.outputs.destination-dir }}
          TELEPORT_PROXY: ${{ inputs.teleport_fqdn }}
          # optional app-cred passthroughs (empty for repos that don't set them)
          VECTOR_SIEM_BASIC_AUTH_USER: ${{ secrets.VECTOR_SIEM_BASIC_AUTH_USER }}
          VECTOR_SIEM_BASIC_AUTH_PASSWORD: ${{ secrets.VECTOR_SIEM_BASIC_AUTH_PASSWORD }}
          PROXMOX_MONITORING_PASSWORD: ${{ secrets.PROXMOX_MONITORING_PASSWORD }}
          # Token for `gh` CLI tasks (e.g. `gh release download` from a private
          # repo). It MUST be set here in the reusable's own context, where
          # github.token is populated. A caller cannot forward it: github.token
          # (and secrets.*) resolve to EMPTY inside a reusable-workflow `with:`
          # input, so forwarding it through `extra_env` shipped an empty value
          # and `gh` ran unauthenticated (rc=4).
          GH_TOKEN: ${{ github.token }}
          # Free-text dispatch inputs reach the shell via env, not ${{ }}
          # interpolation: an interpolated value is pasted into the script
          # BEFORE bash parses it, so `x; rm -rf /` in host_limit would run.
          # An env var is data, never code.
          HOST_LIMIT_INPUT: ${{ inputs.host_limit }}
          TAGS_INPUT: ${{ inputs.tags }}
          EXTRA_ENV_INPUT: ${{ inputs.extra_env }}
          REGION_INPUT: ${{ inputs.region }}
          ENVIRONMENT_INPUT: ${{ inputs.environment }}
          SITE_INPUT: ${{ inputs.site }}
          GROUP_SUFFIX_INPUT: ${{ inputs.inventory_group_suffix }}
          VERBOSITY_INPUT: ${{ inputs.verbosity }}
          INVENTORY_INPUT: ${{ inputs.inventory }}
          PLAYBOOK_INPUT: ${{ inputs.playbook }}
          CHECK_MODE_INPUT: ${{ inputs.check_mode }}
          NO_HOSTS_FAIL_INPUT: ${{ inputs.no_hosts_fail_on_apply }}
        # extra_run_args is a shell fragment by contract (see the COMMON+= comment below)
        # nosemgrep: run-shell-injection
        run: |
          set -uo pipefail

          # inject caller-provided extra env
          if [ -n "${EXTRA_ENV_INPUT}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              # skip a KEY= line with an empty value so it can't clobber a real
              # step-env value (e.g. a caller forwarding an empty github.token)
              case "$line" in *=) continue ;; esac
              export "$line"
            done <<< "${EXTRA_ENV_INPUT}"
          fi

          # check-mode display trim (matches source repos: hide ok/skipped hosts in plans)
          if [ "${CHECK_MODE_INPUT}" = "true" ]; then
            export ANSIBLE_DISPLAY_OK_HOSTS=false
            export ANSIBLE_DISPLAY_SKIPPED_HOSTS=false
          fi

          # compute target group / --limit
          LIMIT="${HOST_LIMIT_INPUT}"
          if [ -z "$LIMIT" ]; then
            LIMIT="${REGION_INPUT}_${ENVIRONMENT_INPUT}_${SITE_INPUT}${GROUP_SUFFIX_INPUT}"
          fi
          # ansible --limit patterns are [a-zA-Z0-9_.,:*!&-] — anything else in a
          # dispatch input is not a host pattern, it is an attempt at the shell.
          case "$LIMIT" in
            *[!a-zA-Z0-9_.,:*!\&-]*)
              echo "::error::host_limit contains characters that are not a valid ansible limit pattern: ${LIMIT}"
              exit 1 ;;
          esac

          # verbosity
          VERB="${VERBOSITY_INPUT}"
          [ "$VERB" = "normal" ] && VERB=""

          # tags / check
          # ansible tags are [a-zA-Z0-9_,-] — same rule as LIMIT above.
          case "$TAGS_INPUT" in
            *[!a-zA-Z0-9_,-]*)
              echo "::error::tags contains characters that are not a valid ansible tag list: ${TAGS_INPUT}"
              exit 1 ;;
          esac
          MODE="apply"; [ "${CHECK_MODE_INPUT}" = "true" ] && MODE="plan"
          SAFE_NAME="${REGION_INPUT}-${ENVIRONMENT_INPUT}-${SITE_INPUT}${GROUP_SUFFIX_INPUT}"
          mkdir -p "${{ github.workspace }}/logs"
          LOG_FILE="${{ github.workspace }}/logs/${MODE}-${SAFE_NAME}.log"
          echo "log_file=${LOG_FILE}" >> "$GITHUB_OUTPUT"

          # Argument ARRAY, not a word-split string: every value that came from an
          # input is one element, so a space in it can never become a new argument.
          COMMON=(-i "$INVENTORY_INPUT" --limit "$LIMIT")
          [ -n "$TAGS_INPUT" ] && COMMON+=(--tags "$TAGS_INPUT")
          [ -n "$VERB" ] && COMMON+=("$VERB")
          # `extra_run_args` is the ONE input that stays a template interpolation, on
          # purpose: its contract is a fragment of SHELL, not a value. haproxy-maestra
          # passes `-e vault_consul_template_token=$CONSUL_TEMPLATE_VAULT_TOKEN`, which
          # only works because bash expands the pasted text — through `env:` it would
          # reach ansible as the literal string and consul-template would render certs
          # with a garbage token on a traffic-serving farm. It is not caller free text
          # either: every consumer builds it from a boolean or from a validated
          # generator (haproxy-maestra .github/scripts/otel-track-override.py), never
          # from a raw dispatch field. Narrowing it is a contract change for the
          # consumers, not a pin-PR edit.
          COMMON+=(${{ inputs.extra_run_args }})

          # no-hosts pre-flight guard
          # >>> no-hosts-guard (ansible/tests/test-no-hosts-guard.sh runs this block)
          # Reads `--list-hosts` output. 0 = some play has hosts, 3 = the inventory did
          # not load, 4 = the target group is empty. A failed inventory script is not
          # an empty group: ansible goes on with the implicit localhost and prints
          # `hosts (0):`, with no "no hosts matched" in it. asbo Deploy 45429247024
          # (24.11.2026): `tsh ls` timed out in the inventory script, the play matched
          # nothing, the job stayed green under no_hosts_fail_on_apply and the host
          # config was not written.
          hosts_verdict() { # <file>
            grep -qiE 'Failed to parse inventory|No inventory was parsed|Unable to parse .* as an inventory source' "$1" && return 3
            grep -qiE 'no hosts (matched|to target)' "$1" && return 4
            if grep -qE 'hosts \(0\):' "$1" && ! grep -qE 'hosts \([1-9][0-9]*\):' "$1"; then return 4; fi
            return 0
          }
          # <<< no-hosts-guard
          ansible-playbook "$PLAYBOOK_INPUT" "${COMMON[@]}" --list-hosts > /tmp/list-hosts.txt 2>&1 || true
          hv=0; hosts_verdict /tmp/list-hosts.txt || hv=$?
          if [ "$hv" -eq 3 ]; then
            # One more try: the inventory is usually a Teleport query, and a lost dial is transient.
            sleep 20
            ansible-playbook "$PLAYBOOK_INPUT" "${COMMON[@]}" --list-hosts > /tmp/list-hosts.txt 2>&1 || true
            hv=0; hosts_verdict /tmp/list-hosts.txt || hv=$?
          fi
          if [ "$hv" -eq 3 ]; then
            tail -20 /tmp/list-hosts.txt | tee -a "$LOG_FILE"
            echo "::error::the inventory did not load (twice); refusing to treat it as an empty group"
            exit 1
          fi
          if [ "$hv" -eq 4 ]; then
            echo "No hosts matched" | tee -a "$LOG_FILE"
            if [ "${NO_HOSTS_FAIL_INPUT}" = "true" ] && [ "${CHECK_MODE_INPUT}" != "true" ]; then
              exit 1
            fi
            exit 0
          fi

          RUN_ARGS=("${COMMON[@]}")
          [ "${CHECK_MODE_INPUT}" = "true" ] && RUN_ARGS+=(--check --diff)

          set -o pipefail
          ATTEMPT_LOG=$(mktemp)
          rc=0
          ansible-playbook "$PLAYBOOK_INPUT" "${RUN_ARGS[@]}" 2>&1 | tee "$ATTEMPT_LOG" | tee -a "$LOG_FILE" || rc=$?
          # >>> unreachable-retry (ansible/tests/test-unreachable-retry.sh runs this block)
          # One rerun when the play never got past fact gathering: rc 4 (unreachable,
          # no failed task), no TASK other than `Gathering Facts` started (recap totals
          # alone miss a loop item done before another item went unreachable), and
          # every PLAY RECAP row is ok=0 changed=0 failed=0 rescued=0. A rerun repeats
          # nothing. That is the first SSH dial through the Teleport proxy lost on the
          # eu-central-1 -> us-iota path, which drops connections for ~2-3 min at a
          # 15-min cadence (asbo 44544069208, 14:43:35-14:44:05 UTC). Mitogen has no
          # SSH connect retry of its own. A play with gather_facts: false never reruns,
          # unless a user task is itself named `Gathering Facts` (the banner is all the
          # default callback prints; no such task in maestra-io on 19.11.2026).
          nothing_ran() {
            local log recap
            log=$(sed "s/$(printf '\033')\[[0-9;]*m//g" "$1")
            # no -q: an early exit would SIGPIPE the first grep and, under pipefail, pass
            grep -E 'TASK \[' <<< "$log" | grep -vF 'TASK [Gathering Facts]' > /dev/null && return 1
            # fact gathering never loops: an item result is a user task (even one named so)
            grep -qF '(item=' <<< "$log" && return 1
            recap=$(grep -E '^[^ ]+ +: ok=[0-9]+ +changed=[0-9]+ +unreachable=[0-9]+ +failed=[0-9]+' <<< "$log") || return 1
            ! grep -vqE ': ok=0 +changed=0 +unreachable=[0-9]+ +failed=0 +skipped=[0-9]+ +rescued=0 ' <<< "$recap"
          }
          # <<< unreachable-retry
          if [ "$rc" = 4 ] && nothing_ran "$ATTEMPT_LOG"; then
            echo "::warning::no host was reached and no user task started; one rerun in 120 s (Teleport path loss window)"
            sleep 120
            rc=0
            ansible-playbook "$PLAYBOOK_INPUT" "${RUN_ARGS[@]}" 2>&1 | tee -a "$LOG_FILE" || rc=$?
          fi
          exit "$rc"

      # --- Vault tunnel teardown -----------------------------------------
      - name: Stop Vault tunnel
        if: ${{ always() && inputs.vault_mode == 'tunnel' && steps.vault-tunnel.outputs.tunnel_pid != '' }}
        run: kill "${{ steps.vault-tunnel.outputs.tunnel_pid }}" || true

      - name: Stop Teleport app tunnels
        if: ${{ always() && steps.app-tunnels.outputs.pid != '' }}
        run: kill "${{ steps.app-tunnels.outputs.pid }}" || true

      # --- Proxmox token cleanup -----------------------------------------
      - name: Cleanup Proxmox API token
        if: ${{ always() && inputs.mint_proxmox_token && steps.mint-proxmox.outputs.node != '' }}
        env:
          PVE_NODE: ${{ steps.mint-proxmox.outputs.node }}
          PVE_TOKEN_NAME: ${{ steps.mint-proxmox.outputs.token_name }}
        run: |
          # Removes only THIS run's token, so a concurrent job keeps its own.
          # Both values arrive through the environment rather than being pasted
          # into the script text (see the mint step).
          timeout 30 tsh ssh --login=teleport-production "$PVE_NODE" \
            "sudo pveum user token remove ci-plan@pve $PVE_TOKEN_NAME" || true

      - name: Generate summary
        if: ${{ always() }}
        # The summary is markdown built by the shell, so an input pasted into it is
        # the same injection point as an input pasted into a command. Same rule: env.
        env:
          MODE_LABEL: ${{ inputs.check_mode && 'plan (check)' || 'apply' }}
          REGION_INPUT: ${{ inputs.region }}
          ENVIRONMENT_INPUT: ${{ inputs.environment }}
          SITE_INPUT: ${{ inputs.site }}
          GROUP_SUFFIX_INPUT: ${{ inputs.inventory_group_suffix }}
          PLAYBOOK_INPUT: ${{ inputs.playbook }}
          TAGS_INPUT: ${{ inputs.tags }}
          CHECK_MODE_INPUT: ${{ inputs.check_mode }}
          LIMIT_INPUT: ${{ inputs.host_limit || format('{0}_{1}_{2}{3}', inputs.region, inputs.environment, inputs.site, inputs.inventory_group_suffix) }}
          SUMMARY_GREP: ${{ inputs.summary_grep }}
          LOG_FILE: ${{ steps.execute.outputs.log_file }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          {
            echo "### Ansible ${MODE_LABEL} — ${REGION_INPUT}-${ENVIRONMENT_INPUT}-${SITE_INPUT}${GROUP_SUFFIX_INPUT}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| playbook | \`${PLAYBOOK_INPUT}\` |"
            echo "| limit | \`${LIMIT_INPUT}\` |"
            echo "| tags | \`${TAGS_INPUT}\` |"
            echo "| check_mode | ${CHECK_MODE_INPUT} |"
            if [ -n "$SUMMARY_GREP" ] && [ -f "$LOG_FILE" ]; then
              echo ""
              # A failed run with no match is an outcome too: the host went
              # unreachable mid-run (ansible then skips rescue/always), or the run
              # died before the line. A green run with no match is a consumer
              # whose role predates the line.
              lines=$(grep -oE "\"msg\": \".*\"" "$LOG_FILE" | sed -E 's/^"msg": "//; s/"$//' \
                | grep -E -- "$SUMMARY_GREP" || true)
              if [ -n "$lines" ]; then
                printf '%s\n' "$lines" | sed 's/^/- /'
              elif [ "$EXECUTE_OUTCOME" != success ]; then
                echo "- \`${LIMIT_INPUT}\`: the run failed and left no result line — final state UNKNOWN, read the job log"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name != '' && inputs.artifact_name || format('ansible-check-{0}-{1}-{2}{3}', inputs.region, inputs.environment, inputs.site, inputs.inventory_group_suffix) }}
          path: logs/
          if-no-files-found: warn
