# Reusable npm package test + release to packages.maestra.io (nora): the GitHub
# port of frontend-ci-components templates/lib (npm-registry-auth,
# install-node-modules, checks, release), issues-maestra#1442 wave W0c.
#
# Usage (caller, on push to the default branch and on pull_request):
#
#   jobs:
#     package:
#       uses: maestra-io/github-actions/.github/workflows/npm-package-publish.yml@main
#       permissions: { contents: write, id-token: write, issues: write, pull-requests: write }
#       secrets: inherit
#
# Release token: semantic-release pushes its version commit (@semantic-release/git)
# to the default branch, which a gitleaks ruleset closes to direct pushes. The push
# goes as the GitHub App maestra-frontend-release (a bypass actor of that ruleset):
# org variable FRONTEND_RELEASE_APP_ID + org secret FRONTEND_RELEASE_APP_PRIVATE_KEY,
# which reaches this workflow only through the caller's `secrets: inherit`, and only
# in repos selected on the secret. Without the secret the release falls back to
# github.token and fails on a ruleset-protected branch.
#
# Version source: semantic-release, exactly as on GitLab: the job runs the
# package's own `npm run release`, which reads the commits since the last vX.Y.Z
# tag, publishes and tags. The package's release config must use
# @semantic-release/github (not /gitlab) and needs the GitLab-era tags in the
# GitHub repository, or it restarts from 1.0.0.
#
# Inputs:
#   node-version      setup-node syntax. Empty = node-version-file.
#   node-version-file Default .nvmrc (used only when node-version is empty).
#   scope             npm scope served by nora (default @mindbox-cloud).
#   packages-url      Default https://packages.maestra.io (npm at /npm/).
#   packages-audience `aud` of the GitHub OIDC token nora accepts (default packages.maestra.io).
#   checks            npm scripts run after install, space-separated, each only if
#                     the package has it (default: the lib@3 merge-request jobs
#                     graphql-codegen check-types check-scripts check-styles test).
#                     All of them run even after one fails; the failed ones are
#                     listed in the job summary and fail the step at the end.
#   test-script       Legacy single script (default test). Any other value runs
#                     only that script, --if-present, instead of `checks`; empty
#                     skips both.
#   report-coverage   On pull_request, run `test` with vitest coverage and keep a
#                     sticky "Coverage summary" comment on the PR (lib@3
#                     report-coverage). `test` must be vitest (the flags are
#                     vitest's, as in lib@3). Needs `checks` (not a custom test-script).
#   build-script      npm script run before release, --if-present (default build:npm-package).
#   release-script    npm script that runs semantic-release (default release).
#   release           Run the release on push (default true). Never on pull_request.
#   pool              RunsOn pool of the job: `small` (default, 2 vCPU) or `build`
#                     (for test suites that time out on small, e.g. jsdom). Any
#                     other value falls back to `small`.
#
# Auth: `.npmrc` sends the GitHub OIDC token as `_authToken` (a Bearer header,
# which is the path nora verifies OIDC on). The repo's .npmrc keeps its own
# settings; only its registry/auth lines are replaced. The token is read from
# NPM_TOKEN at run time and never stored.
#
# Lockfiles: `resolved` URLs of the legacy Artifactory registry are rewritten to
# nora before `npm ci` (scripts/npm-lockfile-to-nora.sh, inlined below: a reusable
# workflow cannot read files of its own repository). `replace-registry-host`
# alone cannot do it: npm keeps the Artifactory path (/artifactory/api/npm/npm/...)
# under nora's /npm/, and Artifactory's scoped tarball layout /-/@scope/name-ver.tgz
# is not nora's /-/name-ver.tgz. The rewrite is reverted after install, so a release
# commit (@semantic-release/git) carries the repository's own lockfile.
#
# registry.npmjs.org URLs are rewritten to nora as well: npm 11's
# `replace-registry-host=npmjs` drops nora's /npm/ for names starting with `npm`
# (npm-run-path -> https://packages.maestra.io/npm-run-path/..., a 404).
#
# `replace-registry-host=npmjs` (npm's default, written explicitly) routes only
# registry.npmjs.org URLs through nora. `always` also rewrote nora's OWN tarball
# URLs: npm 10 builds `<registry without slash><pathname>`, so
# https://packages.maestra.io/npm/x/-/x-1.tgz became /npm/npm/x/-/x-1.tgz, a 404
# for every package resolved from a packument rather than the lockfile (an `npx`
# tool, a semantic-release plugin installed on the fly).
#
# The PR secret scan is not part of this workflow: each repo runs it in its own
# workflow that calls this repo's reusable secret-scan workflow (see the README).

name: npm-package-publish

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: ""
      node-version-file:
        type: string
        default: .nvmrc
      scope:
        type: string
        default: "@mindbox-cloud"
      packages-url:
        type: string
        default: https://packages.maestra.io
      packages-audience:
        type: string
        default: packages.maestra.io
      checks:
        type: string
        default: graphql-codegen check-types check-scripts check-styles test
      test-script:
        type: string
        default: test
      report-coverage:
        type: boolean
        default: false
      build-script:
        type: string
        default: build:npm-package
      release-script:
        type: string
        default: release
      release:
        type: boolean
        default: true
      pool:
        type: string
        default: small
    secrets:
      FRONTEND_RELEASE_APP_PRIVATE_KEY:
        required: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('npm-{0}-{1}', github.repository, github.ref) || format('npm-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: runs-on=${{ github.run_id }}-package/pool=${{ inputs.pool == 'build' && 'build' || 'small' }}
    timeout-minutes: 30
    permissions:
      contents: write      # semantic-release tags and GitHub release
      issues: write        # @semantic-release/github success/fail comments
      pull-requests: write
      id-token: write      # nora OIDC token
    env:
      # A step `if` cannot read `secrets`.
      HAS_RELEASE_APP_KEY: ${{ secrets.FRONTEND_RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # semantic-release walks the history to the last tag
      - id: node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}

      # node_modules from the last run with this lockfile: `npm ci` sends the GitHub OIDC
      # token, which expires mid-install on big packages (E401 after ~6 min), and 49
      # packages installing at once overload nora. Keyed on the repo's own lockfile
      # (the nora rewrite below is reverted before the save), package.json and .npmrc:
      # a hit skips `npm ci`, so a manifest out of sync with the lockfile must miss.
      - id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: npm-package-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'package.json', '.npmrc') }}

      - name: write .npmrc
        env:
          URL: ${{ inputs.packages-url }}
          SCOPE: ${{ inputs.scope }}
        run: |
          registry="${URL%/}/npm/"
          # Keep the project's own settings (legacy-peer-deps, install-links...),
          # replace only the registry/auth lines.
          kept=""
          [ -f .npmrc ] && kept=$(grep -vE '^[[:space:]]*(registry|@[^:]+:registry|//[^=]*:_authToken|replace-registry-host|always-auth)[[:space:]]*=' .npmrc || true)
          {
            [ -z "$kept" ] || printf '%s\n' "$kept"
            echo "registry=${registry}"
            echo "${SCOPE}:registry=${registry}"
            echo "//${registry#https://}:_authToken=\${NPM_TOKEN}"
            echo "replace-registry-host=npmjs"
          } > "$RUNNER_TEMP/npmrc"
          mv "$RUNNER_TEMP/npmrc" .npmrc
          echo "registry ${registry}, scope ${SCOPE}"

      - name: mint packages token
        id: token
        uses: actions/github-script@v9.0.0
        env:
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);

      - name: install
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          NPM_TOKEN: ${{ steps.token.outputs.token }}
          URL: ${{ inputs.packages-url }}
        run: |
          # Same program as scripts/npm-lockfile-to-nora.sh (keep in sync; selftest covers the script).
          nora="${URL%/}/npm/"
          nora_re=$(printf '%s' "$nora" | sed 's/[.[\*^$/]/\\&/g')
          locks=()
          for f in package-lock.json npm-shrinkwrap.json; do [ -f "$f" ] && locks+=("$f"); done
          for f in "${locks[@]}"; do
            sed -i.bak -E \
              -e "s#(\"resolved\": *\")https://artifactory\.mindbox\.ru/artifactory/api/npm/[^/\"]+/#\1${nora}#g" \
              -e "s#(\"resolved\": *\"${nora_re}@[^/\"]+/[^/\"]+/-/)@[^/\"]+/#\1#g" \
              -e "s#(\"resolved\": *\")https://registry\.npmjs\.org/#\1${nora}#g" \
              "$f"
            rm -f "$f.bak"
          done
          npm ci --prefer-offline --ignore-scripts
          [ "${#locks[@]}" -eq 0 ] || git checkout -- "${locks[@]}"

      # Before the checks: a red check must not cost the next run its install.
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # lib@3 ran these as separate jobs, so one red check did not hide the others.
      # graphql-codegen goes first: on push it generates the code build:npm-package needs.
      - name: checks
        id: checks
        if: ${{ inputs.test-script == 'test' && inputs.checks != '' }}
        env:
          CHECKS: ${{ inputs.checks }}
          COVERAGE: ${{ inputs.report-coverage && github.event_name == 'pull_request' }}
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          printf '### npm checks\n\n| script | result |\n|---|---|\n' >> "$summary"
          failed=""
          for s in $CHECKS; do
            if ! jq -e --arg s "$s" '.scripts[$s]' package.json > /dev/null; then
              echo "| \`$s\` | no such script |" >> "$summary"
              continue
            fi
            set --
            case "$s" in
              check-styles) set -- --allow-empty-input ;;
              test) [ "$COVERAGE" != true ] || set -- --coverage --coverage.reportsDirectory=coverage \
                      --coverage.reporter=json-summary --coverage.reporter=text-summary --coverage.reporter=lcov ;;
            esac
            echo "::group::npm run $s $*"
            if npm run "$s" ${1:+--} "$@"; then r=passed; else r=failed; failed="$failed $s"; fi
            echo "::endgroup::"
            echo "| \`$s\` | $r |" >> "$summary"
          done
          [ -z "$failed" ] || { echo "::error::npm checks failed:$failed"; exit 1; }

      - name: test
        if: ${{ inputs.test-script != 'test' && inputs.test-script != '' }}
        env:
          SCRIPT: ${{ inputs.test-script }}
        run: npm run --if-present "$SCRIPT"

      - name: upload coverage
        if: ${{ always() && inputs.report-coverage && github.event_name == 'pull_request' && steps.checks.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      # lib@3 comment-coverage: one comment per PR, updated on every push. A fork
      # PR has a read-only token; the comment is a nicety, not a check.
      - name: coverage comment
        if: ${{ always() && inputs.report-coverage && github.event_name == 'pull_request' && steps.checks.conclusion != 'skipped' }}
        continue-on-error: true
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- npm-package-publish-coverage -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            try {
              const total = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
              const rows = ['statements', 'branches', 'functions', 'lines']
                .map(k => `| ${k} | ${total[k].pct}% | ${total[k].covered}/${total[k].total} |`);
              body = [MARKER, '**Coverage summary**', '', '| | % | covered |', '|---|---|---|', ...rows, '',
                `Full report: \`coverage\` artifact of [the run](${run}).`];
            } catch {
              body = [MARKER, '**Coverage report** :x:', '', `Coverage not found in [the run](${run}).`];
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: body.join('\n') });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: body.join('\n') });
            }

      # Fresh token: tests may outlive the first one.
      - name: mint release token
        id: release-token
        if: ${{ inputs.release && github.event_name != 'pull_request' }}
        uses: actions/github-script@v9.0.0
        env:
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);

      # The version commit must pass the default branch's ruleset (see "Release token").
      - name: mint release app token
        id: app
        if: ${{ inputs.release && github.event_name != 'pull_request' && env.HAS_RELEASE_APP_KEY == 'true' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.FRONTEND_RELEASE_APP_ID }}
          private-key: ${{ secrets.FRONTEND_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          # Not the installation's whole set: what the job's github.token has for
          # semantic-release (push + tag; @semantic-release/github release comments).
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: release (semantic-release)
        if: ${{ inputs.release && github.event_name != 'pull_request' }}
        env:
          NPM_TOKEN: ${{ steps.release-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          HUSKY: "0"
          LEFTHOOK: "0"
          BUILD_SCRIPT: ${{ inputs.build-script }}
          RELEASE_SCRIPT: ${{ inputs.release-script }}
        run: |
          [ -z "$BUILD_SCRIPT" ] || npm run --if-present "$BUILD_SCRIPT"
          # semantic-release takes the git remote from package.json `repository`,
          # which still names the GitLab project in ported repos: it would push the
          # version commit and tag there (and fail auth). Release where we build.
          npm run "$RELEASE_SCRIPT" -- --repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
