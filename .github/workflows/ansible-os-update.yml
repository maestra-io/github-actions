# maestra-io/github-actions/.github/workflows/ansible-os-update.yml
#
# Rolling OS update (apt + kernel + reboot) for the pet VMs — haproxy farms, NAT
# gateways, VPN hosts. issues-maestra#1104.
#
# WHY A PER-HOST MATRIX AND NOT `serial: 1` INSIDE ONE ANSIBLE RUN
# teleport-actions/auth mints ONE SSH certificate per job, at job start
# (ansible-run.yml). A 12-host farm at ~14 min/host is ~2.5h — well past any
# certificate TTL the bot role will grant, and the cert dies on every remaining
# host at the same instant. haproxy-maestra already has this burn on record
# (deploy.yml: "rolling_interval=180s stretches the apply past the Teleport SSH
# session lifetime — run 25733140071 lost the API tunnel ~16 minutes in").
# One job per host = a fresh cert per host, and "Re-run failed jobs" becomes the
# resume button: it replays the failed host and everything fail-fast cancelled,
# in order, reusing enumerate/plan.
#
# The per-host jobs deliberately keep the FARM-level concurrency group of
# ansible-run.yml (they do not pass a concurrency_suffix), so an os-update can
# never interleave with a normal config deploy of the same farm — a deploy landing
# mid-drain would happily unmask keepalived/haproxy on a host we just drained.
name: Ansible OS Update (reusable)

on:
  workflow_call:
    inputs:
      playbook:
        description: "Playbook path relative to working_directory."
        required: false
        type: string
        default: "playbooks/os-update.yml"
      inventory:
        required: false
        type: string
        default: "inventory/teleport_inventory.py"
      working_directory:
        required: false
        type: string
        default: "ansible"
      region:
        required: true
        type: string
      environment:
        required: true
        type: string
      site:
        required: true
        type: string
      inventory_group_suffix:
        description: "Suffix appended to <region>_<env>_<site> to form the target group (_nat_gateway, _vpn, _haproxy_public, ...)."
        required: false
        type: string
        default: ""
      host_limit:
        description: "Subset escape hatch: one host, or a CSV batch. The matrix is exactly those hosts, in the order given."
        required: false
        type: string
        default: ""
      mode:
        description: >-
          plan | stage | apply | binary-update | undrain-only. `plan` mutates
          nothing; `stage` installs without rebooting; `binary-update` drains,
          swaps the SERVING BINARY, verifies and undrains, skipping the
          apt/kernel/reboot path entirely — and on failure it leaves the host
          DRAINED (issues-maestra#1373).
        required: false
        type: string
        default: "plan"
      order:
        description: >-
          Explicit host order, CSV. Empty = alphabetical. Must list EVERY host in the
          target group exactly once (a typo, a duplicate or an omitted host fails the
          run rather than silently skipping a host); use host_limit for a single host.
        required: false
        type: string
        default: ""
      alertmanager_app:
        description: "Teleport app for the Alertmanager tunnel (maintenance silences)."
        required: false
        type: string
        default: "alertmanager"
      silence_minutes:
        description: "Dead-man window for the silences. Must stay < OsUpdateHostStrandedDrain's for: (30m)."
        required: false
        type: number
        default: 25
      reboot_timeout:
        required: false
        type: number
        default: 900
      post_reboot_delay:
        description: "Seconds to wait after reboot before probing — must cover Teleport agent re-registration."
        required: false
        type: number
        default: 45
      certificate_ttl:
        description: "Per-HOST job, so 1h is ample. Capped by the bot role's max_session_ttl."
        required: false
        type: string
        default: "1h"
      aws_workload_identity:
        description: >-
          Forwarded to ansible-run on the APPLY job: `name=<workload-identity>
          role_arn=<arn>` mints a Teleport workload-identity JWT on the RUNNER so the
          play can call AWS as the CI principal. Empty (default) changes nothing.
          haproxy's drain flips a weighted Route53 record and used to do that ON THE
          HOST with the host's own tbot JWT — which exists only where certbot's does,
          so a farm without certbot could not be drained at all.
        required: false
        type: string
        default: ""
      max_hosts:
        description: "Refuse to run if the group is bigger than this (typo/label-drift guard)."
        required: false
        type: number
        default: 20
      extra_run_args:
        required: false
        type: string
        default: ""
    secrets:
      VECTOR_SIEM_BASIC_AUTH_USER:
        required: false
      VECTOR_SIEM_BASIC_AUTH_PASSWORD:
        required: false
      PROXMOX_MONITORING_PASSWORD:
        required: false
      SOC_DISPATCH_APP_PRIVATE_KEY:
        description: >-
          PEM private key of the GitHub App that dispatches the SOC vuln-scan (paired
          with the org variable SOC_DISPATCH_APP_ID). The job's own GITHUB_TOKEN cannot
          trigger a workflow in maestra-io/soc — it is scoped to the calling repo — so
          the soc-rescan step mints a short-lived, soc-only installation token from this
          App and calls the SAME vuln-scan.yaml the weekly cron uses, just scoped to the
          hosts we patched. Absent (App not set up) = the re-scan is SKIPPED with a loud
          warning and the exact command to run by hand — never a silent green.
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install ansible
        run: uv pip install --system -r ansible/requirements-pip.txt

      - name: Get Teleport version from proxy
        id: tp-version
        run: |
          VER="$(/usr/bin/curl -sf "https://teleport.maestra.io:443/webapi/find" \
            | jq -r '.auto_update.tools_version // .server_version')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Setup Teleport
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}

      # teleport-actions/auth mints the certificate by running tbot, whose heartbeat
      # to the proxy intermittently fails ("keepalive ping failed to receive ACK
      # within timeout") and reds a whole run before a single host is touched. The
      # first attempt is allowed to fail; the retry decides the job.
      - name: Teleport auth
        id: teleport-auth
        continue-on-error: true
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: teleport.maestra.io:443
          token: github-actions-infra-deploy
          certificate-ttl: 30m

      - name: Teleport auth — retry
        id: teleport-auth-retry
        if: steps.teleport-auth.outcome == 'failure'
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: teleport.maestra.io:443
          token: github-actions-infra-deploy
          certificate-ttl: 30m

      - name: Build the host list
        id: list
        working-directory: ${{ inputs.working_directory }}
        env:
          TELEPORT_IDENTITY_FILE: ${{ steps.teleport-auth.outputs.identity-file || steps.teleport-auth-retry.outputs.identity-file }}
          TBOT_DEST_DIR: ${{ steps.teleport-auth.outputs.destination-dir || steps.teleport-auth-retry.outputs.destination-dir }}
          TELEPORT_PROXY: teleport.maestra.io:443
          GROUP: ${{ inputs.region }}_${{ inputs.environment }}_${{ inputs.site }}${{ inputs.inventory_group_suffix }}
          HOST_LIMIT: ${{ inputs.host_limit }}
          ORDER: ${{ inputs.order }}
          MAX_HOSTS: ${{ inputs.max_hosts }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          # The reusable contract is open to any caller (the shims use type: choice,
          # but nothing forces a caller to). An unknown mode would make the apply
          # job's `if` false and the run would end GREEN as a plan — a typo'd
          # `mode=aply` must fail loudly instead.
          case "${MODE}" in
            plan|stage|apply|undrain-only|binary-update) ;;
            *) echo "::error::Unknown mode '${MODE}' — must be plan, stage, apply, binary-update or undrain-only"; exit 1;;
          esac

          ansible-inventory -i "${{ inputs.inventory }}" --list > /tmp/inv.json

          if [ -n "${HOST_LIMIT}" ]; then
            # One host, or a CSV batch. A batch exists to amortise enumerate+plan,
            # which are per-RUN and cost ~2.7 min: sweeping the 54-host us-omega
            # worker tier one run per host pays that 54 times (~2.5 h) for ~12 min
            # of actual work each (issues-maestra#1240). It is not a way to touch
            # several hosts at once — the apply matrix stays max-parallel: 1, and
            # the consumers' own cluster locks still allow exactly one drained
            # node at a time.
            #
            # Validated against the group for the same reason `order` is: today a
            # typo'd name becomes a one-host matrix that dies deep inside the
            # apply job ("no hosts matched"), and in a batch it would silently
            # cost the whole remainder of the run to fail-fast. Fail here instead,
            # naming the bad host. `plan` needs no change — it passes host_limit
            # to ansible's --limit, which takes a CSV natively.
            HOSTS="$(jq -c --arg g "${GROUP}" --arg h "${HOST_LIMIT}" '
              ($h | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))) as $want
              | (.[$g].hosts // []) as $have
              | ($want - $have) as $bogus
              | ($want | group_by(.) | map(select(length > 1) | .[0])) as $dupes
              | if ($want | length) == 0
                then error("host_limit is only separators: \($h)")
                elif ($bogus | length) > 0
                then error("hosts not in group \($g): \($bogus | join(", "))")
                elif ($dupes | length) > 0
                then error("duplicate hosts in host_limit: \($dupes | join(", "))")
                else $want end' /tmp/inv.json)"
          elif [ -n "${ORDER}" ]; then
            # Explicit order. The list must be exactly the group: a typo must fail the
            # run, a duplicate must not produce two matrix legs for one host, and an
            # OMITTED host must not be silently dropped from the fleet sweep.
            HOSTS="$(jq -c --arg g "${GROUP}" --arg o "${ORDER}" '
              ($o | split(",") | map(gsub("^\\s+|\\s+$";""))) as $want
              | (.[$g].hosts // []) as $have
              | ($want - $have) as $bogus
              | ($want | group_by(.) | map(select(length > 1) | .[0])) as $dupes
              | ($have - $want) as $missing
              | if ($bogus | length) > 0
                then error("hosts not in group \($g): \($bogus | join(", "))")
                elif ($dupes | length) > 0
                then error("duplicate hosts in order: \($dupes | join(", "))")
                elif ($missing | length) > 0
                then error("order must list every host in group \($g) — missing: \($missing | join(", ")). Use host_limit for a single host.")
                else $want end' /tmp/inv.json)"
          else
            HOSTS="$(jq -c --arg g "${GROUP}" '(.[$g].hosts // []) | sort' /tmp/inv.json)"
          fi

          N="$(echo "${HOSTS}" | jq 'length')"
          if [ "${N}" -eq 0 ]; then
            echo "::error::No hosts matched group ${GROUP}"
            exit 1
          fi
          if [ "${N}" -gt "${MAX_HOSTS}" ]; then
            echo "::error::${N} hosts > max_hosts=${MAX_HOSTS} for group ${GROUP} — refusing (label drift?)"
            exit 1
          fi

          echo "hosts=${HOSTS}" >> "$GITHUB_OUTPUT"
          {
            echo "### OS update — ${N} host(s) in \`${GROUP}\`, in this order"
            echo ""
            echo "${HOSTS}" | jq -r 'to_entries[] | "\(.key + 1). `\(.value)`"'
          } >> "$GITHUB_STEP_SUMMARY"

  # Read-only across the WHOLE group: pending packages, reboot decision, /boot
  # headroom, peer health, and "is anyone already drained". Never gated — you
  # approve `apply` after you have read the plan.
  #
  # This job is the ONE place the playbook's "one host per job" guard must be
  # relaxed: the guard exists to stop a human running a fleet-wide APPLY by hand
  # (which would skip the GH-level fail-fast, per-host approval and artifact trail),
  # but a plan is read-only and is deliberately farm-wide — you want to see every
  # host's pending packages in one table. Without os_update_allow_multi the guard
  # fires on the plan itself and the run dies before it reaches a host (run
  # 29360255290).
  plan:
    needs: enumerate
    # NOT in undrain-only, and NOT in stage — the same reason twice.
    #
    # The plan job always runs the role with os_update_mode=plan, whatever the
    # operator asked for, and that mode runs the consumer preflight in full. Every
    # gate in there decides whether a host may be taken OUT of rotation: peer
    # health, "every node Ready", "nobody else cordoned", capacity for the evicted
    # pods. A mode that takes nothing out of rotation must not be gated by them.
    #
    #   undrain-only — on a host stranded mid-drain (haproxy soft-stopped +
    #     masked) preflight FAILS, which would skip `apply` and brick the very
    #     escape hatch the mode exists to be.
    #   stage — it installs packages and reboots nothing. Its whole purpose is to
    #     run WHILE a Deckhouse node-update wave is rolling, so the platform's own
    #     reboots activate the staged kernel instead of being wasted. But a wave
    #     means, by definition, that some node is cordoned or NotReady — so
    #     "every node Ready" refuses, and a failed plan job skips the apply job.
    #     Measured 2026-08-27: run 33086587730 died on the contending-wave gate,
    #     which was then made apply-only (kubernetes-clusters#78); run 33088788156
    #     died on "Every node is Ready" instead, with the message "refusing to
    #     DRAIN" on a run that drains nothing. Patching gate by gate was the wrong
    #     shape — the next drain gate would do it again. A non-draining mode must
    #     not be gated by drain preflights at all.
    #   binary-update — a different reason: the plan is entirely an APT/KERNEL
    #     report (pending packages, reboot decision, /boot headroom) and this mode
    #     unpacks no kernel, so the /boot guard would refuse a run that cannot
    #     consume /boot. It DOES drain, but its peer gates run in-band in the apply
    #     job — the role runs the consumer preflight for every mode but `stage`,
    #     immediately before the drain, which is the only place that answer is
    #     still true. Skipping this job also returns ~2.7 min to a mode whose
    #     acceptance criterion is a <=10 min per-host cycle (issues-maestra#1373).
    if: ${{ inputs.mode != 'undrain-only' && inputs.mode != 'stage' && inputs.mode != 'binary-update' }}
    uses: ./.github/workflows/ansible-run.yml
    secrets: inherit
    with:
      playbook: ${{ inputs.playbook }}
      inventory: ${{ inputs.inventory }}
      working_directory: ${{ inputs.working_directory }}
      region: ${{ inputs.region }}
      environment: ${{ inputs.environment }}
      site: ${{ inputs.site }}
      inventory_group_suffix: ${{ inputs.inventory_group_suffix }}
      host_limit: ${{ inputs.host_limit }}
      # NOT --check: command/shell/apt are skipped in check mode, which would leave
      # every probe register undefined and make the plan a green no-op.
      check_mode: false
      use_mitogen: false
      no_hosts_fail_on_apply: true
      certificate_ttl: 30m
      # The plan is read-only, but it deliberately does NOT use --check (command /
      # shell / apt are skipped there, which would leave every probe register
      # undefined). So it cannot be recognised as read-only from inside ansible-run,
      # and without its own lane it would sit in the farm's MUTATING concurrency
      # group — where any Renovate PR check landing in the group evicts it, because
      # GitHub keeps at most one pending job per group. That is how run 29359006993
      # was cancelled before it ever reached a host.
      concurrency_suffix: "-osupdate-plan"
      tbot_tunnels: |
        app=${{ inputs.alertmanager_app }} listen=9093
      extra_run_args: >-
        -e os_update_mode=plan
        -e os_update_am_url=http://127.0.0.1:9093
        -e os_update_allow_multi=true
        ${{ inputs.extra_run_args }}
      # run_attempt: upload-artifact v4 rejects a duplicate name within a run (409),
      # and "Re-run failed jobs" — the documented resume button — reuses run_number.
      artifact_name: os-update-plan-${{ inputs.region }}-${{ inputs.environment }}-${{ inputs.site }}${{ inputs.inventory_group_suffix }}-${{ github.run_number }}-${{ github.run_attempt }}

  apply:
    needs: [enumerate, plan]
    # `!cancelled()` because in undrain-only, stage and binary-update the plan job
    # is SKIPPED (see above) and the default `success()` would skip this job too.
    # plan success is still required for mode=apply. binary-update drains as well,
    # but its peer gates are the role's in-band preflight rather than this job —
    # see the plan job's note.
    if: >-
      ${{ !cancelled()
          && needs.enumerate.result == 'success'
          && (needs.plan.result == 'success'
              || inputs.mode == 'undrain-only'
              || inputs.mode == 'stage'
              || inputs.mode == 'binary-update')
          && (inputs.mode == 'apply' || inputs.mode == 'stage'
              || inputs.mode == 'binary-update' || inputs.mode == 'undrain-only') }}
    strategy:
      matrix:
        host: ${{ fromJSON(needs.enumerate.outputs.hosts) }}
      max-parallel: 1
      fail-fast: true
    uses: ./.github/workflows/ansible-run.yml
    secrets: inherit
    with:
      playbook: ${{ inputs.playbook }}
      inventory: ${{ inputs.inventory }}
      working_directory: ${{ inputs.working_directory }}
      region: ${{ inputs.region }}
      environment: ${{ inputs.environment }}
      site: ${{ inputs.site }}
      inventory_group_suffix: ${{ inputs.inventory_group_suffix }}
      host_limit: ${{ matrix.host }}
      check_mode: false
      use_mitogen: false
      no_hosts_fail_on_apply: true
      certificate_ttl: ${{ inputs.certificate_ttl }}
      # Every MUTATING mode routes through this job — apply, binary-update and
      # undrain-only — and all three move a weighted Route53 record (withdraw or
      # restore). The plan job never does, which is why it is not forwarded there.
      aws_workload_identity: ${{ inputs.aws_workload_identity }}
      tbot_tunnels: |
        app=${{ inputs.alertmanager_app }} listen=9093
      extra_run_args: >-
        -e os_update_mode=${{ inputs.mode }}
        -e os_update_am_url=http://127.0.0.1:9093
        -e os_update_silence_minutes=${{ inputs.silence_minutes }}
        -e os_update_reboot_timeout=${{ inputs.reboot_timeout }}
        -e os_update_post_reboot_delay=${{ inputs.post_reboot_delay }}
        -e os_update_run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ${{ inputs.extra_run_args }}
      # run_attempt: the failed attempt already uploaded os-update-<host>-<N> (the
      # upload step is if: always()), and upload-artifact v4 409s on a duplicate
      # name — without the attempt suffix, "Re-run failed jobs" red-loops on the
      # artifact step after the playbook has already succeeded.
      artifact_name: os-update-${{ matrix.host }}-${{ github.run_number }}-${{ github.run_attempt }}
      # The family rule (ansible-manual.yml): omega is gated by a GitHub Environment,
      # omicron is not. Never invent an environment name for omicron — GitHub would
      # silently create it WITHOUT protection rules, which reads like a gate and isn't one.
      gh_environment: ${{ inputs.environment == 'omega' && format('{0}-{1}-{2}', inputs.region, inputs.environment, inputs.site) || '' }}

  # Close the loop. The fleet is not "patched" because `uname -r` changed — it is
  # patched when the vulnerability scanner AGREES. So re-scan exactly the hosts we
  # just touched and push the findings to the SOC portal, instead of leaving the
  # board stale until the next weekly sweep (Monday 05:00 UTC).
  #
  # This is also the only end-to-end check on the update payload itself: the kernel
  # gate proves we booted a newer kernel, but only the scan proves the CVEs that put
  # this fleet on the SOC board in the first place are actually gone.
  soc-rescan:
    needs: [enumerate, apply]
    # Also on apply FAILURE: a partial sweep (host k fails, fail-fast cancels the
    # rest) has still patched hosts 1..k-1, and skipping the re-scan would leave
    # exactly the stale-board scenario this job exists to prevent. The dispatched
    # list is the full enumerate list — re-scanning an unpatched host is harmless.
    #
    # `apply` ONLY, deliberately: binary-update installs no archive package and
    # changes no OS-package inventory, so it moves nothing the host CVE board
    # reads. Dispatching a scan there would burn the scanner on an unchanged host
    # every time a binary track is bumped.
    if: ${{ inputs.mode == 'apply' && !cancelled() && contains(fromJSON('["success","failure"]'), needs.apply.result) }}
    runs-on: ubuntu-latest
    steps:
      # A dedicated GitHub App (org variable SOC_DISPATCH_APP_ID + org secret
      # SOC_DISPATCH_APP_PRIVATE_KEY) scoped to actions:write on maestra-io/soc only.
      # We mint a short-lived installation token from it here, scoped to just that repo.
      # This calls the SAME vuln-scan.yaml the weekly cron runs — no duplicated scanner
      # logic; the only thing we add is triggering it, for the hosts we patched, now.
      #
      # If the App is not configured, `create-github-app-token` fails; we let it fail
      # SOFT (continue-on-error) so a missing SOC integration never fails an otherwise
      # good patch run — but the next step turns "no token" into a loud warning, never a
      # silent green.
      - name: Mint a soc-scoped token from the dispatch App
        id: soc-token
        if: ${{ vars.SOC_DISPATCH_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SOC_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SOC_DISPATCH_APP_PRIVATE_KEY }}
          owner: maestra-io
          repositories: soc

      - name: Re-scan the patched hosts and push to SOC
        env:
          HOSTS: ${{ needs.enumerate.outputs.hosts }}
          SOC_TOKEN: ${{ steps.soc-token.outputs.token }}
          SOC_TOKEN_OUTCOME: ${{ steps.soc-token.outcome }}
        run: |
          set -euo pipefail
          LIST="$(printf '%s' "${HOSTS}" | jq -r 'join(",")')"

          if [ -z "${SOC_TOKEN}" ]; then
            # Loud, never silently green. A skipped re-scan means SOC keeps showing the
            # PRE-PATCH findings, and the next person to look at the board concludes the
            # fleet is still vulnerable — or, worse, that the patch run did nothing.
            # Two distinct causes, two distinct remediations: the App may be absent
            # (outcome=skipped — the mint step never ran), or configured but BROKEN
            # (outcome=failure — revoked installation, bad private key; the
            # continue-on-error swallowed it).
            if [ "${SOC_TOKEN_OUTCOME}" = "failure" ]; then
              echo "::warning::SOC re-scan SKIPPED — the dispatch App IS configured (org var SOC_DISPATCH_APP_ID) but the token mint FAILED — check the App installation on maestra-io/soc and the SOC_DISPATCH_APP_PRIVATE_KEY secret. The hosts ARE patched, but the SOC board still shows pre-patch findings until someone runs: gh workflow run vuln-scan.yaml --repo maestra-io/soc -f hosts=${LIST}"
              {
                echo "### SOC re-scan SKIPPED — App configured but token mint FAILED"
                echo ""
                echo "The hosts **are** patched, but the SOC board still shows the pre-patch"
                echo "findings until it is re-scanned. Run it by hand:"
                echo ""
                echo "    gh workflow run vuln-scan.yaml --repo maestra-io/soc -f hosts=${LIST}"
                echo ""
                echo "Then fix the dispatch App: check the App installation on \`maestra-io/soc\`"
                echo "and that the org secret \`SOC_DISPATCH_APP_PRIVATE_KEY\` matches the App in"
                echo "the org variable \`SOC_DISPATCH_APP_ID\` (see the failed mint step's log)."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::SOC re-scan SKIPPED — the SOC dispatch App is not configured (org var SOC_DISPATCH_APP_ID / secret SOC_DISPATCH_APP_PRIVATE_KEY). The hosts ARE patched, but the SOC board still shows pre-patch findings until someone runs: gh workflow run vuln-scan.yaml --repo maestra-io/soc -f hosts=${LIST}"
            {
              echo "### SOC re-scan SKIPPED — dispatch App not configured"
              echo ""
              echo "The hosts **are** patched, but the SOC board still shows the pre-patch"
              echo "findings until it is re-scanned. Run it by hand:"
              echo ""
              echo "    gh workflow run vuln-scan.yaml --repo maestra-io/soc -f hosts=${LIST}"
              echo ""
              echo "To make this automatic: create a GitHub App with **Actions: write** on"
              echo "\`maestra-io/soc\`, then set the org variable \`SOC_DISPATCH_APP_ID\` and the"
              echo "org secret \`SOC_DISPATCH_APP_PRIVATE_KEY\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Dispatching the SOC vuln-scan (the same weekly workflow) for: ${LIST}"
          # --ref is EXPLICIT on purpose: without it, gh resolves the default
          # branch via GraphQL repository.defaultBranchRef, which the App's
          # actions:write + metadata:read token is NOT allowed to query
          # ("Resource not accessible by integration") — the dispatch died
          # there on the first live run after the App secret was fixed
          # (2026-08-04). The REST dispatch itself needs only actions:write.
          GH_TOKEN="${SOC_TOKEN}" gh workflow run vuln-scan.yaml \
            --repo maestra-io/soc \
            --ref main \
            -f hosts="${LIST}" \
            -f dry_run=false

          {
            echo "### SOC re-scan dispatched"
            echo ""
            echo "Hosts: \`${LIST}\`"
            echo ""
            echo "<https://github.com/maestra-io/soc/actions/workflows/vuln-scan.yaml>"
          } >> "$GITHUB_STEP_SUMMARY"
