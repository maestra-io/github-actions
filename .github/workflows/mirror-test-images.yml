# Third-party images that integration tests pull with Testcontainers, rebuilt
# from upstream release binaries into ECR us-west-2 under test-images/<name>
# (issues-maestra#1442, W1: quay.io/minio/minio now refuses anonymous pulls and
# the GitLab pipelines pulled it from the Yandex mirror, which GitHub builds must
# not depend on).
#
# Add an image: one `include` entry: repository, tag, url and sha256 of the
# release binary, `asset` (the file name it is saved as) and a Dockerfile under
# test-images/ that COPYs that file. The sha256 is pinned here and also checked against the
# upstream `.sha256sum` asset when `sha256sum-url` is given.
#
# Runs on dispatch and weekly; an entry whose tag already exists in ECR is
# skipped (release tags are immutable), so the cron only builds new entries.
# Push identity: the org-wide Teleport image-push token, valid on main only.
#
# Consumers: <account>.dkr.ecr.us-west-2.amazonaws.com/test-images/<name>:<tag>,
# e.g. via dotnet-service-build `test-env`.

name: mirror-test-images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: mirror-test-images
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-west-2

jobs:
  image:
    runs-on: runs-on=${{ github.run_id }}-image-${{ strategy.job-index }}/pool=build
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Teleport join for the ECR push
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: test-images/minio
            tag: RELEASE.2025-09-07T16-13-09Z
            url: https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
            sha256sum-url: https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z.sha256sum
            sha256: 7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f
            dockerfile: test-images/minio.Dockerfile
            asset: minio
          # Messaging, ai-assistant-rnd, db-maintenance pin this one (issues-maestra#1569).
          - repository: test-images/minio
            tag: RELEASE.2025-03-12T18-04-18Z
            url: https://github.com/minio/minio/releases/download/RELEASE.2025-03-12T18-04-18Z/minio.linux-amd64.RELEASE.2025-03-12T18-04-18Z
            sha256sum-url: https://github.com/minio/minio/releases/download/RELEASE.2025-03-12T18-04-18Z/minio.linux-amd64.RELEASE.2025-03-12T18-04-18Z.sha256sum
            sha256: 8ec42f70f5db7bfe584790b06af3f7e2b16f48488ea4c96e0ebd8cea40990dfa
            dockerfile: test-images/minio.Dockerfile
            asset: minio
          # minio RELEASE.2025-09-07T16-13-09Z + mc (dm-serving execs `mc` in the
          # container, issues-maestra#1569); the entry's binary is mc, minio is
          # ADDed with its checksum in the Dockerfile.
          - repository: test-images/minio-mc
            tag: RELEASE.2025-09-07T16-13-09Z
            url: https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
            sha256sum-url: https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z.sha256sum
            sha256: 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
            dockerfile: test-images/minio-mc.Dockerfile
            asset: mc
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's instance role reads ECR (pull-through cache), enough for a
      # describe-images; any other answer than "found" means build.
      - name: already in ECR?
        id: exists
        env:
          REPOSITORY: ${{ matrix.repository }}
          TAG: ${{ matrix.tag }}
        run: |
          if aws ecr describe-images --region "$AWS_REGION" --repository-name "$REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "${REPOSITORY}:${TAG} already in ECR, skipping"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: download and verify
        if: ${{ steps.exists.outputs.found != 'true' }}
        env:
          URL: ${{ matrix.url }}
          SUM_URL: ${{ matrix.sha256sum-url }}
          SHA256: ${{ matrix.sha256 }}
          ASSET: ${{ matrix.asset }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          ctx="$RUNNER_TEMP/ctx"; mkdir -p "$ctx"
          curl -sfL --retry 3 -o "$ctx/$ASSET" "$URL"
          echo "${SHA256}  $ctx/$ASSET" | sha256sum -c -
          if [ -n "$SUM_URL" ]; then
            upstream=$(curl -sfL --retry 3 "$SUM_URL" | awk '{print $1}')
            [ "$upstream" = "$SHA256" ] || { echo "::error::upstream sha256 ${upstream} != pinned ${SHA256}"; exit 1; }
          fi
          chmod 0755 "$ctx/$ASSET"
          cp "$DOCKERFILE" "$ctx/Dockerfile"

      - name: ecr login
        id: ecr
        if: ${{ steps.exists.outputs.found != 'true' }}
        uses: maestra-io/github-actions/push-to-aws-ecr-repository@2450cdaaf4688887cb65579fc45ab5304cb81967 # v1.46.2
        with:
          awsRegion: us-west-2
          repositories: ${{ matrix.repository }}
          targetTag: ${{ matrix.tag }}
          teleportToken: image-push-github-actions-maestra-io
          push: false

      - if: ${{ steps.exists.outputs.found != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build and push ${{ matrix.repository }}:${{ matrix.tag }}
        if: ${{ steps.exists.outputs.found != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/ctx
          pull: true
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
