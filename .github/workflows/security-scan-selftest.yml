---
# security-scan PR mode for real: scripts/test-security-scan-pr.sh runs security-scan/pr-scan.sh
# with gitleaks, trivy and opengrep on fixture repos (a new secret, sqli and vulnerable bump
# fail; an old finding untouched or moved, and an unrelated PR, pass). The scanners are the
# versions and sha256 pinned in security-scan.yml and trivy's DBs, through nora with the job's OIDC token, the
# rules are the same semgrep-rules security selection.
name: security-scan-selftest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/security-scan-selftest.yml"
      - ".github/workflows/security-scan.yml"
      - "security-scan/**"
      - "nora-session/**"
      - "gitleaks/**"
      - "scripts/test-security-scan-pr.sh"
      - "scripts/test-security-scan-fetch-pinned.sh"

permissions:
  contents: read

jobs:
  pr-mode:
    runs-on: runs-on=${{ github.run_id }}-security-scan-pr/pool=small
    # The opengrep cases make 11 runs, on one rule file per directory (rules-bundle.py).
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # nora OIDC token for the scanner downloads
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: release
          path: .semgrep-rules
          persist-credentials: false
      - name: Install the scanners pinned in security-scan.yml
        run: |
          set -euo pipefail
          wf=.github/workflows/security-scan.yml
          v() { yq -r ".jobs.$1.env.$2" "$wf"; }
          oidc="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=packages.maestra.io" | jq -r .value)"
          echo "::add-mask::${oidc}"
          get() { # <url path under packages.maestra.io/github/> <sha256> <file>
            printf 'user = "oidc:%s"\n' "$oidc" | curl -sfL --retry 5 --retry-delay 5 --retry-all-errors -K - -o "$3" \
              "https://packages.maestra.io/github/$1"
            echo "$2  $3" | sha256sum -c -
          }
          t=$RUNNER_TEMP
          g=$(v gitleaks GITLEAKS_VERSION); get "gitleaks/gitleaks/releases/download/v$g/gitleaks_${g}_linux_x64.tar.gz" "$(v gitleaks GITLEAKS_SHA256)" "$t/gitleaks.tgz"
          r=$(v trivy TRIVY_VERSION); get "aquasecurity/trivy/releases/download/v$r/trivy_${r}_Linux-64bit.tar.gz" "$(v trivy TRIVY_SHA256)" "$t/trivy.tgz"
          o=$(v opengrep OPENGREP_VERSION); get "opengrep/opengrep/releases/download/v$o/opengrep_manylinux_x86" "$(v opengrep OPENGREP_SHA256)" "$t/opengrep"
          tar -xzf "$t/gitleaks.tgz" -C "$t" gitleaks; tar -xzf "$t/trivy.tgz" -C "$t" trivy; chmod +x "$t/opengrep"
          # the security rule selection of security-scan.yml
          mv .semgrep-rules "$t/semgrep-rules"; cd "$t/semgrep-rules"
          rm -rf .git .github scripts stats libsonnet trusted_python
          find . -type f ! -name '*.yaml' -delete
          find . -name '*.yaml' ! -exec grep -qE '^[[:space:]]+category:[[:space:]]*security[[:space:]]*$' {} \; -delete
          find . -path '*/secrets/*' -delete
          find . -type d -empty -delete
          python3 "$GITHUB_WORKSPACE/security-scan/rules-bundle.py" --self-test
          python3 "$GITHUB_WORKSPACE/security-scan/rules-bundle.py" . "$t/semgrep-rules-bundle"
      - name: trivy DBs through nora
        run: bash security-scan/trivy-nora-env.sh "$RUNNER_TEMP/trivy-docker"
      # Proof that trivy fetches nothing around nora: the DB and a POM (commons-text 1.9,
      # CVE-2022-42889) come from packages.maestra.io, Maven Central and mirror.gcr never appear.
      - name: trivy fetches only from nora
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          printf '%s\n' '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>' \
            '<groupId>x</groupId><artifactId>y</artifactId><version>1</version><dependencies><dependency>' \
            '<groupId>org.apache.commons</groupId><artifactId>commons-text</artifactId><version>1.9</version>' \
            '</dependency></dependencies></project>' > "$d/pom.xml"
          "$RUNNER_TEMP/trivy" fs --debug --scanners vuln --format json --output "$d/out.json" "$d" 2> "$d/log"
          grep -E 'Downloading artifact|\[pom\] (Fetching|Failed|Adding mirror)|commons-text-1.9.pom' "$d/log" || true
          grep -q 'repo="packages.maestra.io/ghcr/aquasecurity/trivy-db:2"' "$d/log"
          if grep -E 'mirror\.gcr\.io|ghcr\.io/aquasecurity|repo\.maven\.apache\.org|repo1\.maven\.org' "$d/log"; then exit 1; fi
          if grep '\[pom\] Failed to fetch' "$d/log"; then exit 1; fi
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == "CVE-2022-42889")] | length > 0' "$d/out.json"
      - name: PR mode cases
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: |
          GITLEAKS="$RUNNER_TEMP/gitleaks" GITLEAKS_CONFIG="$PWD/gitleaks/gitleaks.toml" TRIVY="$RUNNER_TEMP/trivy" \
          OPENGREP="$RUNNER_TEMP/opengrep" OPENGREP_RULES="$RUNNER_TEMP/semgrep-rules-bundle" bash scripts/test-security-scan-pr.sh

  # The reusable workflow itself on this repo, as a caller runs it (PR mode on a PR), from this
  # branch's scripts: the scanner and DB caches miss and save on the first run of a branch and
  # restore on a re-run (the job logs say which).
  reusable:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/security-scan.yml
    with:
      ref: ${{ github.head_ref || github.ref_name }}
