# Reusable pull-request checks: the GitLab merge-request checks every service had
# (system/components gitleaks-validate and check-encoding, plus a kustomize build of
# the overlays), ported to GitHub. dotnet-service-build.yml and service-build.yml call
# it on pull_request, so every service that releases through them gets it; a repo with
# its own workflows calls it directly:
#
#   jobs:
#     checks:
#       uses: maestra-io/github-actions/.github/workflows/pr-checks.yml@main
#       permissions: { contents: read }
#
# Everything is scoped to what the PR changes, so a file nobody touched never blocks a
# merge:
#   gitleaks        the PR's own commits (base...head, merge commits carry no patch),
#                   central config pr-checks/gitleaks.toml + the repo's .gitleaksignore
#                   (GitLab: `gitleaks git --log-opts=$DIFF_BASE_SHA..HEAD`).
#   check-encoding  the changed files with these extensions must be UTF-8.
#   kustomize       `kustomize build` of every overlay under kustomize-path when a file
#                   under it changed (Flux builds the same trees from <service>-manifests;
#                   the bake only packs them, so a broken overlay otherwise surfaces in
#                   the cluster).
#
# Inputs:
#   gitleaks             default true.
#   check-encoding       default true.
#   encoding-extensions  default txt,xml,json,config,cs,csproj,sln (the component's).
#   kustomize            default true.
#   kustomize-path       default kustomization.
#   ref                  ref of maestra-io/github-actions the scripts and the gitleaks
#                        config are read from (default main; set it when testing a branch).
#
# Only on pull_request (the job is skipped otherwise). Needs contents: read only: the
# PR commits come from the compare API, the changed files from the test merge commit.

name: pr-checks

on:
  workflow_call:
    inputs:
      gitleaks:
        type: boolean
        default: true
      check-encoding:
        type: boolean
        default: true
      encoding-extensions:
        type: string
        default: txt,xml,json,config,cs,csproj,sln
      kustomize:
        type: boolean
        default: true
      kustomize-path:
        type: string
        default: kustomization
      ref:
        type: string
        default: main

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  KUSTOMIZE_VERSION: v5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61

jobs:
  checks:
    name: pr checks
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runs-on=${{ github.run_id }}-pr-checks/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: runs-on/action@v2.5.0
      # The test merge commit and its first parent, the base branch tip (HEAD^1). No
      # token left in git config: the steps below read the PR's own files.
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v6.1.0
        with:
          repository: maestra-io/github-actions
          ref: ${{ inputs.ref }}
          path: .pr-checks
          sparse-checkout: pr-checks
          persist-credentials: false
      - name: changed files
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=d HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          echo "$(wc -l < "$RUNNER_TEMP/changed") files changed"

      - name: check-encoding
        if: ${{ !cancelled() && inputs.check-encoding }}
        env:
          EXTENSIONS: ${{ inputs.encoding-extensions }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/changed" ]; then echo "no changed files"; exit 0; fi
          tr '\n' '\0' < "$RUNNER_TEMP/changed" | xargs -0 python3 -I .pr-checks/pr-checks/check-encoding.py "$EXTENSIONS"

      - name: gitleaks (PR commits)
        if: ${{ !cancelled() && inputs.gitleaks }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          # base...head as GitHub lists the PR's commits; merge commits carry no patch
          # of their own in `git log -p` (GitLab's base..HEAD scan skipped them too).
          gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
            --jq '.commits[] | "\(.sha) \(.parents | length)"' > "$RUNNER_TEMP/all-commits"
          total=$(grep -c . "$RUNNER_TEMP/all-commits" || true)
          awk '$2 == 1 {print $1}' "$RUNNER_TEMP/all-commits" > "$RUNNER_TEMP/commits"
          n=$(grep -c . "$RUNNER_TEMP/commits" || true)
          if [ "$n" -eq 0 ]; then echo "no non-merge commits in the PR"; exit 0; fi
          # A PR commit is only reachable from the head through PR commits, so depth
          # total+1 fetches every one of them with its parent: each is scanned as its
          # own diff, never as a whole tree.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch -q --no-tags --depth=$((total + 1)) origin "$HEAD_SHA"
          echo "scanning $n commits"
          "$RUNNER_TEMP/gitleaks" git --config .pr-checks/pr-checks/gitleaks.toml --no-banner --no-color --verbose --redact \
            --log-opts="--no-walk $(paste -sd' ' "$RUNNER_TEMP/commits")" . 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          # gitleaks exits 0 when its git log fails, having scanned nothing.
          grep -q " $n commits scanned" "$RUNNER_TEMP/gitleaks.log" \
            || { echo "::error::gitleaks did not scan the $n PR commits"; exit 1; }

      - name: kustomize build (changed overlays tree)
        if: ${{ !cancelled() && inputs.kustomize }}
        env:
          KPATH: ${{ inputs.kustomize-path }}
        run: |
          set -euo pipefail
          if [ ! -d "$KPATH" ] || ! grep -q "^${KPATH%/}/" "$RUNNER_TEMP/changed"; then
            echo "nothing changed under $KPATH"; exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/kustomize.tar.gz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          failed=0
          for ep in $(bash .pr-checks/pr-checks/kustomize-entry-points.sh "$KPATH"); do
            if out=$("$RUNNER_TEMP/kustomize" build --load-restrictor LoadRestrictionsNone "$ep" 2>&1 >/dev/null); then
              echo "ok   $ep"
            else
              echo "::error::kustomize build $ep failed"; echo "$out"; failed=1
            fi
          done
          exit $failed
