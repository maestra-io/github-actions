---
# Lint gate for the maestra.infra collection this repo OWNS.
#
# Why it exists: ansible-lint 26.8.0 (ansible/ansible-lint#5145,
# `_ensure_cache_collections_first`) installs a project's requirements.yml into
# that project's own `.ansible/` and puts it FIRST in collections_paths — so from
# 26.8.0 on, every consumer repo lints THIS collection as part of its own tree.
# One unprefixed role default here (`node_exporter_textfile_dir`) therefore turned
# up as a red pipeline in maestra-io/haproxy-maestra, in code that repo does not
# own and cannot fix. Consumers exclude the download from their gate on purpose
# (the `.ansible/` entry in maestra-io/kubernetes-clusters ansible/.ansible-lint:
# "install it, do not judge it — a repo's lint gate answers for its own tree").
# This is the other half of that sentence.
#
# `production` profile, not the consumers' `moderate`: a finding in a shared
# library is four repos' CI at once, so this gate is deliberately stricter than
# any single consumer's.
name: collection lint

on:
  pull_request:
    paths:
      - "ansible/collections/**"
      - "ansible/.ansible-lint"
      - "ansible/.yamllint"
      - "ansible/pyproject.toml"
      - "ansible/uv.lock"
      - "ansible/tests/test-os-update-tail-silence.sh"
      - "ansible/tests/os-update-tail/**"
      - "ansible/tests/test-os-update-holds.sh"
      - "ansible/tests/os-update-holds/**"
      - ".github/workflows/collection-lint.yml"
  push:
    branches: [main]
    paths:
      - "ansible/collections/**"
      - "ansible/.ansible-lint"
      - "ansible/.yamllint"
      - "ansible/pyproject.toml"
      - "ansible/uv.lock"
      - "ansible/tests/test-os-update-tail-silence.sh"
      - "ansible/tests/os-update-tail/**"
      - "ansible/tests/test-os-update-holds.sh"
      - "ansible/tests/os-update-holds/**"
      - ".github/workflows/collection-lint.yml"

permissions:
  contents: read
  id-token: write # uv-nora: a GitHub OIDC token is the credential for packages.maestra.io

jobs:
  lint:
    name: yamllint + ansible-lint (maestra.infra)
    runs-on: runs-on=${{ github.run_id }}-lint/runner=t3a-small
    timeout-minutes: 10
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      # Pinned to full-length commit SHAs, like every other external `uses:` in this
      # repo since the Renovate landing. A tag is mutable — re-pointing it runs new
      # code here with this job's token. The trailing `# vX.Y.Z` is the form
      # Renovate/Dependabot read, so the pin stays updatable: renovate.json turns on
      # `helpers:pinGitHubActionDigests` plus `pinDigests` for the github-actions
      # manager, so a new tag arrives as a sha bump with the label rewritten, and a
      # hand-written `@v6` gets a PR converting it to a sha.
      #
      # persist-credentials: false — nothing here pushes, so the token has no job
      # to do past the clone, and the steps after it execute code from the PR branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.13.6"
          enable-cache: false

      # Credentials for nora (packages.maestra.io), the only Python index.
      - uses: maestra-io/github-actions/uv-nora@22ccbf9ff3d76fe13025cbc009d395024f025198 # v1.67.0

      # ansible/pyproject.toml + uv.lock: `ansible` as the dependency
      # (ansible-lint resolves modules against a real installation, and without it
      # every FQCN reads as unknown) and the pinned linters as the `lint` group.
      - name: Install lint deps
        env:
          DEPS_PROJECT: ansible
          DEPS_GROUP: lint
          DEPS_TARGET: system
        run: |
          # >>> python-deps (identical in every ansible workflow; ansible/tests/test-python-deps.sh)
          set -euo pipefail
          if [ -f "${DEPS_PROJECT}/uv.lock" ]; then
            # nora only: every package source is the nora registry (or the project
            # itself), every URL is on packages.maestra.io. Anything else (another
            # index, git, ssh, a path, a direct URL) is refused, never followed.
            lock="${DEPS_PROJECT}/uv.lock"
            if bad=$(grep -E '^source = ' "$lock" | sort -u | grep -vxF \
                  -e 'source = { registry = "https://packages.maestra.io/simple/" }' \
                  -e 'source = { virtual = "." }' -e 'source = { editable = "." }'); then
              echo "::error file=${lock}::uv.lock has sources other than the nora registry: ${bad//$'\n'/ }"
              exit 1
            fi
            if other=$(grep -oE '[a-z+]+://[^/"]+' "$lock" | sort -u | grep -vxF 'https://packages.maestra.io'); then
              echo "::error file=${lock}::uv.lock names hosts other than packages.maestra.io: ${other//$'\n'/ }"
              exit 1
            fi
            args=(--locked --no-install-project --project "$DEPS_PROJECT")
            [ -z "${DEPS_GROUP:-}" ] || args+=(--group "$DEPS_GROUP")
            if [ "$DEPS_TARGET" = active ]; then
              args+=(--active)
            else
              # setup-python's interpreter, as `pip install --system` did; --inexact keeps its pip.
              export UV_PROJECT_ENVIRONMENT="${pythonLocation:?actions/setup-python must run first}"
              args+=(--inexact)
            fi
            uv sync "${args[@]}"
          else
            echo "::error::no ${DEPS_PROJECT}/uv.lock: the Ansible toolchain comes from pyproject.toml + uv.lock through nora (input uv_project; issues-maestra#1649)"
            exit 1
          fi
          # <<< python-deps

      - name: yamllint
        working-directory: ansible
        run: yamllint -c .yamllint .

      # Explicit path rather than `.`: ansible/tests/ is shell, and pointing
      # ansible-lint at the collection root is what makes it apply the collection
      # rules (galaxy, meta-runtime) instead of treating the files as loose YAML.
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint -c .ansible-lint collections/maestra/infra

      # Here rather than in selftest: it runs the role's real task files, so it
      # needs the `ansible` this job already installs.
      - name: os_update tail silence (real tasks against a fake Alertmanager)
        run: bash ansible/tests/test-os-update-tail-silence.sh

      - name: os_update holds record (real holds.yml against a fake apt-mark)
        run: bash ansible/tests/test-os-update-holds.sh
