# Reusable build-and-release workflow for a .NET service: the GitHub port of
# the GitLab release pipeline (dotnet-service-cicd-components release-template
# + create-release-number + docker-push-to-all + maestra-bake-oci-manifests +
# create-gitlab-release), issues-maestra#1442 wave W0c.
#
#   version ─► test ─► images (matrix, or one bake job) ─► release ─► bake ─► kargo-refresh
#
# Job names are a contract (required checks, `needs:` in callers): keep them.
#
# Usage (caller, on push to the default branch and on pull_request):
#
#   jobs:
#     build:
#       uses: maestra-io/github-actions/.github/workflows/dotnet-service-build.yml@<sha> # vX.Y.Z
#       permissions: { contents: write, id-token: write }
#       with:
#         image-targets: processing_debugger_services=services,processing_debugger_chmigrator=chmigrator
#         docker-test-target: tests
#         bake: true
#
# Inputs:
#   image-targets       REQUIRED. `image=target` pairs, comma or newline
#                       separated, as IMAGE_TARGETS_PAIRS in GitLab .build-docker:
#                       <image> is the ECR repository, <target> the Dockerfile stage.
#                       `image=<dockerfile>:<target>` builds from another Dockerfile
#                       (repos with several, e.g. Dockerfile-celery); an empty
#                       target (`image=` or `image=<dockerfile>:`) builds the last stage.
#                       `image=<dockerfile>:<target>:<context>` also sets the build
#                       context (default the repo root), for Dockerfiles that GitLab
#                       built with a subdirectory context (`docker build ./email`).
#   dockerfile          Default Dockerfile path (default Dockerfile, context = repo root).
#   base-image          `<name>=<dockerfile>[:<target>]`: a shared base image the image
#                       Dockerfiles start `FROM <name>` (GitLab built it first into the
#                       local daemon, e.g. `local/personalization-base:latest=Dockerfile-base`).
#                       Built once in `test` to fill the cache (scope base-image), then
#                       in every `images` leg whose Dockerfile names it, from that cache,
#                       as an OCI layout handed to the build as the `<name>` build context.
#                       Context = repo root. Never pushed. Empty = none.
#   dotnet-version      SDK for the `test` job (setup-dotnet syntax, e.g. 10.0.x).
#                       Empty = global.json; a global.json that setup-dotnet rejects
#                       (`rollForward` with a non-SDK version such as 10.0.0) gets
#                       <major>.<minor>.x instead.
#   solution-file       Solution/project for restore+test. Empty = dotnet discovers.
#   test-filter         dotnet test --filter (default TestCategory!=IntegrationTest).
#                       Empty = no --filter: required for Microsoft.Testing.Platform
#                       runners (global.json `test.runner`), e.g. xunit v3 MTP
#                       rejects `--filter` with "Unknown option".
#   docker-test-target  Dockerfile stage that runs the tests (GitLab .run-docker-test,
#                       usually `tests`). Set = `test` builds and runs that stage
#                       instead of setup-dotnet + dotnet test.
#   test-command        Non-.NET repos: shell command run instead of dotnet test
#                       (`bash -c`), with test-env, PACKAGES_TOKEN (nora OIDC token)
#                       and PACKAGES_URL in its environment. docker-test-target wins
#                       when both are set. `true` = no tests.
#   test-image          With test-command: run it in this image (`docker run`, repo
#                       mounted at /src, sh -c) instead of on the runner.
#   warn-as-error       Warnings as errors on dotnet test (default true, GitLab parity),
#                       as -p:MSBuildTreatWarningsAsErrors=true: same effect as
#                       /warnaserror, but works on both runners (MTP hands a bare
#                       /warnaserror to the test app: "Zero tests ran", exit 5).
#   test-timeout-minutes  timeout-minutes of the `test` job (default 45). Raise it for
#                       suites that exceed it on RunsOn (mailings-runtime: ~50 min of
#                       Testcontainers projects, cancelled at 45).
#   test-env            Extra environment for the tests, KEY=VALUE per line (GitLab
#                       job `variables:` of the test job, e.g. a Testcontainers image
#                       override). Exported to the dotnet test step, passed with
#                       --env-file to the docker-test-target container. Values are
#                       single-line and not secret (they show in the log). Images on
#                       this account's ECR are pulled after an ECR login (see
#                       mirror-test-images.yml for test-images/*).
#   pr-images           Build the images on pull_request too (default false: a PR runs
#                       tests only; a broken Dockerfile surfaces in the release on the
#                       default branch, before anything is pushed).
#   images-in-one-job   Build every image target in ONE `images` job with docker
#                       buildx bake (default false: one job per image). The targets
#                       share one BuildKit, so stages they have in common (restore,
#                       build) run once; each target keeps its own cache scope. Needs
#                       one Dockerfile for all image-targets (contexts may differ).
#   push                Push images and run release/bake/kargo-refresh (default
#                       true). Never on pull_request. false = build-only dry run.
#   bake                Bake kustomization/ into <service>-manifests:<release> (default false).
#   service             Service name for bake and Kargo. Default: repository name.
#   bake-path           Passed to bake-oci-manifests (default ./kustomization).
#   bakes               One repo, several warehouses (GitLab: several
#                       maestra-bake-oci-manifests jobs). One bake per line:
#                       `<service> <bake-path> [<image>,<image>...]`; images default
#                       to all of image-targets and must be among them. Each line
#                       bakes <service>-manifests:<release> (job `bakes`, one leg
#                       per line, instead of `bake`) and kargo-refresh refreshes
#                       every kargo-<service>/<service>. Set = service, bake-path,
#                       kargo-project and kargo-warehouse are ignored.
#   kargo-refresh       Refresh the Kargo Warehouse after bake (default true; only with bake).
#   kargo-project       Kargo project. Default kargo-<service>.
#   kargo-warehouse     Warehouse to refresh. Default <service>.
#   teleport-token      Teleport GitHub join token of the image-push bot, for the
#                       image push and the bake. Default: the org-wide
#                       image-push-github-actions-maestra-io (fluxcd
#                       teleport-maestra/operator-crs/image-push-tokens.yaml: any
#                       maestra-io repository, refs/heads/main|master only).
#                       Empty = the per-repo image-push-github-actions-<repo name>.
#   kargo-teleport-token  Join token of the kargo-refresh bot
#                       (default kargo-refresh-github-actions-maestra-io).
#   nuget-source-name   nuget.config source the packages token is set on (default private).
#   packages-url        Package registry (default https://packages.maestra.io, nora).
#   packages-audience   `aud` of the GitHub OIDC token nora accepts (default packages.maestra.io).
# Secrets:
#   private-packages-token  Optional. Overrides the nora OIDC token passed as the
#                       PRIVATE_PACKAGES_TOKEN build secret and used for restore
#                       (e.g. GITHUB_TOKEN for a repo still on GitHub Packages).
# Outputs:
#   release             The release number 1.1.N.
#
# Re-runs: images, GitHub release and bake are idempotent for "Re-run failed jobs"
# of the same run (same release number). An image tag already in ECR is not pushed
# again when its layers (rootfs diff_ids) equal the ones just built (the earlier
# attempt pushed this very image), and fails clearly otherwise; the bake reuses
# an existing <service>-manifests:<release> baked from the same commit with the
# same content (bake-oci-manifests). A tag that cannot be reused means: dispatch
# the release workflow again, it takes the next release number.
#
# Release number: `${vars.RELEASE_PREFIX:-1.1}.${github.run_number}`: always above
# the GitLab 1.0.N, inside Kargo's `^1`. run_number belongs to the CALLER workflow
# file: renaming that file restarts it at 1 and collides with existing (immutable)
# tags, so set RELEASE_PREFIX (e.g. 1.2) when that happens.
#
# Registry token: nora accepts the GitHub Actions OIDC token (audience
# packages-audience). It lives MINUTES, so the docker builds get it as secret FILES
# that a background loop re-mints every minute (BuildKit reads the file at each RUN
# that mounts it). Two BuildKit secrets carry it:
#   PRIVATE_PACKAGES_TOKEN  the raw token (GitLab-era id);
#   NUGET_CREDENTIALS       `Username=ci;Password=<token>`, the value format of NuGet's
#                           NuGetPackageSourceCredentials_<source> variable, which
#                           wins over nuget.config credentials.
# Dockerfile pattern: mount the token on EVERY RUN that may reach the feed (restore,
# build/publish/test without --no-restore: `publish -r <rid>` restores runtime packs),
# never write it into a file:
#   RUN --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_private \
#       dotnet restore
#   FROM build AS publish
#   RUN --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_private \
#       dotnet publish src/Svc/Svc.csproj -c Release -r linux-x64 -o /dist
# (`private` = the nuget.config source key). A secret's value is not part of the layer
# cache key: the GitLab-era `RUN --mount=type=secret,... dotnet nuget update source
# private --password $(cat /run/secrets/...)` writes a token into NuGet.Config that the
# cache replays in later jobs and runs after it expired (401 as soon as a later step
# restores). Such a Dockerfile (a `--password`, `ClearTextPassword`, `_authToken`,
# `http-basic` or `ARG ...TOKEN/PASSWORD` line) is built WITHOUT the layer cache, with
# a warning; scripts/nuget-secret-mount-fix.sh rewrites it to the pattern above. The
# nuget.config source URL still has to point at packages.maestra.io (migration wave).
#
# Base images: Dockerfiles use `FROM mcr.microsoft.com/...` directly (MCR has no pull
# limits); `docker.io/...` is mirrored transparently by RunsOn's ECR pull-through
# cache (extras ecr-pull-through, aws-infra terraform/main/eu/runs-on.tf), which
# also covers BuildKit's docker-container builder. The yandex mirror prefix
# `cr.yandex/crp2cvbrp76d7dmfegco/` is removed with scripts/dockerfile-from-fix.sh.
# A Dockerfile that names this account's ECR (`FROM`/`COPY --from` of a private
# base) gets an ECR login before the build (instance role, read only).
#
# Cache: buildx `type=gha` per image scope (images also read the docker-test-target
# scope); RunsOn Magic Cache stores it in S3. Off for a Dockerfile that writes a token
# into a layer (see Registry token).
#
# AWS: a fresh RunsOn instance can lack its instance-role credentials for a few seconds
# (NoCredentials); `test` and `images` wait up to ~40 s for them before any AWS call.

name: dotnet-service-build

on:
  workflow_call:
    inputs:
      image-targets:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      base-image:
        type: string
        default: ""
      dotnet-version:
        type: string
        default: ""
      solution-file:
        type: string
        default: ""
      test-filter:
        type: string
        default: "TestCategory!=IntegrationTest"
      docker-test-target:
        type: string
        default: ""
      test-command:
        type: string
        default: ""
      test-image:
        type: string
        default: ""
      warn-as-error:
        type: boolean
        default: true
      test-timeout-minutes:
        type: number
        default: 45
      test-env:
        type: string
        default: ""
      pr-images:
        type: boolean
        default: false
      images-in-one-job:
        type: boolean
        default: false
      push:
        type: boolean
        default: true
      bake:
        type: boolean
        default: false
      service:
        type: string
        default: ""
      bake-path:
        type: string
        default: ./kustomization
      bakes:
        type: string
        default: ""
      kargo-refresh:
        type: boolean
        default: true
      kargo-project:
        type: string
        default: ""
      kargo-warehouse:
        type: string
        default: ""
      teleport-token:
        type: string
        default: image-push-github-actions-maestra-io
      kargo-teleport-token:
        type: string
        default: kargo-refresh-github-actions-maestra-io
      nuget-source-name:
        type: string
        default: private
      packages-url:
        type: string
        default: https://packages.maestra.io
      packages-audience:
        type: string
        default: packages.maestra.io
    secrets:
      private-packages-token:
        required: false
    outputs:
      release:
        value: ${{ jobs.version.outputs.release }}

# One release pipeline per repository at a time; pull requests get their own group
# and cancel superseded runs. Callers must not reuse the `release-<repo>` group
# name in their own workflow (same name in caller and callee deadlocks).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-{0}-{1}', github.repository, github.ref) || format('release-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  TELEPORT_FQDN: teleport.maestra.io:443

jobs:
  version:
    runs-on: runs-on=${{ github.run_id }}-version/pool=small
    timeout-minutes: 5
    outputs:
      release: ${{ steps.v.outputs.release }}
      matrix: ${{ steps.v.outputs.matrix }}
      images-matrix: ${{ steps.v.outputs.images-matrix }}
      images: ${{ steps.v.outputs.images }}
      service: ${{ steps.v.outputs.service }}
      bakes: ${{ steps.v.outputs.bakes }}
      bake-matrix: ${{ steps.v.outputs.bake-matrix }}
      multi-bake: ${{ steps.v.outputs.multi-bake }}
      base-name: ${{ steps.v.outputs.base-name }}
      base-dockerfile: ${{ steps.v.outputs.base-dockerfile }}
      base-target: ${{ steps.v.outputs.base-target }}
      publish: ${{ steps.v.outputs.publish }}
      teleport-token: ${{ steps.v.outputs.teleport-token }}
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - id: v
        env:
          PREFIX: ${{ vars.RELEASE_PREFIX }}
          RUN_NUMBER: ${{ github.run_number }}
          IMAGE_TARGETS: ${{ inputs.image-targets }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          SERVICE: ${{ inputs.service }}
          BAKE_PATH: ${{ inputs.bake-path }}
          BAKES: ${{ inputs.bakes }}
          BASE_IMAGE: ${{ inputs.base-image }}
          ONE_JOB: ${{ inputs.images-in-one-job }}
          KARGO_PROJECT: ${{ inputs.kargo-project }}
          KARGO_WAREHOUSE: ${{ inputs.kargo-warehouse }}
          REPO_NAME: ${{ github.event.repository.name }}
          PUSH: ${{ inputs.push && github.event_name != 'pull_request' }}
          TELEPORT_TOKEN: ${{ inputs.teleport-token }}
        run: |
          prefix="${PREFIX:-1.1}"
          case "$prefix" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::vars.RELEASE_PREFIX '$prefix' is not MAJOR.MINOR"; exit 1 ;;
          esac
          release="${prefix}.${RUN_NUMBER}"
          # >>> targets-and-bakes (scripts/test-dotnet-service-build.sh runs this block)
          # `image=target` / `image=<dockerfile>:<target>[:<context>]` pairs, comma or newline
          # separated -> images matrix. Empty target = last stage.
          matrix=$(printf '%s' "$IMAGE_TARGETS" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . \
            | jq -Rnc --arg df "$DOCKERFILE" '[inputs | {image: (split("=")[0]), spec: (split("=")[1])}
                | {image, dockerfile: (if (.spec // "") | contains(":") then (.spec | split(":")[0]) else $df end),
                   target: (if (.spec // "") | contains(":") then (.spec | split(":")[1]) else .spec end),
                   context: (if (.spec // "") | contains(":") then ((.spec | split(":")[2]) // "" | if . == "" then "." else . end) else "." end),
                   fields: ((.spec // "") | split(":") | length)}]') || matrix='[]'
          if [ "$(jq 'length' <<<"$matrix")" -eq 0 ] \
             || jq -e 'any(.[]; (.image // "") == "" or .target == null or (.dockerfile // "") == "" or .fields > 3)' <<<"$matrix" >/dev/null; then
            echo "::error::image-targets must be image=target or image=<dockerfile>:<target>[:<context>] pairs, got '$IMAGE_TARGETS'"; exit 1
          fi
          matrix=$(jq -c 'map(del(.fields))' <<<"$matrix")
          images=$(jq -r 'map(.image) | join(",")' <<<"$matrix")
          # One bake (service, bake-path, Kargo project/warehouse inputs) or one per
          # `bakes` line: `<service> <bake-path> [images]`.
          if [ -n "$(printf '%s' "$BAKES" | tr -d '[:space:]')" ]; then
            bakes=$(printf '%s\n' "$BAKES" | sed 's/#.*//' | grep -v '^[[:space:]]*$' \
              | jq -Rnc --arg all "$images" '[inputs | [splits("[[:space:]]+")] | map(select(. != ""))
                  | {service: .[0], "bake-path": .[1], images: (.[2] // $all), extra: .[3],
                     "kargo-project": ("kargo-" + .[0]), "kargo-warehouse": .[0]}]') || bakes='[]'
            if [ "$(jq 'length' <<<"$bakes")" -eq 0 ] \
               || jq -e 'any(.[]; (.service // "") == "" or (.["bake-path"] // "") == "" or .extra != null)' <<<"$bakes" >/dev/null; then
              echo "::error::bakes lines must be '<service> <bake-path> [image,image...]', got '$BAKES'"; exit 1
            fi
            unknown=$(jq -r --arg all "$images" '($all | split(",")) as $a | [.[].images | split(",")[] | select(. as $i | $a | index($i) | not)] | unique | join(",")' <<<"$bakes")
            if [ -n "$unknown" ]; then
              echo "::error::bakes name images that image-targets does not build: $unknown"; exit 1
            fi
            if [ "$(jq '[.[].service] | unique | length' <<<"$bakes")" -ne "$(jq 'length' <<<"$bakes")" ]; then
              echo "::error::bakes lists a service twice"; exit 1
            fi
            bakes=$(jq -c 'map(del(.extra))' <<<"$bakes")
            multi=true
          else
            svc="${SERVICE:-$REPO_NAME}"
            bakes=$(jq -nc --arg s "$svc" --arg p "$BAKE_PATH" --arg i "$images" \
              --arg kp "${KARGO_PROJECT:-kargo-$svc}" --arg kw "${KARGO_WAREHOUSE:-$svc}" \
              '[{service: $s, "bake-path": $p, images: $i, "kargo-project": $kp, "kargo-warehouse": $kw}]')
            multi=false
          fi
          # `<name>=<dockerfile>[:<target>]` -> base image built before each image that
          # names it in FROM. The name may carry a tag, so split on the first `=`.
          base_name=""; base_dockerfile=""; base_target=""
          base_spec=$(printf '%s' "$BASE_IMAGE" | tr -d '[:space:]')
          if [ -n "$base_spec" ]; then
            base_name="${base_spec%%=*}"
            rest="${base_spec#*=}"
            base_dockerfile="${rest%%:*}"
            [[ "$rest" == *:* ]] && base_target="${rest#*:}"
            if [[ "$base_spec" != *=* || -z "$base_name" || -z "$base_dockerfile" || "$base_target" == *:* ]]; then
              echo "::error::base-image must be <name>=<dockerfile>[:<target>], got '$BASE_IMAGE'"; exit 1
            fi
          fi
          # <<< targets-and-bakes
          # >>> images-matrix (scripts/test-dotnet-service-build.sh runs this block)
          # images-in-one-job: one `images` leg that bakes every target (`targets`).
          if [ "$ONE_JOB" = "true" ]; then
            if [ "$(jq '[.[].dockerfile] | unique | length' <<<"$matrix")" -ne 1 ]; then
              echo "::error::images-in-one-job needs one Dockerfile for all image-targets, got $(jq -c '[.[].dockerfile] | unique' <<<"$matrix")"; exit 1
            fi
            images_matrix=$(jq -c '[{image: "all", target: "bake", dockerfile: .[0].dockerfile, context: ".", targets: .}]' <<<"$matrix")
          else
            images_matrix=$matrix
          fi
          # <<< images-matrix
          {
            echo "release=$release"
            echo "matrix=$matrix"
            echo "images-matrix=$images_matrix"
            echo "images=$images"
            echo "service=$(jq -r '.[0].service' <<<"$bakes")"
            echo "bakes=$bakes"
            echo "bake-matrix=$(jq -c 'map({service, "bake-path", images})' <<<"$bakes")"
            echo "multi-bake=$multi"
            echo "base-name=$base_name"
            echo "base-dockerfile=$base_dockerfile"
            echo "base-target=$base_target"
            echo "publish=$PUSH"
            echo "teleport-token=${TELEPORT_TOKEN:-image-push-github-actions-${REPO_NAME}}"
          } >> "$GITHUB_OUTPUT"
          echo "release $release, images $(jq -c 'map(.image)' <<<"$matrix"), bakes $(jq -c 'map(.service)' <<<"$bakes"), publish=$PUSH"

  test:
    needs: version
    runs-on: runs-on=${{ github.run_id }}-test/pool=build
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    # The RunsOn image exports DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 although
    # libicu is installed; the GitLab sdk images ran with ICU. Invariant mode turns
    # satellite-resource locales into NETSDK1188 (an error under /warnaserror) and
    # changes culture-dependent test results.
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
    permissions:
      contents: read
      id-token: write # nora OIDC token
      packages: read  # only for a private-packages-token: GITHUB_TOKEN override (GitHub Packages)
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: mint packages token
        id: token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OVERRIDE: ${{ secrets.private-packages-token }}
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = process.env.OVERRIDE || await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);

      - name: aws credentials
        run: |
          # >>> aws-credentials (scripts/test-dotnet-service-build.sh runs this block)
          # A fresh RunsOn instance can lack its instance-role credentials for a few
          # seconds (NoCredentials): wait for them before the first AWS call.
          region="$(cut -d. -f4 <<< "$ECR_REGISTRY")"
          for i in 1 2 3 4 5; do
            aws sts get-caller-identity --region "$region" --query Account --output text >/dev/null 2>&1 && exit 0
            [ "$i" -lt 5 ] && sleep 10
          done
          echo "::warning::no AWS credentials after 5 tries; the AWS calls below may fail"
          # <<< aws-credentials

      - name: test-env
        env:
          TEST_ENV: ${{ inputs.test-env }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          DOCKER_TEST_TARGET: ${{ inputs.docker-test-target }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          TEST_IMAGE: ${{ inputs.test-image }}
        run: |
          : > "$RUNNER_TEMP/test.env"
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in ''|'#'*) continue ;; esac
            key="${line%%=*}"
            [[ "$line" == *=* && "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] \
              || { echo "::error::test-env line is not KEY=VALUE: '$line'"; exit 1; }
            printf '%s\n' "$line" >> "$RUNNER_TEMP/test.env"
            printf '%s\n' "$line" >> "$GITHUB_ENV"
            echo "test env: ${key}"
          done <<< "$TEST_ENV"
          # Testcontainers pulls with ~/.docker/config.json, and so does BuildKit
          # for the docker-test-target stage; log in to this account's ECR when a
          # value or that Dockerfile names it (instance role, read only).
          ecr_refs=("$RUNNER_TEMP/test.env")
          [ -n "$DOCKER_TEST_TARGET" ] && ecr_refs+=("$DOCKERFILE")
          if grep -qsF "$ECR_REGISTRY" "${ecr_refs[@]}" || [[ "$TEST_IMAGE" == "$ECR_REGISTRY"/* ]]; then
            aws ecr get-login-password --region "$(cut -d. -f4 <<< "$ECR_REGISTRY")" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          fi

      # ── Dockerfile stage (GitLab .run-docker-test) ───────────────────────
      - if: ${{ inputs.docker-test-target != '' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: ${{ inputs.docker-test-target != '' }}
        # GitLab Dockerfiles bind-mount the CI NuGet cache dir; it must exist.
        run: mkdir -p .nuget
      # Layer cache only for a Dockerfile that never writes the token into a layer
      # (header, Registry token).
      - if: ${{ inputs.docker-test-target != '' }}
        name: layer cache
        id: cache
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          SCOPES: ${{ inputs.docker-test-target }}
        run: |
          # >>> layer-cache (scripts/test-dotnet-service-build-cache.sh runs this block)
          persists='--password|ClearTextPassword|_authToken|http-basic|^[[:space:]]*ARG[[:space:]]+[A-Za-z0-9_]*(TOKEN|PASSWORD)'
          if grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer (GitLab-era 'dotnet nuget update source --password'): built WITHOUT the layer cache, a cached layer would replay an expired token. Mount it per RUN instead: --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_<source> (scripts/nuget-secret-mount-fix.sh)."
            from=""; to=""
          else
            scopes=$(printf '%s\n' "$SCOPES" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . || true)
            from=$(awk '{print "type=gha,scope=" $0}' <<<"$scopes")
            to="type=gha,mode=max,scope=$(head -n1 <<<"$scopes")"
          fi
          { echo 'from<<__CACHE__'; echo "$from"; echo '__CACHE__'; echo "to=$to"; } >> "$GITHUB_OUTPUT"
          # <<< layer-cache
      # BuildKit reads a secret FILE each time a RUN mounts it: the files are rewritten
      # with a fresh OIDC token every minute, so a RUN late in a long build still gets a
      # live one (header, Registry token).
      - name: packages token files
        env:
          OVERRIDE: ${{ secrets.private-packages-token }}
          AUDIENCE: ${{ inputs.packages-audience }}
        run: |
          # >>> token-files (scripts/test-dotnet-service-build-cache.sh runs this block)
          dir="$RUNNER_TEMP/packages-token"; mkdir -p "$dir"; chmod 700 "$dir"
          write() { # <token>: atomic, a reader never sees half a file
            printf '%s' "$1" > "$dir/.t" && mv -f "$dir/.t" "$dir/PRIVATE_PACKAGES_TOKEN"
            printf 'Username=ci;Password=%s' "$1" > "$dir/.n" && mv -f "$dir/.n" "$dir/NUGET_CREDENTIALS"
          }
          mint() {
            curl -sSf --retry 3 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value // empty'
