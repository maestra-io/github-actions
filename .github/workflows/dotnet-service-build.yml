          # <<< sdk-version
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command == '' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
          global-json-file: ${{ steps.sdk.outputs.file }}
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command == '' }}
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          SOURCE: ${{ inputs.nuget-source-name }}
          SOLUTION: ${{ inputs.solution-file }}
          FILTER: ${{ inputs.test-filter }}
          WARN_AS_ERROR: ${{ inputs.warn-as-error }}
        run: |
          # >>> dotnet-test (scripts/test-dotnet-service-build-mtp.sh runs this block)
          # Same credential shape as GitLab (`dotnet nuget update source private`).
          dotnet nuget update source "$SOURCE" --username ci --password "$TOKEN" \
            --store-password-in-clear-text || echo "::warning::no nuget source '$SOURCE' to authenticate"
          sln=(); [ -n "$SOLUTION" ] && sln=("$SOLUTION")
          # An MSBuild property, not /warnaserror: under the Microsoft.Testing.Platform
          # runner (global.json `test.runner`) dotnet test forwards a bare /warnaserror
          # to the test app, which then runs zero tests (exit 5). Same effect on VSTest.
          wae=(); [ "$WARN_AS_ERROR" = "true" ] && wae=(-p:MSBuildTreatWarningsAsErrors=true)
          dotnet restore "${sln[@]}" --locked-mode
          filter=(); [ -n "$FILTER" ] && filter=(--filter "$FILTER")
          dotnet test --no-restore "${sln[@]}" --configuration Release "${filter[@]}" "${wae[@]}"
          # <<< dotnet-test

      # ── base-image: built once here into the cache, the `images` legs reuse it ──
      - if: ${{ needs.version.outputs.base-name != '' && (github.event_name != 'pull_request' || inputs.pr-images) }}
        env:
          BASE_DOCKERFILE: ${{ needs.version.outputs.base-dockerfile }}
        run: |
          if grep -qsF "$ECR_REGISTRY" "$BASE_DOCKERFILE"; then
            aws ecr get-login-password --region "$(cut -d. -f4 <<< "$ECR_REGISTRY")" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          fi
      - if: ${{ needs.version.outputs.base-name != '' && (github.event_name != 'pull_request' || inputs.pr-images) }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: layer cache (base image)
        id: cache-base
        if: ${{ needs.version.outputs.base-name != '' && (github.event_name != 'pull_request' || inputs.pr-images) }}
        env:
          DOCKERFILE: ${{ needs.version.outputs.base-dockerfile }}
          SCOPES: base-image
        run: |
          # >>> layer-cache (scripts/test-dotnet-service-build-cache.sh runs this block)
          persists='--password|ClearTextPassword|_authToken|http-basic|^[[:space:]]*ARG[[:space:]]+[A-Za-z0-9_]*(TOKEN|PASSWORD)'
          if grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer (GitLab-era 'dotnet nuget update source --password'): built WITHOUT the layer cache, a cached layer would replay an expired token. Mount it per RUN instead: --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_<source> (scripts/nuget-secret-mount-fix.sh)."
            from=""; to=""
          else
            scopes=$(printf '%s\n' "$SCOPES" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . || true)
            from=$(awk '{print "type=gha,scope=" $0}' <<<"$scopes")
            to="type=gha,mode=max,scope=$(head -n1 <<<"$scopes")"
          fi
          { echo 'from<<__CACHE__'; echo "$from"; echo '__CACHE__'; echo "to=$to"; } >> "$GITHUB_OUTPUT"
          # <<< layer-cache
      - name: base image ${{ needs.version.outputs.base-name }}
        if: ${{ needs.version.outputs.base-name != '' && (github.event_name != 'pull_request' || inputs.pr-images) }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ needs.version.outputs.base-dockerfile }}
          target: ${{ needs.version.outputs.base-target }}
          outputs: type=cacheonly
          secret-files: |
            PRIVATE_PACKAGES_TOKEN=${{ runner.temp }}/packages-token/PRIVATE_PACKAGES_TOKEN
            NUGET_CREDENTIALS=${{ runner.temp }}/packages-token/NUGET_CREDENTIALS
          cache-from: ${{ steps.cache-base.outputs.from }}
          cache-to: ${{ steps.cache-base.outputs.to }}

  images:
    needs: [version, test]
    # Not on pull_request unless pr-images: images are built (and checked) by the
    # release on the default branch and by the workflow_dispatch dry run.
    if: ${{ github.event_name != 'pull_request' || inputs.pr-images }}
    # Explicit: the matrix carries `dockerfile` too, the check name stays
    # `images (<image>, <target>)` as before.
    name: images (${{ matrix.image }}, ${{ matrix.target }})
    # One label per leg: legs sharing `runs-on=<run_id>/pool=build` claim each
    # other's runners, and the robbed leg waits out RunsOn's retry backoff
    # (up to 42 min on 12.10, issues-maestra#1556).
    runs-on: runs-on=${{ github.run_id }}-images-${{ strategy.job-index }}/pool=build
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # nora OIDC token + Teleport join
      packages: read  # see `test`
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.version.outputs.images-matrix) }}
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: mkdir -p .nuget # bind-mount source of the GitLab-era Dockerfiles

      - name: aws credentials
        run: |
          # >>> aws-credentials (scripts/test-dotnet-service-build.sh runs this block)
          # A fresh RunsOn instance can lack its instance-role credentials for a few
          # seconds (NoCredentials): wait for them before the first AWS call.
          region="$(cut -d. -f4 <<< "$ECR_REGISTRY")"
          for i in 1 2 3 4 5; do
            aws sts get-caller-identity --region "$region" --query Account --output text >/dev/null 2>&1 && exit 0
            [ "$i" -lt 5 ] && sleep 10
          done
          echo "::warning::no AWS credentials after 5 tries; the AWS calls below may fail"
          # <<< aws-credentials

      # BuildKit pulls base images with ~/.docker/config.json; log in to this
      # account's ECR when the Dockerfile (or the base-image one) names it
      # (instance role, read only).
      - name: ecr login (base images)
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BASE_DOCKERFILE: ${{ needs.version.outputs.base-dockerfile }}
        run: |
          if grep -qsF "$ECR_REGISTRY" "$DOCKERFILE" "$BASE_DOCKERFILE"; then
            aws ecr get-login-password --region "$(cut -d. -f4 <<< "$ECR_REGISTRY")" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          fi

      # Layer cache only for a Dockerfile that never writes the token into a layer
      # (header, Registry token).
      - name: layer cache
        id: cache
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          SCOPES: |
            ${{ matrix.image != 'all' && matrix.image || join(matrix.targets.*.image, ',') }}
            ${{ inputs.docker-test-target }}
        run: |
          # >>> layer-cache (scripts/test-dotnet-service-build-cache.sh runs this block)
          persists='--password|ClearTextPassword|_authToken|http-basic|^[[:space:]]*ARG[[:space:]]+[A-Za-z0-9_]*(TOKEN|PASSWORD)'
          if grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer (GitLab-era 'dotnet nuget update source --password'): built WITHOUT the layer cache, a cached layer would replay an expired token. Mount it per RUN instead: --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_<source> (scripts/nuget-secret-mount-fix.sh)."
            from=""; to=""
          else
            scopes=$(printf '%s\n' "$SCOPES" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . || true)
            from=$(awk '{print "type=gha,scope=" $0}' <<<"$scopes")
            to="type=gha,mode=max,scope=$(head -n1 <<<"$scopes")"
          fi
          { echo 'from<<__CACHE__'; echo "$from"; echo '__CACHE__'; echo "to=$to"; } >> "$GITHUB_OUTPUT"
          # <<< layer-cache

      # BuildKit reads a secret FILE each time a RUN mounts it: the files are rewritten
      # with a fresh OIDC token every minute, so a RUN late in a long build still gets a
      # live one (header, Registry token).
      - name: packages token files
        env:
          OVERRIDE: ${{ secrets.private-packages-token }}
          AUDIENCE: ${{ inputs.packages-audience }}
        run: |
          # >>> token-files (scripts/test-dotnet-service-build-cache.sh runs this block)
          dir="$RUNNER_TEMP/packages-token"; mkdir -p "$dir"; chmod 700 "$dir"
          write() { # <token>: atomic, a reader never sees half a file
            printf '%s' "$1" > "$dir/.t" && mv -f "$dir/.t" "$dir/PRIVATE_PACKAGES_TOKEN"
            printf 'Username=ci;Password=%s' "$1" > "$dir/.n" && mv -f "$dir/.n" "$dir/NUGET_CREDENTIALS"
          }
          mint() {
            curl -sSf --retry 3 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value // empty'
          }
          if [ -n "$OVERRIDE" ]; then write "$OVERRIDE"; exit 0; fi
          t=$(mint) && [ -n "$t" ] || { echo "::error::cannot mint the packages OIDC token"; exit 1; }
          echo "::add-mask::$t"
          write "$t"
          # Lives until the runner's orphan cleanup at the end of the job. Its tokens are
          # not masked (no workflow commands after the step): never print a secret in a RUN.
          ( while sleep 60; do t=$(mint) && [ -n "$t" ] && write "$t"; done ) </dev/null >/dev/null 2>&1 &
          # <<< token-files

      # base-image: an OCI layout from the cache `test` filled, handed to the build
      # as the named context the Dockerfile's FROM refers to.
      - name: uses ${{ needs.version.outputs.base-name }}?
        id: base
        if: ${{ needs.version.outputs.base-name != '' }}
        env:
          NAME: ${{ needs.version.outputs.base-name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          # ponytail: plain `FROM <name>` match, enough for the GitLab-era Dockerfiles
          if grep -qiF "FROM $NAME" "$DOCKERFILE"; then
            echo "context=${NAME}=oci-layout://${RUNNER_TEMP}/base-image" >> "$GITHUB_OUTPUT"
          fi
      - name: layer cache (base image)
        id: cache-base
        if: ${{ steps.base.outputs.context != '' }}
        env:
          DOCKERFILE: ${{ needs.version.outputs.base-dockerfile }}
          SCOPES: base-image
        run: |
          # >>> layer-cache (scripts/test-dotnet-service-build-cache.sh runs this block)
          persists='--password|ClearTextPassword|_authToken|http-basic|^[[:space:]]*ARG[[:space:]]+[A-Za-z0-9_]*(TOKEN|PASSWORD)'
          if grep -Eiq -- "$persists" "$DOCKERFILE" 2>/dev/null; then
            echo "::warning file=${DOCKERFILE}::${DOCKERFILE} writes the packages token into an image layer (GitLab-era 'dotnet nuget update source --password'): built WITHOUT the layer cache, a cached layer would replay an expired token. Mount it per RUN instead: --mount=type=secret,id=NUGET_CREDENTIALS,env=NuGetPackageSourceCredentials_<source> (scripts/nuget-secret-mount-fix.sh)."
            from=""; to=""
          else
            scopes=$(printf '%s\n' "$SCOPES" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep . || true)
            from=$(awk '{print "type=gha,scope=" $0}' <<<"$scopes")
            to="type=gha,mode=max,scope=$(head -n1 <<<"$scopes")"
          fi
          { echo 'from<<__CACHE__'; echo "$from"; echo '__CACHE__'; echo "to=$to"; } >> "$GITHUB_OUTPUT"
          # <<< layer-cache
      - name: base image ${{ needs.version.outputs.base-name }}
        if: ${{ steps.base.outputs.context != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ needs.version.outputs.base-dockerfile }}
          target: ${{ needs.version.outputs.base-target }}
          outputs: type=oci,dest=${{ runner.temp }}/base-image,tar=false
          secret-files: |
            PRIVATE_PACKAGES_TOKEN=${{ runner.temp }}/packages-token/PRIVATE_PACKAGES_TOKEN
            NUGET_CREDENTIALS=${{ runner.temp }}/packages-token/NUGET_CREDENTIALS
          cache-from: ${{ steps.cache-base.outputs.from }}

      # Built into the local daemon as local/<image>:<release>, then pushed by the
      # shared push-to-aws-ecr-repository action: it creates the repository
      # IMMUTABLE_WITH_EXCLUSION with the org pull policy and logs in through the
      # Teleport image-push bot (no static AWS keys).
      - name: build ${{ matrix.image }} (${{ matrix.target }})
        if: ${{ matrix.image != 'all' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-contexts: ${{ steps.base.outputs.context }}
          load: true
          push: false
          tags: local/${{ matrix.image }}:${{ needs.version.outputs.release }}
          build-args: |
            revision=${{ needs.version.outputs.release }} (${{ github.sha }})
            release=${{ needs.version.outputs.release }} (${{ github.sha }})
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.release }}
          secret-files: |
            PRIVATE_PACKAGES_TOKEN=${{ runner.temp }}/packages-token/PRIVATE_PACKAGES_TOKEN
            NUGET_CREDENTIALS=${{ runner.temp }}/packages-token/NUGET_CREDENTIALS
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      # images-in-one-job: every image target in one bake on one BuildKit, so the
      # stages they share (restore, build) run once and the rest in parallel. Same
      # tags/args/labels/secrets as the per-image build above. Each target exports
      # its own cache scope: a shared scope would keep only the last export.
      - name: bake definition
        id: bakefile
        if: ${{ matrix.image == 'all' }}
        env:
          TARGETS: ${{ toJSON(matrix.targets) }}
          RELEASE: ${{ needs.version.outputs.release }}
          SHA: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          BASE_CONTEXT: ${{ steps.base.outputs.context }}
          CACHE_FROM: ${{ steps.cache.outputs.from }}
          CACHE_TO: ${{ steps.cache.outputs.to }}
        run: |
          # >>> bake-definition (scripts/test-dotnet-service-build.sh runs this block)
          f="$RUNNER_TEMP/images.bake.json"
          jq -n --argjson t "$TARGETS" --arg rel "$RELEASE" --arg sha "$SHA" --arg src "$SOURCE" \
                --arg base "$BASE_CONTEXT" --arg from "$CACHE_FROM" --arg to "$CACHE_TO" \
                --arg tmp "$RUNNER_TEMP" --arg ws "$GITHUB_WORKSPACE" '
            ($from | split("\n") | map(select(. != ""))) as $from
            | {group: {default: {targets: [$t[].image]}},
               target: ($t | map(.image as $img | {key: $img, value: ({
                 context: .context,
                 # bake resolves dockerfile against the context, build-push-action against the workspace
                 dockerfile: ($ws + "/" + .dockerfile),
                 target: .target,
                 tags: ["local/\($img):\($rel)"],
                 args: {revision: "\($rel) (\($sha))", release: "\($rel) (\($sha))"},
                 labels: {"org.opencontainers.image.revision": $sha,
                          "org.opencontainers.image.source": $src,
                          "org.opencontainers.image.version": $rel},
                 secret: ["id=PRIVATE_PACKAGES_TOKEN,src=\($tmp)/packages-token/PRIVATE_PACKAGES_TOKEN",
                          "id=NUGET_CREDENTIALS,src=\($tmp)/packages-token/NUGET_CREDENTIALS"],
                 "cache-from": $from,
                 "cache-to": (if $to == "" then [] else [$to | sub("scope=[^,]*"; "scope=\($img)")] end),
                 output: ["type=docker"]}
                 + (if $base == "" then {} else {contexts: {($base | split("=")[0]): ($base | split("=")[1:] | join("="))}} end))})
                 | from_entries)}' > "$f"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          # <<< bake-definition
          jq -c '.target | map_values({context, target, "cache-to"})' "$f"
      - name: build all images (bake)
        if: ${{ matrix.image == 'all' }}
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: ${{ steps.bakefile.outputs.file }}
          # the secret files and the base-image OCI layout live in runner.temp,
          # outside the working directory: bake refuses to read them otherwise
          allow: fs.read=${{ runner.temp }}

      # Idempotent re-run: the tag may already be in ECR (immutable) from an
      # earlier attempt of this run. Same layers (rootfs diff_ids of the ECR
      # image config = those of the image just built, i.e. a cache-hit rebuild
      # of the same commit) = that attempt pushed this image: skip the push.
      # Anything else would end in ECR TAG_INVALID: fail and say what to do.
      # Layers, not the image id: with the containerd image store `.Id` is a
      # manifest digest, and the config's `created` may differ between attempts.
      - name: ${{ matrix.image }}:${{ needs.version.outputs.release }} already in ECR?
        id: existing
        if: ${{ needs.version.outputs.publish == 'true' }}
        env:
          IMAGES: ${{ matrix.image != 'all' && matrix.image || needs.version.outputs.images }}
          RELEASE: ${{ needs.version.outputs.release }}
          # Instance-role credentials come from IMDS; the CLI default (1 s, one
          # attempt) answered NoCredentials after a long build on a busy t3a.
          AWS_METADATA_SERVICE_TIMEOUT: "5"
          AWS_METADATA_SERVICE_NUM_ATTEMPTS: "5"
        run: |
          region="$(cut -d. -f4 <<< "$ECR_REGISTRY")"
          push=()
          for IMAGE in ${IMAGES//,/ }; do
            if ! out=$(aws ecr batch-get-image --region "$region" --repository-name "$IMAGE" \
                  --image-ids imageTag="$RELEASE" \
                  --accepted-media-types application/vnd.docker.distribution.manifest.v2+json application/vnd.oci.image.manifest.v1+json \
                  --output json 2>&1); then
              if grep -q RepositoryNotFoundException <<<"$out"; then push+=("$IMAGE"); continue; fi
              echo "::error::cannot read ${IMAGE}:${RELEASE} from ECR: $out"; exit 1
            fi
            if [ "$(jq '.images | length' <<<"$out")" -eq 0 ]; then
              push+=("$IMAGE"); continue
            fi
            digest=$(jq -r '.images[0].imageId.imageDigest' <<<"$out")
            config=$(jq -r '.images[0].imageManifest | fromjson | .config.digest // empty' <<<"$out")
            remote=""
            if [ -n "$config" ]; then
              url=$(aws ecr get-download-url-for-layer --region "$region" --repository-name "$IMAGE" \
                --layer-digest "$config" --query downloadUrl --output text)
              remote=$(curl -sfL --retry 3 "$url" | jq -c '.rootfs.diff_ids') || remote=""
            fi
            local=$(docker image inspect --format '{{json .RootFS.Layers}}' "local/${IMAGE}:${RELEASE}" | jq -c .)
            if [ -n "$remote" ] && [ "$remote" = "$local" ]; then
              echo "${IMAGE}:${RELEASE} is already in ECR (${digest}) with the layers just built: push skipped"
            else
              echo "::error::${IMAGE}:${RELEASE} already exists in ECR (${digest}) with other layers than the image built now; tags are immutable. Dispatch the release workflow again: it takes the next release number."
              exit 1
            fi
          done
          echo "push=$(IFS=,; echo "${push[*]}")" >> "$GITHUB_OUTPUT"

      - name: push ${{ matrix.image }}:${{ needs.version.outputs.release }}
        if: ${{ needs.version.outputs.publish == 'true' && steps.existing.outputs.push != '' }}
        uses: maestra-io/github-actions/push-to-aws-ecr-repository@v1
        with:
          awsRegion: us-west-2
          repositories: ${{ steps.existing.outputs.push }}
          localTag: ${{ needs.version.outputs.release }}
          targetTag: ${{ needs.version.outputs.release }}
          teleportToken: ${{ needs.version.outputs.teleport-token }}

  # Git tag + GitHub Release BEFORE the bake: bake-oci-manifests checks out the
  # release tag. Bare `1.1.N`, same shape as create-gitlab-release.
  release:
    needs: [version, images]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: runs-on=${{ github.run_id }}-release/pool=small
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          # Idempotent for a re-run of failed jobs (same run_number, same release).
          if gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE already exists"; exit 0
          fi
          gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE" --generate-notes

  bake:
    needs: [version, release]
    if: ${{ inputs.bake && needs.version.outputs.publish == 'true' && needs.version.outputs.multi-bake != 'true' }}
    runs-on: runs-on=${{ github.run_id }}-bake/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Teleport join + cosign keyless
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: maestra-io/github-actions/bake-oci-manifests@v1
        with:
          service: ${{ needs.version.outputs.service }}
          images: ${{ needs.version.outputs.images }}
          tag: ${{ needs.version.outputs.release }}
          bake-path: ${{ inputs.bake-path }}
          teleport-token: ${{ needs.version.outputs.teleport-token }}

  # `bakes`: one leg per warehouse. A separate job, so a single-bake caller keeps
  # its `bake` check as it was (a skipped matrix job shows no evaluated name).
  bakes:
    needs: [version, release]
    if: ${{ inputs.bake && needs.version.outputs.publish == 'true' && needs.version.outputs.multi-bake == 'true' }}
    runs-on: runs-on=${{ github.run_id }}-bakes-${{ strategy.job-index }}/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Teleport join + cosign keyless
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.bake-matrix) }}
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: maestra-io/github-actions/bake-oci-manifests@v1
        with:
          service: ${{ matrix.service }}
          images: ${{ matrix.images }}
          tag: ${{ needs.version.outputs.release }}
          bake-path: ${{ matrix.bake-path }}
          teleport-token: ${{ needs.version.outputs.teleport-token }}

  # Instant freight: POST /v1beta1/projects/<p>/warehouses/<w>/refresh on Kargo
  # (us-iota-lw-kube-infra) instead of the Warehouse's 5m poll. Reached from the
  # AWS runner through Teleport, nothing on iota runs for it:
  #   1. tbot (github join, bot github-actions-kargo-refresh) writes a kubeconfig
  #      for us-iota-lw-kube-infra and a client certificate for the Teleport app
  #      `kargo` (kargo.teleport.maestra.io), in one oneshot run;
  #   2. kubectl mints a 10-minute token of ServiceAccount kargo/kargo-ci-github
  #      (the bot may do nothing else on the cluster);
  #   3. curl with the app certificate + that bearer. Kargo checks `get` on the
  #      Warehouse as kargo-ci-github (fluxcd ClusterRole kargo-ci-github-refresher),
  #      then applies the annotation with its own client.
  # Best effort: the bake is done, a failure here only delays freight by <=5m.
  kargo-refresh:
    needs: [version, bake, bakes]
    # One job for every warehouse (`bakes` = several), after all bakes succeeded.
    if: >-
      ${{ !cancelled() && inputs.bake && inputs.kargo-refresh && needs.version.outputs.publish == 'true'
          && (needs.bake.result == 'success' || needs.bakes.result == 'success') }}
    runs-on: runs-on=${{ github.run_id }}-kargo-refresh/pool=small
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Teleport join
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - id: tp-version
        run: |
          v=$(curl -sf --retry 5 --retry-all-errors "https://${TELEPORT_FQDN}/webapi/find" | jq -r '.auto_update.tools_version // .server_version')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Downloads from cdn.teleport.dev; one retry after a pause (5xx flakes).
      - id: tp-setup
        continue-on-error: true
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}
      - if: ${{ steps.tp-setup.outcome == 'failure' }}
        run: sleep 20
      - if: ${{ steps.tp-setup.outcome == 'failure' }}
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ steps.tp-version.outputs.version }}
          proxy: ${{ env.TELEPORT_FQDN }}
      - env:
          TOKEN_NAME: ${{ inputs.kargo-teleport-token }}
          BAKES: ${{ needs.version.outputs.bakes }}
        run: |
          out="$(mktemp -d)"
          cat > "$out/tbot.yaml" <<EOF
          version: v2
          proxy_server: ${TELEPORT_FQDN}
          onboarding:
            join_method: github
            token: ${TOKEN_NAME}
          oneshot: true
          storage:
            type: memory
          services:
            - type: kubernetes/v2
              destination:
                type: directory
                path: ${out}/kube
              selectors:
                - name: us-iota-lw-kube-infra
            - type: application
              app_name: kargo
              destination:
                type: directory
                path: ${out}/app
          EOF
          mkdir -p "$out/kube" "$out/app"
          # tbot's heartbeat can hang minutes after the outputs land (see
          # fluxcd setup-flux-ecr): poll for the files, then stop it.
          tbot start -c "$out/tbot.yaml" & pid=$!
          for _ in $(seq 1 30); do
            [ -s "$out/kube/kubeconfig.yaml" ] && [ -s "$out/app/tlscert" ] && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          [ -s "$out/kube/kubeconfig.yaml" ] && [ -s "$out/app/tlscert" ] \
            || { echo "::warning::tbot (${TOKEN_NAME}) produced no credentials; freight appears on the next Warehouse poll"; exit 1; }

          bearer=$(kubectl --kubeconfig "$out/kube/kubeconfig.yaml" \
            --context "teleport.maestra.io-us-iota-lw-kube-infra" \
            -n kargo create token kargo-ci-github --duration 10m)
          echo "::add-mask::$bearer"
          failed=0
          while IFS=$'\t' read -r project warehouse; do
            http=$(curl -sS -o "$out/resp" -w '%{http_code}' -X POST \
              --cert "$out/app/tlscert" --key "$out/app/key" \
              -H "Authorization: Bearer ${bearer}" \
              "https://kargo.teleport.maestra.io/v1beta1/projects/${project}/warehouses/${warehouse}/refresh") || http=000
            if [ "$http" = "200" ]; then
              echo "Kargo warehouse ${project}/${warehouse} refreshed"
            else
              echo "::warning::Kargo warehouse ${project}/${warehouse} refresh failed (HTTP ${http}): $(head -c 300 "$out/resp" 2>/dev/null)"
              failed=1
            fi
          done < <(jq -r '.[] | [.["kargo-project"], .["kargo-warehouse"]] | @tsv' <<<"$BAKES")
          exit "$failed"
