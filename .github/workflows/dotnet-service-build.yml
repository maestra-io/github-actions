          # not masked (no workflow commands after the step): never print a secret in a RUN.
          ( while sleep 60; do t=$(mint) && [ -n "$t" ] && write "$t"; done ) </dev/null >/dev/null 2>&1 &
          # <<< token-files
      - if: ${{ inputs.docker-test-target != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.docker-test-target }}
          load: true
          tags: local/${{ inputs.docker-test-target }}:latest
          secret-files: |
            PRIVATE_PACKAGES_TOKEN=${{ runner.temp }}/packages-token/PRIVATE_PACKAGES_TOKEN
            NUGET_CREDENTIALS=${{ runner.temp }}/packages-token/NUGET_CREDENTIALS
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
      - if: ${{ inputs.docker-test-target != '' }}
        env:
          TARGET: ${{ inputs.docker-test-target }}
        run: docker run --rm --env-file "$RUNNER_TEMP/test.env" "local/${TARGET}:latest"

      # ── test-command (non-.NET repos) ───────────────────────────────────
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
          TEST_IMAGE: ${{ inputs.test-image }}
          PACKAGES_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGES_URL: ${{ inputs.packages-url }}
        run: |
          if [ -n "$TEST_IMAGE" ]; then
            docker run --rm --env-file "$RUNNER_TEMP/test.env" -e PACKAGES_TOKEN -e PACKAGES_URL \
              -v "$PWD:/src" -w /src "$TEST_IMAGE" sh -c "$TEST_COMMAND"
          else
            bash -c "$TEST_COMMAND"
          fi

      # ── dotnet test (GitLab .update-source-and-test) ─────────────────────
      # setup-dotnet rejects a global.json `rollForward` with a version that is not a
      # full SDK version (10.0.0, 8.0.0); dotnet itself rolls forward from it. Such a
      # file gets <major>.<minor>.x; an explicit dotnet-version always wins.
      - if: ${{ inputs.docker-test-target == '' && inputs.test-command == '' }}
        id: sdk
        env:
          DOTNET_VERSION: ${{ inputs.dotnet-version }}
        run: |
          # >>> sdk-version (scripts/test-dotnet-service-build.sh runs this block)
          version="$DOTNET_VERSION"; file=""
          if [ -z "$version" ]; then
            file=global.json
            # Same test as setup-dotnet; a global.json jq cannot read (comments) is passed as is.
            v=$(jq -r '.sdk.version // empty' global.json 2>/dev/null) || v=""
            rf=$(jq -r '.sdk.rollForward // empty' global.json 2>/dev/null) || rf=""
            if [ -n "$rf" ] && ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[1-9][0-9]{2,}$ ]] && [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.x"; file=""
              echo "global.json sdk.version $v with rollForward $rf: setup-dotnet gets $version"
            fi
