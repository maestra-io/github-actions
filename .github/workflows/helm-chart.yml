# Reusable CI for a Helm chart repository: the GitHub port of the GitLab
# system/components/helm-ci (helm-merge-request + helm-release) for omega.
#
#   pull_request:      check (version bump, CHANGELOG entry, lint, unittest)
#   push to main:      release (package + push to ECR us-west-2 helm-charts/<name>)
#
# Job names are a contract (required checks): keep them.
#
# Usage (caller):
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     chart:
#       uses: maestra-io/github-actions/.github/workflows/helm-chart.yml@main
#       permissions: { contents: read, id-token: write }
#
# Inputs:
#   chart-path     Chart directory (default repo root).
#   helm-version   Helm CLI (default v3.18.5, as the GitLab jobs).
# helm-unittest (from nora) runs when a <chart-path>/tests/*.yaml is a helm-unittest
# suite (promtool tests etc. are the caller's).
#
# Lint/unittest values: <chart-path>/ci/values.yaml or ci/test-values.yaml, as
# in GitLab. Not ported: helm-diff MR comment, kind `helm template --validate`,
# metrics-validation, publish-dev label, the RU Yandex registry push.
#
# The PR secret scan is not part of this workflow: each repo runs it in its own
# workflow that calls this repo's reusable secret-scan workflow (see the README).

name: helm-chart

on:
  workflow_call:
    inputs:
      chart-path:
        type: string
        default: "."
      helm-version:
        type: string
        default: "v3.18.5"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('helm-check-{0}-{1}', github.repository, github.ref) || format('helm-release-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runs-on=${{ github.run_id }}-check/pool=small
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # setup-*-nora: the toolchain from nora
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: maestra-io/github-actions/setup-helm-nora@9b8a76b44a7333893fb2f995ab1afdcfb179ba59 # v1.106.5
        with:
          version: ${{ inputs.helm-version }}

      - name: Version bump and CHANGELOG
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          version=$(yq e '.version' "${CHART_PATH}/Chart.yaml")
          if git diff --quiet "$BASE_SHA" HEAD -- \
               "${CHART_PATH}/Chart.yaml" "${CHART_PATH}/Chart.lock" "${CHART_PATH}/values.yaml" \
               "${CHART_PATH}/values.schema.json" "${CHART_PATH}/templates" "${CHART_PATH}/charts" "${CHART_PATH}/crds"; then
            echo "No chart-affecting files changed; skipping version checks"
            exit 0
          fi
          base=$(git show "${BASE_SHA}:${CHART_PATH}/Chart.yaml" 2>/dev/null | yq e '.version' - || echo "0.0.0")
          echo "version: ${base} -> ${version}"
          if [ "$version" = "$base" ]; then
            echo "::error::Chart version has not been changed. Please update version in ${CHART_PATH}/Chart.yaml"
            exit 1
          fi
          if ! grep -q "^## Version ${version}\b" "${CHART_PATH}/CHANGELOG.md" 2>/dev/null; then
            echo "::error::Add a '## Version ${version}' section to ${CHART_PATH}/CHANGELOG.md"
            exit 1
          fi

      # The release archive is the plugin: `helm plugin install` would run its hook, which downloads
      # the binary from GitHub again.
      - name: helm-unittest through nora
        if: ${{ hashFiles(format('{0}/tests/*.yaml', inputs.chart-path)) != '' }}
        id: untt
        uses: maestra-io/github-actions/nora-asset@bce883a9462ae1a0ec95b02ac797f223589ef7a5 # v1.115.0
        with:
          path: github/helm-unittest/helm-unittest/releases/download/v1.1.0/helm-unittest-linux-amd64-1.1.0.tgz
          sha256: 3a8adc16a6d56cb2176b3668b4c4a3ec55130a8a8a52ae78804fd9b12ddf3418

      - name: Lint and unittest
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          UNITTEST_TGZ: ${{ steps.untt.outputs.file }}
        run: |
          set -euo pipefail
          values=()
          for f in ci/values.yaml ci/test-values.yaml; do
            if [ -f "${CHART_PATH}/$f" ]; then values=(--values "${CHART_PATH}/$f"); break; fi
          done
          helm dependency build "$CHART_PATH"
          helm lint "$CHART_PATH" "${values[@]}"
          if grep -qs "^suite:" "${CHART_PATH}"/tests/*.yaml; then
            d="$(helm env HELM_PLUGINS)/helm-unittest"; mkdir -p "$d"; tar -xzf "$UNITTEST_TGZ" -C "$d"
            helm unittest "$CHART_PATH"
          fi

  release:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: runs-on=${{ github.run_id }}-release/pool=small
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Teleport join -> AWS
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maestra-io/github-actions/setup-helm-nora@9b8a76b44a7333893fb2f995ab1afdcfb179ba59 # v1.106.5
        with:
          version: ${{ inputs.helm-version }}
      - uses: maestra-io/github-actions/push-helm-chart-to-aws-ecr@2450cdaaf4688887cb65579fc45ab5304cb81967 # v1.46.2
        with:
          chartPath: ${{ inputs.chart-path }}
