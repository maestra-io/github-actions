# maestra-io/github-actions/.github/workflows/ansible-pr.yml
#
# Reusable PR workflow: lint -> check-mode matrix (fan-out to ansible-run) -> unified PR comment.
#
# The caller passes:
#   - `envs`: a JSON array of {region,environment,site,inventory_group_suffix?,tags?,
#             vault_mode?,vault_addr?,teleport_app?,vault_role?,vault_secrets?,
#             vault2_addr?,vault2_role?,vault2_secrets?,
#             mint_proxmox_token?,extra_run_args?,extra_env?} objects -> becomes the check matrix.
#   - `playbook`, `use_mitogen`, `windows_mode`, etc. as shared defaults.
#
# Path convention: `playbook` / `inventory` / `lint_paths` are relative to `working_directory`.
#
# Standardized commenter flavor: FLAT plan-*.log + merge-multiple:true (the majority variant —
# nat-gateway / vpn / mssql / ad / haproxy). Single sticky comment, marker <!-- ansible-plan-diff -->.
# Log filenames carry the inventory_group_suffix (plan-<r>-<e>-<s><suffix>.log), so per-role
# rows (e.g. haproxy _haproxy_public vs _haproxy_api) each get their own table row; the
# commenter's parsing is prefix/extension stripping, so any suffix is tolerated.
#
# The PR secret scan is not part of this workflow: each repo runs it in its own
# workflow that calls this repo's reusable secret-scan workflow (see the README).
name: Ansible PR (reusable)

on:
  workflow_call:
    inputs:
      envs:
        description: "JSON array of per-env objects for the check matrix"
        required: true
        type: string
      playbook:
        required: true
        type: string
      inventory:
        description: "Inventory path relative to working_directory"
        required: false
        type: string
        default: "inventory/teleport_inventory.py"
      working_directory:
        required: false
        type: string
        default: "ansible"
      use_mitogen:
        required: false
        type: boolean
        default: true
      windows_mode:
        required: false
        type: boolean
        default: false
      lint_paths:
        description: "Paths passed to ansible-lint / yamllint, relative to working_directory"
        required: false
        type: string
        default: "."
      uv_project:
        description: >-
          Directory (workspace-relative) of the caller's pyproject.toml + uv.lock
          (next to ansible.cfg, so ansible/** path filters see a toolchain bump):
          the Ansible toolchain as `[project].dependencies`, ansible-lint/yamllint
          as the `lint` dependency group, nora as the only index
          (`[[tool.uv.index]] name = "maestra"`, default = true; issues-maestra#1649).
          While that directory has no uv.lock, requirements_lint / requirements_pip
          are installed from PyPI as before (legacy, removed once every caller has
          migrated).
        required: false
        type: string
        default: "ansible"
      requirements_lint:
        description: "Legacy (no uv.lock in uv_project): lint pins, installed with an unpinned ansible."
        required: false
        type: string
        default: "ansible/requirements-lint.txt"
      requirements_pip:
        description: "Legacy (no uv.lock in uv_project): the runtime requirements file."
        required: false
        type: string
        default: "ansible/requirements-pip.txt"
      requirements_galaxy:
        required: false
        type: string
        default: "ansible/requirements.yml"
      python_version:
        required: false
        type: string
        default: "3.14"
      teleport_join_token:
        required: false
        type: string
        default: "github-actions-infra-deploy"
      teleport_fqdn:
        required: false
        type: string
        default: "teleport.maestra.io:443"
      extra_env:
        description: "Extra KEY=VALUE lines for the Execute env (workflow-wide default; per-row extra_env in `envs` wins)"
        required: false
        type: string
        default: ""
      runs_on:
        description: "Default runner label for the check-matrix jobs; a per-row runs_on in `envs` wins. Empty = RunsOn t3a-small under a per-leg label: legs sharing one label steal each other's runners (issues-maestra#1556). Rows target different environments whose runners must not cross (omicron rows -> us-omicron-lw-runners; omega rows -> omega's own set). Lint and the comment job run on RunsOn t3a-small."
        required: false
        type: string
        default: ""
      extra_run_args:
        description: "Extra ansible-playbook args (workflow-wide default; per-row extra_run_args in `envs` wins)"
        required: false
        type: string
        default: ""
      no_hosts_fail_on_apply:
        required: false
        type: boolean
        default: false
      comment_max_chars:
        description: "Max characters of log tail included per env section in the PR comment"
        required: false
        type: string
        default: "4000"
    secrets:
      VECTOR_SIEM_BASIC_AUTH_USER:
        required: false
      VECTOR_SIEM_BASIC_AUTH_PASSWORD:
        required: false
      PROXMOX_MONITORING_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  lint:
    # RunsOn t3a-small (issues-maestra#1556): ~50 s of work on every PR push of
    # nine consumer repos; was ubuntu-slim.
    runs-on: runs-on=${{ github.run_id }}-lint/runner=t3a-small
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv-managed Python instead of actions/setup-python: on the bare slim
      # image setup-python downloads + copies a toolcache Python (~21s); uv
      # fetches a standalone build in ~2s. The venv lives in runner.temp, NOT
      # the workspace, so yamllint/ansible-lint over `lint_paths` never see it.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.13.6"
          enable-cache: false
          python-version: ${{ inputs.python_version }}
          activate-environment: true
          venv-path: ${{ runner.temp }}/lint-venv
      # Credentials for nora (packages.maestra.io), the caller's only Python index.
      - uses: maestra-io/github-actions/uv-nora@22ccbf9ff3d76fe13025cbc009d395024f025198 # v1.67.0
      # Inputs reach the shell through `env:`, never through ${{ }} in the script
      # body: GitHub substitutes the expression BEFORE bash parses the line, so a
      # quote or a `;` in a caller-supplied value would execute here. Same rule as
      # the tp-version / Execute steps in ansible-run.yml.
      # The lock's runtime set (the repo's own ansible pin) plus the `lint` group,
      # into the activated venv: ansible-lint judges against the ansible that runs.
      - name: Install lint deps
        env:
          DEPS_PROJECT: ${{ inputs.uv_project }}
          DEPS_GROUP: lint
          DEPS_TARGET: active
          LEGACY_REQUIREMENTS: ${{ inputs.requirements_lint }}
          LEGACY_EXTRA: ansible
        run: |
          # >>> python-deps (identical in every ansible workflow; ansible/tests/test-python-deps.sh)
          set -euo pipefail
          if [ -f "${DEPS_PROJECT}/uv.lock" ]; then
            # nora only: every package source is the nora registry (or the project
            # itself), every URL is on packages.maestra.io. Anything else (another
            # index, git, ssh, a path, a direct URL) is refused, never followed.
            lock="${DEPS_PROJECT}/uv.lock"
            if bad=$(grep -E '^source = ' "$lock" | sort -u | grep -vxF \
                  -e 'source = { registry = "https://packages.maestra.io/simple/" }' \
                  -e 'source = { virtual = "." }' -e 'source = { editable = "." }'); then
              echo "::error file=${lock}::uv.lock has sources other than the nora registry: ${bad//$'\n'/ }"
              exit 1
            fi
            if other=$(grep -oE '[a-z+]+://[^/"]+' "$lock" | sort -u | grep -vxF 'https://packages.maestra.io'); then
              echo "::error file=${lock}::uv.lock names hosts other than packages.maestra.io: ${other//$'\n'/ }"
              exit 1
            fi
            args=(--locked --no-install-project --project "$DEPS_PROJECT")
            [ -z "${DEPS_GROUP:-}" ] || args+=(--group "$DEPS_GROUP")
            if [ "$DEPS_TARGET" = active ]; then
              args+=(--active)
            else
              # setup-python's interpreter, as `pip install --system` did; --inexact keeps its pip.
              export UV_PROJECT_ENVIRONMENT="${pythonLocation:?actions/setup-python must run first}"
              args+=(--inexact)
            fi
            uv sync "${args[@]}"
          else
            echo "::warning::no ${DEPS_PROJECT}/uv.lock: installing ${LEGACY_REQUIREMENTS} from PyPI (legacy path, removed once every caller has a uv.lock; issues-maestra#1649)"
            legacy=(-r "$LEGACY_REQUIREMENTS")
            [ -z "${LEGACY_EXTRA:-}" ] || legacy=("$LEGACY_EXTRA" "${legacy[@]}")
            if [ "$DEPS_TARGET" = active ]; then uv pip install "${legacy[@]}"; else uv pip install --system "${legacy[@]}"; fi
          fi
          # <<< python-deps
      - name: Cache Ansible Galaxy collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          # "nora": collections cached before Galaxy went through nora (a version
          # younger than 3 days among them) are not restored.
          key: galaxy-nora-${{ runner.os }}-${{ hashFiles(inputs.requirements_galaxy) }}
      # Galaxy through nora (packages.maestra.io/ansible/, issues-maestra#1649 s9):
      # collection versions younger than 3 days are hidden there, so a range like
      # ">=8.0.0" resolves to the newest mature release. The ANSIBLE_GALAXY_SERVER_*
      # variables reach every later step: the install below and ansible-lint's own
      # requirements install. Auth: a GitHub OIDC token as Basic token:<jwt>
      # (expires in minutes, enough for the install that follows).
      - name: Galaxy through nora
        if: ${{ hashFiles(inputs.requirements_galaxy) != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const t = await core.getIDToken('packages.maestra.io');
            core.setSecret(t);
            core.exportVariable('ANSIBLE_GALAXY_SERVER_LIST', 'nora');
            core.exportVariable('ANSIBLE_GALAXY_SERVER_NORA_URL', 'https://packages.maestra.io/ansible/');
            core.exportVariable('ANSIBLE_GALAXY_SERVER_NORA_USERNAME', 'token');
            core.exportVariable('ANSIBLE_GALAXY_SERVER_NORA_PASSWORD', t);
      - name: Install Galaxy collections/roles
        if: ${{ hashFiles(inputs.requirements_galaxy) != '' }}
        # From working_directory so ansible.cfg's roles_path/collections_path apply
        # (matches the runner and the source repos' `cd ansible && ansible-galaxy install`).
        working-directory: ${{ inputs.working_directory }}
        env:
          REQUIREMENTS_GALAXY: ${{ inputs.requirements_galaxy }}
        run: ansible-galaxy install -r "${GITHUB_WORKSPACE}/${REQUIREMENTS_GALAXY}"
      # `lint_paths` is a space-separated list by contract (default `.`), so the
      # word-splitting is deliberate. `read -ra` keeps exactly that meaning while
      # the value stays DATA — an env var is never re-parsed as script text.
      - name: yamllint
        working-directory: ${{ inputs.working_directory }}
        env:
          LINT_PATHS: ${{ inputs.lint_paths }}
        run: |
          read -ra paths <<< "$LINT_PATHS"
          yamllint "${paths[@]}"
      - name: ansible-lint
        working-directory: ${{ inputs.working_directory }}
        env:
          LINT_PATHS: ${{ inputs.lint_paths }}
        run: |
          read -ra paths <<< "$LINT_PATHS"
          ansible-lint "${paths[@]}"

  check:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(inputs.envs) }}
    uses: ./.github/workflows/ansible-run.yml
    secrets: inherit
    with:
      playbook: ${{ inputs.playbook }}
      inventory: ${{ inputs.inventory }}
      working_directory: ${{ inputs.working_directory }}
      region: ${{ matrix.env.region }}
      environment: ${{ matrix.env.environment }}
      site: ${{ matrix.env.site }}
      inventory_group_suffix: ${{ matrix.env.inventory_group_suffix || '' }}
      tags: ${{ matrix.env.tags || '' }}
      check_mode: true
      use_mitogen: ${{ inputs.use_mitogen }}
      windows_mode: ${{ inputs.windows_mode }}
      vault_mode: ${{ matrix.env.vault_mode || 'none' }}
      vault_addr: ${{ matrix.env.vault_addr || 'https://vault.maestra.io' }}
      teleport_app: ${{ matrix.env.teleport_app || '' }}
      vault_role: ${{ matrix.env.vault_role || '' }}
      vault_secrets: ${{ matrix.env.vault_secrets || '' }}
      # Per-row like the rest of the vault block: a matrix row that needs a
      # fleet-wide secret alongside its per-contour ones carries its own second
      # source. Absent from a row means empty means the second fetch is skipped.
      vault2_addr: ${{ matrix.env.vault2_addr || '' }}
      vault2_role: ${{ matrix.env.vault2_role || '' }}
      vault2_secrets: ${{ matrix.env.vault2_secrets || '' }}
      mint_proxmox_token: ${{ matrix.env.mint_proxmox_token || false }}
      extra_env: ${{ matrix.env.extra_env || inputs.extra_env }}
      extra_run_args: ${{ matrix.env.extra_run_args || inputs.extra_run_args }}
      no_hosts_fail_on_apply: ${{ inputs.no_hosts_fail_on_apply }}
      teleport_join_token: ${{ inputs.teleport_join_token }}
      teleport_fqdn: ${{ inputs.teleport_fqdn }}
      uv_project: ${{ inputs.uv_project }}
      requirements_pip: ${{ inputs.requirements_pip }}
      requirements_galaxy: ${{ inputs.requirements_galaxy }}
      python_version: ${{ inputs.python_version }}
      runs_on: ${{ matrix.env.runs_on || inputs.runs_on || format('runs-on={0}-check-{1}/runner=t3a-small', github.run_id, strategy.job-index) }}
      artifact_name: ansible-check-${{ matrix.env.region }}-${{ matrix.env.environment }}-${{ matrix.env.site }}${{ matrix.env.inventory_group_suffix || '' }}

  comment:
    needs: check
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: runs-on=${{ github.run_id }}-comment/runner=t3a-small # see `lint`
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - name: Download all check logs (flat)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ansible-check-*
          merge-multiple: true
          path: logs
      - name: Upsert plan-diff comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const MARKER = '<!-- ansible-plan-diff -->';
            const MAX_PER_ENV = parseInt('${{ inputs.comment_max_chars }}', 10) || 4000;
            const logsDir = 'logs';

            const stripAnsi = (s) => s.replace(/\x1b\[[0-9;]*m/g, '');
            const count = (s, re) => { const m = s.match(re); return m ? m.length : 0; };

            // The profile_tasks callback pollutes plan logs with a per-task
            // timestamp banner line and a giant end-of-run timing summary
            // (TASKS RECAP / PLAYBOOK RECAP). A blind tail() of the raw log
            // showed ONLY that noise — the actual --diff output sits above it
            // and got cut off. Strip the banners, chop everything from
            // TASKS RECAP down (PLAY RECAP sits above it and survives), and
            // only then take the tail.
            // Banner match keys on the invariant tail "(elapsed)  cumulative ***"
            // rather than the leading timestamp, whose format is configurable
            // (datetime_format=iso8601 or custom strftime).
            const stripProfileNoise = (s) => s
              .split('\n')
              .filter(l => !/^.{0,80}\(\d+:\d{2}:\d{2}\.\d+\)\s+\d+:\d{2}:\d{2}\.\d+ \*+\s*$/.test(l))
              .join('\n')
              .replace(/(?:^|\n)[\n]*TASKS RECAP \*+[\s\S]*$/, '\n')
              .replace(/\n{3,}/g, '\n\n');

            let files = [];
            try {
              files = fs.readdirSync(logsDir)
                .filter(f => f.startsWith('plan-') && f.endsWith('.log'));
            } catch (e) { files = []; }

            const rows = [];
            const sections = [];
            for (const f of files.sort()) {
              const raw = stripAnsi(fs.readFileSync(path.join(logsDir, f), 'utf8'));
              // filename = plan-<region>-<env>-<site><suffix>.log; the whole middle
              // (incl. any inventory_group_suffix) becomes the row label.
              const env = f.replace(/^plan-/, '').replace(/\.log$/, '');
              const noHosts = /No hosts matched/i.test(raw);
              const changed = count(raw, /changed=[1-9]/g);
              const failed  = count(raw, /failed=[1-9]/g);
              const unreach = count(raw, /unreachable=[1-9]/g);

              let status;
              if (noHosts) status = '⏭️ no hosts';
              else if (failed || unreach) status = '❌ failed';
              else if (changed) status = '📝 changes';
              else status = '✅ no changes';

              rows.push(`| \`${env}\` | ${status} | changed=${changed} failed=${failed} unreachable=${unreach} |`);

              const hasChanges = changed > 0;
              const hasFailed = failed > 0 || unreach > 0;
              if (hasChanges || hasFailed) {
                const clean = stripProfileNoise(raw);
                const body = clean.length > MAX_PER_ENV
                  ? '... (older output truncated)\n' + clean.slice(-MAX_PER_ENV)
                  : clean;
                sections.push(`<details><summary>${env} — ${status}</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`);
              }
            }

            const table = rows.length
              ? ['| env | status | recap |', '| --- | --- | --- |', ...rows].join('\n')
              : '_No ansible check logs found._';

            const commentBody =
              `${MARKER}\n## Ansible plan (check mode)\n\n${table}\n\n${sections.join('\n\n')}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: commentBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: commentBody });
            }
