# Reusable check, build and release workflow for a micro-frontend (MCF): the GitHub
# port of frontend-ci-components templates/mcf (mcf@3) for the omega contour
# (issues-maestra#1571). The static files reach the buckets at promotion, by the
# upload Job of the MCF's own kustomization/, not from here.
#
#   version ─► install ─► codegen ─► checks, test, build ─► image ─► release ─► bake
#                                                      │                     └─► sourcemaps
#                                                      ├─► hot-test (pull_request)
#                                                      ├─► e2e-stand (pull_request, tests/e2e/) ─► e2e (input e2e)
#                                                      └─► functional (tests/functional/)
#   version ─► tests-install ─► tests-checks (tests/package.json)
#   pull_request: every job that ran ─► pr-gate (the required check)
#
# Warehouse refresh: no job here. The GitHub org webhook (workflow_run completed)
# refreshes every Kargo Warehouse labelled maestra.io/source-repo=<lower-case repo name>
# (fluxcd iota/us-iota-lw-kube-infra/kargo/webhook-receivers.yaml); Warehouses still
# poll ECR every 5 min as the fallback.
#
# Usage (caller, on push to the default branch and on pull_request):
#
#   jobs:
#     build:
#       uses: maestra-io/github-actions/.github/workflows/mcf-build.yml@main
#       permissions: { contents: write, id-token: write, pull-requests: read }
#       with:
#         push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
#
#   pull-requests: read is for the hotfix label; the hot-test stand link reaches the PR
#   as a deployment of environment hot-test.
#
# Inputs:
#   node-version        Exact Node.js version (default 24.19.0, as mcf@3).
#   test-max-workers    Vitest workers (default 6, as mcf@3).
#   min-lines-coverage  Lines coverage floor of `test` (default 40, as mcf@3).
#   test-timeout-minutes  Job timeout of `test` (default 30). A large vitest suite (frontend-email-editor:
#                       ~21 min on GitLab, over 30 on the build pool) raises it.
#   test-runner         RunsOn label of `test` after the run id (default `pool=build`, t3a.2xlarge).
#                       A large suite takes a 16 vCPU spot runner: `runner=fast-spot-test`
#                       (maestra-io/.github-private runs-on.yml; same env, so the caches restore).
#   push                Push the image and run release/bake (default true).
#                       Only from the default branch, never on pull_request.
#                       false = build-only dry run.
#   hot-test            On pull_request, publish the hot-test stand of the PR (default true):
#                       hot-test-publish.yml, https://hot-test-<repo>-pr-<N>.testing-env.omicron.maestra.io.
#                       Not for renovate/* and LocalizationPull branches or PRs from forks.
#   static-prefix       Folder of the built static under build/, no leading or trailing
#                       slash (default v2_static/<mcf>, <mcf> = the package name without its
#                       scope, - -> _). The admin shell frontend-core-v2 builds v2_static/core.
#   manifest            mcf (default): <static-prefix>/mf-manifest.json is the module
#                       federation manifest. core: <static-prefix>/manifest.json and
#                       build-info.json (frontend-core-v2). Both go on to hot-test-publish.yml.
#   image               ECR repository of the static image. Default: repository name.
#   service             Service name for bake (<service>-manifests). Default: repository name.
#   auth-jwt-url        auth-jwt the schema token comes from (default the omega one).
#   auth-jwt-client     Its client (auth-jwt-terraform terraform/omega/clients.tf).
#   teleport-token      Join token of the image-push bot (default the org-wide one).
#   packages-url        Package registry (default https://packages.maestra.io, nora).
#   packages-audience   `aud` of the GitHub OIDC token nora accepts.
#   functional-workers  Playwright workers of `functional` (default 4, as frontend-playwright).
#   functional-required A red `functional` fails the run and `pr gate` and holds the image and
#                       release (default false: advisory, the summary still shows red). The default
#                       turns true once the MCFs are green (issues-maestra#1573).
#   e2e                 Run `npm run e2e:ci` on the e2e stand (default false: opt-in per repo with
#                       `e2e: true` in pr.yml until every repo is on, then the input goes away).
#                       The e2e stand itself is published on every pull_request with tests/e2e/.
#   e2e-workers         Playwright workers of `e2e` (default 4).
#   e2e-required        A red `e2e` fails the run and `pr gate` (default false: advisory). It
#                       never holds the image or the release yet.
#   e2e-vault-role      Central Vault jwt-github role of `e2e` (default ci-e2e-autotests-eu).
#   e2e-vault-secret    KV v2 secret with ADMINSITE_USERNAME and ADMINSITE_PASSWORD, as
#                       vault-action reads it (default gitlab/data/ci-e2e/autotests-eu).
# Outputs:
#   release             The release number 1.1.N.
#
# Jobs:
#   install   node_modules (and tests/node_modules of a `tests` npm workspace) is cached
#             under the lockfile hash and `npm ci` runs only on a miss; every other job
#             restores it and never reaches nora. On a miss npm's tarball store
#             (~/.npm/_cacache) is restored by key prefix, so only changed packages hit nora.
#   tests-install  tests/ with its own tests/package-lock.json: `npm ci` there, the same
#             nora setup as `install`, cached under that lockfile's hash. A `tests` npm
#             workspace of the root (no tests/package-lock.json) comes from `install`.
#   tests-checks  tests/package.json: check-types and check-scripts in tests/ (mcf@3
#             unified-tests-types, unified-tests-lint) with codegen output. Fails the run,
#             holds the image.
#   codegen   GitHub OIDC -> auth-jwt JWT (masked) -> `npm run graphql-codegen`; the
#             generated code goes to the other jobs as an artifact.
#   checks    check-types, check-scripts, check-styles, entries in parallel; on
#             pull_request also check-unused-code and the localization keys report,
#             which never fail the job (mcf@3 allow_failure).
#   test      vitest with coverage, fails under min-lines-coverage. JUnit comes from the
#             shared vitest preset (reports/ in CI) -> artifact, test-results-ingest; a
#             repo on an older preset or with its own `reporters` sends nothing.
#   build     package.json version = release, LAST_HOTFIX from hotfix/* tags (the MF
#             plugin bakes both into the bundle), `npm run build`.
#   image     rclone + build/<static-prefix> without source maps -> ECR <image>:<release>,
#             once checks, test, build, tests-checks (with tests/) and a required
#             functional passed. A skipped tests-checks/functional skips nothing after it:
#             image, release, sourcemaps and bake guard on results, not on success().
#   release   git tag + GitHub Release <release>; a PR labelled `hotfix` also gets
#             the marker tag hotfix/<release>.
#   sourcemaps  the release's source maps -> Datadog US3 (service <mcf>, version <release>,
#             as mcf@3 upload-source-maps [maestra]); key from the central Vault
#             (jwt-github role mcf-build-sourcemaps-github-ci). Never fails the release.
#   bake      as in service-build.yml.
#   hot-test  pull_request only, right after `build`: the PR's static files and an
#             entry built on them go to the hot-test bucket, the PR gets the hot-test
#             deployment (hot-test-publish.yml; mcf@3 hot-test environments, issues-maestra#1574).
#   functional  tests/functional/playwright.config.ts, not on renovate/* and LocalizationPull
#             branches: the `static` artifact served by http-server on :8080, Chromium of
#             the tests' Playwright, `npm run functional:ci` in tests/ (mcf@3
#             functional-tests/run). JUnit -> step summary, artifact, test-results-ingest;
#             test-results/ (traces) as an artifact on failure. Advisory unless
#             functional-required.
#   e2e-stand  hot-test with stand-prefix e2e (tests/e2e/): fluxcd sends its API to the e2e tenant.
#   e2e       `npm run e2e:ci` in tests/ on the e2e stand, login from Vault (input e2e); skipped
#             without a route.
#   pr-gate   pull_request only, the check a branch ruleset requires (`build / pr gate`): red when
#             a PR job failed or was cancelled, skipped jobs pass; functional and e2e count only
#             with functional-required / e2e-required. image, release, sourcemaps, bake never run
#             on pull_request.
#
# Not ported from mcf@3: cyrillic (translation-checker, issues-maestra#1581),
# the -e2e/-with-deps images (issues-maestra#1573),
# multi-contour schema loading, and the RU contour jobs (Octopus, phrase, metrics,
# pipelines release submit, Mindbox Datadog source maps).

name: mcf-build

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24.19.0"
      test-max-workers:
        type: string
        default: "6"
      min-lines-coverage:
        type: string
        default: "40"
      test-timeout-minutes:
        type: number
        default: 30
      test-runner:
        type: string
        default: pool=build
      push:
        type: boolean
        default: true
      hot-test:
        type: boolean
        default: true
      static-prefix:
        type: string
        default: ""
      manifest:
        type: string
        default: mcf
      image:
        type: string
        default: ""
      service:
        type: string
        default: ""
      auth-jwt-url:
        type: string
        default: https://auth-jwt.maestra.io
      auth-jwt-client:
        type: string
        default: github-frontend-graphql-schema
      teleport-token:
        type: string
        default: image-push-github-actions-maestra-io
      packages-url:
        type: string
        default: https://packages.maestra.io
      packages-audience:
        type: string
        default: packages.maestra.io
      functional-workers:
        type: string
        default: "4"
      functional-required:
        type: boolean
        default: false
      e2e:
        type: boolean
        default: false
      e2e-workers:
        type: string
        default: "4"
      e2e-required:
        type: boolean
        default: false
      e2e-vault-role:
        type: string
        default: ci-e2e-autotests-eu
      e2e-vault-secret:
        type: string
        default: gitlab/data/ci-e2e/autotests-eu
    outputs:
      release:
        value: ${{ jobs.version.outputs.release }}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mcf-{0}-{1}', github.repository, github.ref) || format('release-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ECR_REGISTRY: 515260921971.dkr.ecr.us-west-2.amazonaws.com
  HUSKY: "0"

jobs:
  # Pull requests that change only the kustomization tree(s) skip version/test/images:
  # nothing that is built or tested changed. pr-checks still runs (the kustomize build of
  # the changed overlays). Any doubt (no merge commit, git failure, bake from the repo
  # root) means code=true: everything runs.
  changes:
    runs-on: runs-on=${{ github.run_id }}-changes/pool=small
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # A push (release) or workflow_dispatch builds everything: code=true without a diff. The job
      # must still RUN on those events - a skipped `changes` makes every dependent job that has
      # no `!cancelled()` guard (test, images, release, bake) skip too, which shipped empty green
      # releases on 2026-10-19.
      code: ${{ github.event_name == 'pull_request' && steps.c.outputs.code || 'true' }}
    steps:
      - uses: runs-on/action@v2.5.0
      # The test merge commit and its first parent, the base branch tip (HEAD^1).
      - uses: actions/checkout@v7.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: c
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BAKE_PATH: kustomization
          BAKES: ""
        run: |
          # >>> pr-changes (scripts/test-pr-changes.sh runs this block)
          # kustomization trees: bake-path plus the <bake-path> field of every `bakes` line.
          # Comments are stripped first (a `# src` comment is not a path). A tree that is the repo
          # root (`.`, `./`, empty) means everything is baked: never skip.
          raw=$( { printf '%s\n' "$BAKE_PATH"; printf '%s\n' "$BAKES" | sed 's/#.*//' | awk 'NF>=2{print $2}'; } \
            | sed -E 's#^\./##; s#/+$##; s#^$#.#')
          dirs=$(grep -vxE '\.?' <<<"$raw" | sort -u || true)
          root=false; grep -qxE '\.?' <<<"$raw" && root=true
          files=$(git diff --name-only --no-renames HEAD^1 HEAD 2>/dev/null) || files=""
          code=true
          if [ -n "$files" ] && [ -n "$dirs" ] && ! $root; then
            code=false
            while IFS= read -r f; do
              inside=false
              while IFS= read -r d; do case "$f" in "$d"/*) inside=true; break ;; esac; done <<<"$dirs"
              if ! $inside; then code=true; break; fi
            done <<<"$files"
          fi
          echo "kustomization trees: $(tr '\n' ' ' <<<"$dirs")"
          echo "changed files: $(wc -l <<<"$files" | tr -d ' ') -> code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # <<< pr-changes

  version:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: runs-on=${{ github.run_id }}-version/pool=small
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.v.outputs.release }}
      publish: ${{ steps.v.outputs.publish }}
      pr-stands: ${{ steps.v.outputs.pr-stands }}
      hot-test: ${{ steps.v.outputs.hot-test }}
      e2e-stand: ${{ steps.v.outputs.pr-stands == 'true' && steps.tests.outputs.e2e == 'true' }}
      image: ${{ steps.v.outputs.image }}
      service: ${{ steps.v.outputs.service }}
      mcf: ${{ steps.v.outputs.mcf }}
      static-prefix: ${{ steps.v.outputs.static-prefix }}
      manifest: ${{ steps.v.outputs.manifest }}
      manifest-files: ${{ steps.v.outputs.manifest-files }}
      bake: ${{ steps.v.outputs.bake }}
      last-hotfix: ${{ steps.hotfix.outputs.last-hotfix }}
      is-hotfix: ${{ steps.hotfix.outputs.is-hotfix }}
      tests: ${{ steps.tests.outputs.tests }}
      tests-layout: ${{ steps.tests.outputs.tests-layout }}
      functional: ${{ steps.tests.outputs.functional }}
      e2e: ${{ steps.tests.outputs.e2e }}
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            kustomization/
            tests/package.json
            tests/package-lock.json
            tests/functional/playwright.config.ts
            tests/e2e/playwright.config.ts
          sparse-checkout-cone-mode: false
      - id: v
        env:
          PREFIX: ${{ vars.RELEASE_PREFIX }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO_NAME: ${{ github.event.repository.name }}
          IMAGE: ${{ inputs.image }}
          SERVICE: ${{ inputs.service }}
          STATIC_PREFIX: ${{ inputs.static-prefix }}
          MANIFEST: ${{ inputs.manifest }}
          PUSH: ${{ inputs.push && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          PUSH_REQUESTED: ${{ inputs.push && github.event_name != 'pull_request' }}
          PR_STANDS: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'renovate/') && github.head_ref != 'LocalizationPull' }}
          HOT_TEST_INPUT: ${{ inputs.hot-test }}
        run: |
          HOT_TEST=false
          if [ "$PR_STANDS" = true ] && [ "$HOT_TEST_INPUT" = true ]; then HOT_TEST=true; fi
          if [ "$PUSH_REQUESTED" = true ] && [ "$PUSH" != true ]; then
            echo "::warning::$GITHUB_REF is not the default branch: build only, nothing is published"
          fi
          prefix="${PREFIX:-1.1}"
          case "$prefix" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::vars.RELEASE_PREFIX '$prefix' is not MAJOR.MINOR"; exit 1 ;;
          esac
          # build/v2_static/<mcf>: the package name without its scope, - -> _ (webpack-configs moduleFederation).
          mcf=$(jq -r '.name // empty' package.json | sed -E 's#^@[^/]+/##; s#-#_#g')
          [ -n "$mcf" ] || { echo "::error::package.json has no name"; exit 1; }
          # >>> static (scripts/test-mcf-build-static.sh runs this block)
          static_prefix="${STATIC_PREFIX:-v2_static/$mcf}"
          manifest="${MANIFEST:-mcf}"
          # The same path hot-test-publish.yml and the ResourceSet template accept, without the slashes.
          [[ "$static_prefix" =~ ^[a-z0-9_-]+(/[a-z0-9_-]+)*$ ]] || { echo "::error::static-prefix '$static_prefix' is not [a-z0-9_-]+(/[a-z0-9_-]+)* (no leading or trailing slash)"; exit 1; }
          case "$manifest" in
            mcf) manifest_files=mf-manifest.json ;;
            core) manifest_files="manifest.json build-info.json" ;;
            *) echo "::error::manifest '$manifest' is not mcf or core"; exit 1 ;;
          esac
          # <<< static
          {
            echo "release=${prefix}.${RUN_NUMBER}"
            echo "publish=$PUSH"
            echo "pr-stands=$PR_STANDS"
            echo "hot-test=$HOT_TEST"
            echo "image=${IMAGE:-$REPO_NAME}"
            echo "service=${SERVICE:-$REPO_NAME}"
            echo "mcf=$mcf"
            echo "static-prefix=$static_prefix"
            echo "manifest=$manifest"
            echo "manifest-files=$manifest_files"
            if [ -d kustomization ]; then echo "bake=true"; else echo "bake=false"; fi
          } >> "$GITHUB_OUTPUT"
          echo "release ${prefix}.${RUN_NUMBER}, mcf $mcf, static $static_prefix ($manifest), image ${IMAGE:-$REPO_NAME}, publish=$PUSH, hot-test=$HOT_TEST, kustomization/ $([ -d kustomization ] && echo present || echo absent)"

      - id: tests
        env:
          PLAYWRIGHT_EVENT: ${{ !startsWith(github.head_ref, 'renovate/') && github.head_ref != 'LocalizationPull' }}
        run: |
          # >>> tests-detect (scripts/test-functional.sh and scripts/test-e2e.sh run this block)
          tests=false; layout=none
          if [ -f tests/package.json ]; then
            tests=true
            if [ -f tests/package-lock.json ]; then layout=lockfile; else layout=workspace; fi
          fi
          playwright() { # playwright <functional|e2e>: run=true when tests/<kind>/ runs
            run=false
            [ -f "tests/$1/playwright.config.ts" ] || return 0
            if [ "$tests" != true ]; then
              echo "::warning::tests/$1/playwright.config.ts without tests/package.json: no $1 tests"
            elif [ "$PLAYWRIGHT_EVENT" = true ]; then
              run=true
            else
              echo "no $1 tests on $GITHUB_HEAD_REF"
            fi
          }
          playwright functional; functional=$run
          playwright e2e; e2e=$run
          { echo "tests=$tests"; echo "tests-layout=$layout"; echo "functional=$functional"; echo "e2e=$e2e"; } >> "$GITHUB_OUTPUT"
          echo "tests/: $layout, functional=$functional, e2e=$e2e"
          # <<< tests-detect

      # mcf@3 build/create-hotfix-marker: the MF plugin reads LAST_HOTFIX, the newest
      # hotfix/X.Y.Z tag, this release included when its PR carries the `hotfix` label.
      - id: hotfix
        if: ${{ steps.v.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.v.outputs.release }}
        run: |
          is_hotfix=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'any(.[]; any(.labels[]; .name == "hotfix"))') \
            || { echo "::warning::PR lookup failed; this release is not treated as a hotfix"; is_hotfix=false; }
          versions=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/hotfix/" --jq '.[].ref' \
            | sed -nE 's#^refs/tags/hotfix/([0-9]+\.[0-9]+\.[0-9]+)$#\1#p') \
            || { echo "::warning::hotfix tags query failed; LAST_HOTFIX may be incomplete"; versions=""; }
          if [ "$is_hotfix" = true ]; then versions=$(printf '%s\n%s' "$versions" "$RELEASE"); fi
          last_hotfix=$(printf '%s\n' "$versions" | grep . | sort -V | tail -n 1 || true)
          { echo "last-hotfix=$last_hotfix"; echo "is-hotfix=$is_hotfix"; } >> "$GITHUB_OUTPUT"
          echo "LAST_HOTFIX=${last_hotfix:-<none>} hotfix=$is_hotfix"

  install:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: runs-on=${{ github.run_id }}-install/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # nora OIDC token
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          # Missing paths are skipped; the cache version hashes this list: every restore repeats it.
          path: &root-node-modules |
            node_modules
            tests/node_modules
          key: mcf-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          lookup-only: true
      - &setup-node-on-miss
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - &write-npmrc
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        name: write .npmrc
        env:
          URL: ${{ inputs.packages-url }}
        run: |
          registry="${URL%/}/npm/"
          kept=""
          [ -f .npmrc ] && kept=$(grep -vE '^[[:space:]]*(registry|@[^:]+:registry|//[^=]*:_authToken|replace-registry-host|always-auth)[[:space:]]*=' .npmrc || true)
          {
            [ -z "$kept" ] || printf '%s\n' "$kept"
            echo "registry=${registry}"
            echo "@mindbox-cloud:registry=${registry}"
            echo "//${registry#https://}:_authToken=\${NPM_TOKEN}"
            echo "replace-registry-host=npmjs"
          } > "$RUNNER_TEMP/npmrc"
          mv "$RUNNER_TEMP/npmrc" .npmrc
      - &mint-token
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        name: mint packages token
        id: token
        uses: actions/github-script@v9.0.0
        env:
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);
      # npm's tarball store from the latest run (this branch, else the default one): a new
      # lockfile (a Renovate bump) fetches only the changed packages from nora, not all
      # ~2500 per MCF (a Renovate wave saturated nora's link, NoraHighLatency 21.10.2026).
      - &npm-cache-restore
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        id: npm-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.npm/_cacache
          key: npm-cacache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'tests/package-lock.json') }}
          restore-keys: npm-cacache-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - &npm-ci
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        name: npm ci
        env:
          NPM_TOKEN: ${{ steps.token.outputs.token }}
          URL: ${{ inputs.packages-url }}
        run: |
          # Same program as scripts/npm-lockfile-to-nora.sh (keep in sync; selftest covers the script).
          nora="${URL%/}/npm/"
          nora_re=$(printf '%s' "$nora" | sed 's/[.[\*^$/]/\\&/g')
          locks=()
          for f in package-lock.json npm-shrinkwrap.json; do [ -f "$f" ] && locks+=("$f"); done
          for f in "${locks[@]}"; do
            sed -i.bak -E \
              -e "s#(\"resolved\": *\")https://artifactory\.mindbox\.ru/artifactory/api/npm/[^/\"]+/#\1${nora}#g" \
              -e "s#(\"resolved\": *\"${nora_re}@[^/\"]+/[^/\"]+/-/)@[^/\"]+/#\1#g" \
              -e "s#(\"resolved\": *\")https://registry\.npmjs\.org/#\1${nora}#g" \
              "$f"
            rm -f "$f.bak"
          done
          npm ci --prefer-offline --no-audit --no-fund
      - &npm-cache-save
        if: ${{ steps.cache.outputs.cache-hit != 'true' && steps.npm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.npm/_cacache
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: *root-node-modules
          # The lockfile is rewritten to nora by now: its hash is not the key the other jobs look up.
          key: ${{ steps.cache.outputs.cache-primary-key }}

  tests-install:
    needs: version
    if: ${{ needs.version.outputs.tests-layout == 'lockfile' }}
    runs-on: runs-on=${{ github.run_id }}-tests-install/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # nora OIDC token
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: tests/node_modules
          key: mcf-tests-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('tests/package-lock.json') }}
          lookup-only: true
      - *setup-node-on-miss
      - *write-npmrc
      - *mint-token
      - *npm-cache-restore
      - *npm-ci
      - *npm-cache-save
      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: tests/node_modules
          key: ${{ steps.cache.outputs.cache-primary-key }}

  codegen:
    needs: install
    runs-on: runs-on=${{ github.run_id }}-codegen/pool=small
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # auth-jwt login
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *root-node-modules
          key: mcf-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - name: graphql-codegen
        env:
          AUTH_JWT_URL: ${{ inputs.auth-jwt-url }}
          AUTH_JWT_CLIENT: ${{ inputs.auth-jwt-client }}
        run: |
          if ! jq -e '.scripts["graphql-codegen"]' package.json >/dev/null; then
            echo "no graphql-codegen script"; tar -czf "$RUNNER_TEMP/codegen.tgz" -T /dev/null; exit 0
          fi
          id_token=$(curl -sSf --connect-timeout 10 --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUTH_JWT_URL" | jq -r '.value // empty')
          [ -n "$id_token" ] || { echo "::error::no GitHub OIDC token"; exit 1; }
          echo "::add-mask::$id_token"
          code=$(jq -cn --arg c "$AUTH_JWT_CLIENT" '{clientId: $c, policy: "default"}' \
            | curl -sS --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/jwt.json" -w '%{http_code}' -X POST "$AUTH_JWT_URL/token" \
                -H "Authorization: Bearer $id_token" -H "Content-Type: application/json" --data-binary @-)
          [ "$code" = 200 ] || { echo "::error::auth-jwt $AUTH_JWT_URL/token as $AUTH_JWT_CLIENT: HTTP $code"; exit 1; }
          JWT_TOKEN=$(jq -r '.token // .jwt // empty' "$RUNNER_TEMP/jwt.json")
          rm -f "$RUNNER_TEMP/jwt.json"
          [ -n "$JWT_TOKEN" ] || { echo "::error::auth-jwt response has no token"; exit 1; }
          echo "::add-mask::$JWT_TOKEN"
          JWT_TOKEN="$JWT_TOKEN" npm run graphql-codegen
          find src \( -path src/generated -o -name __generated__ \) -type d -prune -print0 \
            | tar -czf "$RUNNER_TEMP/codegen.tgz" --null -T -
          echo "generated: $(tar -tzf "$RUNNER_TEMP/codegen.tgz" | wc -l) entries"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: codegen
          path: ${{ runner.temp }}/codegen.tgz
          retention-days: 1

  checks:
    needs: codegen
    runs-on: runs-on=${{ github.run_id }}-checks/pool=build
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *root-node-modules
          key: mcf-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: codegen
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/codegen.tgz"
      - name: checks
        env:
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          logs="$RUNNER_TEMP/checks"; mkdir -p "$logs"
          names=(); advisory=" unused-code localization-keys "
          start() { local n=$1; shift; names+=("$n"); ( rc=0; "$@" > "$logs/$n.log" 2>&1 || rc=$?; echo "$rc" > "$logs/$n.rc" ) & }
          has() { jq -e --arg s "$1" '.scripts[$s]' package.json > /dev/null; }
          has check-types && start types npm run check-types
          has check-scripts && start lint npm run check-scripts
          has check-styles && start stylelint npm run check-styles
          shopt -s globstar nullglob
          entries=(src/entries/**/*.ts)
          [ "${#entries[@]}" -eq 0 ] \
            || start entries node ./node_modules/@mindbox-cloud/frontend-shared-configs/check-entry-types/checkEntryTypes.js
          if [ "$PR" = true ]; then
            has check-unused-code && start unused-code npm run check-unused-code
            i18n=./node_modules/@mindbox-cloud/frontend-i18n/utils
            [ -f "$i18n/deadLocalizationKeys.js" ] && start localization-keys bash -c "
              node $i18n/deadLocalizationKeys.js --md-report $logs/unused-keys.md
              [ ! -f $i18n/undefinedLocalizationKeys.js ] || node $i18n/undefinedLocalizationKeys.js --md-report $logs/missing-keys.md"
          fi
          wait
          printf '### checks\n\n| check | result |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          failed=""
          for n in "${names[@]}"; do
            rc=$(cat "$logs/$n.rc")
            echo "::group::$n (exit $rc)"; cat "$logs/$n.log"; echo "::endgroup::"
            if [ "$rc" = 0 ]; then r=passed
            elif [[ "$advisory" == *" $n "* ]]; then r="failed (not blocking)"
            else r=failed; failed="$failed $n"; fi
            echo "| \`$n\` | $r |" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$logs"/unused-keys.md "$logs"/missing-keys.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ -z "$failed" ] || { echo "::error::checks failed:$failed"; exit 1; }

  test:
    needs: codegen
    runs-on: runs-on=${{ github.run_id }}-test/${{ inputs.test-runner }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    permissions:
      contents: read
      id-token: write # test-results-ingest
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *root-node-modules
          key: mcf-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: codegen
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/codegen.tgz"
      - name: vitest
        env:
          WORKERS: ${{ inputs.test-max-workers }}
          MIN_LINES_COVERAGE: ${{ inputs.min-lines-coverage }}
        run: |
          # typecheck is the `types` check of the checks job.
          npm test -- \
            --maxConcurrency=4 \
            --maxWorkers="$WORKERS" \
            --testTimeout=20000 \
            --typecheck.enabled=false \
            --coverage \
            --coverage.reportsDirectory=coverage \
            --coverage.reporter=json-summary \
            --coverage.reporter=text-summary
          lines=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "lines coverage: ${lines}% (floor ${MIN_LINES_COVERAGE}%)" | tee -a "$GITHUB_STEP_SUMMARY"
          if awk "BEGIN { exit !($lines < $MIN_LINES_COVERAGE) }"; then
            echo "::error::lines coverage ${lines}% is below ${MIN_LINES_COVERAGE}%"; exit 1
          fi
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-vitest-${{ github.run_attempt }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: ingest test results
        if: ${{ always() }}
        continue-on-error: true
        uses: maestra-io/github-actions/test-results-ingest@v1
        with:
          path: reports

  tests-checks:
    needs: [version, install, tests-install, codegen]
    if: ${{ !cancelled() && needs.version.outputs.tests == 'true' && needs.install.result == 'success' && needs.codegen.result == 'success' && (needs.tests-install.result == 'success' || needs.tests-install.result == 'skipped') }}
    runs-on: runs-on=${{ github.run_id }}-tests-checks/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *root-node-modules
          key: mcf-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - if: ${{ needs.version.outputs.tests-layout == 'lockfile' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: tests/node_modules
          key: mcf-tests-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('tests/package-lock.json') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: codegen
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/codegen.tgz"
      - name: tests/ checks
        working-directory: tests
        run: |
          printf '### tests/ checks\n\n| check | result |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          failed=""
          for s in check-types check-scripts; do
            if ! jq -e --arg s "$s" '.scripts[$s]' package.json > /dev/null; then
              echo "| \`$s\` | no script |" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            rc=0
            echo "::group::npm run $s"
            npm run "$s" --if-present || rc=$?
            echo "::endgroup::"
            if [ "$rc" = 0 ]; then r=passed; else r="failed (exit $rc)"; failed="$failed $s"; fi
            echo "| \`$s\` | $r |" >> "$GITHUB_STEP_SUMMARY"
          done
          [ -z "$failed" ] || { echo "::error::tests/ checks failed:$failed"; exit 1; }

  build:
    needs: [version, codegen]
    runs-on: runs-on=${{ github.run_id }}-build/pool=build
    timeout-minutes: 30
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *root-node-modules
          key: mcf-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: codegen
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/codegen.tgz"
      - name: npm run build
        env:
          PUBLISH: ${{ needs.version.outputs.publish }}
          RELEASE: ${{ needs.version.outputs.release }}
          LAST_HOTFIX: ${{ needs.version.outputs.last-hotfix }}
          STATIC_PREFIX: ${{ needs.version.outputs.static-prefix }}
          MANIFEST_FILES: ${{ needs.version.outputs.manifest-files }}
        run: |
          [ "$PUBLISH" != true ] || npm pkg set version="$RELEASE"
          echo "version $(jq -r .version package.json), LAST_HOTFIX=${LAST_HOTFIX:-<none>}"
          npm run build
          out="build/$STATIC_PREFIX"; top="${STATIC_PREFIX%%/*}"
          for f in $MANIFEST_FILES; do
            [ -f "$out/$f" ] || { echo "::error::$out/$f was not built"; exit 1; }
          done
          [ "$PUBLISH" != true ] || tar -czf "$RUNNER_TEMP/sourcemaps.tgz" -C build "$top"
          find build -name '*.map' -type f -delete
          tar -czf "$RUNNER_TEMP/static.tgz" -C build "$top"
          du -sh "$out"
      - if: ${{ needs.version.outputs.publish == 'true' || needs.version.outputs.hot-test == 'true' || needs.version.outputs.e2e-stand == 'true' || needs.version.outputs.functional == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: static
          path: ${{ runner.temp }}/static.tgz
          retention-days: 1
      - if: ${{ needs.version.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sourcemaps
          path: ${{ runner.temp }}/sourcemaps.tgz
          retention-days: 1

  image:
    needs: [version, checks, test, build, tests-checks, functional]
    if: ${{ !cancelled() && needs.version.outputs.publish == 'true' && needs.checks.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && (needs.version.outputs.tests != 'true' || needs.tests-checks.result == 'success') && (!inputs.functional-required || needs.version.outputs.functional != 'true' || needs.functional.result == 'success') }}
    runs-on: runs-on=${{ github.run_id }}-image/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Teleport join
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: static
          path: ${{ runner.temp }}
      - name: build ${{ needs.version.outputs.image }}:${{ needs.version.outputs.release }}
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          ctx="$RUNNER_TEMP/image"; mkdir -p "$ctx/static"
          tar -xzf "$RUNNER_TEMP/static.tgz" -C "$ctx/static"
          printf 'FROM rclone/rclone:1.67.0\nCOPY static /static\n' > "$ctx/Dockerfile"
          docker build "$ctx" -t "local/$IMAGE:$RELEASE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$RELEASE"
      - uses: maestra-io/github-actions/push-to-aws-ecr-repository@v1
        with:
          awsRegion: us-west-2
          repositories: ${{ needs.version.outputs.image }}
          localTag: ${{ needs.version.outputs.release }}
          targetTag: ${{ needs.version.outputs.release }}
          teleportToken: ${{ inputs.teleport-token }}

  # Git tag + GitHub Release BEFORE the bake: bake-oci-manifests checks out the release tag.
  release:
    needs: [version, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: runs-on=${{ github.run_id }}-release/pool=small
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: runs-on/action@v2.5.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.version.outputs.release }}
          IS_HOTFIX: ${{ needs.version.outputs.is-hotfix }}
        run: |
          if gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE already exists"
          else
            gh release create "$RELEASE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$RELEASE" --generate-notes
          fi
          if [ "$IS_HOTFIX" = true ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/hotfix/$RELEASE" -f sha="$GITHUB_SHA" >/dev/null \
              && echo "created hotfix/$RELEASE" \
              || echo "::warning::failed to create hotfix/$RELEASE; the next release's LAST_HOTFIX misses it"
          fi

  sourcemaps:
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: runs-on=${{ github.run_id }}-sourcemaps/pool=small
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # central Vault (jwt-github), nora
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: sourcemaps
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://vault.maestra.io
          method: jwt
          path: jwt-github
          role: mcf-build-sourcemaps-github-ci
          jwtGithubAudience: https://github.com/maestra-io
          secrets: |
            github/data/mcf-build/datadog api_key | DATADOG_API_KEY ;
      - name: mint packages token
        id: token
        uses: actions/github-script@v9.0.0
        env:
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);
      - name: datadog-ci sourcemaps upload
        env:
          NPM_TOKEN: ${{ steps.token.outputs.token }}
          URL: ${{ inputs.packages-url }}
          MCF: ${{ needs.version.outputs.mcf }}
          RELEASE: ${{ needs.version.outputs.release }}
          DATADOG_SITE: us3.datadoghq.com
        run: |
          registry="${URL%/}/npm/"
          {
            echo "registry=${registry}"
            echo "//${registry#https://}:_authToken=\${NPM_TOKEN}"
          } > "$RUNNER_TEMP/npmrc"
          dir="$RUNNER_TEMP/sourcemaps"; mkdir -p "$dir"
          tar -xzf "$RUNNER_TEMP/sourcemaps.tgz" -C "$dir"
          echo "$(find "$dir" -name '*.map' | wc -l) source maps of $MCF@$RELEASE"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npx --yes @datadog/datadog-ci@5.24.1 sourcemaps upload "$dir" \
            --service "$MCF" \
            --release-version "$RELEASE" \
            --minified-path-prefix /

  bake:
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.version.outputs.bake == 'true' }}
    runs-on: runs-on=${{ github.run_id }}-bake/pool=small
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Teleport join + cosign keyless
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: maestra-io/github-actions/bake-oci-manifests@v1
        with:
          service: ${{ needs.version.outputs.service }}
          images: ${{ needs.version.outputs.image }}
          tag: ${{ needs.version.outputs.release }}
          teleport-token: ${{ inputs.teleport-token }}

  # Hot-test stand of the PR, right after build (checks and tests do not gate it, as the
  # GitLab hot-test jobs).
  hot-test:
    needs: [version, build]
    if: ${{ needs.version.outputs.hot-test == 'true' }}
    uses: maestra-io/github-actions/.github/workflows/hot-test-publish.yml@main
    permissions:
      contents: read
      id-token: write # Teleport join
    with:
      repo: ${{ github.event.repository.name }}
      pr-number: ${{ github.event.pull_request.number }}
      mcf: ${{ needs.version.outputs.mcf }}
      static-prefix: ${{ needs.version.outputs.static-prefix }}
      manifest: ${{ needs.version.outputs.manifest }}
      static-artifact: static

  # The e2e tests' own stand: the entry bakes the stand host in, so it cannot share hot-test's.
  e2e-stand:
    needs: [version, build]
    if: ${{ needs.version.outputs.e2e-stand == 'true' }}
    uses: maestra-io/github-actions/.github/workflows/hot-test-publish.yml@main
    permissions:
      contents: read
      id-token: write # Teleport join
    with:
      repo: ${{ github.event.repository.name }}
      pr-number: ${{ github.event.pull_request.number }}
      mcf: ${{ needs.version.outputs.mcf }}
      static-prefix: ${{ needs.version.outputs.static-prefix }}
      manifest: ${{ needs.version.outputs.manifest }}
      static-artifact: static
      stand-prefix: e2e

  functional:
    needs: [version, install, tests-install, build]
    if: ${{ !cancelled() && needs.version.outputs.functional == 'true' && needs.build.result == 'success' && (needs.tests-install.result == 'success' || needs.tests-install.result == 'skipped') }}
    runs-on: runs-on=${{ github.run_id }}-functional/pool=build
    timeout-minutes: 30
    continue-on-error: ${{ !inputs.functional-required }}
    permissions:
      contents: read
      id-token: write # nora OIDC token, test-results-ingest
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *root-node-modules
          key: mcf-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - if: ${{ needs.version.outputs.tests-layout == 'lockfile' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: tests/node_modules
          key: mcf-tests-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('tests/package-lock.json') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: static
          path: ${{ runner.temp }}
      - name: unpack static
        env:
          STATIC_PREFIX: ${{ needs.version.outputs.static-prefix }}
        run: |
          site="$RUNNER_TEMP/site"; mkdir -p "$site"
          tar -xzf "$RUNNER_TEMP/static.tgz" -C "$site"
          [ -f "$site/$STATIC_PREFIX/index.html" ] \
            || { echo "::error::build/$STATIC_PREFIX/index.html was not built: the functional tests open it"; exit 1; }
      - id: playwright
        working-directory: tests
        run: |
          v=$(node -p "require('@playwright/test/package.json').version" || true)
          [ -n "$v" ] || { echo "::error::no Playwright in tests/"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Playwright $v"
      - id: browsers
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: mcf-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: install chromium
        working-directory: tests
        run: npx --no playwright install --with-deps chromium
      - if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - name: mint packages token
        id: token
        uses: actions/github-script@v9.0.0
        env:
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);
      # The tests hardcode :8080 (frontend-webhooks Common.ts), whatever BASE_URL says.
      - name: start http-server
        env:
          NPM_TOKEN: ${{ steps.token.outputs.token }}
          URL: ${{ inputs.packages-url }}
        run: |
          registry="${URL%/}/npm/"
          {
            echo "registry=${registry}"
            echo "//${registry#https://}:_authToken=\${NPM_TOKEN}"
          } > "$RUNNER_TEMP/npmrc"
          srv="$RUNNER_TEMP/http-server"; mkdir -p "$srv"; cd "$srv"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm install --prefix "$srv" --no-save --no-audit --no-fund http-server@14.1.1
          nohup "$srv/node_modules/.bin/http-server" "$RUNNER_TEMP/site" -p 8080 -c-1 --cors \
            > "$RUNNER_TEMP/http-server.log" 2>&1 &
      - name: wait for http-server
        env:
          BASE_URL: http://localhost:8080
          SERVER_WAIT_TIMEOUT: "30"
          SERVER_LOG: ${{ runner.temp }}/http-server.log
        run: |
          # >>> functional-wait (scripts/test-functional.sh runs this block)
          up=false
          for _ in $(seq 1 "$SERVER_WAIT_TIMEOUT"); do
            if curl -fs -o /dev/null --max-time 2 "$BASE_URL/"; then up=true; break; fi
            sleep 1
          done
          if [ "$up" != true ]; then
            echo "::error::http-server did not answer $BASE_URL/ in ${SERVER_WAIT_TIMEOUT}s"
            cat "$SERVER_LOG" 2>/dev/null || true
            exit 1
          fi
          echo "http-server answers $BASE_URL/"
          # <<< functional-wait
      - id: run
        name: npm run functional:ci
        working-directory: tests
        env:
          BASE_URL: http://localhost:8080
          RETRIES: "2"
          WORKERS: ${{ inputs.functional-workers }}
        run: |
          set -o pipefail
          npm run functional:ci 2>&1 | tee "$RUNNER_TEMP/functional.log"
      - name: summary
        if: ${{ always() }}
        env:
          JUNIT: tests/functional/test-results/results.xml
          LOG: ${{ runner.temp }}/functional.log
          OUTCOME: ${{ steps.run.outcome }}
          REQUIRED: ${{ inputs.functional-required }}
        run: |
          # >>> functional-summary (scripts/test-functional.sh runs this block)
          python3 -I - "$JUNIT" "$LOG" "$OUTCOME" "$REQUIRED" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, re, sys
          import xml.etree.ElementTree as ET

          junit, log, outcome, required = sys.argv[1:5]
          out = ["### functional tests", ""]
          if os.path.isfile(junit) and os.path.getsize(junit) > 0:
              root = ET.parse(junit).getroot()
              total = failed = skipped = flaky = 0
              names, seconds = [], 0.0
              for case in root.iter("testcase"):
                  total += 1
                  seconds += float(case.get("time") or 0)
                  tags = {child.tag for child in case}
                  if tags & {"failure", "error"}:
                      failed += 1
                      names.append(f"{case.get('classname', '')} › {case.get('name', '')}")
                  elif "skipped" in tags:
                      skipped += 1
                  elif any(t.startswith("flaky") for t in tags):
                      flaky += 1
              if os.path.isfile(log):
                  m = re.search(r"^\s*(\d+) flaky\s*$", open(log, errors="replace").read(), re.M)
                  if m:
                      flaky = max(flaky, int(m.group(1)))
              if root.get("time"):
                  seconds = float(root.get("time"))
              if failed:
                  out.append(f":x: {failed} of {total} failed")
              elif outcome != "success":
                  out.append(f":x: `functional:ci` failed ({outcome}) with no failed test in the report")
              else:
                  out.append(f":white_check_mark: {total - skipped} of {total} passed")
              out += ["", "| tests | passed | failed | flaky | skipped | duration |", "|---|---|---|---|---|---|",
                      f"| {total} | {total - failed - skipped} | {failed} | {flaky} | {skipped} | {seconds:.1f} s |"]
              if names:
                  out += ["", "Failed:"] + [f"- `{n}`" for n in names]
          elif outcome in ("", "skipped"):
              out.append(":x: the tests did not run: an earlier step failed")
          else:
              out.append(f":x: no JUnit report at `{junit}` (`functional:ci` {outcome})")
          if required != "true":
              out += ["", "not blocking: functional-required is false"]
          print("\n".join(out))
          PY
          # <<< functional-summary
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: functional-test-results-${{ github.run_attempt }}
          path: tests/functional/test-results
          retention-days: 3
          if-no-files-found: ignore
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: functional-junit-${{ github.run_attempt }}
          path: tests/functional/test-results/results.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: ingest test results
        if: ${{ always() }}
        continue-on-error: true
        uses: maestra-io/github-actions/test-results-ingest@v1
        with:
          path: tests/functional/test-results/results.xml

  e2e:
    needs: [version, install, tests-install, e2e-stand]
    if: ${{ !cancelled() && inputs.e2e && needs.version.outputs.e2e == 'true' && needs.e2e-stand.result == 'success' && needs.e2e-stand.outputs.route == 'true' && needs.install.result == 'success' && (needs.tests-install.result == 'success' || needs.tests-install.result == 'skipped') }}
    runs-on: runs-on=${{ github.run_id }}-e2e/pool=build
    timeout-minutes: 60
    continue-on-error: ${{ !inputs.e2e-required }}
    permissions:
      contents: read
      id-token: write # central Vault (jwt-github), test-results-ingest
    steps:
      - uses: runs-on/action@v2.5.0
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: *root-node-modules
          key: mcf-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - if: ${{ needs.version.outputs.tests-layout == 'lockfile' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: tests/node_modules
          key: mcf-tests-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('tests/package-lock.json') }}
          fail-on-cache-miss: true
      - id: playwright
        working-directory: tests
        run: |
          v=$(node -p "require('@playwright/test/package.json').version" || true)
          [ -n "$v" ] || { echo "::error::no Playwright in tests/"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Playwright $v"
      - id: browsers
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: mcf-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: install chromium
        working-directory: tests
        run: npx --no playwright install --with-deps chromium
      - if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # Outputs only: exported env would reach every later step (uploads, ingest).
      - id: vault
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: https://vault.maestra.io
          method: jwt
          path: jwt-github
          role: ${{ inputs.e2e-vault-role }}
          jwtGithubAudience: https://github.com/maestra-io
          exportEnv: false
          exportToken: false
          secrets: |
            ${{ inputs.e2e-vault-secret }} ADMINSITE_USERNAME | ADMINSITE_USERNAME ;
            ${{ inputs.e2e-vault-secret }} ADMINSITE_PASSWORD | ADMINSITE_PASSWORD
      - id: run
        name: npm run e2e:ci
        working-directory: tests
        env:
          CI: "true"
          BASE_URL: ${{ needs.e2e-stand.outputs.url }}
          ADMINSITE_USERNAME: ${{ steps.vault.outputs.ADMINSITE_USERNAME }}
          ADMINSITE_PASSWORD: ${{ steps.vault.outputs.ADMINSITE_PASSWORD }}
          TEST_ENVIRONMENT: pull-request
          RETRIES: "2"
          WORKERS: ${{ inputs.e2e-workers }}
        run: |
          set -o pipefail
          npm run e2e:ci 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - name: summary
        if: ${{ always() }}
        env:
          JUNIT: tests/e2e/test-results/results.xml
          LOG: ${{ runner.temp }}/e2e.log
          OUTCOME: ${{ steps.run.outcome }}
          REQUIRED: ${{ inputs.e2e-required }}
          STAND: ${{ needs.e2e-stand.outputs.url }}
        run: |
          # >>> e2e-summary (scripts/test-e2e.sh runs this block)
          python3 -I - "$JUNIT" "$LOG" "$OUTCOME" "$REQUIRED" "$STAND" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import os, re, sys
          import xml.etree.ElementTree as ET

          junit, log, outcome, required, stand = sys.argv[1:6]
          out = ["### e2e tests", "", f"Stand: {stand}", ""]
          if os.path.isfile(junit) and os.path.getsize(junit) > 0:
              root = ET.parse(junit).getroot()
              total = failed = skipped = flaky = 0
              names, seconds = [], 0.0
              for case in root.iter("testcase"):
                  total += 1
                  seconds += float(case.get("time") or 0)
                  tags = {child.tag for child in case}
                  if tags & {"failure", "error"}:
                      failed += 1
                      names.append(f"{case.get('classname', '')} › {case.get('name', '')}")
                  elif "skipped" in tags:
                      skipped += 1
                  elif any(t.startswith("flaky") for t in tags):
                      flaky += 1
              if os.path.isfile(log):
                  m = re.search(r"^\s*(\d+) flaky\s*$", open(log, errors="replace").read(), re.M)
                  if m:
                      flaky = max(flaky, int(m.group(1)))
              if root.get("time"):
                  seconds = float(root.get("time"))
              if failed:
                  out.append(f":x: {failed} of {total} failed")
              elif outcome != "success":
                  out.append(f":x: `e2e:ci` failed ({outcome}) with no failed test in the report")
              else:
                  out.append(f":white_check_mark: {total - skipped} of {total} passed")
              out += ["", "| tests | passed | failed | flaky | skipped | duration |", "|---|---|---|---|---|---|",
                      f"| {total} | {total - failed - skipped} | {failed} | {flaky} | {skipped} | {seconds:.1f} s |"]
              if names:
                  out += ["", "Failed:"] + [f"- `{n}`" for n in names]
          elif outcome in ("", "skipped"):
              out.append(":x: the tests did not run: an earlier step failed")
          elif outcome == "success":
              out.append(f":warning: `e2e:ci` passed but wrote no JUnit report at `{junit}`")
          else:
              out.append(f":x: `e2e:ci` failed ({outcome}) and wrote no JUnit report at `{junit}`: see the job log")
          if required != "true":
              out += ["", "not blocking: e2e-required is false"]
          print("\n".join(out))
          PY
          # <<< e2e-summary
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-test-results-${{ github.run_attempt }}
          path: tests/e2e/test-results
          retention-days: 3
          if-no-files-found: ignore
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-junit-${{ github.run_attempt }}
          path: tests/e2e/test-results/results.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: ingest test results
        if: ${{ always() }}
        continue-on-error: true
        uses: maestra-io/github-actions/test-results-ingest@v1
        with:
          path: tests/e2e/test-results/results.xml

  # The kustomize build of a changed kustomization/ tree on every pull request (a PR that
  # changes only kustomization/ skips the build/test jobs, so this is its validation);
  # check-encoding stays with the service builds.
  pr-checks:
    if: ${{ github.event_name == 'pull_request' }}
    uses: maestra-io/github-actions/.github/workflows/pr-checks.yml@main
    permissions:
      contents: read
    with:
      check-encoding: false
      kustomize: true

  pr-gate:
    name: pr gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [changes, version, install, tests-install, codegen, checks, test, tests-checks, build, hot-test, e2e-stand, functional, e2e, pr-checks]
    runs-on: runs-on=${{ github.run_id }}-pr-gate/pool=small
    timeout-minutes: 5
    steps:
      - uses: runs-on/action@v2.5.0
      - env:
          NEEDS: ${{ toJSON(needs) }}
          FUNCTIONAL_REQUIRED: ${{ inputs.functional-required }}
          E2E_REQUIRED: ${{ inputs.e2e-required }}
        run: |
          # >>> pr-gate (scripts/test-mcf-build-pr-gate.sh runs this block)
          echo "PR jobs: $(jq -c 'map_values(.result)' <<<"$NEEDS")"
          red=$(jq -r --argjson fr "$FUNCTIONAL_REQUIRED" --argjson er "$E2E_REQUIRED" '
            (if $fr then . else del(.functional) end) | (if $er then . else del(.e2e) end)
            | to_entries | map(select(.value.result == "failure" or .value.result == "cancelled") | .key) | join(" ")' <<<"$NEEDS")
          [ -z "$red" ] || { echo "::error::failed or cancelled: $red"; exit 1; }
          # <<< pr-gate
