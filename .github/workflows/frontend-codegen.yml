# Reusable GraphQL codegen job for a frontend whose pipeline is its own (the legacy
# admin, maestra-io/frontend; issues-maestra#1539, #1571). The same job is the
# `codegen` job of mcf-build.yml.
#
# Why it is a workflow and not a job in the caller: the auth-jwt client below enforces
# an exact job_workflow_ref, and a reusable workflow called at @main presents a constant
# one, where a caller's own pr.yml carries the PR number. So the OIDC audience, auth-jwt
# URL and client are constants here, not inputs: a caller must not redirect the token.
#
# Usage (caller; needs a job `install` that saved node_modules under
# mcf-node-modules-<os>-<arch>-<node-version>-<package-lock.json hash>):
#
#   jobs:
#     codegen:
#       needs: install
#       uses: maestra-io/github-actions/.github/workflows/frontend-codegen.yml@main
#       permissions: { contents: read, id-token: write }
#       with: { node-version: "24" }
#
# Inputs:
#   node-version  Node.js version of the `install` cache key (default 24).
# Outputs:
#   artifact `codegen`  codegen.tgz: src/generated and every __generated__ directory,
#                       to be unpacked at the repository root (empty archive when the
#                       package has no graphql-codegen script). One day retention.
#
# auth-jwt: client github-frontend-graphql-schema at https://auth-jwt.maestra.io
# (auth-jwt-terraform terraform/omega/clients.tf) accepts job_workflow_ref
# maestra-io/github-actions/.github/workflows/frontend-codegen.yml@refs/heads/main,
# so callers must use @main.
#
# The PR secret scan is not part of this workflow: each repo runs it in its own
# workflow that calls this repo's reusable secret-scan workflow (see the README).
name: frontend-codegen

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"

jobs:
  codegen:
    runs-on: runs-on=${{ github.run_id }}-codegen/pool=small
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # auth-jwt login
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: mcf-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true
      - name: graphql-codegen
        env:
          AUTH_JWT_URL: https://auth-jwt.maestra.io
          AUTH_JWT_CLIENT: github-frontend-graphql-schema
        run: |
          if ! jq -e '.scripts["graphql-codegen"]' package.json >/dev/null; then
            echo "no graphql-codegen script"; tar -czf "$RUNNER_TEMP/codegen.tgz" -T /dev/null; exit 0
          fi
          id_token=$(curl -sSf --connect-timeout 10 --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUTH_JWT_URL" | jq -r '.value // empty')
          [ -n "$id_token" ] || { echo "::error::no GitHub OIDC token"; exit 1; }
          echo "::add-mask::$id_token"
          code=$(jq -cn --arg c "$AUTH_JWT_CLIENT" '{clientId: $c, policy: "default"}' \
            | curl -sS --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/jwt.json" -w '%{http_code}' -X POST "$AUTH_JWT_URL/token" \
                -H "Authorization: Bearer $id_token" -H "Content-Type: application/json" --data-binary @-)
          [ "$code" = 200 ] || { echo "::error::auth-jwt $AUTH_JWT_URL/token as $AUTH_JWT_CLIENT: HTTP $code"; exit 1; }
          JWT_TOKEN=$(jq -r '.token // .jwt // empty' "$RUNNER_TEMP/jwt.json")
          rm -f "$RUNNER_TEMP/jwt.json"
          [ -n "$JWT_TOKEN" ] || { echo "::error::auth-jwt response has no token"; exit 1; }
          echo "::add-mask::$JWT_TOKEN"
          JWT_TOKEN="$JWT_TOKEN" npm run graphql-codegen
          find src \( -path src/generated -o -name __generated__ \) -type d -prune -print0 \
            | tar -czf "$RUNNER_TEMP/codegen.tgz" --null -T -
          echo "generated: $(tar -tzf "$RUNNER_TEMP/codegen.tgz" | wc -l) entries"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codegen
          path: ${{ runner.temp }}/codegen.tgz
          retention-days: 1
