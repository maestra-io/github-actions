# Reusable Python package build + upload to packages.maestra.io (nora),
# issues-maestra#1442 wave W0c.
#
# Usage (caller, on push to the default branch and on pull_request):
#
#   jobs:
#     package:
#       uses: maestra-io/github-actions/.github/workflows/python-package-publish.yml@<sha> # vX.Y.Z
#       permissions: { contents: read, id-token: write }
#       with:
#         build-tool: poetry
#
# Version source: the package's own pyproject.toml (poetry/uv build read it), unless
# version-prefix is set: then <prefix><github.run_number + build-number-offset> is
# written into pyproject.toml before the build (`poetry version` / `uv version`).
# That is the GitLab 0.0.<CI_PIPELINE_IID + offset> scheme (maestra-io/ml-commons):
# set the offset so GitHub versions continue above the imported ones.
#
# Auth: the run's GitHub OIDC token (`aud` packages.maestra.io), sent by twine as
# the HTTP Basic password; nora verifies the JWT on Basic as well as on Bearer
# (nora MAESTRA.md, auth matrix "GitHub Actions"), so no stored secret and the
# caller grants `id-token: write`. The packages-token secret (`nra_` API token)
# still overrides it.
#
# Re-runs: a dist file already in the index (its name on /simple/<project>/, or a
# 409 on upload) is skipped. twine is pinned: 7.0 refuses --skip-existing for any
# repository but PyPI, and 6.1+ is needed for Metadata 2.4 (license-expression).
#
# Inputs:
#   python-version    Default 3.12.
#   build-tool        poetry | uv (default poetry).
#   test-command      Shell command run after the build (default empty = none);
#                     installing the package's deps is up to the command.
#   repository-url    twine upload target (default https://packages.maestra.io/simple/).
#                     nora serves PyPI at /simple/ only: twine POSTs the upload
#                     to /simple/, pip/uv/poetry read the index from the same
#                     URL (--index-url https://packages.maestra.io/simple/).
#                     /pypi/ is 404 (verified against a local nora 1.3.3 run).
#   publish           Upload on push (default true). Never on pull_request.
#   version-prefix    Empty (default) = pyproject.toml version. Else the version is
#                     <prefix><run_number + build-number-offset>, e.g. "0.0.".
#   build-number-offset  Added to github.run_number for version-prefix (default 0).
#                     Renaming the caller workflow file restarts run_number.
#   packages-audience `aud` of the GitHub OIDC token nora accepts (default packages.maestra.io).
# Secrets:
#   packages-token    Optional nora `nra_` API token with write access; overrides OIDC.

name: python-package-publish

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      build-tool:
        type: string
        default: poetry
      test-command:
        type: string
        default: ""
      repository-url:
        type: string
        default: https://packages.maestra.io/simple/
      publish:
        type: boolean
        default: true
      version-prefix:
        type: string
        default: ""
      build-number-offset:
        type: number
        default: 0
      packages-audience:
        type: string
        default: packages.maestra.io
    secrets:
      packages-token:
        required: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pypi-{0}-{1}', github.repository, github.ref) || format('pypi-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: runs-on=${{ github.run_id }}/pool=small
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # nora OIDC token (upload)
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
      - if: ${{ inputs.build-tool == 'uv' }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: build
        env:
          TOOL: ${{ inputs.build-tool }}
          PREFIX: ${{ inputs.version-prefix }}
          RUN_NUMBER: ${{ github.run_number }}
          OFFSET: ${{ inputs.build-number-offset }}
        run: |
          v=""; [ -z "$PREFIX" ] || v="${PREFIX}$((RUN_NUMBER + OFFSET))"
          case "$TOOL" in
            poetry) pipx install poetry && { [ -z "$v" ] || poetry version "$v"; } && poetry build ;;
            uv) { [ -z "$v" ] || uv version --frozen "$v"; } && uv build ;;
            *) echo "::error::build-tool must be poetry or uv, got '$TOOL'"; exit 1 ;;
          esac
          ls -1 dist

      - name: test
        if: ${{ inputs.test-command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"

      - name: mint packages token
        if: ${{ inputs.publish && github.event_name != 'pull_request' }}
        id: token
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUDIENCE: ${{ inputs.packages-audience }}
        with:
          script: |
            const t = await core.getIDToken(process.env.AUDIENCE);
            core.setSecret(t);
            core.setOutput('token', t);

      - name: upload
        if: ${{ inputs.publish && github.event_name != 'pull_request' }}
        env:
          TOKEN: ${{ secrets.packages-token || steps.token.outputs.token }}
          URL: ${{ inputs.repository-url }}
        run: |
          # pypi-upload: begin
          export TWINE_USERNAME=token TWINE_PASSWORD="$TOKEN" TWINE_REPOSITORY_URL="$URL"
          for f in dist/*; do
            file="${f##*/}"
            # PEP 503 project name: the filename up to "-<version>", normalized.
            project=$(sed -E 's/-[0-9].*$//; s/[-_.]+/-/g' <<<"$file" | tr '[:upper:]' '[:lower:]')
            if curl -fsS -u "token:$TOKEN" "${URL%/}/${project}/" 2>/dev/null | grep -qF -- "$file"; then
              echo "skip $file: already on ${URL%/}/${project}/"
              continue
            fi
            if ! out=$(pipx run --spec twine==6.2.0 twine upload --non-interactive "$f" 2>&1); then
              echo "$out"
              grep -q '409 Conflict' <<<"$out" || exit 1
              echo "skip $file: 409, uploaded by an earlier run"
              continue
            fi
            echo "$out"
          done
          # pypi-upload: end
