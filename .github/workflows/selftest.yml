---
# This repo is reusable workflows: nothing here runs on its own PRs, so the shell
# embedded in them has never had a test. The os-update host selector is the first
# piece worth one — it decides which machines a sweep touches, and it is the kind
# of jq that reads correct and is not.
name: selftest

on:
  # Every PR, no path filter: `shell` is a required check on main
  # (maestra-io/iam github/rulesets.tf); a filtered-out run would leave it
  # pending forever and block the PR.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ansible-os-update.yml"
      - ".github/workflows/dotnet-service-build.yml"
      - ".github/workflows/frontend-codegen.yml"
      - ".github/workflows/hot-test-publish.yml"
      - ".github/workflows/mcf-build.yml"
      - ".github/workflows/npm-package-publish.yml"
      - ".github/workflows/nuget-package-publish.yml"
      - ".github/workflows/python-package-publish.yml"
      - ".github/workflows/service-build.yml"
      - ".github/workflows/selftest.yml"
      - "ansible/tests/**"
      - "ci/**"
      - "scripts/**"
      - "push-helm-chart-to-aws-ecr/**"
      - "tbot-join/**"
      - ".github/workflows/pr-checks.yml"
      - "pr-checks/**"

permissions:
  contents: read

jobs:
  shell:
    runs-on: runs-on=${{ github.run_id }}-shell/runner=t3a-small
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: host_limit selector
        run: bash ansible/tests/test-host-limit-selector.sh

      # The release tag is derived from the commit range by a shell script, and
      # a wrong bump is silent: it publishes a version that is merely the wrong
      # number, which consumers then pin. The cases build real throwaway repos.
      - name: next release version
        run: bash ci/tests/test-next-version.sh

      - name: dockerfile-from-fix (rewrite, keep, idempotence)
        run: bash scripts/test-dockerfile-from-fix.sh

      - name: npm-lockfile-to-nora (rewrite, keep, idempotence, workflow copy)
        run: bash scripts/test-npm-lockfile-to-nora.sh

      - name: nuget SDK set (TFM scan, override, workflow copy)
        run: bash scripts/test-nuget-sdk-set.sh

      - name: push-helm-chart-to-aws-ecr version resolution
        run: bash scripts/test-helm-chart-version.sh

      - name: push-helm-chart-to-aws-ecr package-and-push step (stub aws/helm)
        run: bash scripts/test-helm-chart-push.sh

      - name: tbot-join retries (stub tbot; real 5 s / 15 s backoff, ~70 s)
        run: bash scripts/test-tbot-join.sh

      - name: nuget build SDK pin (highest TFM, global.json kept/restored, workflow copy)
        run: bash scripts/test-nuget-sdk-pin.sh

      - name: pypi upload (skip existing, 409, pinned twine, workflow copy)
        run: bash scripts/test-pypi-upload.sh

      - name: test-results-ingest converter (TRX + JUnit fixtures)
        run: bash scripts/test-test-results-ingest.sh

      - name: dotnet-service-build image-targets / bakes, global.json SDK, AWS credentials wait (workflow copy)
        run: bash scripts/test-dotnet-service-build.sh

      # A cached layer that holds the packages token replays it after it expired
      # (maestra-io/billing publish -r linux-x64: 401). Docker + a fake feed that
      # accepts only the current token; the GitLab-era Dockerfile must reproduce it.
      - name: dotnet-service-build packages token (layer cache, token files, expired-token e2e; workflow copy)
        run: bash scripts/test-dotnet-service-build-cache.sh

      - name: service-build image-targets parsing (workflow copy)
        run: bash scripts/test-service-build.sh

      - name: hot-test-publish stand names, manifest override and route wait (workflow copy)
        run: bash scripts/test-hot-test-publish.sh

      - name: pr-checks check-encoding and kustomize entry points
        run: bash scripts/test-pr-checks.sh

      # warn-as-error must keep tests running on the Microsoft.Testing.Platform
      # runner too (a bare /warnaserror ran zero tests there, exit 5).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: dotnet-service-build warn-as-error on MTP and VSTest runners (workflow copy)
        run: bash scripts/test-dotnet-service-build-mtp.sh

      # `mode: stage` is only safe BECAUSE it disrupts nothing — that is why it is
      # allowed to skip preflight. This checks the property structurally, so the
      # mode cannot quietly grow a drain.
      - name: stage-mode wiring and the overridable reboot
        run: bash ansible/tests/test-stage-mode-wiring.sh

      # `mode: binary-update` is the one mode that leaves a failed host OUT of
      # rotation. That is a property of WHICH block the undrain sits in, and the
      # most natural tidy-up — moving it next to the unsilence, the way `apply`
      # has it — silently turns the mode into one that puts an unproven binary
      # back into production. Checked structurally for that reason.
      - name: binary-update wiring (a failed host must stay drained)
        run: bash ansible/tests/test-binary-update-wiring.sh

      # The test carries its own copy of the selector; a change to the workflow
      # that does not update the test would leave the test green and meaningless.
      - name: the test's copy of the selector still matches the workflow
        run: |
          set -euo pipefail
          for line in '| ($want - $have) as $bogus' \
                      '| ($want | group_by(.) | map(select(length > 1) | .[0])) as $dupes' \
                      'then error("hosts not in group \($g): \($bogus | join(", "))")'; do
            grep -qF -- "$line" .github/workflows/ansible-os-update.yml \
              || { echo "::error::workflow no longer contains: $line"; exit 1; }
            grep -qF -- "$line" ansible/tests/test-host-limit-selector.sh \
              || { echo "::error::test no longer contains: $line"; exit 1; }
          done

  # The shared PR checks on this repo's own pull requests, with the scripts and the
  # gitleaks config of the PR head. The workflow skips itself outside pull_request.
  pr-checks:
    uses: ./.github/workflows/pr-checks.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  # End to end: the real reusable workflow on a net8.0 + net10.0 solution with no
  # global.json. Each test asserts it runs on its own target's runtime (no
  # RollForward), so a missing 8.0 runtime fails here the way Mindbox.Tenants
  # PR #2 failed. PR-only: on a push to main the workflow would publish.
  nuget-mixed-tfm:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/nuget-package-publish.yml
    permissions:
      contents: read
      id-token: write # the workflow mints a nora token even when it only builds
    with:
      solution-file: ci/fixtures/nuget-mixed-tfm/Mixed.sln
      # Exported to dotnet test; naming the ECR registry exercises the ECR login.
      test-env: |
        SELFTEST_TEST_ENV=from-test-env
        SELFTEST_ECR_IMAGE=515260921971.dkr.ecr.us-west-2.amazonaws.com/test-images/minio:not-pulled

  # No global.json and only net8.0: the runner's preinstalled SDK 10 must not
  # build it (its analyzers broke /warnaserror builds, W2). The test asserts the
  # SDK recorded in the assembly is 8.x. PR-only, as above. Sequential: the
  # reusable workflow's concurrency group (repo + ref) cancels a parallel call.
  nuget-net8:
    needs: nuget-mixed-tfm
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/nuget-package-publish.yml
    permissions:
      contents: read
      id-token: write # the workflow mints a nora token even when it only builds
    with:
      solution-file: ci/fixtures/nuget-net8/Net8.sln
      lfs: true # no LFS objects here: proves the input is wired, nothing more
