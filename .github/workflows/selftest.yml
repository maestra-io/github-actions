---
# This repo is reusable workflows: nothing here runs on its own PRs, so the shell
# embedded in them has never had a test. The os-update host selector is the first
# piece worth one — it decides which machines a sweep touches, and it is the kind
# of jq that reads correct and is not.
name: selftest

on:
  # Every PR, no path filter: `shell` is a required check on main
  # (maestra-io/iam github/rulesets.tf); a filtered-out run would leave it
  # pending forever and block the PR.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ansible-os-update.yml"
      - ".github/workflows/ansible-run.yml"
      - ".github/workflows/ansible-pr.yml"
      - ".github/workflows/collection-lint.yml"
      - ".github/workflows/dotnet-service-build.yml"
      - ".github/workflows/frontend-codegen.yml"
      - ".github/workflows/hot-test-publish.yml"
      - ".github/workflows/mcf-build.yml"
      - ".github/workflows/npm-package-publish.yml"
      - ".github/workflows/nuget-package-publish.yml"
      - ".github/workflows/python-package-publish.yml"
      - ".github/workflows/service-build.yml"
      - ".github/workflows/selftest.yml"
      - "ansible/tests/**"
      - "ci/**"
      - "scripts/**"
      - "push-helm-chart-to-aws-ecr/**"
      - "bake-oci-manifests/**"
      - "sign-image/**"
      - "tbot-join/**"
      - "terraform-nora/**"
      - "uv-nora/**"
      - "go-nora/**"
      - "cargo-nora/**"
      - "dotnet-nora/**"
      - "nora-tool/**"
      - "nora-asset/**"
      - "setup-*-nora/**"
      - "nora-session/**"
      - "nora-service/**"
      - "check-encoding/**"
      - "translation-checker/**"
      - "nora-image-prewarm/**"
      - "test-results-ingest/**"
      - ".github/workflows/pr-checks.yml"
      - ".github/workflows/base-images.yml"
      - "pr-checks/**"
      - ".github/workflows/gitleaks.yml"
      - "gitleaks/**"
      - ".github/workflows/security-scan.yml"
      - "security-scan/**"

permissions:
  contents: read

jobs:
  shell:
    runs-on: runs-on=${{ github.run_id }}-shell/runner=t3a-small
    permissions:
      contents: read
      id-token: write # dotnet-nora: the SDK from nora raw
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its first parent (the base): the selector's diff

      # The two heavy blocks below, the docker cache e2e (~4 min) and the real SDKs (~2.5 min),
      # run on a PR only when it changes what they read; every push to main and every PR that
      # changes this file runs them. The selector fails open: no diff -> both run. Tested by
      # scripts/test-selftest-changes.sh, which also checks that every file the heavy tests read
      # turns their block on.
      - name: heavy blocks this change can affect
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # >>> selftest-changes
          set -euo pipefail
          docker_cache=true; dotnet_sdk=true
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only HEAD^1 HEAD 2>/dev/null) && [ -n "$files" ]; then
            docker_cache=false; dotnet_sdk=false
            while IFS= read -r f; do
              case "$f" in
                .github/workflows/selftest.yml | .github/workflows/dotnet-service-build.yml)
                  docker_cache=true; dotnet_sdk=true ;;
                .github/workflows/service-build.yml | scripts/nuget-secret-mount-fix.sh | \
                scripts/test-dotnet-service-build-cache.sh | ci/fixtures/nuget-token-cache/* | nora-session/*)
                  docker_cache=true ;;
                dotnet-nora/* | scripts/test-dotnet-service-build-mtp.sh | scripts/test-dotnet-sdk-pin-real.sh | \
                ci/fixtures/dotnet-test/*)
                  dotnet_sdk=true ;;
              esac
            done <<< "$files"
          fi
          printf 'docker_cache=%s\ndotnet_sdk=%s\n' "$docker_cache" "$dotnet_sdk" >> "$GITHUB_OUTPUT"
          printf 'heavy blocks: docker cache e2e=%s, real SDKs=%s\n' "$docker_cache" "$dotnet_sdk" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # <<< selftest-changes

      - name: selftest-changes selector (file lists, every heavy test's input turns its block on)
        run: bash scripts/test-selftest-changes.sh

      - name: host_limit selector
        run: bash ansible/tests/test-host-limit-selector.sh

      - name: break-glass re-probe step
        run: bash ansible/tests/test-breakglass-reprobe.sh

      # The release tag is derived from the commit range by a shell script, and
      # a wrong bump is silent: it publishes a version that is merely the wrong
      # number, which consumers then pin. The cases build real throwaway repos.
      - name: next release version
        run: bash ci/tests/test-next-version.sh

      - name: dockerfile-from-fix (rewrite, keep, idempotence)
        run: bash scripts/test-dockerfile-from-fix.sh

      - name: npm-lockfile-to-nora (rewrite, keep, idempotence, workflow lockfile check)
        run: bash scripts/test-npm-lockfile-to-nora.sh

      - name: nuget SDK set (TFM scan, override, workflow copy)
        run: bash scripts/test-nuget-sdk-set.sh

      - name: push-helm-chart-to-aws-ecr version resolution
        run: bash scripts/test-helm-chart-version.sh

      - name: push-helm-chart-to-aws-ecr package-and-push step (stub aws/helm)
        run: bash scripts/test-helm-chart-push.sh

      - name: push-helm-chart-to-aws-ecr sign + verify step (stub aws/cosign)
        run: bash scripts/test-helm-chart-sign.sh

      - name: bake-oci-manifests staging tag, re-run reuse, publish after sign (stub aws/flux)
        run: bash scripts/test-bake-oci-manifests.sh

      - name: tbot-join retries (stub tbot; real 5 s / 15 s backoff, ~70 s)
        run: bash scripts/test-tbot-join.sh

      - name: terraform-nora CLI config and credentials helper (stub curl)
        run: bash scripts/test-terraform-nora.sh

      - name: nora-session JWT exchanged for a session token, fallback, refusal (stub curl)
        run: bash scripts/test-nora-session.sh

      - name: nora-service pull credential, docker run flags, health wait, post cleanup (stub docker/curl)
        run: bash scripts/test-nora-service.sh

      - name: go-nora GOPROXY, GOAUTH helper, token output (stub curl)
        run: bash scripts/test-go-nora.sh

      - name: cargo-nora source replacement, token-from-stdout helper, token output (stub curl)
        run: bash scripts/test-cargo-nora.sh
      - name: dotnet-nora version specs, global.json rollForward, tampered download refused (stub curl)
        run: bash scripts/test-dotnet-nora.sh
      - name: setup-*-nora version specs, go.mod floor, pins, tampered download and poisoned cache refused (stub curl)
        run: bash scripts/test-nora-tool.sh

      - name: uv-nora keyring helper, UV_* env, token output (stub curl, local 401 index)
        run: bash scripts/test-uv-nora.sh

      - name: nora-image-prewarm image mapping, flate diff, OIDC round trip (stub)
        run: python3 nora-image-prewarm/prewarm.py --self-test

      - name: nora-asset raw binary, tar and zip member, tampered download refused (stub curl)
        run: bash scripts/test-nora-asset.sh

      - name: security-scan trivy DBs through nora (stub curl)
        run: bash scripts/test-security-scan-trivy-nora-env.sh
      - name: security-scan pinned scanner fetch, runner cache hit / poisoned copy refetched (stub curl)
        run: bash scripts/test-security-scan-fetch-pinned.sh
      - name: security-scan reports (field allowlist, hashes, raw-secret check)
        run: python3 security-scan/report.py --self-test

      - name: security-scan PR mode, trivy base/head difference (keys, not line numbers)
        run: python3 security-scan/pr-diff.py --self-test

      - name: nuget build SDK pin (highest TFM, global.json kept/restored, workflow copy)
        run: bash scripts/test-nuget-sdk-pin.sh

      - name: pypi upload (skip existing, 409, pinned twine, workflow copy)
        run: bash scripts/test-pypi-upload.sh

      - name: test-results-ingest converter (TRX + JUnit fixtures), bounded Vault login and upload (stub curl)
        run: bash scripts/test-test-results-ingest.sh

      - name: dotnet-service-build image-targets / bakes, global.json SDK, AWS credentials wait (workflow copy)
        run: bash scripts/test-dotnet-service-build.sh

      # Real tools at the pr-checks.yml pins and the real commons-app / commons-app-init charts
      # from ECR with the runner's instance role: the same path a service PR takes, so a runner
      # image without PyYAML or ECR read fails here, not on the first service PR with a block.
      - name: pr-checks networkPolicy gate (fixture pilot tree, ECR chart pull, kubeconform, broad gate)
        run: bash scripts/test-network-policy-gate.sh

      # The cache test's docker-container builders run moby/buildkit from nora
      # (packages.maestra.io, issues-maestra#1649): the daemon pulls it with this login.
      - name: nora session token
        id: nora
        if: steps.changes.outputs.docker_cache == 'true'
        uses: ./nora-session
      - name: docker login nora
        if: steps.changes.outputs.docker_cache == 'true'
        env:
          NORA_TOKEN: ${{ steps.nora.outputs.token }}
        run: printf '%s' "$NORA_TOKEN" | docker login packages.maestra.io -u token --password-stdin
      # A cached layer that holds the packages token replays it after it expired
      # (maestra-io/billing publish -r linux-x64: 401). Docker + a fake feed that
      # accepts only the current token; the GitLab-era Dockerfile must reproduce it.
      - name: dotnet-service-build packages token (layer cache, token files, expired-token e2e; workflow copy)
        if: steps.changes.outputs.docker_cache == 'true'
        run: bash scripts/test-dotnet-service-build-cache.sh
      # The steps below ran without a nora login before: keep it that way.
      - if: ${{ always() }}
        run: docker logout packages.maestra.io
      - name: dotnet-service-build graphql-schemas (.graphqlrc.json discovery, hosts, build contexts, token override, OIDC/auth-jwt/401/HTML/no SDL; stub curl/dotnet; workflow copy)
        run: bash scripts/test-dotnet-service-build-graphql.sh

      - name: service-build image-targets parsing (workflow copy)
        run: bash scripts/test-service-build.sh
      - name: ecr-push-check (tag absent / same digest / other digest)
        run: bash scripts/test-ecr-push-check.sh
      - name: mcf-build ecr-release-check (image, deps-image, e2e-image side by side; re-run keeps its own tag)
        run: bash scripts/test-mcf-build-ecr-release-check.sh
      - name: github-release-create (403 after main moved with a workflow change; workflow copies)
        run: bash scripts/test-github-release-create.sh
      - name: sign-image status, background SBOM, cosign pin, no syft auth env, SBOM from a local OCI archive (stub cosign/curl/docker/aws)
        run: bash scripts/test-sign-image.sh

      - name: hot-test-publish stand names, manifest override, route wait, release bucket check, summary (workflow copy)
        run: bash scripts/test-hot-test-publish.sh
      - name: mcf-build static-prefix, static-manifest and static-version-file inputs (workflow copy)
        run: bash scripts/test-mcf-build-static.sh
      - name: mcf-build deps-prune, DEPS_PRUNE and what only it needs leave node_modules (workflow copy)
        run: bash scripts/test-mcf-build-deps-prune.sh
      - name: mcf-build localization-keys exit code and checks verdict (workflow copy)
        run: bash scripts/test-mcf-build-localization-keys.sh
      - name: mcf-build / npm-package-publish eslint --concurrency (workflow copies)
        run: bash scripts/test-eslint-concurrency.sh
      - name: mcf-build lockfile in sync with package.json (workflow copy)
        run: bash scripts/test-lockfile-sync.sh

      - name: mcf-build tests/ detection, http-server wait, functional summary (workflow copy)
        run: bash scripts/test-functional.sh
      - name: mcf-build e2e detection, e2e-stand and e2e wiring, credentials, e2e summary (workflow copy)
        run: bash scripts/test-e2e.sh
      - name: mcf-build pr gate (needs, verdict; workflow copy)
        run: bash scripts/test-mcf-build-pr-gate.sh

      - name: pr-checks check-encoding and kustomize entry points
        run: bash scripts/test-pr-checks.sh
      - name: base-images Dockerfile/compose/workflow parser, nora verdicts, only-if-cached probe (stub nora)
        run: python3 -I pr-checks/check-base-images.py --self-test
      - name: pr-changes (kustomization-only PRs skip build and test)
        run: bash scripts/test-pr-changes.sh

      # warn-as-error must keep tests running on the Microsoft.Testing.Platform
      # runner too (a bare /warnaserror ran zero tests there, exit 5).
      # The real SDK download from nora (sha256-checked), as the workflows install it.
      # SDK 11 stands for the newest SDK beside the pinned one (the job's root holds only the SDKs
      # dotnet-nora installs, not the runner image's).
      - uses: ./dotnet-nora
        if: steps.changes.outputs.dotnet_sdk == 'true'
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: dotnet-service-build warn-as-error on MTP and VSTest runners (workflow copy)
        if: steps.changes.outputs.dotnet_sdk == 'true'
        run: bash scripts/test-dotnet-service-build-mtp.sh
      - name: dotnet-service-build SDK pin on real SDKs (build SDK = pinned SDK 10, SDK 11 beside it)
        if: steps.changes.outputs.dotnet_sdk == 'true'
        run: bash scripts/test-dotnet-sdk-pin-real.sh
      # The tool-cache tree pin on a real SDK: a tampered `dotnet` host left in the tool cache (as an
      # earlier job on a reused instance could) is reinstalled from the verified archive, never run.
      - name: tamper with the SDK 10 in the tool cache (complete marker kept)
        if: steps.changes.outputs.dotnet_sdk == 'true'
        run: |
          set -euo pipefail
          d="$RUNNER_TOOL_CACHE/dotnet-nora"; v=$(DOTNET_NOLOGO=1 dotnet --list-sdks | awk '/^10\./ { print $1 }')
          [ -f "$d/$v.complete" ]
          printf '#!/bin/sh\necho tampered\n' > "$d/$v/dotnet.new"; chmod +x "$d/$v/dotnet.new"; mv -f "$d/$v/dotnet.new" "$d/$v/dotnet"
      - uses: ./dotnet-nora
        if: steps.changes.outputs.dotnet_sdk == 'true'
        with:
          dotnet-version: 10.0.x
      - name: the tampered SDK was reinstalled, not run
        if: steps.changes.outputs.dotnet_sdk == 'true'
        run: |
          set -euo pipefail
          d="$RUNNER_TOOL_CACHE/dotnet-nora"; v=$(DOTNET_NOLOGO=1 dotnet --list-sdks | awk '/^10\./ { print $1 }')
          if grep -q tampered "$d/$v/dotnet"; then echo "::error::the tampered dotnet host is still in $d/$v"; exit 1; fi
          [ "$(DOTNET_NOLOGO=1 dotnet --version)" = "$v" ]

      # `mode: stage` is only safe BECAUSE it disrupts nothing — that is why it is
      # allowed to skip preflight. This checks the property structurally, so the
      # mode cannot quietly grow a drain.
      - name: stage-mode wiring and the overridable reboot
        run: bash ansible/tests/test-stage-mode-wiring.sh

      # `mode: binary-update` is the one mode that leaves a failed host OUT of
      # rotation. That is a property of WHICH block the undrain sits in, and the
      # most natural tidy-up — moving it next to the unsilence, the way `apply`
      # has it — silently turns the mode into one that puts an unproven binary
      # back into production. Checked structurally for that reason.
      - name: binary-update wiring (a failed host must stay drained)
        run: bash ansible/tests/test-binary-update-wiring.sh

      # The per-host result line reaches the job summary only while the role's
      # text and the workflow's `summary_grep` agree.
      - name: os-update result line reaches the job summary
        run: bash ansible/tests/test-os-update-result-line.sh

      # The os-update apply leg pins the Teleport FQDN away from the proxy on its
      # own target (us-iota: proxy hostNetwork on the nodes it reboots). The test
      # runs the workflow's own step block against stubs.
      - name: avoid-target-proxy pin (ansible-run.yml)
        run: bash ansible/tests/test-avoid-target-proxy.sh

      # The one rerun after an unreachable-only failure must never repeat a task:
      # it is allowed only when the PLAY RECAP shows no task ran on any host.
      - name: unreachable-only rerun gate (ansible-run.yml)
        run: bash ansible/tests/test-unreachable-retry.sh

      # An inventory that did not load is a failure, never "an empty group".
      - name: no-hosts guard (ansible-run.yml)
        run: bash ansible/tests/test-no-hosts-guard.sh

      # Opt-in: a re-run of an old caller run must not apply its older commit.
      - name: refuse-ancestor gate (ansible-run.yml)
        run: bash ansible/tests/test-refuse-ancestor.sh

      # The Python install of every Ansible workflow: the caller's uv.lock through
      # nora only, and no install at all without one (issues-maestra#1649).
      - name: python-deps block (uv.lock through nora only)
        run: bash ansible/tests/test-python-deps.sh

      # The test carries its own copy of the selector; a change to the workflow
      # that does not update the test would leave the test green and meaningless.
      - name: the test's copy of the selector still matches the workflow
        run: |
          set -euo pipefail
          for line in '| ($want - $have) as $bogus' \
                      '| ($want | group_by(.) | map(select(length > 1) | .[0])) as $dupes' \
                      'then error("hosts not in group \($g): \($bogus | join(", "))")'; do
            grep -qF -- "$line" .github/workflows/ansible-os-update.yml \
              || { echo "::error::workflow no longer contains: $line"; exit 1; }
            grep -qF -- "$line" ansible/tests/test-host-limit-selector.sh \
              || { echo "::error::test no longer contains: $line"; exit 1; }
          done

  # nora-service for real: Postgres pulled through nora by digest with the job's OIDC token,
  # reached on the published port and by docker exec, removed by the post step.
  nora-service:
    runs-on: runs-on=${{ github.run_id }}-nora-service/runner=t3a-small
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # nora session token for the pull
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./nora-service
        id: pg
        with:
          image: packages.maestra.io/docker-hub/library/postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
          ports: 127.0.0.1:5432:5432
          env: POSTGRES_HOST_AUTH_METHOD=trust
          options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      - name: Postgres answers by docker exec and on the published port
        env:
          PG: ${{ steps.pg.outputs.id }}
        run: |
          [ "$(docker exec "$PG" psql -U postgres -Atc 'select 1')" = 1 ]
          timeout 5 bash -c '</dev/tcp/127.0.0.1/5432'
          docker image inspect --format '{{join .RepoDigests " "}}' "$(docker inspect -f '{{.Image}}' "$PG")" \
            | grep -qF 'packages.maestra.io/docker-hub/library/postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1'
          # the pull's credential stayed out of the runner's docker config
          ! grep -qs packages.maestra.io "${DOCKER_CONFIG:-$HOME/.docker}/config.json"

  # check-encoding and translation-checker for real over this repo: check-encoding runs
  # the Python port, translation-checker pulls our image from ECR with the runner's
  # instance role. No id-token: neither action needs one.
  mindbox-lint:
    runs-on: runs-on=${{ github.run_id }}-mindbox-lint/runner=t3a-small
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./check-encoding
      - uses: ./translation-checker

  # The shared PR checks on this repo's own pull requests, with the scripts and the
  # gitleaks config of the PR head. The workflow skips itself outside pull_request.
  pr-checks:
    uses: ./.github/workflows/pr-checks.yml
    permissions:
      contents: read
      id-token: write # the checks' tools from nora
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  # The base-image check of the PR head on this repo's own pull requests: mcf-build's
  # DEPS_BASE and the other digest-pinned nora images of these workflows move here.
  base-images:
    uses: ./.github/workflows/base-images.yml
    permissions:
      contents: read
      id-token: write # nora session token
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  # The gitleaks workflow of the PR head on this repo's own pull requests, with the two kinds
  # of caller: with id-token (gitleaks and pinact from nora, so a pin younger than nora's 3-day
  # hold is red here before any repo gets it) and without (the same pins from GitHub Releases;
  # the workflow must start without the permission). Skips itself outside pull_request.
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      id-token: write
  gitleaks-no-oidc:
    uses: ./.github/workflows/gitleaks.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      pull-requests: write

  # End to end: the real reusable workflow on a net8.0 + net10.0 solution with no
  # global.json. Each test asserts it runs on its own target's runtime (no
  # RollForward), so a missing 8.0 runtime fails here the way Mindbox.Tenants
  # PR #2 failed. PR-only: on a push to main the workflow would publish.
  nuget-mixed-tfm:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/nuget-package-publish.yml
    permissions:
      contents: read
      id-token: write # the workflow mints a nora token even when it only builds
    with:
      solution-file: ci/fixtures/nuget-mixed-tfm/Mixed.sln
      # Exported to dotnet test; naming the ECR registry exercises the ECR login.
      test-env: |
        SELFTEST_TEST_ENV=from-test-env
        SELFTEST_ECR_IMAGE=515260921971.dkr.ecr.us-west-2.amazonaws.com/test-images/minio:not-pulled

  # No global.json and only net8.0: the runner's preinstalled SDK 10 must not
  # build it (its analyzers broke /warnaserror builds, W2). The test asserts the
  # SDK recorded in the assembly is 8.x. PR-only, as above. Sequential: the
  # reusable workflow's concurrency group (repo + ref) cancels a parallel call.
  nuget-net8:
    needs: nuget-mixed-tfm
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/nuget-package-publish.yml
    permissions:
      contents: read
      id-token: write # the workflow mints a nora token even when it only builds
    with:
      solution-file: ci/fixtures/nuget-net8/Net8.sln
      lfs: true # no LFS objects here: proves the input is wired, nothing more
