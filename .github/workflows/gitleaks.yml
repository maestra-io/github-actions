# Reusable secret scan of a pull request's commits with the official
# gitleaks/gitleaks-action. One job, `gitleaks` (the check is `<caller job> / gitleaks`),
# skipped outside pull_request.
#
# A second job, `actions pinned` (`<caller job> / actions pinned`), fails when a line the
# PR adds or changes references an action by a tag or branch instead of a full commit
# SHA (`pinact run --check` on the PR diff only, so lines nobody touched never block a
# merge). Write `uses: owner/repo@<40-hex sha> # vX.Y.Z` (`pinact run` does it); the org
# requires SHA-pinned actions (sha_pinning_required, maestra-io/issues-maestra#1649).
# Reusable workflows (`.../.github/workflows/x.yml@ref`) are exempt, as in GitHub's
# policy (slsa-github-generator even requires its tag). It rides on this workflow
# because every repo already calls it.
#
# What is scanned: gitleaks-action lists the PR's commits through the API and runs
# `gitleaks detect --log-opts="--no-merges --first-parent <first>^..<last>"`, so only
# what the PR adds is scanned, never the whole tree. The checkout is full depth
# (fetch-depth: 0) because that range reaches back to the parent of the PR's first
# commit. The action reads only the first page of that list (30 commits), so a PR
# with more than 30 commits fails before the scan instead of passing on a partial one
# (squash or split it). Merge commits and side branches merged into the PR are not
# scanned (`--first-parent --no-merges` is fixed in the action). Red on a finding; the job summary
# lists the findings (redacted), each one gets a review comment on the PR, and the
# SARIF report is uploaded as a run artifact (the action's defaults).
#
# Usage: every repo enables the scan with its own PR workflow; no shared workflow
# of this repo (dotnet-service-build, service-build, mcf-build, the package
# publishers, helm-chart, frontend-codegen, terraform-pr, ansible-pr, pr-checks)
# runs it. GITLEAKS_LICENSE is an org secret (gitleaks-action exits 1 on an org repo
# without it); `secrets: inherit` passes it:
#
# .github/workflows/gitleaks.yml in the repo:
#   name: gitleaks
#   on: pull_request
#   permissions: { contents: read, pull-requests: write }
#   jobs:
#     gitleaks:
#       uses: maestra-io/github-actions/.github/workflows/gitleaks.yml@main
#       secrets: inherit
#
# Permissions come from the calling workflow (this one declares none):
# pull-requests: write for the PR's commit list and the review comments.
#
# Config: only the central gitleaks/gitleaks.toml of this repo (gitleaks' default
# rules plus allowlists that apply to any repo), passed as GITLEAKS_CONFIG. A repo's
# own gitleaks config is not read: a project-specific allowlist is added centrally.
#
# A single accepted finding goes to `.gitleaksignore` at the repo root, one
# fingerprint `<commit>:<file>:<rule-id>:<line>` per line (the job log prints it; the
# summary lists its parts).
#
# gitleaks-action installs the newest gitleaks release (GITLEAKS_VERSION latest).
#
# Inputs:
#   ref   ref of maestra-io/github-actions the central config is read from (default
#         main; set it when testing a branch of this repo).

name: gitleaks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
    secrets:
      GITLEAKS_LICENSE:
        required: true

jobs:
  gitleaks:
    name: gitleaks
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runs-on=${{ github.run_id }}-gitleaks/pool=small
    timeout-minutes: 10
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      # gitleaks-action scans the first 30 commits of a PR and no more (one page of
      # the commits API): a longer PR must not pass on a partial scan.
      - if: ${{ github.event.pull_request.commits > 30 }}
        run: |
          echo "::error::this PR has ${{ github.event.pull_request.commits }} commits; gitleaks-action scans only the first 30. Squash or split it."
          exit 1
      # Full history: the scanned range starts at the parent of the PR's first commit.
      # No token left in git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The central config from `ref`, not from the workflow's own ref: a reusable
      # workflow cannot reach files of its repo by path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestra-io/github-actions
          ref: ${{ inputs.ref }}
          path: .github-actions
          sparse-checkout: gitleaks
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_VERSION: latest
          GITLEAKS_CONFIG: .github-actions/gitleaks/gitleaks.toml

  actions-pinned:
    name: actions pinned
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runs-on=${{ github.run_id }}-actions-pinned/pool=small
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PINACT_VERSION: 5.0.1
      PINACT_SHA256: 12500c0fff5db94a0155e2e76ed959d1dc0e899056ee168d8fb7b4840e7c04f0
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      # The test merge commit and its first parent, the base branch tip (HEAD^1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: pinact --check (lines this PR changes)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/pinact.tar.gz" \
            "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  $RUNNER_TEMP/pinact.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pinact.tar.gz" -C "$RUNNER_TEMP" pinact
          cat > "$RUNNER_TEMP/pinact.yaml" <<'YAML'
          version: 3
          rules:
            - ignore: true
              conditions:
                - expr: ActionName contains "/.github/workflows/"
                - expr: ActionVersion matches "^[0-9a-f]{40}$"
          YAML
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          # --no-api: a syntactic check, no token needed. Any 40-hex SHA passes (the second
          # rule), whatever its comment says: a branch pin `@<sha> # main` is pinned too, and
          # pinact --no-api would reject its non-semver comment.
          if ! "$RUNNER_TEMP/pinact" run --fix=false --no-api -c "$RUNNER_TEMP/pinact.yaml" --diff-file "$RUNNER_TEMP/pr.diff"; then
            echo "::error::an action this PR adds or changes is not pinned to a full commit SHA. Run \`pinact run\` locally and commit the result."
            exit 1
          fi
