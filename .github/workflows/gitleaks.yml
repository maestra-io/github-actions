# Reusable secret scan of a pull request's commits with the gitleaks CLI. One job,
# `gitleaks` (the check is `<caller job> / gitleaks`), skipped outside pull_request.
#
# A second job, `actions pinned` (`<caller job> / actions pinned`), fails when a line the
# PR adds or changes references an action by a tag or branch instead of a full commit
# SHA (`pinact run --check` on the PR diff only, so lines nobody touched never block a
# merge). Write `uses: owner/repo@<40-hex sha> # vX.Y.Z` (`pinact run` does it); the org
# requires SHA-pinned actions (sha_pinning_required, maestra-io/issues-maestra#1649).
# Reusable workflows (`.../.github/workflows/x.yml@ref`) are exempt, as in GitHub's
# policy (slsa-github-generator even requires its tag). It rides on this workflow
# because every repo already calls it.
#
# What is scanned: the PR's commits, `gitleaks git --log-opts="--no-merges --first-parent
# HEAD^1..HEAD^2"` of the merge commit GitHub checks out (HEAD^1 = base, HEAD^2 = PR head),
# any number of them, never the whole tree. Merge commits and side branches merged into the
# PR are not scanned here. Red on a finding: an annotation on the file and line and a job
# summary with the fingerprints, the secret itself always redacted.
#
# Binaries: gitleaks and pinact releases pinned by sha256, nothing runs before the check.
# A caller that grants `id-token: write` gets them from nora (packages.maestra.io, which
# holds a GitHub release for 3 days); any other caller, and a fork PR, gets the same sha256
# from GitHub Releases. This workflow must NOT ask for id-token itself: a caller that does
# not grant it would fail at startup (github-actions#375). selftest.yml runs both ways on
# every PR here, so a bump of a pin younger than nora's 3 days is red before it merges.
#
# Usage: every repo enables the scan with its own PR workflow; no shared workflow
# of this repo (dotnet-service-build, service-build, mcf-build, the package
# publishers, helm-chart, frontend-codegen, terraform-pr, ansible-pr, pr-checks)
# runs it:
#
# .github/workflows/gitleaks.yml in the repo:
#   name: gitleaks
#   on: pull_request
#   permissions: { contents: read, id-token: write }
#   jobs:
#     gitleaks:
#       uses: maestra-io/github-actions/.github/workflows/gitleaks.yml@main
#
# Permissions come from the calling workflow (this one declares none): contents: read, and
# id-token: write for nora. `pull-requests: write` and GITLEAKS_LICENSE, which
# gitleaks-action needed, are no longer used; the secret stays declared because callers
# pass it.
#
# Config: only the central gitleaks/gitleaks.toml of this repo (gitleaks' default
# rules plus allowlists that apply to any repo). A repo's own gitleaks config is not
# read: a project-specific allowlist is added centrally.
#
# A single accepted finding goes to `.gitleaksignore` at the repo root, one
# fingerprint `<commit>:<file>:<rule-id>:<line>` per line (the job summary prints it).
#
# Inputs:
#   ref   ref of maestra-io/github-actions the central config and fetch-pinned.sh are read
#         from (default main; set it when testing a branch of this repo).

name: gitleaks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
    secrets:
      # DEPRECATED, ignored: callers still pass it (an undeclared secret is refused).
      GITLEAKS_LICENSE:
        required: false

jobs:
  gitleaks:
    name: gitleaks
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runs-on=${{ github.run_id }}-gitleaks/pool=small
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_<GITLEAKS_VERSION>_linux_x64.tar.gz (the release's checksums.txt).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      # Full history: the scanned range starts at the parent of the PR's first commit.
      # No token left in git config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The central config from `ref`, not from the workflow's own ref: a reusable
      # workflow cannot reach files of its repo by path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestra-io/github-actions
          ref: ${{ inputs.ref }}
          path: .github-actions
          sparse-checkout: |
            gitleaks
            security-scan
          persist-credentials: false
      - name: Install gitleaks (sha256-pinned)
        run: |
          set -euo pipefail
          rel="gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          bash .github-actions/security-scan/fetch-pinned.sh "https://packages.maestra.io/github/$rel" \
            "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/$rel"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks over the PR's commits
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
          GITLEAKS_TOML: .github-actions/gitleaks/gitleaks.toml
        run: |
          # >>> gitleaks-scan (scripts/test-gitleaks-scan.sh runs this block)
          set -euo pipefail
          # gitleaks exits 0 on a range git cannot resolve: resolve it first.
          if ! base=$(git rev-parse --verify -q 'HEAD^1') || ! head=$(git rev-parse --verify -q 'HEAD^2'); then
            echo "::error::HEAD is not the PR's merge commit"; exit 1
          fi
          n=$(git rev-list --count --no-merges --first-parent "${base}..${head}")
          echo "scanning ${n} first-parent non-merge commits of ${base}..${head}"
          report=$(mktemp)
          rc=0
          "$GITLEAKS" git . --no-banner --config "$GITLEAKS_TOML" \
            --log-opts="--no-merges --first-parent ${base}..${head}" \
            --redact=100 --verbose --exit-code 2 --report-format json --report-path "$report" || rc=$?
          [ "$rc" -ne 0 ] || exit 0
          [ "$rc" -eq 2 ] || { echo "::error::gitleaks failed (exit $rc)"; exit "$rc"; }
          # Rule, place and fingerprint only: no Secret, Match or author field is printed.
          jq -r 'def esc: gsub("%";"%25") | gsub("\r";"%0D") | gsub("\n";"%0A"); def prop: esc | gsub(":";"%3A") | gsub(",";"%2C");
            .[] | "::error file=\(.File | prop),line=\(.StartLine),title=gitleaks \(.RuleID | prop)::Secret in commit \(.Commit). A real one: rotate it now. A false positive: add to .gitleaksignore: \(.Fingerprint | esc)"' "$report"
          {
            echo "### gitleaks: secrets in this PR's commits"
            echo 'Rotate a real secret now: removing the line does not remove it from the commit. Fingerprints for .gitleaksignore (false positives only):'
            echo '```'
            jq -r '.[].Fingerprint | gsub("[\r\n`]";"?")' "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
          # <<< gitleaks-scan

  actions-pinned:
    name: actions pinned
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: runs-on=${{ github.run_id }}-actions-pinned/pool=small
    timeout-minutes: 5
    env:
      PINACT_VERSION: 5.0.1
      PINACT_SHA256: 12500c0fff5db94a0155e2e76ed959d1dc0e899056ee168d8fb7b4840e7c04f0
    steps:
      - uses: runs-on/action@17b59092eb37ebfdbb034460892887c09100eaa3 # v2.5.0
      # The test merge commit and its first parent, the base branch tip (HEAD^1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maestra-io/github-actions
          ref: ${{ inputs.ref }}
          path: .github-actions
          sparse-checkout: security-scan
          persist-credentials: false
      - name: pinact --check (lines this PR changes)
        run: |
          set -euo pipefail
          rel="suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          bash .github-actions/security-scan/fetch-pinned.sh "https://packages.maestra.io/github/$rel" \
            "$PINACT_SHA256" "$RUNNER_TEMP/pinact.tar.gz" "https://github.com/$rel"
          tar -xzf "$RUNNER_TEMP/pinact.tar.gz" -C "$RUNNER_TEMP" pinact
          cat > "$RUNNER_TEMP/pinact.yaml" <<'YAML'
          version: 3
          rules:
            - ignore: true
              conditions:
                - expr: ActionName contains "/.github/workflows/"
                - expr: ActionVersion matches "^[0-9a-f]{40}$"
          YAML
          git diff HEAD^1 HEAD > "$RUNNER_TEMP/pr.diff"
          # --no-api: a syntactic check, no token needed. Any 40-hex SHA passes (the second
          # rule), whatever its comment says: a branch pin `@<sha> # main` is pinned too, and
          # pinact --no-api would reject its non-semver comment.
          if ! "$RUNNER_TEMP/pinact" run --fix=false --no-api -c "$RUNNER_TEMP/pinact.yaml" --diff-file "$RUNNER_TEMP/pr.diff"; then
            echo "::error::an action this PR adds or changes is not pinned to a full commit SHA. Run \`pinact run\` locally and commit the result."
            exit 1
          fi
