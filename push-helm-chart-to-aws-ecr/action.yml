name: 'Push a Helm chart to AWS ECR'
description: >-
  Package a chart and push it as OCI to <registry>/<repositoryPrefix>/<chart name>:<version>
  in us-west-2, the GitHub port of the GitLab helm-ci helm-chart-push-aws job.
  The version is Chart.yaml's or the `version` input (build-number charts).
  An already published version is skipped (release tags are immutable).
  Auth: Teleport workload identity -> role/teleport-image-push, the job needs
  `id-token: write`. A `tbot` already on PATH (the caller installed it) skips
  the Teleport download.
inputs:
  chartPath:
    description: 'Chart directory.'
    required: false
    default: '.'
  version:
    description: >-
      Chart version to package and push. Empty (default) = Chart.yaml `version`.
      Set it when the version is the build number rather than a field in git
      (DirectCRM cdp-*-tenant: `helm package --version $BUILD_VERSION`).
    required: false
    default: ''
  appVersion:
    description: >-
      Chart appVersion. Empty (default) = `version` when that is set, else
      Chart.yaml `appVersion`.
    required: false
    default: ''
  repositoryPrefix:
    description: 'ECR repository prefix, the chart lands in <prefix>/<chart name>.'
    required: false
    default: 'helm-charts'
  awsRegion:
    description: 'AWS Region.'
    required: false
    default: 'us-west-2'
  teleportToken:
    description: >-
      Teleport GitHub join token of the image-push bot. Default: the org-wide
      image-push-github-actions-maestra-io (any maestra-io repo, main/master).
    required: false
    default: 'image-push-github-actions-maestra-io'
  teleportFqdn:
    description: 'Teleport proxy host:port.'
    required: false
    default: 'teleport.maestra.io:443'
  awsRoleArn:
    description: 'IAM role assumed with the Teleport workload-identity JWT.'
    required: false
    default: 'arn:aws:iam::515260921971:role/teleport-image-push'
outputs:
  name:
    description: 'Chart name.'
    value: ${{ steps.chart.outputs.name }}
  version:
    description: 'Chart version.'
    value: ${{ steps.chart.outputs.version }}
  pushed:
    description: 'true when this run pushed the chart.'
    value: ${{ steps.push.outputs.pushed }}
runs:
  using: "composite"
  steps:
    - name: Resolve chart name and version
      id: chart
      shell: bash
      env:
        CHART_PATH: ${{ inputs.chartPath }}
        VERSION: ${{ inputs.version }}
        APP_VERSION: ${{ inputs.appVersion }}
      run: |
        bash "${GITHUB_ACTION_PATH}/resolve-version.sh" | tee -a "$GITHUB_OUTPUT"

    - name: Is tbot already on PATH?
      if: ${{ steps.chart.outputs.version != '0.0.0' }}
      id: tbot
      shell: bash
      run: |
        if command -v tbot >/dev/null; then echo "installed=true"; else echo "installed=false"; fi >> "$GITHUB_OUTPUT"

    - name: Get Teleport version
      if: ${{ steps.chart.outputs.version != '0.0.0' && steps.tbot.outputs.installed != 'true' }}
      id: tp-version
      shell: bash
      env:
        TELEPORT_FQDN: ${{ inputs.teleportFqdn }}
      run: |
        version=$(curl -sf "https://${TELEPORT_FQDN}/webapi/find" \
          | jq -r '.auto_update.tools_version // .server_version')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - if: ${{ steps.chart.outputs.version != '0.0.0' && steps.tbot.outputs.installed != 'true' }}
      uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
      with:
        version: ${{ steps.tp-version.outputs.version }}
        proxy: ${{ inputs.teleportFqdn }}

    - name: Mint Teleport workload-identity JWT for AWS
      if: ${{ steps.chart.outputs.version != '0.0.0' }}
      shell: bash
      env:
        TELEPORT_FQDN: ${{ inputs.teleportFqdn }}
        TELEPORT_TOKEN: ${{ inputs.teleportToken }}
      run: |
        out="$(mktemp -d)"
        cat > "$out/tbot.yaml" <<EOF
        version: v2
        proxy_server: ${TELEPORT_FQDN}
        onboarding:
          join_method: github
          token: ${TELEPORT_TOKEN}
        oneshot: true
        storage:
          type: memory
        services:
          - type: workload-identity-jwt
            destination:
              type: directory
              path: ${out}/svid
            selector:
              name: image-push
            audiences: ["sts.amazonaws.com"]
        EOF
        mkdir -p "$out/svid"
        # Retries transient Teleport backend / GitHub OIDC failures, fails at once
        # on configuration errors (../tbot-join/tbot-join.sh, same ref as this action).
        bash "${GITHUB_ACTION_PATH}/../tbot-join/tbot-join.sh" -c "$out/tbot.yaml" -r "$out/svid/jwt_svid" \
          -l "token ${TELEPORT_TOKEN}" -H "is the ref main/master, and does the job have id-token: write?"
        echo "PUSH_ECR_JWT_SVID=$out/svid/jwt_svid" >> "$GITHUB_ENV"

    - name: Configure AWS Credentials (workload identity)
      if: ${{ steps.chart.outputs.version != '0.0.0' }}
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.awsRoleArn }}
        aws-region: ${{ inputs.awsRegion }}
        web-identity-token-file: ${{ env.PUSH_ECR_JWT_SVID }}

    # Same repository shape as push-to-aws-ecr-repository: immutable release
    # tags and the org-wide read policy, from that action's files.
    - name: Package and push
      if: ${{ steps.chart.outputs.version != '0.0.0' }}
      id: push
      shell: bash
      working-directory: ${{ github.action_path }}/../push-to-aws-ecr-repository
      env:
        CHART_PATH: ${{ github.workspace }}/${{ inputs.chartPath }}
        NAME: ${{ steps.chart.outputs.name }}
        VERSION: ${{ steps.chart.outputs.version }}
        APP_VERSION: ${{ steps.chart.outputs.app-version }}
        PREFIX: ${{ inputs.repositoryPrefix }}
        AWS_REGION: ${{ inputs.awsRegion }}
        AWS_ROLE_ARN: ${{ inputs.awsRoleArn }}
      run: |
        set -euo pipefail
        repo="${PREFIX}/${NAME}"
        # Every aws-cli call is ~2.5 s of Python start-up on a t3a: the account
        # comes from the role ARN, and one describe-images answers both "is the
        # version published" and "does the repository exist".
        IFS=: read -r _ _ _ _ account _ <<<"${AWS_ROLE_ARN}"  # arn:<partition>:iam::<account>:role/<name>
        [[ "$account" =~ ^[0-9]{12}$ ]] || { echo "::error::awsRoleArn ${AWS_ROLE_ARN} carries no 12-digit account"; exit 1; }
        registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
        if err=$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=${VERSION}" 2>&1 >/dev/null); then
          echo "::warning::Chart ${NAME}@${VERSION} already exists in ECR ${AWS_REGION}; skipping push. Bump version in Chart.yaml to release."
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$err" in
          *RepositoryNotFoundException*)
            bash ./create-repository.sh "$repo"
            aws ecr set-repository-policy --repository-name "$repo" --policy-text file://ecr-policy.json >/dev/null
            ;;
          *ImageNotFoundException*) ;;
          *) echo "$err" >&2; exit 1 ;;
        esac
        aws ecr get-login-password | helm registry login "$registry" --username AWS --password-stdin
        pkg="$(mktemp -d)"
        helm package --dependency-update "$CHART_PATH" --destination "$pkg" \
          --version "$VERSION" --app-version "$APP_VERSION"
        helm push "${pkg}/${NAME}-${VERSION}.tgz" "oci://${registry}/${PREFIX}"
        echo "pushed=true" >> "$GITHUB_OUTPUT"
        echo "Pushed oci://${registry}/${repo}:${VERSION}"
